<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" href="/static/favicon.png" crossorigin="use-credentials" />
		<link
			rel="icon"
			type="image/png"
			href="/static/favicon-96x96.png"
			sizes="96x96"
			crossorigin="use-credentials"
		/>
		<link
			rel="icon"
			type="image/svg+xml"
			href="/static/favicon.svg"
			crossorigin="use-credentials"
		/>
		<link rel="shortcut icon" href="/static/favicon.ico" crossorigin="use-credentials" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/static/apple-touch-icon.png"
			crossorigin="use-credentials"
		/>
		<link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#171717" />
		<meta name="robots" content="noindex,nofollow" />

		<!--
			Hive: the /static/loader.js hook is gone with the overlay it injected.
			It existed to add an agent-workspace entry point to a compiled bundle
			that had no navigation slot; this frontend is built from source now and
			the entry point is a row in the sidebar
			(src/lib/hive/ShellNav.svelte). custom.css stays: it still carries the
			Workspace empty-state override, which is upstream markup we do not own.
		-->
		<link rel="stylesheet" href="/static/custom.css" crossorigin="use-credentials" />

		<!-- Hive: signed-out fast exit (#945, #967). A visitor with no session used
				 to pay this app's whole boot, about sixty modules plus /api/config plus
				 socket setup, only for +layout.svelte's SSO decision then bounce them
				 to the console sign-in. Measured cold, that put the sign-in form about
				 five seconds behind an already slow HTML response. This runs at parse
				 time instead and applies the same guards as sso-redirect.ts (the tested
				 source of truth) with the layout's context. It fails closed: any
				 surprise, including a failed attempt-stamp write, means do nothing and
				 let the normal boot own the decision. Keep the guard list identical on
				 both sides when either changes. -->
		<script>
			(() => {
				// Every storage access is individually guarded: a browser that denies
				// storage must not silence the whole fast exit, only the guard that
				// needed the value. Reads degrade to "absent"; the attempt-stamp write
				// is still verified and still fails closed, exactly like
				// sso-redirect.ts's writeStorage.
				let readLocalToken = null;
				try {
					readLocalToken = window.localStorage.getItem('token');
				} catch (localError) {}
				if (readLocalToken) return;
				let hasTokenCookie = false;
				try {
					hasTokenCookie = window.document.cookie
						.split('; ')
						.some((cookie) => cookie.startsWith('token='));
				} catch (cookieError) {}
				if (hasTokenCookie) return;
				const readSession = (key) => {
					try {
						return window.sessionStorage.getItem(key);
					} catch (sessionError) {
						return null;
					}
				};
				const writeSession = (key, value) => {
					try {
						window.sessionStorage.setItem(key, value);
						return window.sessionStorage.getItem(key) === value;
					} catch (writeError) {
						return false;
					}
				};
				try {
					if (window.electronAPI) return;
					if (location.pathname !== '/') return;
					if (readSession('hive:signed-out') === '1') return;
					const stamp = Number.parseInt(readSession('hive:sso-attempt-at'), 10);
					if (
						Number.isFinite(stamp) &&
						Date.now() - stamp >= 0 &&
						Date.now() - stamp < 15000
					) {
						return;
					}
					try {
						if (/\.scubed\.co$/.test(location.hostname)) {
							const link = window.document.createElement('link');
							link.rel = 'preconnect';
							link.href = 'https://console-hive.scubed.co';
							window.document.head.appendChild(link);
						}
					} catch (preconnectError) {}
					window
						.fetch('/api/config', { credentials: 'same-origin' })
						.then((res) => (res.ok ? res.json() : null))
						.then((cfg) => {
							try {
								const providers =
									cfg && cfg.oauth && cfg.oauth.providers ? Object.keys(cfg.oauth.providers) : [];
								const features = (cfg && cfg.features) || {};
								if (!cfg || !cfg.oauth || cfg.oauth.auto_redirect !== true) return;
								if (providers.length !== 1) return;
								if (
									features.auth === false ||
									features.enable_login_form !== false ||
									features.enable_ldap ||
									features.auth_trusted_header
								) {
									return;
								}
								if (cfg.onboarding) return;
								if (!writeSession('hive:sso-attempt-at', String(Date.now()))) return;
								location.replace('/oauth/' + providers[0] + '/login');
							} catch (configError) {}
						})
						.catch(() => {});
				} catch (setupError) {}
			})();
		</script>

		<script>
			function resizeIframe(obj) {
				obj.style.height = obj.contentWindow.document.documentElement.scrollHeight + 'px';
			}
		</script>

		<script>
			// On page load or when changing themes, best to add inline in `head` to avoid FOUC
			(() => {
				const metaThemeColorTag = document.querySelector('meta[name="theme-color"]');
				const prefersDarkTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;

				if (!localStorage?.theme) {
					localStorage.theme = 'system';
				}

				// Three themes and no more: system, light, dark. The retired
				// oled-dark branch used to overwrite four --color-gray-* values
				// with raw hex, which is the half of the brand ramp the dark
				// surfaces are drawn from; the retired `her` branch set a maroon
				// that appears nowhere in the token layer. A stored value of
				// either now falls through to the final else and resolves to
				// dark, so an account that picked one before this change still
				// boots into a real theme.
				//
				// data-theme travels with the class because the Hive token layer
				// defines its dark register under [data-theme="dark"] while
				// upstream's utilities read the class. Set here, in the same
				// inline head script that sets the class, so the two never
				// disagree during first paint.
				if (localStorage.theme === 'system') {
					document.documentElement.classList.add(prefersDarkTheme ? 'dark' : 'light');
					document.documentElement.dataset.theme = prefersDarkTheme ? 'dark' : 'light';
					metaThemeColorTag.setAttribute('content', prefersDarkTheme ? '#171717' : '#ffffff');
				} else if (localStorage.theme === 'light' || localStorage.theme === 'her') {
					document.documentElement.classList.add('light');
					document.documentElement.dataset.theme = 'light';
					metaThemeColorTag.setAttribute('content', '#ffffff');
				} else {
					document.documentElement.classList.add('dark');
					document.documentElement.dataset.theme = 'dark';
					metaThemeColorTag.setAttribute('content', '#171717');
				}

				const preloadHref = document.documentElement.classList.contains('dark')
					? '/static/splash-dark.png'
					: '/static/splash.png';
				const preload = document.createElement('link');
				preload.rel = 'preload';
				preload.as = 'image';
				preload.href = preloadHref;
				preload.setAttribute('fetchpriority', 'high');
				document.head.appendChild(preload);

				window.matchMedia('(prefers-color-scheme: dark)').addListener((e) => {
					if (localStorage.theme === 'system') {
						if (e.matches) {
							document.documentElement.classList.add('dark');
							document.documentElement.classList.remove('light');
							document.documentElement.dataset.theme = 'dark';
							metaThemeColorTag.setAttribute('content', '#171717');
						} else {
							document.documentElement.classList.add('light');
							document.documentElement.classList.remove('dark');
							document.documentElement.dataset.theme = 'light';
							metaThemeColorTag.setAttribute('content', '#ffffff');
						}
					}
				});
				const isDarkMode = document.documentElement.classList.contains('dark');

				const logo = document.createElement('img');
				logo.id = 'logo';
				logo.style =
					'position: absolute; width: auto; height: 6rem; top: 44%; left: 50%; transform: translateX(-50%); display:block;';
				logo.loading = 'eager';
				logo.fetchPriority = 'high';
				logo.src = isDarkMode ? '/static/splash-dark.png' : '/static/splash.png';

				document.addEventListener('DOMContentLoaded', function () {
					const splash = document.getElementById('splash-screen');
					if (document.documentElement.classList.contains('her')) {
						return;
					}

					if (splash) splash.prepend(logo);
				});
			})();
		</script>

		<title>Hive Chat</title>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>

		<div
			id="splash-screen"
			style="position: fixed; z-index: 100; top: 0; left: 0; width: 100%; height: 100%"
		>
			<style type="text/css" nonce="">
				html {
					overflow-y: scroll !important;
				}
			</style>

			<div
				style="
					position: absolute;
					top: 33%;
					left: 50%;

					width: 24rem;
					transform: translateX(-50%);

					display: flex;
					flex-direction: column;
					align-items: center;
				"
			>
				<img
					id="logo-her"
					style="width: auto; height: 13rem"
					src="/static/splash.png"
					loading="eager"
					fetchpriority="high"
					class="animate-pulse-fast"
				/>

				<div style="position: relative; width: 24rem; margin-top: 0.5rem">
					<div
						id="progress-background"
						style="
							position: absolute;
							width: 100%;
							height: 0.75rem;

							border-radius: 9999px;
							background-color: #fafafa9a;
						"
					></div>

					<div
						id="progress-bar"
						style="
							position: absolute;
							width: 0%;
							height: 0.75rem;
							border-radius: 9999px;
							background-color: #fff;
						"
						class="bg-white"
					></div>
				</div>
			</div>

			<!-- <span style="position: absolute; bottom: 32px; left: 50%; margin: -36px 0 0 -36px">
				Footer content
			</span> -->
		</div>
	</body>

	<style type="text/css" nonce="">
		html {
			overflow-y: hidden !important;
			overscroll-behavior-y: none;
		}

		#splash-screen {
			background: #fff;
		}

		html.dark #splash-screen {
			background: #000;
		}

		html.her #splash-screen {
			background: #983724;
		}

		#logo-her {
			display: none;
		}

		#progress-background {
			display: none;
		}

		#progress-bar {
			display: none;
		}

		html.her #logo {
			display: none;
		}

		html.her #logo-her {
			display: block;
			filter: invert(1);
		}

		html.her #progress-background {
			display: block;
		}

		html.her #progress-bar {
			display: block;
		}

		@media (max-width: 24rem) {
			html.her #progress-background {
				display: none;
			}

			html.her #progress-bar {
				display: none;
			}
		}

		@keyframes pulse {
			50% {
				opacity: 0.65;
			}
		}

		.animate-pulse-fast {
			animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
		}
	</style>
</html>
