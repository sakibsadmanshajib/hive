global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"
  # deploy/prometheus/alerts/*.yml (e.g. rate-limit.yml, added in #133) ship in
  # the repo but were never mounted into the Prometheus container, so those
  # rule groups silently never loaded in any profile (local/cloud/enterprise
  # all share this file). Glob picks up the whole directory automatically.
  - "/etc/prometheus/alerts/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Both services serve /metrics on a telemetry-only port, not on their public
  # port (8081 / 8080). The public ports are published to the host and routed
  # through the ingress tunnel, and the series carry provider names, payment
  # rail counts, and the internal endpoint inventory. These ports are reachable
  # over the container network only, which is where Prometheus runs.
  - job_name: 'control-plane'
    static_configs:
      - targets: ['control-plane:9101']
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: 'edge-api'
    static_configs:
      - targets: ['edge-api:9102']
    metrics_path: /metrics
    scrape_interval: 10s

  # The alerting chain scrapes itself, because until now nothing measured it.
  # alertmanager_notifications_failed_total is the only signal that says a
  # receiver is not delivering, and prometheus_config_last_reload_successful is
  # the only signal that says a rule file was rejected. Neither was being read,
  # which is how a receiver pointing at a webhook nobody listened on survived
  # four months. Both feed the rules in alerts/monitoring.yml.
  #
  # Self-scraping is not circular reasoning, it is just limited: an alert about
  # undeliverable alerts cannot be delivered either. It is still visible in the
  # Prometheus and Alertmanager UIs and in Grafana, which is exactly where an
  # operator looks when asking whether alerting works at all.
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    metrics_path: /metrics

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics
