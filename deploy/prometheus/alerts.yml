groups:
  - name: hive-critical
    rules:
      # Signup tenant provisioning (D-023). Deliberately an alert rather than a
      # readiness failure: provisioning can be broken while API-key resolution,
      # routing and payments still work, so degrading the container healthcheck
      # for it would turn a signup outage into a billing one. The absence of the
      # wiring itself is still a failed healthcheck, since that cannot be
      # transient.
      - alert: SignupProvisioningSweepFailing
        expr: hive_signup_provisioning_sweep_failures >= 3
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Signup tenant provisioning sweeps are failing"
          description: "{{ $value }} consecutive failed sweeps. New identities are not being given a tenant, so they hold a token with no tenant claim and every tenant-scoped request they make is refused."
      - alert: HighAPIErrorRate
        expr: |
          sum(rate(hive_http_requests_total{status_class=~"4xx|5xx"}[5m]))
          /
          sum(rate(hive_http_requests_total[5m]))
          > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API error rate above 10% for 5 minutes"
          description: "Combined 4xx+5xx error rate is {{ $value | humanizePercentage }}"

      - alert: UpstreamProviderDown
        expr: |
          sum by (provider) (rate(hive_upstream_requests_total{status="success"}[2m])) == 0
          AND
          sum by (provider) (rate(hive_upstream_requests_total[2m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Upstream provider {{ $labels.provider }} has 0% success rate"
          description: "Provider {{ $labels.provider }} returning no successful responses for 2 minutes"

      - alert: PaymentWebhookFailures
        expr: |
          increase(hive_payment_events_total{status="error"}[10m]) > 3
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Payment webhook failures detected"
          description: "More than 3 payment webhook errors in the last 10 minutes for rail {{ $labels.rail }}"
