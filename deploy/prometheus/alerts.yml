groups:
  - name: hive-critical
    rules:
      # Signup tenant provisioning (D-023). Deliberately an alert rather than a
      # readiness failure: provisioning can be broken while API-key resolution,
      # routing and payments still work, so degrading the container healthcheck
      # for it would turn a signup outage into a billing one. The absence of the
      # wiring itself is still a failed healthcheck, since that cannot be
      # transient.
      - alert: SignupProvisioningSweepFailing
        expr: hive_signup_provisioning_sweep_failures >= 3
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Signup tenant provisioning sweeps are failing"
          description: "{{ $value }} consecutive failed sweeps. New identities are not being given a tenant, so they hold a token with no tenant claim and every tenant-scoped request they make is refused."

      # The gauge above resets to zero the moment a sweep completes with no
      # failures, and a sweep completes with no failures once the identity that
      # kept faulting ages out of the reconciler's 24 hour lookback window. So
      # the alert above resolves itself at the exact moment provisioning has
      # permanently failed for a real person (review finding on PR 993). These
      # two cover that; the gauge stays because "currently failing" is still
      # worth knowing, it was just never enough on its own.
      #
      # A counter cannot be walked back by the work disappearing, which is the
      # whole point of using one here.
      - alert: SignupProvisioningFaulting
        expr: increase(hive_signup_provisioning_faults_total[1h]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Signup tenant provisioning is faulting on individual identities"
          description: "{{ $value }} provisioning attempts have faulted in the last hour. Unlike the consecutive-sweep gauge, this cannot be cleared by the affected identity ageing out of the sweep's window, so it stays visible while somebody is actually losing access."

      # And the standing state, not just the event: identities whose created_at
      # is already outside the lookback window hold no membership and no future
      # sweep will ever look at them again, so their loss is permanent until an
      # administrator acts. Keyed on the RISE rather than an absolute threshold
      # on purpose: a deployment with legitimately unclaimed historical
      # identities would sit permanently above any fixed threshold, and an alert
      # that is always firing is an alert nobody reads.
      - alert: SignupProvisioningStrandedIdentity
        expr: hive_signup_provisioning_stranded_identities - (hive_signup_provisioning_stranded_identities offset 1h) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "An identity aged out of the provisioning window with no tenant"
          description: "{{ $value }} more identities than an hour ago now sit outside the sweep's lookback window holding no tenant membership. Nothing automatic will pick them up again: they need an invitation, a registered email domain, or cmd/backfill-tenants."
      - alert: HighAPIErrorRate
        expr: |
          sum(rate(hive_http_requests_total{status_class=~"4xx|5xx"}[5m]))
          /
          sum(rate(hive_http_requests_total[5m]))
          > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API error rate above 10% for 5 minutes"
          description: "Combined 4xx+5xx error rate is {{ $value | humanizePercentage }}"

      - alert: UpstreamProviderDown
        expr: |
          sum by (provider) (rate(hive_upstream_requests_total{status="success"}[2m])) == 0
          AND
          sum by (provider) (rate(hive_upstream_requests_total[2m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Upstream provider {{ $labels.provider }} has 0% success rate"
          description: "Provider {{ $labels.provider }} returning no successful responses for 2 minutes"

      - alert: PaymentWebhookFailures
        expr: |
          increase(hive_payment_events_total{status="error"}[10m]) > 3
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Payment webhook failures detected"
          description: "More than 3 payment webhook errors in the last 10 minutes for rail {{ $labels.rail }}"

      # Cache-aware billing (PR #1157, vault spec-2026-08-25-cache-aware-billing.md).
      # A trip means a charge exceeded 2x the highest-rate bound (the highest
      # of the input, cache-read and cache-write rates) for its metered
      # tokens, the signature of a cache semantics inversion (the same class
      # of bug the audit found: prompt tokens billed at the wrong rate).
      # increase(), not the raw counter, so this alert clears once the
      # inversion stops happening rather than staying permanently firing --
      # same pattern as SignupProvisioningFaulting above, for the same
      # reason: a logged-but-unwatched failure is exactly how the
      # 2026-07-31 three-day free-billing incident went unnoticed.
      - alert: CacheBillingMagnitudeGuardTripped
        expr: |
          increase(hive_cache_billing_magnitude_guard_trips_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Cache-aware billing magnitude guard fired for {{ $labels.alias }}"
          description: "{{ $value }} charge(s) on alias {{ $labels.alias }} (provider {{ $labels.provider }}) exceeded 2x the highest-rate bound in the last 15 minutes. Usually a cache semantics inversion (cache tokens billed in the wrong direction); check recent provider/LiteLLM shape changes for this alias before assuming it is a one-off."

      # Lower severity than the trip above: this is billing continuing
      # correctly at a documented fallback rate, not a wrong charge, so it
      # is a catalog-hygiene signal (an alias reporting cache tokens with no
      # seeded cache price) rather than a money-correctness one.
      - alert: CacheBillingFallbackRateInUse
        expr: |
          increase(hive_cache_billing_fallback_rate_used_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Alias {{ $labels.alias }} is billing cache-{{ $labels.side }} tokens on the fallback rate"
          description: "{{ $value }} request(s) on alias {{ $labels.alias }} (provider {{ $labels.provider }}) priced a cache-{{ $labels.side }} token on the documented default multiplier because model_aliases.cache_{{ $labels.side }}_price_credits is NULL for this alias. Seed a real per-model rate (see the migration pattern in supabase/migrations/20260825_01_deepseek_cache_write_price.sql) so this stops being the normal path for this alias."

      # Issue #560. Open WebUI presents OWUI_SHIM_KEY, and nothing else, on the
      # upstream calls that carry no signed-in user: the bodyless GET /v1/models
      # the model picker is built from, text-to-speech and speech-to-text. When
      # that key stops resolving, handleModels answers 401 and the picker comes
      # up empty, and an empty picker issues no chat request at all, so the chat
      # surface looks like a silent no-op rather than a credential failure;
      # voice fails with a generic invalid-key error that names no cause.
      # Sign-in still works, because it carries the user's own token.
      #
      # Document RAG is unaffected, and for a stronger reason than "issue #1696
      # moved it onto the user's token". On /v1/embeddings the shim key is never
      # resolved at all: auth.hasShimAuthorization matches the Authorization
      # header by string comparison against the configured value, and
      # forwardUnwrapped then swaps in the signed-in user's token before authz.
      # A revoked key is still the same string, so revocation is invisible
      # there. Necessary-but-not-sufficient would be the wrong summary of it.
      #
      # edge-api probes the key at boot and every five minutes and logs the
      # verdict. That log line is not the signal: nothing reads it on a
      # schedule. This is, because it reaches Alertmanager and the ops mailbox.
      #
      # for: 6m is one probe interval plus a margin, so a genuinely revoked key
      # pages within roughly ten minutes of the revocation instead of being
      # found by a customer. The gauge is not written at all while the control
      # plane is unreachable (edge-api holds its last value), so a cold
      # control-plane container cannot fire this.
      #
      # Three bounds on this rule, stated rather than discovered later.
      #
      #   1. The gauge starts at 1 on each edge-api start (see
      #      registerOWUIShimKeyMetric for why a 0 start would page on a slow
      #      first probe), so an edge-api restarting more often than every six
      #      minutes keeps resetting this window. A container in that state is a
      #      louder outage than the one this rule watches for, and a stable one
      #      reaches the threshold on the first probe after boot.
      #   2. A blank OWUI_SHIM_KEY exports no series at all, deliberately: a
      #      deployment with no chat front-end has no key to break, and a gauge
      #      sitting at 0 there would be a permanent false page.
      #   3. Holding the last verdict means "usable" and "never actually
      #      measured" are the same reading, so a boot whose control plane is
      #      never reachable would sit at 1 forever with nothing observed. That
      #      is what OWUIShimKeyVerdictStale below covers, and EdgeAPITargetDown
      #      in alerts/monitoring.yml covers the case where the series stops
      #      being scraped at all. Neither absence can read as healthy.
      - alert: OWUIShimKeyUnusable
        expr: |
          hive_owui_shim_key_usable == 0
        for: 6m
        labels:
          severity: critical
        annotations:
          summary: "OWUI_SHIM_KEY does not resolve; the chat model picker is empty and text-to-speech and speech-to-text are down"
          description: "edge-api cannot resolve the Open WebUI shim key to an active, tenant-provisioned Hive API key allowed at least one model. GET /v1/models answers 401 for it, so the model picker is empty right now and an empty picker issues no chat request at all, which reads to a user as a chat surface that silently does nothing; text-to-speech and speech-to-text are failing with a generic invalid-key error. Sign-in is unaffected, and so is document RAG: its embeddings carry the signed-in user's own token since issue #1696, and this key is never resolved on that path at all. The cause is in edge-api's log (`docker compose logs edge-api | grep 'owui:'`), which names whether the key is revoked, unmapped to a tenant, or allowed no models. Remedy for a revoked key: python3 scripts/seed-owui-e2e-user.py --account-slug <this deployment's account> --tenant-slug <its tenant> --env-file .env with OWUI_BASE_URL and OWUI_ADMIN_TOKEN set, then recreate open-webui. That run revokes the key it replaces only when it minted the one being replaced (it revokes only <account-slug>-key); if this account also carries a key minted by hand under some other nickname, the script leaves it active on purpose and you must revoke it yourself once the new key is serving, or a superseded credential stays valid forever."

      # The staleness half of the rule above, and the reason that rule can be
      # trusted at all. hive_owui_shim_key_usable holds its last real verdict
      # and starts at 1, so an edge-api whose control plane never answers
      # exports a healthy-looking 1 indefinitely with nothing measured. This
      # reads the companion series edge-api writes only on a real verdict, so an
      # unknown key state is loud instead of quietly green.
      #
      # 1800 is six probe intervals: long enough that a control plane restarting
      # or briefly unreachable never trips it, short enough that "we have not
      # known the state of this credential for half an hour" reaches somebody.
      # The series is 0 until the first verdict lands, which is an unbounded age
      # and so fires this rather than passing it.
      #
      # warning, not critical: nothing is known to be broken here, the check
      # itself has stopped answering. HighAPIErrorRate is the backstop if the
      # control plane really is down, since a failed resolve answers 401 and
      # RATE_LIMIT_FAIL_OPEN defaults to false.
      - alert: OWUIShimKeyVerdictStale
        expr: |
          time() - hive_owui_shim_key_last_verdict_seconds > 1800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OWUI_SHIM_KEY has not been checked successfully for over 30 minutes"
          description: "edge-api's shim-key probe has not reached a verdict in {{ $value | humanizeDuration }} (an age in years means it has never reached one since this edge-api started), so hive_owui_shim_key_usable is holding a value nothing has confirmed and OWUIShimKeyUnusable cannot fire on a key that died in the meantime. The probe writes this series only when it actually resolves the key, so this means the control plane has been unreachable from edge-api (see `docker compose logs edge-api | grep 'owui:'` for the transient warnings), or the probe goroutine is not running. Do not rotate the key over this: nothing here says the key is bad."
