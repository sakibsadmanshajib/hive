groups:
  - name: hive-critical
    rules:
      # Signup tenant provisioning (D-023). Deliberately an alert rather than a
      # readiness failure: provisioning can be broken while API-key resolution,
      # routing and payments still work, so degrading the container healthcheck
      # for it would turn a signup outage into a billing one. The absence of the
      # wiring itself is still a failed healthcheck, since that cannot be
      # transient.
      - alert: SignupProvisioningSweepFailing
        expr: hive_signup_provisioning_sweep_failures >= 3
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Signup tenant provisioning sweeps are failing"
          description: "{{ $value }} consecutive failed sweeps. New identities are not being given a tenant, so they hold a token with no tenant claim and every tenant-scoped request they make is refused."

      # The gauge above resets to zero the moment a sweep completes with no
      # failures, and a sweep completes with no failures once the identity that
      # kept faulting ages out of the reconciler's 24 hour lookback window. So
      # the alert above resolves itself at the exact moment provisioning has
      # permanently failed for a real person (review finding on PR 993). These
      # two cover that; the gauge stays because "currently failing" is still
      # worth knowing, it was just never enough on its own.
      #
      # A counter cannot be walked back by the work disappearing, which is the
      # whole point of using one here.
      - alert: SignupProvisioningFaulting
        expr: increase(hive_signup_provisioning_faults_total[1h]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Signup tenant provisioning is faulting on individual identities"
          description: "{{ $value }} provisioning attempts have faulted in the last hour. Unlike the consecutive-sweep gauge, this cannot be cleared by the affected identity ageing out of the sweep's window, so it stays visible while somebody is actually losing access."

      # And the standing state, not just the event: identities whose created_at
      # is already outside the lookback window hold no membership and no future
      # sweep will ever look at them again, so their loss is permanent until an
      # administrator acts. Keyed on the RISE rather than an absolute threshold
      # on purpose: a deployment with legitimately unclaimed historical
      # identities would sit permanently above any fixed threshold, and an alert
      # that is always firing is an alert nobody reads.
      - alert: SignupProvisioningStrandedIdentity
        expr: hive_signup_provisioning_stranded_identities - (hive_signup_provisioning_stranded_identities offset 1h) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "An identity aged out of the provisioning window with no tenant"
          description: "{{ $value }} more identities than an hour ago now sit outside the sweep's lookback window holding no tenant membership. Nothing automatic will pick them up again: they need an invitation, a registered email domain, or cmd/backfill-tenants."
      - alert: HighAPIErrorRate
        expr: |
          sum(rate(hive_http_requests_total{status_class=~"4xx|5xx"}[5m]))
          /
          sum(rate(hive_http_requests_total[5m]))
          > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API error rate above 10% for 5 minutes"
          description: "Combined 4xx+5xx error rate is {{ $value | humanizePercentage }}"

      - alert: UpstreamProviderDown
        expr: |
          sum by (provider) (rate(hive_upstream_requests_total{status="success"}[2m])) == 0
          AND
          sum by (provider) (rate(hive_upstream_requests_total[2m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Upstream provider {{ $labels.provider }} has 0% success rate"
          description: "Provider {{ $labels.provider }} returning no successful responses for 2 minutes"

      - alert: PaymentWebhookFailures
        expr: |
          increase(hive_payment_events_total{status="error"}[10m]) > 3
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Payment webhook failures detected"
          description: "More than 3 payment webhook errors in the last 10 minutes for rail {{ $labels.rail }}"

      # Cache-aware billing (PR #1157, vault spec-2026-08-25-cache-aware-billing.md).
      # A trip means a charge exceeded 2x the highest-rate bound (the highest
      # of the input, cache-read and cache-write rates) for its metered
      # tokens, the signature of a cache semantics inversion (the same class
      # of bug the audit found: prompt tokens billed at the wrong rate).
      # increase(), not the raw counter, so this alert clears once the
      # inversion stops happening rather than staying permanently firing --
      # same pattern as SignupProvisioningFaulting above, for the same
      # reason: a logged-but-unwatched failure is exactly how the
      # 2026-07-31 three-day free-billing incident went unnoticed.
      - alert: CacheBillingMagnitudeGuardTripped
        expr: |
          increase(hive_cache_billing_magnitude_guard_trips_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Cache-aware billing magnitude guard fired for {{ $labels.alias }}"
          description: "{{ $value }} charge(s) on alias {{ $labels.alias }} (provider {{ $labels.provider }}) exceeded 2x the highest-rate bound in the last 15 minutes. Usually a cache semantics inversion (cache tokens billed in the wrong direction); check recent provider/LiteLLM shape changes for this alias before assuming it is a one-off."

      # Lower severity than the trip above: this is billing continuing
      # correctly at a documented fallback rate, not a wrong charge, so it
      # is a catalog-hygiene signal (an alias reporting cache tokens with no
      # seeded cache price) rather than a money-correctness one.
      - alert: CacheBillingFallbackRateInUse
        expr: |
          increase(hive_cache_billing_fallback_rate_used_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Alias {{ $labels.alias }} is billing cache-{{ $labels.side }} tokens on the fallback rate"
          description: "{{ $value }} request(s) on alias {{ $labels.alias }} (provider {{ $labels.provider }}) priced a cache-{{ $labels.side }} token on the documented default multiplier because model_aliases.cache_{{ $labels.side }}_price_credits is NULL for this alias. Seed a real per-model rate (see the migration pattern in supabase/migrations/20260825_01_deepseek_cache_write_price.sql) so this stops being the normal path for this alias."
