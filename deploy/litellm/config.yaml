# ─── Hive Cloud Demo — LiteLLM config (OpenRouter + Groq, cloud models only) ─
#
# IMPORTANT: Do NOT add a second top-level `model_list:` key. YAML parsers do
# not merge duplicate keys; a second key silently drops everything in the first.
# Append new models inside the single model_list block, before litellm_settings.
#
# Phase 15 note: OpenRouter and Groq chat-completions routes ship with
# `route_capabilities.executor_kind = 'local'` in the database so the
# control-plane local batch executor handles POST /v1/batches for these
# providers instead of LiteLLM's upstream file-upload path.
# (See git history for the phase 10 KNOWN-ISSUE-batch-upstream planning note.)

# Demo budget posture — paid-route count
# ──────────────────────────────────────
# RECOUNTED 2026-08-23. Owner directive, in two halves. hive-default and
# hive-auto left Groq for the OpenRouter FREE model
# dots-studio/dots-3-note-preview:free at HALF their previous price; hive-small,
# hive-medium and the deprecated hive-fast followed them onto the same free
# model at their prices UNCHANGED, to stop the Groq allowance being consumed.
# Migrations 20260823_20 and 20260823_21.
#
# So EVERY chat route in this file is now OpenRouter, and Groq serves audio
# only (sections 6 and 7). GROQ_API_KEY is still required.
#
# The paid count is UNCHANGED at FOUR, because nothing moved into or out of the
# paid set: route-deepseek-v4-flash, route-deepseek-v4-pro, route-doc-vlm
# (still OPENROUTER_AUTO_MODEL) and route-openrouter-embedding-fallback.
# route-openrouter-auto-beta is billed at actual upstream cost rather than a
# catalog price and is bounded by provider.max_price, so it is paid but
# self-limiting.
#
# CONCENTRATION RISK, in the same paragraph as the saving. Five aliases
# (hive-default, hive-auto, hive-small, hive-medium, hive-fast) now resolve to
# ONE model at ONE provider on ONE free endpoint, and there are still no
# gateway fallbacks (see litellm_settings below). The failure mode MOVES rather
# than disappearing: OpenRouter documents free variants at 20 requests per
# minute, which is tighter than the Groq daily allowance this was meant to
# escape. It also removes the workaround that existed an hour earlier, namely
# switching to hive-small on a different provider; there is no such alias now.
# What a customer sees at the cap is a roughly 60 second wait and then a 502
# reading "context canceled" rather than the provider's 429 with its retry hint
# (issue #1089, not fixed here: the candidate fix lives in the litellm_settings
# block the config sync preserves verbatim, so a file edit is inert on a live
# box). This does NOT close issue #1088, which is CI consuming the live demo's
# allowance and has a different owner.
#
# The historical note below is kept for the reasoning it records.
#
# CORRECTED by issue #689 (2026-08). This block used to claim only ONE route
# was paid, on the theory that OPENROUTER_DEFAULT_MODEL / OPENROUTER_AUTO_MODEL
# default to `openrouter/free` in .env.example, so the flagship and vision
# routes cost nothing "out of the box". That was the bug: those two env vars
# resolve OpenRouter's arbitrary free-model router, an undisclosed model priced
# at zero, while model_aliases still charged customers the gpt-4o-mini /
# gpt-4.1-mini price the catalog names. The env vars now default to the same
# paid slugs the catalog is priced against (see .env.example and
# supabase/migrations/20260331_02_routing_policy.sql's provider_model column),
# so the honest count is FOUR dispatchable paid routes out of the six below,
# resolving to THREE distinct paid models: route-openrouter-default
# (gpt-4o-mini), route-openrouter-auto and route-doc-vlm (both gpt-4.1-mini,
# sharing OPENROUTER_AUTO_MODEL -- one model, two routes), and
# route-openrouter-embedding-fallback (qwen3-embedding-8b, embedding cascade
# last resort). Use the route count for a dispatch audit (which routes can
# ever bill a paid provider) and the model count for a spend estimate (how
# many distinct upstream rates are in play). The Groq fast route and the
# embedding primary stay free-tier.
# Whether a 3-paid-route demo still fits inside whatever budget cap motivated
# this comment is a cost-policy question for the owner, not something this fix
# decides; deploy-demo-box.yml's "Assert model catalog prices agree..." step
# only guarantees the price and the model stay in agreement, not a spend cap.
# OpenRouter exposes no embedding models on /api/v1/models (embeddings ride the
# openai/ generic adapter), so there is no verified free embedding slug to swap
# the fallback to; it stays paid by necessity and is documented here.
model_list:
  # ── 1. Default chat (OpenRouter FREE model, hive-default) ───────────────────
  # Owner directive 2026-08-23: hive-default and hive-auto move to an OpenRouter
  # free model and their prices halve. Migration
  # supabase/migrations/20260823_20_free_route_aliases_half_price.sql carries
  # the full derivation, the live capability and data-policy evidence, and the
  # before-and-after prices.
  #
  # Was route-groq-default (groq/openai/gpt-oss-20b), which is retired as
  # `disabled` in provider_routes so the config sync drops its entry from the
  # live gateway. A NEW route id is what lets that happen, and it is the same
  # reason 20260822_02 gave when it retired route-openrouter-default: the sync
  # merges field by field, the database owns only model, api_base and api_key,
  # and anything else already on an entry survives forever.
  #
  # The doubled `openrouter/` prefix is correct: LiteLLM strips the leading one
  # as its provider selector and forwards the rest, so this reaches OpenRouter
  # as `dots-studio/dots-3-note-preview:free`. The trailing `:free` selects the
  # zero-priced variant; dropping it silently selects a PAID endpoint of the
  # same model.
  #
  # `provider.data_collection: deny` restricts routing to providers that do not
  # collect user data. It is a fail-closed guard rather than decoration: this
  # model resolves to one provider today (AtlasCloud, which does not train on
  # prompts), and if that policy changes or a second provider appears the
  # request fails instead of quietly moving customer prompts to a provider that
  # stores them. Verified live 2026-08-23: with this preference set, five of
  # five requests were served by non-training providers, and `zdr: true`, the
  # stricter form, returns 404 because no zero-data-retention free endpoint
  # exists at all right now.
  #
  # `allow_fallbacks: false` keeps OpenRouter from substituting a different
  # provider for this model behind our back, which would defeat the guard
  # above.
  #
  # The model is written literally, not through an env var. The upstream model
  # for a DB-managed route comes from provider_routes.provider_model via
  # POST /internal/litellm/sync (issue #713), and adding a fresh
  # os.environ/... indirection would just rebuild the two-mechanisms-one-
  # checked drift that issues #689 and #965 were. This literal is only the
  # first-boot seed.
  - model_name: route-free-default
    litellm_params:
      model: openrouter/dots-studio/dots-3-note-preview:free
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          data_collection: deny
          allow_fallbacks: false

  # ── 2. Deprecated fast chat (hive-fast) ─────────────────────────────────────
  # hive-fast is DEPRECATED as of the 2026-08-22 catalog restructure. It is
  # kept, priced and routed identically to hive-small, because the model id is
  # persisted per-conversation in existing Open WebUI chats and in live API
  # clients. Do not retire this route without a migration path for those.
  #
  # It no longer falls back to anything. The previous comment claimed an
  # automatic cascade to the flagship route via litellm_settings.fallbacks;
  # those chat fallbacks are gone, deliberately, because a fallback answers
  # from a model the alias was not priced against. See litellm_settings below.
  #
  # It used to serve Groq openai/gpt-oss-20b through GROQ_FAST_MODEL (a value
  # issue #965 had to revert once already, after Groq decommissioned
  # llama-3.1-8b-instant).
  #
  # MOVED OFF GROQ 2026-08-23 by the same owner directive, second half: the
  # remaining Groq TEXT routes go to the OpenRouter free model to stop the Groq
  # allowance being consumed. Migration
  # supabase/migrations/20260823_21_groq_text_routes_to_openrouter_free.sql.
  # Its price does NOT change; only hive-default and hive-auto were repriced.
  #
  # This also drops the `os.environ/GROQ_FAST_MODEL` indirection, the last one
  # on a chat route. GROQ_FAST_MODEL is now unused; it stays in .env.example
  # only because CI workflows still pass it through.
  - model_name: route-free-fast
    litellm_params:
      model: openrouter/dots-studio/dots-3-note-preview:free
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          data_collection: deny
          allow_fallbacks: false

  # ── 3. Larger chat (OpenRouter FREE model, hive-auto) ───────────────────────
  # Was route-groq-auto (groq/openai/gpt-oss-120b), retired for the same reason
  # and in the same way as route-groq-default above. Same owner directive, same
  # migration.
  #
  # It serves the SAME upstream model as route-free-default, and hive-auto is
  # priced at twice hive-default, so the price gap now buys a customer nothing.
  # That wart is recorded in the migration header and flagged to the owner
  # rather than papered over: the directive was 50 percent of each alias's own
  # current price, and no second free model has full capability parity without
  # training on prompts, so a distinct larger model was not available to pick.
  #
  # This route IS the sole catalog carrier of supports_batch,
  # supports_image_generation and supports_image_edit, inherited from
  # route-groq-auto and before that route-openrouter-auto. The two image flags
  # remain a documented status-quo preservation, not a claim that this model
  # generates images; dropping them would delete /v1/images/generations and
  # /v1/images/edits for every alias in the catalog. See the migration header.
  #
  # ON VISION, correcting what the previous revision of this comment said. The
  # 2026-08-22 restructure recorded that moving hive-auto to gpt-oss-120b left
  # NO customer-reachable vision path through the gateway. This free model is
  # `text+image->text`, so an image-input path exists again on both aliases at
  # the upstream level. That is deliberately NOT declared as a capability:
  # provider_capabilities has no vision column, so there is nothing to set and
  # no catalog claim is being made. Treat it as an unadvertised property of the
  # upstream, not a supported feature, until something actually declares it.
  #
  # route-doc-vlm (section 4) is still not a customer path. It has no
  # provider_routes row, which is why the config sync leaves it alone, and
  # SelectRoute only ever returns routes joined to an alias, so nothing a
  # customer sends in the OpenAI-compatible `model` field can select it. Its
  # only consumer is apps/agent-engine/internal/docvlm, which addresses this
  # LiteLLM model name directly and never goes through the catalog. Do not
  # point a customer at it.
  #
  # hive-auto still performs no automatic model selection; the name is kept for
  # back-compat only.
  - model_name: route-free-auto
    litellm_params:
      model: openrouter/dots-studio/dots-3-note-preview:free
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          data_collection: deny
          allow_fallbacks: false

  # ── 3b. Catalog restructure routes (2026-08-22, repointed 2026-08-23) ───────
  # hive-small and hive-medium are provider-blind capability tiers. They used to
  # be the two Groq gpt-oss models; as of 2026-08-23 they are on the same free
  # OpenRouter model as every other chat alias, at their UNCHANGED prices.
  #
  # So after that change there is NO Groq chat route left in this file. Groq
  # still serves audio (sections 6 and 7) and GROQ_API_KEY is still required;
  # what it no longer serves is chat. Say the consequence plainly rather than
  # pointing somewhere reassuring: every customer-reachable chat alias except
  # the two paid DeepSeek ones now depends on ONE model at ONE provider on ONE
  # free endpoint capped at 20 requests per minute, with no gateway fallbacks.
  # There is no longer a same-capability alias on a different provider for a
  # rate-limited customer to switch to.
  #
  # The two DeepSeek routes remain the only paid OpenRouter chat routes.
  #
  # The tilde in ~deepseek/deepseek-v4-flash-latest is part of the real
  # OpenRouter model id. Removing it silently selects a different, differently
  # priced model, so do not "tidy" it away.
  - model_name: route-free-small
    litellm_params:
      model: openrouter/dots-studio/dots-3-note-preview:free
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          data_collection: deny
          allow_fallbacks: false
  - model_name: route-free-medium
    litellm_params:
      model: openrouter/dots-studio/dots-3-note-preview:free
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          data_collection: deny
          allow_fallbacks: false
  - model_name: route-deepseek-v4-flash
    litellm_params:
      model: openrouter/~deepseek/deepseek-v4-flash-latest
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        # Prompt-cache endpoint affinity, fix/cache-realization (2026-08-26).
        # Unpinned, OpenRouter bounced three identical prompts across three
        # endpoints (Inceptron / Fireworks / OpenInference), cached_tokens=0
        # every time: a cold endpoint cannot serve a cache hit, so the
        # supports_cache_read=true capability row on this route never paid
        # off and every repeat prompt billed at full input price. The soft
        # `order` preference below keeps fallbacks enabled (no availability
        # cliff): while the preferred endpoint is healthy it serves the
        # request and DeepSeek prefix caching hits; when it is not, OpenRouter
        # falls back to another endpoint and callers see a cold cache plus a
        # different tokenizer's prompt-token count until the preference
        # resumes. Live-proven pinned: cached_tokens=512 on every repeat.
        provider:
          order:
            - Inceptron
  - model_name: route-deepseek-v4-pro
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro-0813
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        # Same defect, same fix as route-deepseek-v4-flash above. Unpinned,
        # pro bounced DigitalOcean / SiliconFlow / Together with zero cache
        # hits; pinned to DigitalOcean, cached_tokens=768 on every repeat.
        provider:
          order:
            - DigitalOcean

  # ── 4. Doc-layout vision (paid, OpenRouter, the last multimodal route) ──────
  # Blueprint Wave 3, Step 3.2 (issue #300): the doc-layout knowledge-work-pack
  # skill (apps/agent-engine/internal/docvlm) sends contract/PDF page images
  # here for structured layout extraction.
  #
  # UPDATED 2026-08-22. This section used to describe the route as sharing a
  # model and an env var with route-openrouter-auto, and as being separable
  # from "the general vision route edge-api's capability selector uses".
  # Neither that route nor that selector path exists any more: the catalog
  # restructure retired route-openrouter-auto and moved hive-auto to a
  # text-only Groq model.
  #
  # What is left is this: route-doc-vlm is the ONLY multimodal route in the
  # file, it is reachable only by agent-engine calling this LiteLLM model name
  # directly, and it is NOT selectable by any customer request, because it has
  # no provider_routes row and therefore no alias. OPENROUTER_AUTO_MODEL now
  # exists for this route alone, so it must stay pointed at a vision-capable
  # slug even though no alias is priced against it any more.
  - model_name: route-doc-vlm
    litellm_params:
      model: os.environ/OPENROUTER_AUTO_MODEL
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          allow_fallbacks: false
          sort: throughput

  # ── 5. Embedding (OpenRouter free pool, with paid fallback) ─────────────────
  # LiteLLM's native `openrouter/` provider does NOT map the /embeddings
  # endpoint. We use the `openai/` generic adapter with `api_base` pointing
  # at OpenRouter's base URL so the model slug is passed through directly.
  #
  # Primary: NVIDIA Nemotron-Embed VL 1B (free pool, multimodal embeddings).
  # Fallback: Qwen3 Embedding 8B (paid, larger context window).
  # NVIDIA NIM retrieval models were retired on 2026-05-18 (HTTP 410); the
  # Nemotron-Embed VL route is the replacement via OpenRouter's free pool.
  - model_name: route-openrouter-embedding
    litellm_params:
      model: openai/nvidia/llama-nemotron-embed-vl-1b-v2:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      mode: embedding
  - model_name: route-openrouter-embedding-fallback
    litellm_params:
      model: openai/qwen/qwen3-embedding-8b
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      mode: embedding

  # ── 5b. Embedding: bge-m3 (Enterprise/Ollama local, native 1024-dim) ────────
  # Not active in the serverless cloud demo -- no bge-m3 server runs there.
  # This route lets the enterprise/self-host profile point EMBEDDING_MODEL at
  # "bge-m3" through LiteLLM instead of hitting Ollama directly, once an
  # operator sets EMBEDDING_LOCAL_BASE_URL to their bge-m3-serving endpoint
  # (e.g. http://ollama:11434/v1). Native 1024-dim: no EMBEDDING_TRUNCATE_TO
  # needed when EMBEDDING_DIM=1024 (the default, matching rag_chunks today).
  - model_name: bge-m3
    litellm_params:
      model: openai/bge-m3
      api_base: os.environ/EMBEDDING_LOCAL_BASE_URL
      api_key: "none"
    model_info:
      mode: embedding

  # ── 6. Voice: speech-to-text (Groq Whisper, free tier) ──────────────────────
  # Groq: whisper-large-v3 — serverless STT for the demo. edge-api's audio
  # handler forwards POST /v1/audio/transcriptions here whenever no local
  # sovereign STT sidecar (Parakeet/faster-whisper) is configured.
  - model_name: route-groq-stt
    litellm_params:
      model: groq/whisper-large-v3
      api_key: os.environ/GROQ_API_KEY
    model_info:
      mode: audio_transcription

  # ── 7. Voice: text-to-speech (Groq Orpheus TTS) ─────────────────────────────
  # Groq: canopylabs/orpheus-v1-english — serverless TTS for the demo. Groq
  # deprecated playai-tts (shut down 2025-12-31) in favor of Orpheus (Canopy
  # Labs); this is the current recommended replacement per
  # https://console.groq.com/docs/deprecations. Voice IDs are plain names
  # (e.g. "troy", "hannah"), not the old "<Name>-PlayAI" convention.
  - model_name: route-groq-tts
    litellm_params:
      model: groq/canopylabs/orpheus-v1-english
      api_key: os.environ/GROQ_API_KEY
    model_info:
      mode: audio_speech

  # ── 8. Task-aware router (paid; billed at ACTUAL per-request cost) ──────────
  # Backs the `openrouter-auto` alias. openrouter/auto-beta is a ROUTER: it
  # picks a different upstream model per request, so OpenRouter reports
  # `prompt: -1, completion: -1` for it and there is no catalog price to charge
  # against. The alias is therefore priced `upstream_actual` in model_aliases,
  # and settlement reads the cost OpenRouter reports for each generation.
  #
  # Three things here are load-bearing, not decoration.
  #
  # 1. `usage.include` is what makes OpenRouter report the cost at all. Without
  #    it every request settles through the fail-closed path and gets charged
  #    the full hold. It is set here rather than left to the client so the
  #    charge does not depend on what a caller happened to send. Verified
  #    2026-08-22 that `drop_params: true` does NOT strip it.
  #
  # 2. `provider.max_price` bounds what one request can cost us, in USD per
  #    MILLION tokens. OpenRouter's auto-router documentation confirms it still
  #    applies to the router, enforced after it resolves a model, and that a
  #    breach fails the request rather than routing to a pricier endpoint. That
  #    bound is what makes the credit hold defensible instead of a guess; the
  #    hold in the migration is derived from these exact numbers.
  #
  # 3. The model is a LITERAL, not `os.environ/..._MODEL` like every other
  #    OpenRouter route here. Issue #689 is what an env var costs on a priced
  #    route: the catalog priced one model while the deployment quietly called
  #    another. For an alias billed at actual cost the slug IS the product
  #    decision, and it must not be repointable without a code review.
  #
  # Deliberately absent from `fallbacks:` below. A fallback to a fixed-price
  # route would settle this alias against a provider that never reports a
  # per-request cost, which is the free-serve shape it exists to avoid.
  # The doubled prefix is correct and matches every other OpenRouter entry
  # here: LiteLLM strips the leading `openrouter/` as its provider selector and
  # forwards the rest, so this sends the slug `openrouter/auto-beta` upstream.
  # Compare `openrouter/openai/gpt-4o-mini` above, which reaches OpenRouter as
  # `openai/gpt-4o-mini`. Verified against a live LiteLLM on 2026-08-22.
  - model_name: route-openrouter-auto-beta
    litellm_params:
      model: openrouter/openrouter/auto-beta
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        usage:
          include: true
        provider:
          max_price:
            prompt: 3
            completion: 15

  # route-openrouter-auto-live is the SAME arrangement for the customer-facing
  # `hive-auto` alias, which 20260824_02_free_pool_router.sql moved onto
  # openrouter/auto. It carries the same three load-bearing keys for the same
  # three reasons, and it has to be stated HERE rather than left to the config
  # sync: the generator owns only model, api_base and api_key, and merges every
  # other key from this file field by field (litellmconfig.mergeParams). A
  # provider_routes row alone therefore produced a live entry with no
  # usage.include and no max_price at all, which is what the box was running
  # (verified 2026-08-29 by reading /etc/litellm/config.yaml inside the running
  # container).
  #
  # max_price is the load-bearing one: without it the rate half of the credit
  # hold's coverage proof simply does not exist, so the hold is a number rather
  # than a bound (issue #1372).
  #
  # usage.include is belt and braces rather than a repair. A live hive-auto turn
  # on 2026-08-29 settled with terminal_usage_confirmed true even without it, so
  # a cost does reach us on this path today. Setting it explicitly means the
  # charge does not depend on that continuing to be true by default, which is
  # the same reason its beta twin sets it rather than leaving it to the client.
  - model_name: route-openrouter-auto-live
    litellm_params:
      model: openrouter/openrouter/auto
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        usage:
          include: true
        provider:
          max_price:
            prompt: 3
            completion: 15

  # ── OpenCode Zen, the keyless upstream (hive-free-tools) ────────────────────
  #
  # Migration supabase/migrations/20260830_04_opencode_zen_keyless_provider.sql
  # carries the provider, route, alias and measured capability rows. The two
  # headers below are the part the database cannot carry, and they are the
  # entire access mechanism, so they are stated HERE for the same reason
  # route-openrouter-auto-live states its extra_body here: the config generator
  # owns exactly model, api_base and api_key and merges every other
  # litellm_params key from this file field by field
  # (litellmconfig.mergeParams). A provider_routes row alone would therefore
  # produce a live entry with no headers at all, which answers 429 to every
  # request while the repository, the pull request and CI all look correct.
  #
  # `User-Agent: opencode` IS the access gate. This endpoint takes no
  # credential; what it checks is the client identity in the User-Agent.
  # Measured 2026-08-30, direct to the endpoint: `opencode` and
  # `opencode-cli/1.0.0` answer 200, while `Mozilla/5.0`, curl's default and
  # the OpenAI client's own `AsyncOpenAI/Python 2.33.0` all answer 429
  # FreeUsageLimitError. There is no TLS fingerprinting involved: plain curl
  # with the right header is served.
  #
  # The empty `Authorization` is not decoration either. LiteLLM cannot build an
  # OpenAI client with no api_key at all, so the generator emits the literal
  # `keyless` for a provider whose api_key_env is empty, and without this
  # override that literal reaches the upstream as `Bearer keyless`. Measured
  # through the pinned image (v1.98.0) against the real endpoint: with both
  # headers, 200; with only the User-Agent, 401 "Invalid API key"; with
  # neither, 429. Any non-empty bearer token is rejected, so "no token" has to
  # be said explicitly rather than left to a placeholder.
  #
  # Deliberately NOT joined to the free pool's shared model_name: this
  # deployment supports tools and json_schema and the pool's members do not, and
  # LiteLLM load-balances across a shared name regardless of what Hive selected.
  - model_name: route-free-opencode-zen
    litellm_params:
      model: openai/big-pickle
      api_base: https://opencode.ai/zen/v1
      api_key: keyless
      extra_headers:
        User-Agent: opencode
        Authorization: ""


# Retry each upstream call up to 3 times before falling back to another group.
# Covers 429/5xx automatically. `fallbacks:` kicks in only after retries
# exhaust. `cooldown_time` prevents hammering a model that just failed.
# `drop_params: true` silently drops provider-unsupported request fields
# (e.g. some OpenRouter free embedding providers reject `encoding_format`)
# instead of returning a hard 400 to the client. It does NOT cover
# `dimensions` on the embedding routes below: LiteLLM's generic openai adapter
# raises UnsupportedParamsError for any model name without "text-embedding-3"
# before consulting drop_params, so callers must not send that field at all
# (see apps/edge-api/internal/rag/embed.go and
# apps/control-plane/internal/rag/ingest.go, which reduce client-side instead).
# Per-exception-class retry counts, which override num_retries below for the
# classes named here. Issue #1089.
#
# A rate limit gets ZERO retries. The limit that actually fired on 2026-08-23
# was Groq's tokens-per-DAY budget, and retrying a window that resets tomorrow
# cannot succeed: it only converts a fast, correct, actionable 429 into a slow
# wrong one. LiteLLM cannot tell a per-day budget from a per-second burst, so a
# blanket retry on rate limits is a bet that every rate limit is transient, and
# the one we hit was not.
#
# Measured on the image this stack runs (v1.98.0), against a stub upstream that
# returns 429 on demand, rather than read off a doc page:
#
#   without this block   4 upstream attempts, 11.47s, client sees 429
#   with this block      1 upstream attempt,   1.79s, client sees 429
#   with this block, upstream 500 instead
#                        4 upstream attempts, 13.27s, client sees 500
#
# The third line is the one that makes this safe: every other error class still
# retries num_retries times. And the absorption for a genuine per-minute burst
# is not lost, it moves one layer out: edge-api retries 429 itself, four
# attempts inside about 2.9 seconds, and returns the final 429 verbatim
# (apps/edge-api/internal/inference/retry.go). Fast absorption stays, the slow
# multi-minute kind goes.
#
# One caution found while measuring: LiteLLM classifies partly on message
# CONTENT, not only on status code. A stub returning HTTP 500 whose body
# mentioned "limits" was mapped to RateLimitError and therefore not retried. So
# a provider whose 5xx text talks about limits will now fail fast rather than
# retry. That is the correct trade for the case this fixes and is written down
# so the next reader does not rediscover it from a strange log line.
router_settings:
  retry_policy:
    RateLimitErrorRetries: 0

litellm_settings:
  # Sovereign edge: disable all LiteLLM telemetry so no call metadata is
  # sent to LiteLLM's hosted services. Must be set to False (string form)
  # per the LiteLLM docs; the Python bool False is also accepted at runtime.
  telemetry: False
  # Applies to every error class EXCEPT the ones router_settings.retry_policy
  # above names.
  num_retries: 3
  request_timeout: 45
  # DO NOT "TIDY" allowed_fails / cooldown_time INTO router_settings.
  #
  # They look misplaced, and in the narrow sense they are: both are Router
  # constructor params (litellm/types/router.py::UpdateRouterConfig lists them),
  # so sitting under litellm_settings they never reach the Router. The effective
  # cooldown is therefore DEFAULT_COOLDOWN_TIME_SECONDS (5), not the 30 written
  # here -- confirmed at runtime, not inferred: CI run 32830060362's litellm log
  # prints `'cooldown_time': 5` in its Cooldown Deployments line.
  #
  # Moving allowed_fails would BREAK the free pool. With it unset on the Router,
  # router_utils/cooldown_handlers.py::_should_cooldown_deployment takes its
  # BASE CASE branch, whose last test is `litellm._should_retry(status) is False
  # -> return True`: a 404 member is cooled down on its FIRST failure. Set
  # allowed_fails on the Router and that branch is skipped for
  # should_cooldown_based_on_allowed_fails_policy, which needs `fails >
  # allowed_fails` -- four failures before a dead member is taken out of
  # rotation. The edge's failover retry (apps/edge-api/internal/inference/
  # retry.go) depends on the immediate cooldown to land its next attempt on a
  # different member, so that change would quietly restore issue #1064.
  #
  # Left as-is deliberately, with the reason written down, rather than "fixed"
  # into a regression. Revisit only alongside that retry ladder.
  allowed_fails: 3
  cooldown_time: 30
  drop_params: true
  fallbacks:
    # The two chat fallbacks that used to live here are GONE, deliberately.
    # They read:
    #   - route-openrouter-default: [route-groq-fast]
    #   - route-openrouter-auto: [route-groq-fast]
    # Both named routes are retired by the 2026-08-22 catalog restructure, so
    # they would be inert anyway, but they should not simply be re-pointed at
    # the replacement routes either. A gateway fallback serves a DIFFERENT
    # upstream model than the alias is priced against: route-openrouter-auto
    # was priced on gpt-4.1-mini and would silently answer from gpt-oss-20b.
    # That is the one-alias-one-price rule being broken one layer below the
    # database, where the catalog cannot see it. The owner's rule is that an
    # alias maps to exactly one model, so a chat request now fails rather than
    # being quietly served by a model the customer was not charged for.
    #
    # Consequence, stated plainly: there is no absorption if Groq has an
    # outage. That is the accepted trade-off of one model, one price.
    #
    # Embedding cascade: Nemotron-Embed VL (free pool) → Qwen3 Embedding
    # (paid, larger context). NVIDIA NIM is no longer in the chain after
    # the 2026-05-18 retrieval-model EOL wave. Kept, because both legs are
    # embedding routes under one alias whose price is not per-token in the
    # same sense, and RAG ingestion failing outright is worse than a
    # second-choice embedding model.
    - route-openrouter-embedding: [route-openrouter-embedding-fallback]

files_settings:
  - custom_llm_provider: openrouter
    api_key: os.environ/OPENROUTER_API_KEY

