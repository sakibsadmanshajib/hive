<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hive">
  <!-- Vector twin of the rasters generated by generate-brand-assets.py in this
       directory. Palette and hexagon both come from the live S Cubed site's own
       source (repository scubedcombd/scubed), not from a screenshot. -->
  <rect width="64" height="64" rx="14" fill="#2b2b28"/>
  <!-- The Hive motif: the same hexagon scubed.co/hive clips its floating marks
       with, polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%). -->
  <polygon points="32,19.2 43.25,25.6 43.25,38.4 32,44.8 20.75,38.4 20.75,25.6" fill="#d9a53b"/>
</svg>
