# docker-compose.enterprise.yml
#
# EnterpriseEdge self-hosted Supabase data plane override (issue #231).
#
# This file is intentionally separate from docker-compose.yml because Docker
# Compose evaluates ALL environment interpolations for ALL services regardless
# of which --profile is active. Placing the enterprise-only Supabase services
# here means that operators running --profile local or --profile cloud never
# see :? errors for ENTERPRISE_* vars they have not set.
#
# Usage (always pass both -f flags for enterprise):
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.enterprise.yml \
#     --profile enterprise up --build
#
# The installer (scripts/install.sh) does this automatically.
#
# Required vars (set in .env before running):
#   ENTERPRISE_DB_PASSWORD      openssl rand -base64 24
#   ENTERPRISE_JWT_SECRET       openssl rand -base64 48  (min 32 chars)
#   ENTERPRISE_ANON_KEY         sign {"role":"anon"} JWT with ENTERPRISE_JWT_SECRET
#   ENTERPRISE_SERVICE_ROLE_KEY sign {"role":"service_role"} JWT with ENTERPRISE_JWT_SECRET
#   ENTERPRISE_JWT_KEYS         scripts/generate-enterprise-jwt-keys.py
#   ENTERPRISE_JWT_VERIFY_KEYS         same command, printed on the second line
#
# See .env.example for the full ENTERPRISE_* block and generation instructions.

name: hive

services:

  # ── supabase-db ────────────────────────────────────────────────────────────
  # Postgres 16 with the pgvector and pg_cron extensions pre-installed.
  # No host port binding: all access is via the internal compose network.
  # The init script at deploy/supabase/init/00-extensions.sql runs once on
  # first startup and creates the required extensions, schemas, and roles
  # (including hive_app which RLS policies reference).
  supabase-db:
    # Built here rather than pulled, for one reason: pg_cron. See
    # Dockerfile.supabase-db for why a derived image and not supabase/postgres,
    # and for the digest-pinned base this adds a single package to.
    #
    # Without pg_cron on disk, 20260729_02's nightly metering retention job was
    # never scheduled on this deployment and nothing said so. The extension is
    # a property of the image now, so a container recreate, a fresh volume or a
    # rebuilt box all still have it. A hand-run CREATE EXTENSION on the box
    # would not survive any of the three.
    image: hive-supabase-db:pg16-cron
    build:
      context: .
      dockerfile: Dockerfile.supabase-db
    # `command:` overrides the base image's CMD (`postgres`), which the official
    # entrypoint execs after initialisation. This is how a
    # shared_preload_libraries value reaches this server: pg_cron refuses
    # CREATE EXTENSION outright unless its library is preloaded, and preloading
    # is a startup-time setting, so it cannot be done from a migration or from
    # the init script. Changing this line recreates the container, which is a
    # short database restart for the whole stack.
    #
    # cron.database_name has to name the database the cron schema lives in,
    # which is the one every migration runs against. It defaults to the literal
    # `postgres`, so it is spelled from the same variable as POSTGRES_DB below
    # rather than left to coincide with it.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=${ENTERPRISE_DB_NAME:-postgres}
    profiles:
      - enterprise
      - selfhost
    environment:
      POSTGRES_USER: ${ENTERPRISE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ENTERPRISE_DB_PASSWORD:?set ENTERPRISE_DB_PASSWORD in .env (openssl rand -base64 24)}
      POSTGRES_DB: ${ENTERPRISE_DB_NAME:-postgres}
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - ../../deploy/supabase/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ENTERPRISE_DB_USER:-postgres} -d ${ENTERPRISE_DB_NAME:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── supabase-auth (GoTrue) ─────────────────────────────────────────────────
  # Local JWT issuer. edge-api validates tokens against its JWKS, reached
  # through the caddy-supabase gateway over TLS, never directly over http:
  # SUPABASE_JWKS_URL=https://caddy-supabase/auth/v1/.well-known/jwks.json.
  # Set ENTERPRISE_MAILER_AUTOCONFIRM=true for air-gapped installs without SMTP.
  supabase-auth:
    # Pinned to immutable digest. Refresh: docker pull supabase/gotrue:v2.189.0 && docker inspect --format='{{index .RepoDigests 0}}' supabase/gotrue:v2.189.0
    #
    # Bumped from v2.170.0 (2025-03-06), which predates the OAuth 2.1
    # authorization server entirely: on that tag /oauth/authorize and both
    # well-known discovery documents answer 404, verified by running the image
    # rather than by reading notes. Open WebUI signs in through that server
    # (OPENID_PROVIDER_URL in docker-compose.yml), so self-hosting on the old
    # pin would have silently lost chat login. The server first ships in
    # v2.180.0; v2.189.0 is what upstream's own self-host compose pins.
    image: supabase/gotrue:v2.189.0@sha256:385184459f57569c54c25209f51f3b2be99ddd7c4ce9e3555b5d3eea8447b7cf
    profiles:
      - enterprise
      - selfhost
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: "9999"
      # The AUTH origin, not the app origin. It is the base GoTrue puts in
      # email links and, with the issuer below, in its discovery document, so
      # it must be the externally reachable address of THIS service. Distinct
      # from GOTRUE_SITE_URL below, which is the web-console origin: deriving
      # both from one variable cannot be correct for either.
      API_EXTERNAL_URL: ${ENTERPRISE_AUTH_EXTERNAL_URL:-http://caddy-supabase/auth/v1}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: "postgres://${ENTERPRISE_DB_USER:-postgres}:${ENTERPRISE_DB_PASSWORD:?set ENTERPRISE_DB_PASSWORD in .env}@supabase-db:5432/${ENTERPRISE_DB_NAME:-postgres}?search_path=auth"
      GOTRUE_SITE_URL: ${ENTERPRISE_SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${ENTERPRISE_REDIRECT_ALLOW_LIST:-}
      # Default true: regulated deployments use admin-provisioned users only.
      # Set ENTERPRISE_DISABLE_SIGNUP=false in .env to re-enable self-serve signup.
      GOTRUE_DISABLE_SIGNUP: ${ENTERPRISE_DISABLE_SIGNUP:-true}
      GOTRUE_JWT_SECRET: ${ENTERPRISE_JWT_SECRET:?set ENTERPRISE_JWT_SECRET in .env (openssl rand -base64 48)}
      # Asymmetric signing key set, and the reason this profile can
      # authenticate at all. With GOTRUE_JWT_SECRET alone GoTrue signs HS256
      # and its /.well-known/jwks.json publishes an EMPTY key set: the
      # handler skips every symmetric key (internal/api/jwks.go, verified in
      # this exact pinned image). edge-api validates with jwt.WithKeySet
      # against that endpoint and fails its initial refresh, so every token
      # is rejected and the gateway will not come up. Generate the value
      # with scripts/generate-enterprise-jwt-keys.py; GoTrue accepts exactly
      # one signing key, so rotation is a replace and forces a re-login.
      #
      # That generated value also carries the legacy symmetric key, verify
      # only, and it has to. Once GoTrue is given a key set it validates
      # incoming tokens against that set alone: observed on this pin, an admin
      # call made with the HS256 service_role key is refused with "signing
      # method HS256 is invalid" (HTTP 403) when the EC key is configured by
      # itself, which would break the seeding scripts and the invite flow.
      # GOTRUE_JWT_SECRET below stays set regardless, since Storage validates
      # against the raw secret.
      GOTRUE_JWT_KEYS: ${ENTERPRISE_JWT_KEYS:?set ENTERPRISE_JWT_KEYS in .env (scripts/generate-enterprise-jwt-keys.py)}
      GOTRUE_JWT_EXP: ${ENTERPRISE_JWT_EXP:-3600}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      # Must match what edge-api expects in SUPABASE_JWT_ISSUER / SUPABASE_JWKS_URL.
      # Default is the in-stack service name, not localhost.
      # Same variable as API_EXTERNAL_URL above, on purpose: the issuer and the
      # external URL are the same origin, and one auth origin is one setting.
      # It drives the whole OpenID discovery document and the iss claim on
      # every token, including the OAuth id_token, and edge-api's
      # SUPABASE_JWT_ISSUER derives from it too, so the pair cannot drift.
      #
      # The default is the in-network gateway name, which is correct only for
      # a stack carrying no browser traffic. Any deployment a browser reaches
      # sets ENTERPRISE_AUTH_EXTERNAL_URL to the public https auth origin, and
      # that one edit moves all three.
      GOTRUE_JWT_ISSUER: ${ENTERPRISE_AUTH_EXTERNAL_URL:-http://caddy-supabase/auth/v1}
      # OAuth 2.1 authorization server. Open WebUI signs in through it, so
      # without this the chat front end has no login path at all on a
      # self-hosted stack. Needs v2.180.0 or newer, hence the pin above.
      #
      # AUTHORIZATION_PATH is a path on GOTRUE_SITE_URL (the web-console
      # origin), where the consent page already lives. GoTrue has no built-in
      # consent UI and redirects there instead.
      #
      # Dynamic registration stays OFF and unset: it is an unauthenticated
      # client-creation endpoint, and this deployment needs exactly one client,
      # registered by scripts/register-owui-oauth-client.py.
      GOTRUE_OAUTH_SERVER_ENABLED: ${ENTERPRISE_OAUTH_SERVER_ENABLED:-true}
      GOTRUE_OAUTH_SERVER_AUTHORIZATION_PATH: ${ENTERPRISE_OAUTH_CONSENT_PATH:-/oauth/consent}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${ENTERPRISE_MAILER_AUTOCONFIRM:-true}
      GOTRUE_SMTP_HOST: ${ENTERPRISE_SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${ENTERPRISE_SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${ENTERPRISE_SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${ENTERPRISE_SMTP_PASS:-}
      # The address auth mail is sent AS, and it needs its own variable.
      #
      # It used to be ENTERPRISE_SMTP_ADMIN_EMAIL, which is simultaneously
      # Alertmanager's alert RECIPIENT (deploy/docker/docker-compose.yml). One
      # variable cannot be both a no-reply sender and the mailbox a human reads,
      # and pointing it at an authenticated sending domain would have silently
      # redirected every ops alert to an unread no-reply address.
      #
      # The default sits on hive.scubed.co because that is the domain the relay
      # has authenticated: it carries the Brevo DKIM CNAMEs (brevo1/brevo2) and a
      # DMARC record. scubed.com.bd has neither, and its SPF record ends in -all
      # while listing only Outlook, so mail sent as an address there through this
      # relay fails authentication at the receiver with nothing to fall back on.
      GOTRUE_SMTP_ADMIN_EMAIL: ${HIVE_MAIL_FROM:-no_reply@hive.scubed.co}
      # Without this the inbox list shows a bare address rather than a name.
      GOTRUE_SMTP_SENDER_NAME: ${HIVE_MAIL_FROM_NAME:-Hive}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      # Enable the custom access token hook so JWTs include tenant_id, tenants,
      # and role claims. Migration 20260516_07 installs public.custom_access_token_hook;
      # without this flag GoTrue issues plain tokens and all RLS/authz middleware breaks.
      # Overridable for one specific case: a database that has not had the
      # migrations applied yet has no public.custom_access_token_hook, and
      # GoTrue fails every token issuance when the hook it is told to call
      # does not exist. Standing the stack up before loading the schema is
      # exactly that case. Default stays true, because a deployment serving
      # traffic without the hook issues tokens with no tenant claim and every
      # authz check downstream then behaves as if the user belongs nowhere.
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: ${ENTERPRISE_CUSTOM_ACCESS_TOKEN_HOOK_ENABLED:-true}
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: "pg-functions://postgres/public/custom_access_token_hook"
      # Auth rate limits and password policy (OSFI B-10 / PIPEDA baseline).
      # Units: requests per hour (GoTrue float64 rate). GoTrue source defaults:
      #   EMAIL_SENT=30, VERIFY=30, OTP=30, TOKEN_REFRESH=150.
      # We set all four explicitly so they are visible and tunable per deployment.
      # GOTRUE_RATE_LIMIT_EMAIL_SENT: max magic-link/invite emails sent per hour.
      # Without this, none of the four limits below is ever consulted:
      # GoTrue's performRateLimiting falls through to a header-keyed path that
      # returns immediately when the header name is empty, so the limits read
      # as configured while doing nothing at all.
      #
      # The value has to be trustworthy, and today it is: this Caddy replaces
      # a client-sent X-Forwarded-For rather than appending to it, because
      # appending happens only for a peer listed in trusted_proxies and none
      # is configured. caddy-supabase rewrites it explicitly anyway, so the
      # guarantee survives the cutover, which will want trusted_proxies set.
      #
      # Changing this name alone breaks that: the gateway rewrites
      # X-Forwarded-For specifically, so pointing GoTrue at another header
      # keys its limits on something the caller sends. The two are checked
      # against each other by scripts/test_caddy_supabase_routes.py.
      GOTRUE_RATE_LIMIT_HEADER: ${ENTERPRISE_RATE_LIMIT_HEADER:-X-Forwarded-For}
      GOTRUE_RATE_LIMIT_EMAIL_SENT: ${ENTERPRISE_RATE_LIMIT_EMAIL_SENT:-30}
      # GOTRUE_RATE_LIMIT_VERIFY: max OTP/magic-link verification attempts per hour.
      GOTRUE_RATE_LIMIT_VERIFY: ${ENTERPRISE_RATE_LIMIT_VERIFY:-30}
      # GOTRUE_RATE_LIMIT_OTP: max OTP generation requests per hour.
      GOTRUE_RATE_LIMIT_OTP: ${ENTERPRISE_RATE_LIMIT_OTP:-30}
      # GOTRUE_RATE_LIMIT_TOKEN_REFRESH: max token refresh requests per hour.
      # GoTrue default is 150; tightened to 30 for regulated edge deployments.
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: ${ENTERPRISE_RATE_LIMIT_TOKEN_REFRESH:-30}
      # Per-ADDRESS cap on outbound auth mail, issue #1744. Every limit above
      # is keyed on the caller's address, so an attacker holding a botnet
      # multiplies them; this one is keyed on the recipient's user row
      # (sendPasswordRecovery checks it against users.recovery_sent_at before
      # any mail is composed) and therefore holds no matter how many source
      # addresses the traffic comes from. Five minutes is twelve recovery
      # mails an hour to any one person, against the twenty-seven a single
      # host measurably delivered before.
      #
      # GoTrue's own default is one minute and applies whether or not this
      # line exists, so the behaviour is not new; the window is. It is global
      # across GoTrue's mailers, not recovery-only, so it also throttles email
      # change confirmations for the same user. Signup confirmation is not
      # affected here because GOTRUE_MAILER_AUTOCONFIRM is true on this
      # deployment and no confirmation mail is sent at all.
      #
      # The refusal is a 429 that can only fire for an address that HAS an
      # account, which would make it an account-existence oracle. It is not
      # one: Caddyfile.supabase rewrites every 429 on /auth/v1/recover back to
      # the endpoint's own 200 {}, so the response is identical for a real
      # address, an unknown address, and a throttled one. Changing this value
      # without reading that route is how the oracle comes back.
      GOTRUE_SMTP_MAX_FREQUENCY: ${ENTERPRISE_SMTP_MAX_FREQUENCY:-5m}
      # Minimum password length. GoTrue default is 6; regulated workloads
      # (OSFI B-10, PIPEDA) require at least 12 characters.
      GOTRUE_PASSWORD_MIN_LENGTH: ${ENTERPRISE_PASSWORD_MIN_LENGTH:-12}
      # ── Enterprise SSO: SAML 2.0 (issue #237) ─────────────────────────────
      # GoTrue v2 native SAML 2.0 support. Enable by setting
      # ENTERPRISE_SSO_SAML_ENABLED=true and providing the SP private key.
      # The SP private key must be a PEM-encoded RSA or ECDSA key; generate with:
      #   openssl genrsa -out saml_private.pem 2048
      # Then base64-encode it:
      #   base64 -w 0 saml_private.pem
      # and set ENTERPRISE_SSO_SAML_PRIVATE_KEY to the base64 output.
      # IdP metadata XML is registered via the GoTrue SSO admin API
      # (POST /admin/sso/providers) after the service starts.
      GOTRUE_SAML_ENABLED: ${ENTERPRISE_SSO_SAML_ENABLED:-false}
      GOTRUE_SAML_PRIVATE_KEY: ${ENTERPRISE_SSO_SAML_PRIVATE_KEY:-}
      # ── Enterprise SSO: OIDC providers (issue #237) ───────────────────────
      # Google Workspace OIDC. Set ENTERPRISE_SSO_GOOGLE_ENABLED=true and
      # supply your Workspace OAuth 2.0 client credentials.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${ENTERPRISE_SSO_GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${ENTERPRISE_SSO_GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${ENTERPRISE_SSO_GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${ENTERPRISE_SITE_URL:-http://localhost:3000}/auth/v1/callback
      # Microsoft Entra ID / Azure AD OIDC. Set
      # ENTERPRISE_SSO_MICROSOFT_ENABLED=true and supply client credentials.
      # Set ENTERPRISE_SSO_MICROSOFT_TENANT_URL to your tenant URL, e.g.:
      #   https://login.microsoftonline.com/<tenant-id>/v2.0
      GOTRUE_EXTERNAL_AZURE_ENABLED: ${ENTERPRISE_SSO_MICROSOFT_ENABLED:-false}
      GOTRUE_EXTERNAL_AZURE_CLIENT_ID: ${ENTERPRISE_SSO_MICROSOFT_CLIENT_ID:-}
      GOTRUE_EXTERNAL_AZURE_SECRET: ${ENTERPRISE_SSO_MICROSOFT_SECRET:-}
      GOTRUE_EXTERNAL_AZURE_URL: ${ENTERPRISE_SSO_MICROSOFT_TENANT_URL:-}
      GOTRUE_EXTERNAL_AZURE_REDIRECT_URI: ${ENTERPRISE_SITE_URL:-http://localhost:3000}/auth/v1/callback
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9999/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── supabase-rest (PostgREST) ──────────────────────────────────────────────
  # Auto REST API over local Postgres, reached through the caddy-supabase
  # gateway at /rest/v1, exactly as hosted Supabase serves it.
  #
  # This is NOT what control-plane's SUPABASE_URL points at, which is what this
  # comment used to say. control-plane appends /auth/v1/user to that base, and
  # PostgREST cannot serve an auth route, so pointing it here breaks every
  # identity lookup. SUPABASE_URL is the gateway, and the gateway is what makes
  # one base URL correct for the auth, rest and storage prefixes at once.
  supabase-rest:
    # Pinned to immutable digest. Refresh: docker pull postgrest/postgrest:v12.2.3 && docker inspect --format='{{index .RepoDigests 0}}' postgrest/postgrest:v12.2.3
    image: postgrest/postgrest:v12.2.3@sha256:729bf65c733b73f5b52777f0e4b853f22ed73aa67a22d38269d289779b0a8401
    profiles:
      - enterprise
      - selfhost
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: "postgres://${ENTERPRISE_DB_USER:-postgres}:${ENTERPRISE_DB_PASSWORD:?set ENTERPRISE_DB_PASSWORD in .env}@supabase-db:5432/${ENTERPRISE_DB_NAME:-postgres}"
      PGRST_DB_SCHEMAS: "public,storage,graphql_public"
      PGRST_DB_ANON_ROLE: anon
      # A JWKS, not a raw secret: GoTrue now signs user tokens with ES256, so
      # a symmetric-only secret here would reject every one of them. The
      # generated set carries the EC public key AND the legacy symmetric key,
      # so the HS256 anon and service_role keys keep validating too.
      PGRST_JWT_SECRET: ${ENTERPRISE_JWT_VERIFY_KEYS:?set ENTERPRISE_JWT_VERIFY_KEYS in .env (scripts/generate-enterprise-jwt-keys.py)}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${ENTERPRISE_JWT_SECRET:?set ENTERPRISE_JWT_SECRET in .env}
      PGRST_APP_SETTINGS_JWT_EXP: ${ENTERPRISE_JWT_EXP:-3600}
    # No healthcheck, deliberately. The postgrest image ships the binary and
    # nothing else: it has no /bin/sh, so every CMD-SHELL probe answers
    # "exec: /bin/sh: no such file or directory" and the container is marked
    # unhealthy forever. The previous probe here did exactly that, and because
    # supabase-storage waited on service_healthy, the whole enterprise profile
    # could never finish starting. A check that can never pass is worse than
    # none: it blocks every dependent instead of reporting anything.
    # ponytail: dependents wait on service_started; add a real check if the
    # image ever grows a shell, or by enabling PGRST_ADMIN_SERVER_PORT and
    # probing /ready from a container that has an HTTP client.
    restart: unless-stopped

  # ── supabase-storage ───────────────────────────────────────────────────────
  # Supabase Storage API with local filesystem backend.
  # No MinIO: STORAGE_BACKEND=file writes object data to the supabase-storage-data
  # volume. No S3 call leaves the box.
  # S3_ENDPOINT for edge-api and control-plane is the GATEWAY form,
  # http://caddy-supabase/storage/v1/s3, not this service directly: the
  # gateway restores the hosted /storage/v1 prefix and Storage serves /s3
  # at its own root, so the two together reproduce the hosted path exactly.
  # The /object/s3 path this comment used to name answers on no listener.
  supabase-storage:
    # Pinned to immutable digest. Refresh: docker pull supabase/storage-api:v1.11.13 && docker inspect --format='{{index .RepoDigests 0}}' supabase/storage-api:v1.11.13
    image: supabase/storage-api:v1.11.13@sha256:1e85dad48e8b3e85890a555e5114dc7ee48c2e8be4cfd97dd4e3564b4f104fcd
    profiles:
      - enterprise
      - selfhost
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        # service_started, not service_healthy: see the note on supabase-rest.
        condition: service_started
    environment:
      ANON_KEY: ${ENTERPRISE_ANON_KEY:?set ENTERPRISE_ANON_KEY in .env (sign anon JWT with ENTERPRISE_JWT_SECRET)}
      SERVICE_KEY: ${ENTERPRISE_SERVICE_ROLE_KEY:?set ENTERPRISE_SERVICE_ROLE_KEY in .env (sign service_role JWT)}
      POSTGREST_URL: http://supabase-rest:3000
      # Storage takes the raw secret here (it hands this to jsonwebtoken as an
      # HMAC key, so a JWKS document in this variable would break the anon and
      # service_role keys it is given) and takes the asymmetric set separately
      # through JWT_JWKS, which is the variable its own config reads for that.
      PGRST_JWT_SECRET: ${ENTERPRISE_JWT_SECRET:?set ENTERPRISE_JWT_SECRET in .env}
      JWT_JWKS: ${ENTERPRISE_JWT_VERIFY_KEYS:?set ENTERPRISE_JWT_VERIFY_KEYS in .env (scripts/generate-enterprise-jwt-keys.py)}
      DATABASE_URL: "postgres://${ENTERPRISE_DB_USER:-postgres}:${ENTERPRISE_DB_PASSWORD:?set ENTERPRISE_DB_PASSWORD in .env}@supabase-db:5432/${ENTERPRISE_DB_NAME:-postgres}"
      FILE_SIZE_LIMIT: ${ENTERPRISE_STORAGE_FILE_SIZE_LIMIT:-52428800}
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
      # The S3-compatible endpoint, which is the ONLY way edge-api and
      # control-plane speak to Storage. Without these three variables Storage
      # answers every signed request with 403 AccessDenied and the body
      # "Missing S3 Protocol Access Key ID or Secret Key Environment
      # variables", so POST /v1/files, every Batches input and output object,
      # and RAG document upload all return 500 while the container reports
      # healthy and the bucket rows exist. That was live on the demo box until
      # 2026-08-29 (issue #1282).
      #
      # Deliberately the SAME two variables the consumers read
      # (docker-compose.yml, edge-api and control-plane). The client's access
      # key and secret must equal the server's pair exactly, since Storage
      # recomputes the AWS SigV4 signature from them; two independent
      # variables would let the halves drift apart with no boot error on
      # either side. .env.example's older recipe of pointing S3_ACCESS_KEY and
      # S3_SECRET_KEY at the service_role key never worked: a service_role JWT
      # is not an S3 credential in single-tenant mode, and Storage compares
      # against S3_PROTOCOL_ACCESS_KEY_ID/SECRET only.
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env (the S3 protocol access key edge-api and control-plane sign with)}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env (the S3 protocol secret edge-api and control-plane sign with)}
      # The prefix Caddyfile.supabase's `handle_path /storage/v1/*` STRIPS
      # before this service sees the request. The signature covers the path the
      # client signed, so Storage has to put the prefix back before it
      # recomputes: canonicalUri is `s3ProtocolPrefix + request.url`. Leave it
      # empty and every request fails SignatureDoesNotMatch instead, which
      # looks like a wrong key rather than a wrong path. Must stay equal to the
      # prefix in S3_ENDPOINT (http://caddy-supabase/storage/v1/s3) and to the
      # gateway's handle_path; scripts/test_selfhost_supabase_seam.py fails if
      # the three drift.
      S3_PROTOCOL_PREFIX: /storage/v1
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: ""
    volumes:
      - supabase-storage-data:/var/lib/storage
    healthcheck:
      # 127.0.0.1, not localhost: the storage image resolves localhost to ::1
      # first, the server binds IPv4 only, and the probe then fails with
      # "connection refused" forever while the service is in fact serving.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ── supabase-init ──────────────────────────────────────────────────────────
  # One-shot container: creates the hive-files and hive-images buckets via the
  # Storage API. Runs once per compose up; restart: "no" prevents re-runs.
  #
  # Re-running has to be a no-op, and getting that right needs the response
  # BODY, not just the status. The Storage API answers a duplicate bucket with
  # HTTP 400 carrying {"statusCode":"409","error":"Duplicate"}, so a status-only
  # check for 409 never matches and the second `up` of any enterprise stack
  # fails here. That is not cosmetic: edge-api and control-plane both wait on
  # this container completing successfully, so a stack that came up cleanly the
  # first time refuses to start the second, which is the restart shape a
  # cutover has.
  supabase-init:
    # Pinned to immutable digest. Refresh: docker pull curlimages/curl:8.7.1 && docker inspect --format='{{index .RepoDigests 0}}' curlimages/curl:8.7.1
    image: curlimages/curl:8.7.1@sha256:25d29daeb9b14b89e2fa8cc17c70e4b188bca1466086907c2d9a4b56b59d8e21
    profiles:
      - enterprise
      - selfhost
    depends_on:
      supabase-storage:
        condition: service_healthy
    environment:
      SERVICE_KEY: ${ENTERPRISE_SERVICE_ROLE_KEY:?set ENTERPRISE_SERVICE_ROLE_KEY in .env}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        STORAGE_URL="http://supabase-storage:5000"
        # ponytail: $${VAR} escapes compose interpolation; shell expands at runtime.
        AUTH_HEADER="Authorization: Bearer $${SERVICE_KEY}"
        for BUCKET in hive-files hive-images; do
          echo "Creating bucket: $${BUCKET}"
          RESPONSE=$(curl -s -w '\n%{http_code}' -X POST "$${STORAGE_URL}/bucket" \
            -H "Content-Type: application/json" \
            -H "$${AUTH_HEADER}" \
            -d "{\"id\":\"$${BUCKET}\",\"name\":\"$${BUCKET}\",\"public\":false}")
          HTTP_STATUS=$(echo "$${RESPONSE}" | tail -n1)
          BODY=$(echo "$${RESPONSE}" | sed '$$d')
          case "$${HTTP_STATUS}" in
            2*) echo "  bucket $${BUCKET}: created" ;;
            400|409)
              case "$${BODY}" in
                *Duplicate*|*already*exists*) echo "  bucket $${BUCKET}: already exists" ;;
                *) echo "  bucket $${BUCKET}: FAILED ($${HTTP_STATUS}) $${BODY}"; exit 1 ;;
              esac ;;
            *) echo "  bucket $${BUCKET}: FAILED ($${HTTP_STATUS}) $${BODY}"; exit 1 ;;
          esac
        done
        echo "Bucket init complete."
    restart: "no"

  # ── caddy-supabase (the Kong replacement) ──────────────────────────────────
  # One gateway in front of GoTrue, PostgREST and Storage, so a single
  # SUPABASE_URL with the familiar /auth/v1, /rest/v1 and /storage/v1 prefixes
  # keeps working exactly as it does against hosted Supabase. Without it every
  # consumer would need a different host and a different path shape, and
  # apps/control-plane/internal/auth/client.go, @supabase/ssr and the seeding
  # scripts would each break in a different way. See Caddyfile.supabase.
  #
  # It also carries the TLS listener edge-api's JWKS fetch requires. That
  # guard (https only) is not relaxed for self-hosting: Caddy terminates real
  # TLS with its own local certificate authority, and edge-api trusts exactly
  # that authority through SUPABASE_JWKS_CA_FILE.
  #
  # Same image and volume pattern as caddy-owui, caddy-console and
  # caddy-artifacts, with its own named volumes so certificate state never
  # mixes between origins.
  #
  # The healthcheck is an HTTPS request to this service's own name, routed
  # through to GoTrue's /health: it proves the TLS listener answers AND that
  # the prefix routing reaches an upstream. It also gives edge-api a
  # service_healthy condition to wait on, so the certificate authority file
  # exists on the shared volume before the first JWKS fetch.
  caddy-supabase:
    image: caddy:2-alpine@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
    profiles:
      - enterprise
      - selfhost
    depends_on:
      supabase-auth:
        condition: service_healthy
    environment:
      SUPABASE_DOMAIN: ${SUPABASE_DOMAIN:-supabase.localhost}
    volumes:
      - ./Caddyfile.supabase:/etc/caddy/Caddyfile:ro
      - caddy-supabase-data:/data
      - caddy-supabase-config:/config
    healthcheck:
      # curl, not a shell-wrapped busybox wget: one process per probe instead
      # of three. The old probe ran `sh -c` around a wget that forks
      # `ssl_client` for the TLS leg, and on the demo box every one of those
      # probes leaked a pid charge in the container's cgroup. It reached the
      # 12376 ceiling after about nineteen hours, and from then on the kernel
      # could not fork the probe at all: `docker exec` answered "procReady not
      # received", the check recorded exit -1 forever, and the container
      # reported unhealthy while Caddy itself was serving and renewing
      # certificates normally. pids.current stayed pegged with a single live
      # process in the cgroup, so the charges were stale, not real tasks.
      # `supabase-ca-export` waits on this container being healthy, and
      # edge-api mounts what that export publishes, so the stuck badge would
      # have hung a fresh enterprise bring-up rather than merely looked wrong.
      #
      # No other container on that box leaks, and all of them are probed on the
      # same interval; this one was the only three-process probe. Fewer forks
      # per probe and a third of the probe rate is the mitigation available at
      # this layer.
      #
      # The https listener is what is probed, deliberately, and dropping to
      # http here was wrong: edge-api reads its JWKS from
      # https://caddy-supabase/auth/v1/.well-known/jwks.json and exits at boot
      # if that first refresh fails, while `supabase-ca-export` only copies
      # root.crt and never checks that the TLS listener answers. An http-only
      # probe would therefore stay green through an https-only failure and let
      # the export complete, and edge-api would be the thing that discovered
      # it, by dying.
      #
      # --cacert against the local authority rather than the old
      # --no-check-certificate: the same file edge-api is handed, so the probe
      # verifies the chain and the hostname the way its consumer does. It costs
      # nothing, and it means a certificate the export publishes but nothing
      # trusts fails here first.
      #
      # Timing: five consecutive failures at a 15s interval mark the container
      # unhealthy, so a hard outage is reported in roughly 75 to 90 seconds
      # depending on where in the cycle it starts. Slower than the old five
      # seconds on paper; faster than a probe that cannot run at all.
      test: ["CMD", "curl", "-fsS", "--cacert", "/data/caddy/pki/authorities/local/root.crt", "-o", "/dev/null", "https://caddy-supabase/auth/v1/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ── supabase-ca-export ─────────────────────────────────────────────────────
  # Copies caddy-supabase's local authority certificate into a volume of its
  # own, world readable, and exits.
  #
  # Two reasons, both found by review rather than by design. First, Caddy
  # writes /data/caddy/pki as 0700 root and root.crt as 0600 root, so the
  # published edge-api image (Dockerfile.edge-api.prod, USER app at uid 10001)
  # could not read it: SUPABASE_JWKS_CA_FILE would fail with permission denied
  # and the process would exit at boot. That worked only under the dev
  # Dockerfile, which runs as root, and would have broken on the first deploy
  # of the published image, during cutover. Second, mounting Caddy's whole data
  # directory handed edge-api the authority's PRIVATE key, plus anything else
  # that directory ever comes to hold (a publicly trusted certificate for
  # SUPABASE_DOMAIN, an ACME account key), and put all of it into any backup of
  # that volume.
  #
  # Exporting one public certificate removes both. edge-api mounts only the
  # export, and the export holds exactly one file.
  supabase-ca-export:
    # Same pinned image as caddy-supabase, so this adds no pull.
    image: caddy:2-alpine@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
    profiles:
      - enterprise
      - selfhost
    depends_on:
      caddy-supabase:
        condition: service_healthy
    volumes:
      - caddy-supabase-data:/src:ro
      - supabase-ca:/out
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        SRC=/src/caddy/pki/authorities/local/root.crt
        if [ ! -f "$${SRC}" ]; then
          echo "caddy has not written its local authority yet: $${SRC}"
          exit 1
        fi
        install -m 0644 "$${SRC}" /out/root.crt
        echo "exported the local authority certificate, readable by non-root"
    restart: "no"

  # ── depends_on overrides for edge-api and control-plane ───────────────────
  # The base docker-compose.yml already declares required:false stubs for
  # supabase-auth and supabase-storage. This override adds supabase-init so
  # neither application service starts until buckets exist. Kept here (not in
  # the base file) so --profile local and --profile cloud are unaffected.
  edge-api:
    depends_on:
      supabase-init:
        condition: service_completed_successfully
      supabase-ca-export:
        condition: service_completed_successfully
    environment:
      # Standalone GoTrue serves its routes at the root, with no /auth/v1
      # prefix; the caddy-supabase gateway puts the hosted prefixes back, which
      # is why the URL below carries /auth/v1 while GoTrue itself does not. The
      # issuer is a string comparison against the token claim, never fetched,
      # so it stays whatever GoTrue actually stamps.
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:-${ENTERPRISE_AUTH_EXTERNAL_URL:-http://caddy-supabase/auth/v1}}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-https://caddy-supabase/auth/v1/.well-known/jwks.json}
      SUPABASE_JWKS_CA_FILE: ${SUPABASE_JWKS_CA_FILE:-/etc/hive/supabase-ca/root.crt}
    volumes:
      # One file, the local authority's certificate, exported by the one-shot
      # service above. Nothing Caddy owns is mounted here: no private key, and
      # nothing that volume may come to hold later.
      - supabase-ca:/etc/hive/supabase-ca:ro

  control-plane:
    depends_on:
      supabase-init:
        condition: service_completed_successfully

  # PR review on #1602 (issue #1602): the base docker-compose.yml default for
  # WEBUI_SECRET_KEY (${WEBUI_SECRET_KEY:-hive-local-webui-secret}) is a dev
  # convenience only, a value anyone can read on GitHub, and it signs real
  # auth tokens (open_webui/utils/auth.py SESSION_SECRET). Fine for plain
  # `--profile local`, where nothing about that value is a secret to begin
  # with. Not fine here: this file is merged into every enterprise/self-hosted
  # deployment (per the file header above) and into the demo box's own
  # HIVE_COMPOSE_FLAGS, which always includes it regardless of --profile. A
  # required var fails the `docker compose up` outright with a clear message
  # instead of silently starting the box signing production sessions with a
  # public literal, which is what happened before: WEBUI_SECRET_KEY was never
  # set at all and every container recreate regenerated a throwaway key
  # in-image. deploy-demo-box.yml's own scripted path already exports a real
  # WEBUI_SECRET_KEY (the repository secret) before this runs, so it never
  # hits this check; a manual `docker compose $HIVE_COMPOSE_FLAGS up` run by
  # hand over SSH, without exporting that secret first, now fails loudly
  # instead of degrading silently.
  open-webui:
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY must be set to a real secret (openssl rand -hex 32) for any deployment that merges docker-compose.enterprise.yml -- see .env.example}

volumes:
  # Postgres WAL and data files. Persists the full schema, all migrations, and
  # all tenant data across container recreates.
  supabase-db-data:
  # Object files written by the Storage API local filesystem backend.
  # Holds hive-files and hive-images bucket contents on the box filesystem.
  supabase-storage-data:
  # caddy-supabase's certificate and configuration state. The local authority's
  # root certificate lives here and is mounted read-only into edge-api.
  caddy-supabase-data:
  caddy-supabase-config:
  # The exported authority certificate, and only that. Public material, so
  # unlike caddy-supabase-data this one is safe in a backup.
  supabase-ca:
