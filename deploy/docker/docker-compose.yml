name: hive

services:
  edge-api:
    image: hive-edge-api:ci
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.edge-api
    ports:
      - "8080:8080"
    depends_on:
      control-plane:
        condition: service_healthy
    volumes:
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    # Bounded memory (issue #1299). edge-api reads and buffers a request body
    # before the credential is validated on five routes, with no rate limit,
    # no concurrency limiter and no proxy in front of it (the tunnel maps
    # api-hive.scubed.co straight to this port), so an unauthenticated caller
    # can drive its heap. Uncapped, that is a whole-box outage on the 12 GB
    # demo machine; capped, it is one container under GC pressure.
    #
    # A cap this size is only safe because no single request can claim a large
    # share of it. The per-request costs it has to cover:
    #   * ~21 MiB of live heap per concurrent 10 MiB inference request,
    #     measured, which is the widest body the JSON surfaces accept.
    #   * 32 MiB per concurrent /v1/files upload (files.multipartMemoryBudget),
    #     with everything past it spilled to a temporary file. That argument
    #     used to be files.MaxFileSize, so one upload could hold 512 MiB of
    #     live heap and two could exceed this limit between them, with no
    #     GOMEMLIMIT able to reclaim a byte of it because it is all reachable.
    #     Lowering it did not shrink what an upload may contain by one byte.
    # 1.5 GiB therefore leaves room for dozens of concurrent requests of any
    # shape, rather than being sized around a single one.
    #
    # The ceiling comes from the box: 1.5 GiB is 12.5% of the 12 GB it shares
    # with open-webui (2g), self-hosted Postgres, LiteLLM, the monitoring
    # stack and a 4 GiB-per-sandbox agent ceiling. A saturated edge-api must
    # not be able to displace any of those.
    #
    # GOMEMLIMIT is the same budget expressed to the Go runtime, at ~83% of
    # the cgroup limit. The remaining ~256 MiB covers what the runtime does
    # not count against the soft limit (thread stacks, mmapped runtime
    # metadata, allocator overhead). Without it the runtime has no idea a
    # ceiling exists and grows the heap until the kernel kills the container,
    # dropping every in-flight SSE stream. With it, the collector runs harder
    # as the heap approaches the limit, which buys back only what is garbage:
    # against genuinely live memory it changes nothing except how much CPU is
    # spent discovering that, so it is a SOFT limit that cannot by itself
    # prevent an OOM kill. That is why mem_limit is set too, and why the
    # per-request costs above are what the safety actually rests on.
    #
    # Deliberately a literal and not ${EDGE_API_GOMEMLIMIT}: an override that
    # can move on its own is an override that can be raised past mem_limit,
    # which silently removes the only thing GOMEMLIMIT does. Keep the two in
    # sync if either changes; edge-api also compares them against its own
    # cgroup limit at boot and logs a WARNING when the pair cannot work
    # (cmd/server/memlimit.go).
    mem_limit: 1536m
    environment:
      GOMEMLIMIT: 1280MiB
      EDGE_CONTROL_PLANE_BASE_URL: ${EDGE_CONTROL_PLANE_BASE_URL:-http://control-plane:8081}
      CONTROL_PLANE_INTERNAL_TOKEN: ${CONTROL_PLANE_INTERNAL_TOKEN:-hive-local-internal-token}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-litellm-dev-key}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # SUPABASE_DB_URL: For the enterprise profile set this to the local DSN:
      #   postgres://postgres:<ENTERPRISE_DB_PASSWORD>@supabase-db:5432/postgres
      # For cloud/local profiles set this to the hosted Supabase DB URL.
      #
      # edge-api prefers the TRANSACTION-mode pooler when one is configured.
      # Session-mode clients are capped at the project's pool_size of 15 and
      # every consumer shares that ceiling, so a service that does not need
      # session state should not hold a slot. edge-api only ever takes
      # pg_advisory_xact_lock and SET LOCAL, both transaction scoped, so it is
      # safe here. control-plane is not; see its own SUPABASE_DB_URL below.
      # Unset SUPABASE_DB_POOL_URL falls back to the session DSN, so an
      # enterprise or local Postgres deployment behaves exactly as before.
      SUPABASE_DB_URL: ${SUPABASE_DB_POOL_URL:-${SUPABASE_DB_URL}}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
      S3_USE_SSL: ${S3_USE_SSL:-true}
      S3_BUCKET_IMAGES: ${S3_BUCKET_IMAGES:-hive-images}
      S3_BUCKET_FILES: ${S3_BUCKET_FILES:-hive-files}
      # SUPABASE_JWT_ISSUER / SUPABASE_JWKS_URL: For the enterprise profile set
      # these to the local GoTrue service:
      #   SUPABASE_JWT_ISSUER=http://supabase-auth:9999
      #   SUPABASE_JWKS_URL=http://supabase-auth:9999/.well-known/jwks.json
      # For cloud/local profiles set these to the hosted Supabase auth URLs.
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:-}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
      OWUI_SHIM_KEY: ${OWUI_SHIM_KEY:-}
      # RAG query embeddings (#232). Without these the query embedder is nil and
      # POST /v1/rag/search + /v1/rag/chat return a provider-blind 503. The demo
      # uses SERVERLESS embeddings only (no local embedding model runs): point at
      # LiteLLM, whose route-openrouter-embedding-fallback forwards to OpenRouter's
      # qwen3-embedding-8b (MRL-trained, native 4096-dim). The embedder appends
      # /v1/embeddings, so the base URL must NOT itself include /v1.
      # rag_chunks.embedding is vector(1024) NOT NULL (see EmbeddingDimension in
      # apps/edge-api/internal/rag/types.go); neither serverless route natively
      # returns 1024, and LiteLLM's `dimensions` request param is rejected by
      # this proxy config even with drop_params set, so EMBEDDING_TRUNCATE_TO
      # reduces the vector client-side (MRL truncation + L2 renormalize) instead
      # of asking the provider for a narrower width. Only qwen3 is MRL-verified;
      # the free Nemotron primary is NOT used here for that reason. Note the
      # fallback chain is one-directional: route-openrouter-embedding-fallback
      # (qwen3) is terminal in deploy/litellm/config.yaml, with no further
      # fallback if it also fails.
      # Provider-swappable with no schema change: override in .env
      # (e.g. http://ollama:11434 + bge-m3 + EMBEDDING_TRUNCATE_TO=0 for the
      # enterprise profile's in-stack Ollama, which returns native 1024-dim).
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://litellm:4000}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-route-openrouter-embedding-fallback}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_TRUNCATE_TO: ${EMBEDDING_TRUNCATE_TO:-1024}
      # Binary document ingest for RAG: markitdown sidecar (default profile,
      # same group as edge-api). MARKITDOWN_URL defaults to the compose DNS
      # name; RAG_MAX_UPLOAD_BYTES must match the sidecar's MAX_UPLOAD_BYTES
      # below so the edge rejects before the sidecar has to.
      MARKITDOWN_URL: ${MARKITDOWN_URL:-http://markitdown:8700}
      RAG_MAX_UPLOAD_BYTES: ${RAG_MAX_UPLOAD_BYTES:-26214400}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Binary document ingest for RAG: converts PDF/DOCX/PPTX/XLSX uploads to
  # markdown before chunk + embed (markitdown[all]==0.1.7, pinned exact).
  # Runs on the default profile wherever edge-api runs; internal network
  # only, no host port. markitdown loads whole files in memory, so the cap
  # below and edge-api's RAG_MAX_UPLOAD_BYTES must stay in sync.
  markitdown:
    image: hive-markitdown:ci
    build:
      context: ../../
      dockerfile: deploy/docker/markitdown/Dockerfile
    environment:
      MAX_UPLOAD_BYTES: ${RAG_MAX_UPLOAD_BYTES:-26214400}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8700/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  agent-engine:
    image: hive-agent-engine:ci
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.agent-engine
    profiles:
      - agent
    # This container builds and runs the Go control binary (quota, egress
    # allowlist enforcement, apptainer argv construction) only. It does not
    # bundle the `apptainer` binary or a rootless user-namespace: Apptainer
    # rootless sandboxes are launched by this binary on the linux/amd64 host
    # it runs on in production, not nested inside another container. In this
    # repo's dev environment (WSL2) `apptainer` is unavailable, so sandbox
    # launches here fail at the `exec.LookPath("apptainer")` step; see
    # apps/agent-engine/internal/sandbox/apptainer_integration_test.go
    # (HIVE_APPTAINER_TEST=1) for the gated live-launch proof.
    #
    # cmd/agent-engine's -tenant/-user/-workspace/-sif flags are required and
    # have no default (see cmd/agent-engine/main.go); this compose service
    # supplied none of them, so the entrypoint hit uuid.Parse("") and
    # log.Fatal'd immediately on every start. The command below is the
    # manual smoke-test invocation the binary's package doc already
    # describes: placeholder tenant/user UUIDs plus --dry-run take the
    # binary past flag parsing and into its real egress-policy call to
    # control-plane, proving the binary builds, starts, and reaches its
    # dependency over the compose network. It still exits non-zero because
    # the placeholder tenant/user do not exist in this database (egress
    # policy resolution 500s for an unknown tenant) -- expected for a
    # placeholder ID, not a regression. Real per-task sandbox launches do
    # not go through this container at all: when HIVE_AGENT_ENGINE_SOCKET is
    # set, control-plane sends them to the unprivileged host daemon
    # (apps/agent-engine/cmd/agent-engine -serve, installed by
    # scripts/install-agent-engine-host.sh) over that Unix socket; see
    # cmd/server/main.go's buildAgentEngine. Only a deployment where
    # control-plane itself can exec Apptainer falls back to the in-process
    # engineapi wiring below that branch.
    command:
      - "-tenant=00000000-0000-0000-0000-000000000000"
      - "-user=00000000-0000-0000-0000-000000000000"
      - "-workspace=/tmp/agent-engine-smoke-test"
      - "-sif=/tmp/agent-engine-smoke-test.sif"
      - "-dry-run"
    volumes:
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    environment:
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-http://control-plane:8081}
      CONTROL_PLANE_INTERNAL_TOKEN: ${CONTROL_PLANE_INTERNAL_TOKEN:-hive-local-internal-token}
      # Local/dev only: agent-engine refuses to start with the known default
      # token unless this is set (see cmd/agent-engine/main.go).
      HIVE_AGENT_ENGINE_ALLOW_DEFAULT_TOKEN: ${HIVE_AGENT_ENGINE_ALLOW_DEFAULT_TOKEN:-1}
      HIVE_AGENT_SIF_PATH: ${HIVE_AGENT_SIF_PATH:-}
      HIVE_QUOTA_TENANT_CONCURRENCY: ${HIVE_QUOTA_TENANT_CONCURRENCY:-4}
      HIVE_QUOTA_USER_CONCURRENCY: ${HIVE_QUOTA_USER_CONCURRENCY:-2}
      # Per-session cgroup ceilings (issue #308). Enforced by Apptainer's own
      # --memory/--cpus/--pids-limit; rootless enforcement needs a cgroups v2
      # host with systemd delegation, and Apptainer fails the launch loudly
      # without it rather than running the session unbounded.
      HIVE_SANDBOX_MEMORY_LIMIT: ${HIVE_SANDBOX_MEMORY_LIMIT:-4G}
      HIVE_SANDBOX_CPU_LIMIT: ${HIVE_SANDBOX_CPU_LIMIT:-2}
      HIVE_SANDBOX_PIDS_LIMIT: ${HIVE_SANDBOX_PIDS_LIMIT:-512}
    depends_on:
      control-plane:
        condition: service_healthy

  toolchain:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.toolchain
    profiles:
      - tools
    volumes:
      - ../../:/workspace
      - gomodcache:/go/pkg/mod

  litellm:
    # Pinned by tag AND digest, matching the convention the enterprise compose
    # file already uses. The tag is readable at review time; the digest is what
    # makes it reproducible if the tag is ever moved.
    #
    # v1.98.0 is newer than v1.83.14-stable but is NOT one of LiteLLM's
    # `-stable` releases, so it has had less soak time on the component that
    # fronts every request. That is a real tradeoff and it is taken knowingly.
    # The reason it is taken: on both v1.77.7-stable and v1.83.14-stable,
    # LiteLLM reconstructs the usage object when relaying SSE and drops the
    # provider's reported cost, so no variable-cost alias can be billed
    # correctly on a streaming request, which is every chat turn. Measured, not
    # read off release notes; see the PR for the matrix.
    #
    # Recoverable two ways if it misbehaves: it is validated on the box by
    # setting LITELLM_IMAGE before this default moves, and LITELLM_IMAGE remains
    # the one-variable revert afterwards, needing no PR and no redeploy of
    # anything else.
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.98.0@sha256:20b5044b619055374061a6d5b7b08754cad75aeabbf82ddf4f69cc0cf80ddaf4}
    # Fixed container name so the control-plane Docker restart API can locate
    # this container by name regardless of the Compose project name.
    container_name: litellm
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-litellm-dev-key}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      # Free pool key slots (migration 20260824_02_free_pool_router.sql): the
      # config's os.environ/ references resolve inside THIS container, so each
      # slot must be forwarded here or its deployment fails at request time.
      GROQ_API_KEY_2: ${GROQ_API_KEY_2}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL}
      OPENROUTER_AUTO_MODEL: ${OPENROUTER_AUTO_MODEL}
      OPENROUTER_FAST_FALLBACK_MODEL: ${OPENROUTER_FAST_FALLBACK_MODEL}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL}
      OPENROUTER_EMBEDDING_FALLBACK_MODEL: ${OPENROUTER_EMBEDDING_FALLBACK_MODEL}
      # Enterprise/self-host only: bge-m3 LiteLLM route (deploy/litellm/config.yaml,
      # model_name "bge-m3"). Unset in the serverless demo, which never selects
      # that route (EMBEDDING_MODEL defaults to route-openrouter-embedding-fallback).
      EMBEDDING_LOCAL_BASE_URL: ${EMBEDDING_LOCAL_BASE_URL:-}
      GROQ_FAST_MODEL: ${GROQ_FAST_MODEL}
      GROQ_REASONING_MODEL: ${GROQ_REASONING_MODEL}
      # EnterpriseEdge: set to http://ollama:11434 when using the enterprise
      # profile with the in-stack Ollama service. Consumed by the commented
      # ollama_chat/ model entries in deploy/litellm/config.yaml.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
    volumes:
      # Phase 20 Plan 03 — shared config volume: control-plane writes here,
      # LiteLLM reads from it. The volume persists generated config across
      # container recreates; the seed file is copied in on first start.
      - litellm-config:/etc/litellm
      # The DIRECTORY, read-only, not the single file it used to be.
      #
      # A single-file bind mount resolves to one inode at container start and
      # keeps it. git checkout does not edit a file in place, it writes a
      # replacement and renames over the old name, so a `git pull` that changes
      # this config gives the host a NEW inode while the container goes on
      # showing the old one until it is recreated. Measured on the demo box,
      # replacing a file the same way git does: the file-mounted container
      # still read the old content, the directory-mounted one read the new
      # content. Mounting the directory means /seed/config.yaml is resolved per
      # open, so the container always reads what the repository currently says.
      - ../../deploy/litellm:/seed:ro
    # Reconcile the shared volume against the repo's seed on every start.
    #
    # This used to be `if [ ! -f /etc/litellm/config.yaml ]`, which copies the
    # seed exactly once in the lifetime of the volume. The volume outlives
    # container recreates by design, so on any box that had already booted once
    # (the demo box included) an edit to deploy/litellm/config.yaml never
    # reached the running proxy again: routes added or repointed there were
    # inert, silently, while the repository, the pull request and CI all looked
    # correct. Deleting the volume by hand was the only cure, and nothing said
    # so.
    #
    # Keyed on a checksum of the seed rather than on the config's existence,
    # and that distinction is what makes it safe. control-plane owns
    # /etc/litellm/config.yaml at runtime: it merges the DB's model catalog
    # over this seed and RESTARTS this container to apply it. An unconditional
    # copy here would therefore overwrite, on that very restart, the config
    # control-plane just wrote and restarted for. Comparing the seed against
    # the checksum recorded when it was last copied means a control-plane
    # restart is a no-op (the seed did not change) while a genuine repository
    # change is applied (it did).
    entrypoint:
      - /bin/sh
      - -c
      - |
        seed_sha="$$(sha256sum /seed/config.yaml | cut -d" " -f1)"
        if [ ! -f /etc/litellm/config.yaml ] \
          || [ "$$seed_sha" != "$$(cat /etc/litellm/.seed.sha256 2>/dev/null)" ]; then
          echo "litellm: seeding /etc/litellm/config.yaml from the repo config ($$seed_sha)"
          cp /seed/config.yaml /etc/litellm/config.yaml
          printf '%s' "$$seed_sha" > /etc/litellm/.seed.sha256
        fi
        exec litellm --config=/etc/litellm/config.yaml
    command: []
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  sdk-tests-js:
    image: hive-sdk-tests-js:ci
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.sdk-tests-js
    profiles:
      - test
    depends_on:
      edge-api:
        condition: service_healthy
    environment:
      HIVE_BASE_URL: http://edge-api:8080/v1
      HIVE_API_KEY: ${HIVE_API_KEY:-}
      # Issue #1088. These two are read by the suites
      # (packages/sdk-tests/js/tests/**), and until this line existed nothing
      # forwarded them: `docker compose run` gives a service only its own
      # declared environment, so the caller's HIVE_TEST_MODEL never crossed
      # into the container and every suite fell back to its literal default.
      # ci.yml set it, the comment there claimed it propagated, and the check
      # went on driving the live demo's provider budget on every run.
      # tools/lint-sdk-test-env-propagation.mjs now fails on that shape.
      #
      # The defaults are the suites' own in-code fallbacks, restated so the
      # value is visible here rather than only in the test file.
      HIVE_TEST_MODEL: ${HIVE_TEST_MODEL:-hive-free}
      HIVE_EMBEDDING_MODEL: ${HIVE_EMBEDDING_MODEL:-hive-embedding-default}
      # Capability tests in chat-completions.test.ts read this one (run
      # 32736430913): tools/response_format need an alias whose routes are
      # tools_supported AND whose providers honour the response contract.
      # hive-free is that alias as of
      # supabase/migrations/20260830_03_free_pool_capability_truth.sql,
      # which measured every member and kept only the ones that passed: two Groq
      # key slots on qwen/qwen3.8-27b, live-probed for forced tool calls and
      # strict json_schema, under one LiteLLM group. It is upstream-free, so it
      # also satisfies the 2026-08-30 directive that no CI pipeline may call a
      # paid completion model. It replaces hive-small, and before that
      # deepseek-v4-flash, which was paid and whose `-latest` router showed
      # message.content instability (run 32665985618).
      HIVE_TOOLS_MODEL: ${HIVE_TOOLS_MODEL:-hive-free}
      # images/images.test.ts, audio/audio.test.ts: same propagation rule
      # (tools/lint-sdk-test-env-propagation.mjs) applies to every new
      # HIVE_* knob a suite reads. hive-auto is the only alias carrying
      # provider_capabilities.supports_image_generation=true today (see that
      # test file's header comment on why, and why that flag is not a
      # working guarantee); hive-tts/hive-stt are the real Groq-backed voice
      # routes from 20260717_02_voice_groq_stt_tts.sql.
      HIVE_IMAGE_MODEL: ${HIVE_IMAGE_MODEL:-hive-auto}
      HIVE_TTS_MODEL: ${HIVE_TTS_MODEL:-hive-tts}
      HIVE_STT_MODEL: ${HIVE_STT_MODEL:-hive-stt}

  sdk-tests-py:
    image: hive-sdk-tests-py:ci
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.sdk-tests-py
    profiles:
      - test
    depends_on:
      edge-api:
        condition: service_healthy
    environment:
      HIVE_BASE_URL: http://edge-api:8080/v1
      HIVE_API_KEY: ${HIVE_API_KEY:-}
      # Same pair, same reason as sdk-tests-js above (issue #1088). Read by
      # packages/sdk-tests/python/tests/**.
      HIVE_TEST_MODEL: ${HIVE_TEST_MODEL:-hive-free}
      HIVE_EMBEDDING_MODEL: ${HIVE_EMBEDDING_MODEL:-hive-embedding-default}
      # test_anthropic_messages.py's tool-use tests need a tools_supported
      # alias. hive-free is one as of
      # supabase/migrations/20260830_03_free_pool_capability_truth.sql:
      # its remaining members were live-probed for tool calls and strict
      # json_schema, and the unmeasured ones were removed rather than claimed
      # for. Same variable and same upstream-free default as sdk-tests-js above.
      HIVE_TOOLS_MODEL: ${HIVE_TOOLS_MODEL:-hive-free}

  sdk-tests-java:
    image: hive-sdk-tests-java:ci
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.sdk-tests-java
    profiles:
      - test
    depends_on:
      edge-api:
        condition: service_healthy
    environment:
      HIVE_BASE_URL: http://edge-api:8080/v1
      HIVE_API_KEY: ${HIVE_API_KEY:-}

  control-plane:
    image: hive-control-plane:ci
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.control-plane
    ports:
      - "8081:8081"
    # `required: false` makes the redis dependency optional at the Compose
    # level. When the `local` or `enterprise` profile is active the in-stack
    # redis service exists and control-plane waits for it to be healthy before
    # starting, preventing a race where control-plane pings Redis once at boot
    # and permanently marks redisClient=nil on a miss. When the `cloud` profile
    # is active there is no in-stack redis service, so Compose skips the
    # dependency entirely and control-plane connects via the managed REDIS_URL.
    depends_on:
      redis:
        condition: service_healthy
        required: false
    volumes:
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
      # Phase 20 Plan 03 — shared LiteLLM config volume (control-plane writes,
      # LiteLLM reads). Mount read-write so control-plane can write atomically.
      - litellm-config:/etc/litellm
      # Docker socket mount (read-write required — the restart API needs write
      # access). control-plane calls POST /containers/<name>/restart over the
      # Unix socket directly via net/http; no docker CLI binary is needed.
      - /var/run/docker.sock:/var/run/docker.sock
      # Issue #780 — the agent-engine launch daemon's socket directory on the
      # host. Empty on a host that runs no daemon, in which case
      # HIVE_AGENT_ENGINE_SOCKET is unset too and nothing reads this mount.
      - ${HIVE_AGENT_ENGINE_SOCKET_DIR:-/tmp/hive-agent-engine}:/run/hive-agent
    environment:
      # SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY:
      # Enterprise profile: SUPABASE_URL must point at GoTrue, not PostgREST.
      # control-plane calls GET /auth/v1/user on this URL; PostgREST cannot serve auth routes.
      #   SUPABASE_URL=http://supabase-auth:9999
      #   SUPABASE_ANON_KEY=<ENTERPRISE_ANON_KEY>
      #   SUPABASE_SERVICE_ROLE_KEY=<ENTERPRISE_SERVICE_ROLE_KEY>
      # Cloud/local profiles: set these to the hosted Supabase project values.
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Enterprise profile: set to local Postgres DSN:
      #   postgres://postgres:<ENTERPRISE_DB_PASSWORD>@supabase-db:5432/postgres
      #
      # Deliberately the SESSION-mode DSN, never SUPABASE_DB_POOL_URL.
      # control-plane holds one connection open for the process lifetime on
      # LISTEN tenant_settings_changed, and takes a session-scoped
      # pg_advisory_lock that it holds across a whole credit reservation. Under
      # a transaction-mode pooler both keep looking healthy while doing nothing.
      # platformdb.Open refuses port 6543 outright so this cannot be changed by
      # accident.
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      REDIS_URL: ${REDIS_URL}
      # Enterprise profile: set to local Storage endpoint:
      #   S3_ENDPOINT=http://caddy-supabase/storage/v1/s3
      # Through the gateway, not straight at supabase-storage: the
      # gateway is what restores the hosted /storage/v1 prefix, and
      # Storage itself serves /s3 at its own root. Two earlier versions
      # of this comment named the service directly, one of them with an
      # /object/s3 path that no listener answers.
      # The two S3 credentials are a dedicated pair, NOT the service_role
      # key: Storage compares them against its own
      # S3_PROTOCOL_ACCESS_KEY_ID/SECRET, which the enterprise compose file
      # feeds from these same variables. A service_role JWT here is refused,
      # and the two halves must differ from each other because SigV4 sends
      # the access key id in the clear.
      #   S3_ACCESS_KEY=<openssl rand -hex 16>
      #   S3_SECRET_KEY=<openssl rand -base64 32>
      #   S3_REGION=local
      #   S3_USE_SSL=false  (internal compose network, no TLS)
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
      S3_BUCKET_FILES: ${S3_BUCKET_FILES:-hive-files}
      CONTROL_PLANE_PORT: ${CONTROL_PLANE_PORT:-8081}
      CONTROL_PLANE_INTERNAL_TOKEN: ${CONTROL_PLANE_INTERNAL_TOKEN:-hive-local-internal-token}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      BKASH_APP_KEY: ${BKASH_APP_KEY:-}
      BKASH_APP_SECRET: ${BKASH_APP_SECRET:-}
      BKASH_USERNAME: ${BKASH_USERNAME:-}
      BKASH_PASSWORD: ${BKASH_PASSWORD:-}
      BKASH_BASE_URL: ${BKASH_BASE_URL:-}
      SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID:-}
      SSLCOMMERZ_STORE_PASSWD: ${SSLCOMMERZ_STORE_PASSWD:-}
      SSLCOMMERZ_BASE_URL: ${SSLCOMMERZ_BASE_URL:-}
      XE_ACCOUNT_ID: ${XE_ACCOUNT_ID:-}
      XE_API_KEY: ${XE_API_KEY:-}
      # Public base URL used to build payment-rail callback and redirect URLs
      # (resolveCallbackBaseURL in apps/control-plane/internal/payments/http.go).
      # Deliberately has NO default. When the variable is empty the Go handler
      # derives the base from the request Host, which is already correct in
      # every shape this file is used in: http://localhost:8081 in local dev,
      # and https://control-hive.scubed.co behind the Cloudflare Tunnel, since
      # cloudflared forwards the public Host through to localhost:8081.
      # A compose default of http://localhost:8081 was worse than no value at
      # all: it guaranteed the variable was always set, so the host-derived
      # fallback could never run, and live payment providers were handed a
      # loopback callback URL that nothing outside the box can reach.
      # Set it explicitly only where the public base URL is not the request
      # Host, for example behind a proxy that rewrites Host.
      CONTROL_PLANE_PUBLIC_URL: ${CONTROL_PLANE_PUBLIC_URL:-}
      # Console origin the payment rails return the customer's BROWSER to
      # (issue #538). This is a different concern from CONTROL_PLANE_PUBLIC_URL
      # above: that one is where a provider posts its server-to-server webhook,
      # this one is where the paying customer's browser is sent afterwards.
      # Same no-default rule for the same reason. A loopback value here is
      # demoted below any real origin and refused outright for a non-loopback
      # request, so a box cannot silently return a payer to localhost.
      # CONSOLE_APP_URL is the deployed console origin and is consulted next,
      # then NEXT_PUBLIC_APP_URL, which ships as a localhost placeholder.
      WEB_CONSOLE_PUBLIC_URL: ${WEB_CONSOLE_PUBLIC_URL:-}
      CONSOLE_APP_URL: ${CONSOLE_APP_URL:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      # Outbound mail for workspace invitations (issue #1440). The same relay
      # GoTrue uses, and deliberately the same sender identity, so auth mail and
      # product mail arrive from one address on one authenticated domain.
      #
      # Unset is a supported state, not a broken one: invitations are still
      # issued and the console hands the inviting user a copyable link, saying
      # plainly that nothing was emailed. Control-plane logs which variable is
      # missing at boot.
      HIVE_SMTP_HOST: ${ENTERPRISE_SMTP_HOST:-}
      HIVE_SMTP_PORT: ${ENTERPRISE_SMTP_PORT:-587}
      HIVE_SMTP_USER: ${ENTERPRISE_SMTP_USER:-}
      HIVE_SMTP_PASS: ${ENTERPRISE_SMTP_PASS:-}
      # The sender address, which is NOT the SMTP login and NOT
      # ENTERPRISE_SMTP_ADMIN_EMAIL (that one is the alert recipient). It has to
      # sit on a domain the relay has authenticated or receivers reject the
      # message: hive.scubed.co carries the Brevo DKIM CNAMEs and a DMARC
      # record, scubed.com.bd carries neither and publishes an SPF record that
      # excludes the relay outright.
      HIVE_MAIL_FROM: ${HIVE_MAIL_FROM:-no_reply@hive.scubed.co}
      HIVE_MAIL_FROM_NAME: ${HIVE_MAIL_FROM_NAME:-Hive}
      OWUI_BASE_URL: ${OWUI_BASE_URL:-http://open-webui:8080}
      OWUI_ADMIN_TOKEN: ${OWUI_ADMIN_TOKEN:-}
      SUPABASE_WEBHOOK_SECRET: ${SUPABASE_WEBHOOK_SECRET:-}
      AUDIT_WAL_DIR: ${AUDIT_WAL_DIR:-/var/lib/hive/audit-wal}
      # Audit fan-out sinks (issue #755). These are the only surface that
      # enables one: there is no console control and no per-workspace setting,
      # because a tenant-scoped switch over the operator's own audit export
      # would let a workspace suppress its own audit trail. Read by
      # apps/control-plane/internal/auditworker/sinkconfig at process start.
      #
      # A sink needs BOTH its ENABLE_ flag set to the literal string true AND
      # its credentials; either half alone registers nothing, and every flag
      # defaults to absent, which is off. That default is the zero-egress
      # posture, so these lines forward the operator's choice and never make
      # one. Given to control-plane only, which is the process that runs the
      # fan-out worker; edge-api has no sink of its own to configure. The
      # enterprise override adds no environment block for control-plane, so
      # local, cloud and enterprise all inherit these here.
      #
      # Note for anyone reading these values back in Go: ${VAR:-} puts the NAME
      # in the container environment unconditionally, so every variable below
      # is present-with-an-empty-value on a default deployment. The existing
      # readers compare the value, which is immune to that. An os.LookupEnv
      # presence check on any of them would read all seventeen as configured.
      ENABLE_AUDIT_SINK_ELK: ${ENABLE_AUDIT_SINK_ELK:-}
      AUDIT_SINK_ELK_URL: ${AUDIT_SINK_ELK_URL:-}
      AUDIT_SINK_ELK_API_KEY: ${AUDIT_SINK_ELK_API_KEY:-}
      ENABLE_AUDIT_SINK_LOKI: ${ENABLE_AUDIT_SINK_LOKI:-}
      AUDIT_SINK_LOKI_URL: ${AUDIT_SINK_LOKI_URL:-}
      ENABLE_AUDIT_SINK_DATADOG: ${ENABLE_AUDIT_SINK_DATADOG:-}
      AUDIT_SINK_DATADOG_API_KEY: ${AUDIT_SINK_DATADOG_API_KEY:-}
      AUDIT_SINK_DATADOG_SITE: ${AUDIT_SINK_DATADOG_SITE:-}
      ENABLE_AUDIT_SINK_SPLUNK: ${ENABLE_AUDIT_SINK_SPLUNK:-}
      AUDIT_SINK_SPLUNK_HEC_URL: ${AUDIT_SINK_SPLUNK_HEC_URL:-}
      AUDIT_SINK_SPLUNK_HEC_TOKEN: ${AUDIT_SINK_SPLUNK_HEC_TOKEN:-}
      ENABLE_AUDIT_SINK_SENTRY: ${ENABLE_AUDIT_SINK_SENTRY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ENABLE_AUDIT_SINK_LANGFUSE: ${ENABLE_AUDIT_SINK_LANGFUSE:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # LANGFUSE_INCLUDE_CONTENT is deliberately NOT forwarded, and this
      # comment is here so a later consistency tidy does not "fix" the
      # omission. sinks/langfuse.go reads it at send time and, when true, adds
      # the prompt and the completion to the exported generation. It is the
      # only variable in this block that would put user text on the wire, as
      # opposed to audit metadata about a change. Leaving it out means turning
      # content export on takes a reviewed edit to this file rather than a
      # line in an operator's .env, which is the right bar for that decision.
      # .env.example says the same thing next to the variable.
      #
      # Tenant BYOK credential encryption (AES-256-GCM at rest). Read only by
      # control-plane, which owns every read and write of
      # public.tenant_provider_keys; deliberately NOT given to edge-api, which
      # also holds a database connection, so a compromise of that service
      # cannot pair the ciphertext with the key that opens it. Unset keeps the
      # module in locked mode: register answers 503 byok_not_configured and
      # nothing is ever stored unencrypted. Set but malformed (not base64 of
      # exactly 32 bytes) and control-plane refuses to start. This one line is
      # what makes the feature reachable on a compose deployment at all; the
      # enterprise override adds no environment block of its own for
      # control-plane, so local, cloud and enterprise all inherit it here.
      HIVE_BYOK_ENC_KEY: ${HIVE_BYOK_ENC_KEY:-}
      # RAG ingestion (#232). Without EMBEDDING_BASE_URL the ingest route is not
      # registered and uploaded documents stay "pending" forever. Must match the
      # edge-api query embedder (same model + same truncation) or search/chat
      # retrieval silently returns nothing, since ingested and query vectors
      # would live in incompatible embedding spaces. See the edge-api service's
      # EMBEDDING_* comment above for why EMBEDDING_TRUNCATE_TO exists.
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://litellm:4000}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-route-openrouter-embedding-fallback}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_TRUNCATE_TO: ${EMBEDDING_TRUNCATE_TO:-1024}
      # Phase 20 Plan 03 — LiteLLM config generation and controlled restart.
      LITELLM_CONTAINER_NAME: ${LITELLM_CONTAINER_NAME:-litellm}
      LITELLM_CONFIG_PATH: ${LITELLM_CONFIG_PATH:-/etc/litellm/config.yaml}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-litellm-dev-key}
      # Agent task execution. THE variable that matters on a containerised
      # deployment is this one (issue #780): the path, inside this container,
      # of the Unix socket the unprivileged host launch daemon
      # (apps/agent-engine/cmd/agent-engine -serve) listens on, bind-mounted
      # from HIVE_AGENT_ENGINE_SOCKET_DIR below. When it is set,
      # buildAgentEngine ignores every HIVE_AGENT_ENGINE_* path variable
      # below and forwards launches to that daemon.
      #
      # Why: this service runs inside a golang:1.26-alpine container, which
      # cannot exec the host's Apptainer directly (glibc-linked binary, no
      # musl dynamic loader; no /dev/fuse; would need real CAP_SYS_ADMIN-class
      # privilege on the service holding Stripe/Supabase/payment secrets).
      # The daemon keeps that privilege question off this container entirely:
      # it runs as an ordinary host user with no added capabilities.
      HIVE_AGENT_ENGINE_SOCKET: ${HIVE_AGENT_ENGINE_SOCKET:-}
      # The five path variables below only apply when control-plane itself
      # runs as a bare host process next to an Apptainer install (no compose
      # topology in this repo does). They are still forwarded so that
      # deployment stays possible without a code change.
      HIVE_AGENT_ENGINE_SIF_PATH: ${HIVE_AGENT_ENGINE_SIF_PATH:-}
      HIVE_AGENT_ENGINE_PACKS_DIR: ${HIVE_AGENT_ENGINE_PACKS_DIR:-}
      HIVE_AGENT_ENGINE_WORKSPACE_ROOT: ${HIVE_AGENT_ENGINE_WORKSPACE_ROOT:-}
      HIVE_AGENT_ENGINE_RUN_DIR: ${HIVE_AGENT_ENGINE_RUN_DIR:-}
      HIVE_AGENT_ENGINE_PROFILE_ID: ${HIVE_AGENT_ENGINE_PROFILE_ID:-}
      HIVE_AGENT_ENGINE_SESSION_API_KEY: ${HIVE_AGENT_ENGINE_SESSION_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────
  # EnterpriseEdge: Self-hosted Supabase data plane (issue #231)
  #
  # The five Supabase services (supabase-db, supabase-auth, supabase-rest,
  # supabase-storage, supabase-init) are defined in the companion override
  # file docker-compose.enterprise.yml. They are kept in a separate file
  # because Docker Compose evaluates ALL environment variable interpolations
  # in ALL services regardless of which profile is active, so :? guards in
  # enterprise-only services would break `--profile local` and `--profile cloud`
  # config validation for operators who have not set ENTERPRISE_* vars.
  #
  # To bring up the full enterprise stack:
  #   docker compose \
  #     -f docker-compose.yml \
  #     -f docker-compose.enterprise.yml \
  #     --profile enterprise up --build
  #
  # The installer (scripts/install.sh) passes both -f flags automatically when
  # the enterprise profile is selected.
  # ──────────────────────────────────────────────────────────────────────────

  # In-stack Redis. Active for local dev, SDK tests, and self-hosted
  # enterprise deployments. Cloud deployments use managed Upstash via
  # REDIS_URL and do NOT activate this service.
  # Profiles:
  #   local      - in-stack dev redis. Run: docker compose --profile local up
  #   test       - SDK integration tests need the redis dependency resolved.
  #   enterprise - Hive EnterpriseEdge self-hosted box includes in-stack redis.
  redis:
    image: redis:8.4-alpine
    profiles:
      - local
      - test
      - enterprise
    # Bind to loopback only. Local devs can still reach redis on 127.0.0.1:6379
    # for debugging. Enterprise deployments do not expose Redis on all host
    # interfaces; no TLS or password is configured on this service, so a
    # network-reachable port would be an unauthenticated attack surface.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Self-hosted SearXNG, chat web search's retrieval backend (issue #298,
  # replacing the DuckDuckGo scraper). Runs in the same three profiles as
  # open-webui itself so it always starts alongside the chat surface: local
  # dev, the self-hosted enterprise box, and the `chat` profile the demo
  # deploy workflow adds on top of `local`.
  #
  # Configuration is the committed deploy/searxng/settings.yml, bind-mounted
  # read-only rather than baked into a custom image, per issue #298
  # acceptance criterion 2. It explicitly allow-lists three engines (bing,
  # wikipedia, stackoverflow) via use_default_settings.engines.keep_only and
  # enables the `json` output format the OWUI SearXNG adapter
  # (vendor/open-webui/backend/open_webui/retrieval/web/searxng.py) always
  # requests. See that file's own comments for the secret_key /
  # SEARXNG_SECRET interaction.
  #
  # Issue #298's original four-engine allow-list (google, duckduckgo, brave,
  # bing) degraded to bing-only under real usage: measured live from this box
  # across two rounds an hour apart (issue #1576), google, duckduckgo, brave,
  # startpage, qwant, mojeek, yahoo and wikidata each failed every query
  # (CAPTCHA, rate-limit, or a hard engine-init error), so those four were
  # dropped and wikipedia/stackoverflow added as the two engines that also
  # answered cleanly in the same measurement. Only bing covers general web
  # queries; wikipedia and stackoverflow are narrow by design and do not
  # provide general-search redundancy. Do not re-add the removed engines
  # without a fresh measurement: they are not flaky, they are reliably
  # blocked from this egress IP. Full per-engine, per-query table on issue
  # #1576 and the PR that changed this list.
  searxng:
    image: searxng/searxng:2026.8.29-d226b78bc@sha256:b36af7984b87191b595bc5301418ed6432c047668a4547ab531a7439b816fac3
    profiles:
      - local
      - enterprise
      - chat
    volumes:
      - ../searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/var/cache/searxng/
    environment:
      # server.secret_key in settings.yml is bound to this environment
      # variable at load time (searx/settings_defaults.py), overriding
      # whatever placeholder is committed there. Generate a real value per
      # deployment with `openssl rand -hex 32`; the literal fallback here is
      # a dev convenience only, same pattern as CONTROL_PLANE_INTERNAL_TOKEN
      # above -- it is NOT what reaches the demo box. PR review on #1570
      # (issue #298) flagged that this fallback would otherwise ship there
      # unchanged: deploy-demo-box.yml now sets SEARXNG_SECRET from the
      # SEARXNG_SECRET repository secret (a real generated value), which
      # overrides this default the same way it overrides the web-search
      # flags above.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-hive-local-searxng-secret}
    # Loopback only, same rationale as redis above: nothing outside this box
    # needs to reach SearXNG directly, open-webui talks to it over the
    # internal compose network at http://searxng:8080. The bound port exists
    # so a local operator can query it directly for debugging without
    # exec-ing into the container.
    ports:
      - "127.0.0.1:8888:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  web-console:
    image: hive-web-console:ci
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.web-console
    ports:
      - "3000:3000"
    depends_on:
      - control-plane
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # next dev reads NEXT_PUBLIC_* at runtime, so this one travels as
      # environment rather than a build arg. Same source variable as
      # web-console-prod below (issue #1328).
      NEXT_PUBLIC_DISABLE_SELF_SERVE_SIGNUP: ${ENTERPRISE_DISABLE_SIGNUP:-true}
      CONTROL_PLANE_BASE_URL: http://control-plane:8081
      # Gateway base URL the console prints and pastes into its quickstart
      # snippets. Deliberately not NEXT_PUBLIC_*: it is read at request time so
      # a self-hosting customer re-points it without rebuilding our image
      # (issue #550). Unset falls back to DEFAULT_API_BASE_URL, the hosted
      # deployment's gateway.
      HIVE_PUBLIC_API_BASE_URL: ${HIVE_PUBLIC_API_BASE_URL:-}
    # Dev-only `next dev` server: publishes raw 0.0.0.0:3000 with no Caddy and
    # no TLS in front of it, unlike web-console-prod below which sits behind
    # caddy-console. Docker's published ports bypass ufw's default-deny, so
    # this used to be an unauthenticated LAN-reachable surface on any box
    # running `local`/`chat` (including the demo box) since it carried no
    # profiles gate. Gated behind `dev` so it only starts when explicitly
    # requested: `docker compose --profile dev up web-console`.
    profiles:
      - dev
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Blueprint Step 3.1 (#311, #305) — standalone agent console sidecar.
  # Ratified 2026-07-16: extends nothing in Open WebUI; OWUI stays a pinned
  # upstream image.
  #
  # NOT REACHABLE FROM ANY ORIGIN THIS DEPLOYMENT SERVES, since issue #540.
  # It used to be reached through caddy-owui's /agent-workspace/* route, which
  # is deleted: this container ran a second @supabase/ssr session of its own on
  # the public chat origin and so presented every chat visitor with a second
  # sign in page. That path now answers 404 (Caddyfile.owui, @removedSurfaces),
  # and D-045 rules the app itself goes away rather than being restyled.
  #
  # It is still built and still started here for two reasons, both temporary.
  # `Agent console (type + unit + build)` is a required status check on main,
  # so deleting the app needs a branch protection change, and
  # .github/workflows/agent-visual-proof.yml boots this service by name behind
  # its own CI-only listener (Caddyfile.agent-proof). Retiring the app, this
  # service, that workflow and the dispatch-only agent-workspace-coverage job
  # is tracked as one piece of work in issue #1464. Until then it holds no
  # host port and no route, same posture as open-webui below.
  agent-console:
    image: hive-agent-console:ci
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.agent-console
      # NEXT_PUBLIC_* are baked into the client bundle by `next build`
      # (Dockerfile.agent-console runs a production build, not `next dev`),
      # so they must travel as build args, not runtime `environment:`.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        # Deliberately empty, and deliberately not inheriting the deployment's
        # NEXT_PUBLIC_EDGE_API_BASE_URL: the task console fetches from the
        # browser, edge-api serves no CORS headers, and this app is always
        # served by the same Caddy listener that proxies /v1/agent/* to
        # edge-api (deploy/docker/Caddyfile.owui). An empty base makes those
        # fetches relative, so they stay same-origin and need no CORS.
        NEXT_PUBLIC_EDGE_API_BASE_URL: ""
    profiles:
      - chat
      - enterprise
    depends_on:
      edge-api:
        condition: service_healthy
    environment:
      EDGE_API_INTERNAL_BASE_URL: http://edge-api:8080
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Self-hosted production web-console (migration off Cloudflare Workers --
  # Workers was chosen originally only because Cloudflare Pages Functions
  # silently dropped Set-Cookie under Workerd, breaking Supabase SSR session
  # cookies; that bug is specific to Pages Functions and does not apply to a
  # plain `next start` Node server). Distinct from the `web-console` service
  # above, which stays `next dev` for laptop dev and is unaffected by this.
  # Reached only through caddy-console's own origin (Caddyfile.console), same
  # posture as agent-console/caddy-owui and caddy-artifacts -- no direct host
  # port here.
  web-console-prod:
    image: hive-web-console-prod:ci
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.web-console.prod
      # NEXT_PUBLIC_* are baked into the client bundle by `next build`, so
      # they must travel as build args, not runtime `environment:` (see
      # Dockerfile.web-console.prod).
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${CONSOLE_APP_URL:-https://console-hive.scubed.co}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        # Same variable, same polarity, as the GoTrue flag in
        # docker-compose.enterprise.yml, so the console cannot advertise a
        # sign-up the auth service refuses (issue #1328). Defaulted here
        # rather than left unset, because an unset build arg reaches
        # next build as an empty string and this pair must agree.
        NEXT_PUBLIC_DISABLE_SELF_SERVE_SIGNUP: ${ENTERPRISE_DISABLE_SIGNUP:-true}
    profiles:
      - chat
      - enterprise
    depends_on:
      control-plane:
        condition: service_healthy
    environment:
      CONTROL_PLANE_BASE_URL: http://control-plane:8081
      # Same variable and same rationale as the dev service above: the console
      # prints this as the gateway base URL and pastes it into the curl a
      # developer copies straight after minting a key (issue #550). Runtime
      # environment rather than a build arg on purpose, since a Hive Enterprise
      # customer runs our image and does not build it. Unset falls back to the
      # hosted deployment's gateway.
      HIVE_PUBLIC_API_BASE_URL: ${HIVE_PUBLIC_API_BASE_URL:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Own Caddy origin for web-console-prod, isolated from caddy-owui and
  # caddy-artifacts -- same isolation rationale as caddy-artifacts: a served
  # page's cookies must never be reachable from a different app's origin.
  # Same image/volume pattern as caddy-owui/caddy-artifacts; own named
  # volumes so cert/config state never mixes between origins.
  caddy-console:
    image: caddy:2-alpine@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
    profiles:
      - chat
      - enterprise
    ports:
      - "3005:80"
    environment:
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN:-console.localhost}
      CONSOLE_EXTERNAL_SCHEME: ${CONSOLE_EXTERNAL_SCHEME:-http}
      # Caddyfile.console serves the public /auth/v1 origin from this same
      # hostname and proxies it to caddy-supabase's public listener, which is
      # host matched on this variable. The default here MUST stay identical to
      # the one caddy-supabase uses (docker-compose.enterprise.yml), or an
      # unset variable makes the two sides disagree and the public listener
      # answers 404 to every auth request while both containers look healthy.
      # scripts/test_caddy_console_auth_origin.py pins that agreement.
      SUPABASE_DOMAIN: ${SUPABASE_DOMAIN:-supabase.localhost}
    # No depends_on for caddy-supabase, deliberately: it lives in the
    # enterprise/selfhost profile set while this service is in chat/enterprise,
    # and compose refuses the whole project when a depends_on names a service
    # whose profile is inactive. Caddy resolves the upstream name per dial, so
    # a hosted deployment running --profile chat alone simply 502s /auth/v1,
    # which is correct there: its browser-facing Supabase URL is the hosted
    # project, so nothing ever asks this origin for auth.
    depends_on:
      - web-console-prod
    volumes:
      - ./Caddyfile.console:/etc/caddy/Caddyfile:ro
      - caddy-console-data:/data
      - caddy-console-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Hive Phase 19 — Open WebUI front-end for EnterpriseEdge and cloud chat users.
  # Profiles:
  #   local      - developer laptop with in-stack redis.
  #   enterprise - Hive EnterpriseEdge self-hosted box (includes in-stack redis + Ollama).
  #   chat       - compose on top of cloud profile for a hosted chat front-end.
  open-webui:
    image: hive-open-webui:v0.10.2-branded
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.open-webui
    profiles:
      - local
      - enterprise
      - chat
    # No direct host-port binding. All external access goes through caddy-owui
    # on port 3003, which enforces admin/signup/mutation guards defined in
    # Caddyfile.owui. Exposing port 3002 directly would bypass those defences
    # on enterprise and cloud deployments.
    depends_on:
      edge-api:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    environment:
      ENABLE_SIGNUP: "false"
      # Every account on this deployment is SSO-only: users are provisioned
      # through the Hive OIDC provider and have no Open WebUI password, so the
      # email/password form that upstream renders above "Continue with Hive"
      # could only ever fail. It did, with an actively misleading message --
      # POST /api/v1/auths/signin answered correct Hive credentials with
      # HTTP 400 "The email or password provided is incorrect", which reads as
      # a wrong password rather than as a form that was never wired to
      # anything (found in the live login review).
      #
      # Verified live in the pinned v0.10.2 image, not assumed (the
      # ENABLE_MODEL_FILTER note below is why this gets checked now):
      # backend/open_webui/config.py:1617 reads the variable, exposes it as
      # `ui.enable_login_form`, and main.py:1918 publishes it as
      # features.enable_login_form on /api/config; the login page bundle
      # (build/_app/immutable/nodes/50.*.js) gates the credential fields, the
      # submit button and the "or" divider on
      # `features.enable_login_form || features.enable_ldap`. With enable_ldap
      # already false, only the OAuth button survives.
      #
      # Scope, so nobody later assumes more than this buys: it removes the
      # frontend form, not the endpoint. The only place v0.10.2 consults this
      # flag server-side is routers/auths.py:835, which sits inside signup()
      # and fires only when a new account is being created. The signin route
      # (routers/auths.py:653) is gated by a different variable,
      # ENABLE_PASSWORD_AUTH (config.py:1621), which still defaults to true and
      # is deliberately left alone here. POST /api/v1/auths/signin therefore
      # still accepts a password grant; it just has no form pointing at it.
      #
      # Like the four RAG keys below, this one is persistent config: Open
      # WebUI's seed_defaults wrote `ui.enable_login_form` into its own
      # database on this deployment's first boot, and the database has
      # outranked the environment ever since, so this line on its own would
      # have been a silent no-op on any already-booted box. It reaches a live
      # deployment because owui-patches/hive_rag_env_config.py reconciles this
      # key from the environment on every container start. Confirm after
      # deploying with `curl -s https://<chat-host>/api/config` and check that
      # features.enable_login_form is false.
      ENABLE_LOGIN_FORM: "false"
      # With the password form off and exactly one provider configured, the
      # sign in page's only control was a "Continue with Hive" button, a choice
      # between one option. This sends an unauthenticated visitor straight into
      # the provider flow instead, carrying the `redirect` parameter through.
      #
      # Persistent config, same first-boot trap as ENABLE_LOGIN_FORM above:
      # `oauth.auto_redirect` is in Open WebUI's DEFAULT_CONFIG, so this line
      # reaches an already-booted box only because owui-patches/
      # hive_rag_env_config.py reconciles the key from the environment on every
      # container start. Confirm after deploying with
      # `curl -s https://<chat-host>/api/config` and check that
      # oauth.auto_redirect is true.
      #
      # To turn it back off, set this to "false" rather than deleting the line:
      # the reconcile only writes keys the environment names, so removing the
      # variable leaves whatever is already persisted, which by then is true.
      #
      # The redirect is not unconditional. The page re-checks at runtime that
      # there is exactly one provider, no password form, no LDAP, no trusted
      # header and no onboarding, and it refuses to redirect after a round trip
      # that came back without a session, so a broken provider surfaces as an
      # explained page with a retry rather than a bounce loop.
      OAUTH_AUTO_REDIRECT: "true"
      ENABLE_OAUTH_SIGNUP: "true"
      OAUTH_PROVIDER_NAME: "Hive"
      # The BROWSER-facing auth origin, which is not always the same value as
      # SUPABASE_URL. Open WebUI fetches this document server side, but every
      # endpoint inside it (authorize, token, the issuer) is then resolved by
      # the browser, so a compose service name here is unreachable and login
      # dies at the redirect with nothing in any log naming the cause.
      #
      # Against hosted Supabase the two are identical and the default keeps
      # that. Against the self-hosted data plane SUPABASE_URL is the in-network
      # gateway (http://caddy-supabase), which a browser cannot resolve, so that
      # deployment sets SUPABASE_PUBLIC_URL to its public https auth origin.
      # ENTERPRISE_AUTH_EXTERNAL_URL has to move with it: GoTrue builds this
      # document and the iss claim on its id_token from that one variable, and
      # an OIDC client rejects a token whose issuer does not match the
      # document's.
      OPENID_PROVIDER_URL: "${SUPABASE_PUBLIC_URL:-${SUPABASE_URL}}/auth/v1/.well-known/openid-configuration"
      OAUTH_CLIENT_ID: ${SUPABASE_OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${SUPABASE_OAUTH_CLIENT_SECRET:-}
      # Every scope here has to be one the deployed authorization server
      # advertises. An unknown scope is fatal rather than ignored: GoTrue
      # answers the authorize request with a 302 straight back to the callback
      # carrying error=invalid_request and "unsupported scope: <name>", so
      # there is no consent screen, no authorization code and no session at
      # all. Sign-in is simply dead for every user.
      #
      # That is exactly what #787 shipped on 2026-08-20. It added
      # offline_access after validating against hosted Supabase, whose
      # discovery document advertised it. The self-hosted GoTrue this stack cut
      # over to does not: its scopes_supported is openid, profile, email,
      # phone, and SupportedOAuthScopes in internal/models/oauth_scope.go at
      # the pinned v2.189.0 is that same four value list. Chat sign-in stayed
      # dead until the scope came back out.
      #
      # Against GoTrue specifically, offline_access also buys nothing even
      # where it is accepted, which is the part #787 got wrong on both sides.
      # GoTrue's authorization code grant calls
      # tokenService.IssueRefreshToken unconditionally and always puts
      # refresh_token in the token response (internal/api/oauthserver/
      # handlers.go at v2.189.0), so the refresh token #782 needs is issued
      # whether or not the scope is requested. Read from the pinned source and
      # then confirmed live against the box rather than inferred, since
      # inferring a capability is what caused this in the first place:
      # docs/proof/oauth-scope-selfhost-2026-08-22/.
      #
      # Scoped to GoTrue on purpose, and not a general claim about OAuth. On
      # most authorization servers offline_access is exactly the switch that
      # gates a durable refresh credential, and OPENID_PROVIDER_URL above is
      # built from SUPABASE_PUBLIC_URL, so a deployment pointed at a different
      # server would need this value revisited or #782 returns as a silent
      # 55 minute lockout. TestOWUIOAuthScopesRequestAnIdentity guards the
      # scopes whose absence breaks sign-in outright (openid and email); it
      # cannot guard this one, because whether it is needed is a property of
      # the server rather than of this file.
      #
      # Guarded on both sides, because the two halves of this mismatch drift
      # independently. scripts/check-oauth-scopes.py reads the live
      # scopes_supported and fails when this value is not a subset of it. It
      # runs on every pull request that touches deploy YAML
      # (.github/workflows/oauth-scope-gate.yml) and again after every deploy
      # (deploy-demo-box.yml). The first catches a scope added here that the
      # backend does not know; the second catches a capability the backend
      # stops advertising while this file stands still, which is the direction
      # the self-hosted cutover actually broke.
      #
      # This one is NOT shadowable by a persisted row, which is the question
      # every Open WebUI setting in this file has to answer since #722. Traced
      # rather than assumed: OAUTH_SCOPES is a plain os.getenv in config.py,
      # consumed by oidc_oauth_register, which runs at import through
      # load_oauth_providers(). The oauth.scopes row that Config.seed_defaults
      # writes is read only by the admin config API in routers/auths.py and by
      # nothing on the authorize or the refresh path. A container recreate
      # therefore genuinely picks this up, and no hive_rag_env_config style
      # reconciler is needed here, unlike OAUTH_AUTO_REDIRECT and the feature
      # flags that do go through one.
      #
      # The surviving half of #787, and the only half #782 ever needed. A
      # refresh token that exists is still refused, because Open WebUI's
      # refresh POST authenticates the client in a different dialect than the
      # authorization code exchange does. That half is fixed inside the image
      # by Dockerfile.open-webui's
      # apply_oauth_client_auth_patch.py, deliberately NOT by setting
      # OAUTH_TOKEN_ENDPOINT_AUTH_METHOD here: pinning that to
      # client_secret_post would also force every Supabase OAuth client to be
      # re-registered for the same dialect, and registering those clients is
      # manual ops with no script behind it. Every client this project has
      # registered so far is client_secret_basic, so that value would break
      # sign-in outright on each of them.
      OAUTH_SCOPES: "openid email profile"
      # Supabase's OAuth 2.1 authorization server requires PKCE on every
      # authorize request. authlib (OWUI's OAuth client) only sends
      # code_challenge/code_challenge_method when this is set, so without it
      # Supabase 302s straight back with error=invalid_request.
      OAUTH_CODE_CHALLENGE_METHOD: "S256"
      ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
      # #457: this claim path never actually resolves anything. Confirmed
      # live (DEBUG logs, both the shared-runner nightly and the physical
      # demo box): Supabase's OAuth Authorization Server issues a minimal
      # third-party OIDC id_token for external relying parties like Open
      # WebUI -- standard OIDC claims only, no custom owui_role claim (that
      # only reaches GoTrue's own first-party session tokens, not this
      # OAuth-provider token path) and no user_metadata either (tried and
      # also confirmed empty). So every OAuth login after Open WebUI's own
      # unconditional first-user-becomes-admin bypass silently fell through
      # to DEFAULT_USER_ROLE -- PR #451's claim fix only ever appeared to
      # work because of that first-user bypass, never because the claim
      # itself resolved. Left wired to the original claim name in case a
      # future Supabase change ever starts including it; the real fix is
      # Dockerfile.open-webui's tenant-role-from-Postgres patch, which
      # looks the role up directly instead of depending on this claim. That
      # first-user bypass is itself gone as of #748: on an instance shared by
      # every tenant it made whichever account authenticated first after a
      # volume reset the administrator of everyone's chat.
      OAUTH_ROLES_CLAIM: "owui_role"
      OAUTH_ALLOWED_ROLES: "ADMIN,MEMBER,VIEWER"
      # #748: no tenant role can produce this value any more. The token hook
      # emits owui_role MEMBER for OWNER and ADMIN alike, so this list is
      # deliberately unmatchable, and instance admin comes from the control
      # plane's platform attribute (accounts.is_platform_admin) resolved by
      # the tenant-role patch. It stays set rather than blanked because Open
      # WebUI only runs its claim path at all when the claim name, the allowed
      # list and the admin list are all present.
      OAUTH_ADMIN_ROLES: "ADMIN"
      ENABLE_OAUTH_GROUP_MANAGEMENT: "true"
      OAUTH_GROUPS_CLAIM: "tenants"
      # Valid Open WebUI role enum is pending/user/admin (lowercase) --
      # "MEMBER" was never one of them (open_webui.utils.auth's
      # get_verified_user gate blocks every role that isn't literally
      # "user" or "admin", so an invalid value like "MEMBER" behaved
      # identically to "pending": permanently stuck on Account Activation
      # Pending). This is now only a fallback for a user with zero active
      # tenant membership (the trigger above never fires for them), so
      # "pending" -- Open WebUI's own upstream default -- is correct: an
      # unaffiliated login should land on the pending-activation screen,
      # not be silently granted app access.
      DEFAULT_USER_ROLE: "pending"
      ENABLE_ADMIN_EXPORT: "false"
      ENABLE_COMMUNITY_SHARING: "false"
      # #947: both flags below default to true upstream (config.py:2005 and
      # config.py:2013) and we never set them, so every Open WebUI
      # administrator -- which was every sole tenant OWNER, per the
      # tenant-role patch below, until #748 made instance admin a deliberate
      # platform attribute instead -- could list every other tenant's Knowledge
      # collections (routers/knowledge.py:143, :202) and read any user's chats
      # (routers/chats.py:611, :1056). Confirmed live: a demo account's
      # Knowledge collection was visible from an unrelated personal account.
      # Both are plain os.getenv reads at import time, not PersistentConfig,
      # and neither name appears in hive_rag_env_config.py's reconciler, so
      # setting them here takes effect on the next container start and the
      # database cannot quietly put them back.
      #
      # What this closes, stated precisely, because the two are not the same
      # thing. Chats are closed: every route that can read another user's
      # chat is gated on ENABLE_ADMIN_CHAT_ACCESS (chats.py:611, :1056,
      # :1063, :1174, :1592), and the bulk route at :890 was already behind
      # ENABLE_ADMIN_EXPORT above; PR #1186's router patch flag-gates the
      # remaining chats.py branches (delete-by-id, message edit/delete,
      # shared-chat access grant management). Knowledge reads are closed:
      # the listing routes honour BYPASS_ADMIN_ACCESS_CONTROL (PR #960), and
      # the by-id read routes enforce ownership through
      # owui-patches/apply_knowledge_authz_patch.py (#1056); PR #1186 closes
      # the rest of the family (knowledge writes, the RAG collection query
      # choke point in retrieval/utils.py, and the feedback/folder/calendar/
      # prompt/note/tool/model routers) with the same predicate: owner,
      # AccessGrants grant, or admin when BYPASS_ADMIN_ACCESS_CONTROL is set.
      # Export is also still blocked at the proxy in Caddyfile.owui as
      # defence in depth, since this product has no legitimate caller for it.
      #
      # Scope: this does not change who holds the admin role (#748) or the
      # proxy write-verb gap (#949).
      #
      # BYPASS_ADMIN_ACCESS_CONTROL has an undocumented second name: unset,
      # it falls back to ENABLE_ADMIN_WORKSPACE_CONTENT_ACCESS (also default
      # true, config.py:2003). Irrelevant here because this line sets
      # BYPASS_ADMIN_ACCESS_CONTROL directly and os.getenv's own default
      # never triggers, but named so a future edit auditing this block does
      # not have to rediscover the alias by reading the vendored source.
      BYPASS_ADMIN_ACCESS_CONTROL: "false"
      ENABLE_ADMIN_CHAT_ACCESS: "false"
      # #772: stock Open WebUI surfaces with no Hive counterpart. These three
      # are the ones upstream actually gates on a feature flag rather than on a
      # permission, and the flag is checked before the role, so turning them
      # off removes them for administrators too. The rest of that issue's list
      # (Workspace > Models, Prompts and Tools, and the Playground) has no flag
      # at all in v0.10.2 and is removed from the built bundle instead, by
      # Dockerfile.open-webui's owui-patches/apply_ui_surfaces_patch.py.
      #
      # All three are persisted config (`notes.enable`, `calendar.enable`,
      # `automations.enable` in Open WebUI's DEFAULT_CONFIG), so these values
      # only reach a first boot on their own. owui-patches/hive_rag_env_config.py
      # reconciles them onto an already-booted database, which is what makes
      # them take effect on the demo box.
      ENABLE_NOTES: "false"
      ENABLE_CALENDAR: "false"
      ENABLE_AUTOMATIONS: "false"
      # Upstream's Memory feature, added to the same set on 2026-08-17. Its
      # only surface in this deployment is the Settings > Personalization tab,
      # which nobody chose: ENABLE_MEMORIES defaults to true upstream. While it
      # is on, Chat.svelte adds `features.memory: true` to every turn, so each
      # message also pays for a lookup against a second memory store that Open
      # WebUI owns and Hive does not read. Hive's memory subsystem is one
      # subsystem on Hive's own Postgres (.wolf/decisions.md D-020) and is not
      # built yet, so this is a competing store rather than a head start on it.
      # Its router refuses on the same flag across all 11 of its routes, so
      # unlike Notes it needs no path block.
      ENABLE_MEMORIES: "false"
      # The user-created skills library. Upstream defaults this permission to
      # false, which until 2026-08-23 was invisible here because every tenant
      # OWNER was promoted to Open WebUI `admin` and passed the surrounding
      # `role === 'admin' || <permission>` gates regardless. Since
      # supabase/migrations/20260823_03_owui_role_never_admin.sql only a
      # platform admin is, so leaving this false would ship the surface to
      # nobody: the /skills page would bounce every customer home and
      # POST /api/v1/skills/create would 401.
      #
      # `user.permissions` is one persisted config row holding the whole
      # permission tree, so this line reaches a first boot only.
      # owui-patches/hive_rag_env_config.py merges the leaf into the stored
      # tree on every start, which is what makes it take effect on the demo
      # box. Sharing is deliberately not granted alongside it: a skill stays
      # private to the account that wrote it.
      USER_PERMISSIONS_WORKSPACE_SKILLS_ACCESS: "true"
      # Model visibility belongs to the gateway, not to Open WebUI. edge-api
      # already filters /v1/models per tenant (AliasVisibleToTenant, PR #205),
      # so a second independent filter here adds nothing and actively hides
      # upstream state: Open WebUI's own access control shows a session whose
      # role is "user" only models present in Open WebUI's Models registry,
      # and this deployment never populates that registry (nothing curates one,
      # and #772 removed the Workspace > Models page that would). An empty
      # picker therefore looks identical whether edge-api served six models or
      # refused the shim key outright, which is exactly how a gateway 403
      # stayed hidden for four nights (#717).
      #
      # BYPASS_MODEL_ACCESS_CONTROL makes the gateway the single source of
      # truth. In the pinned v0.10.2 image it skips get_filtered_models on
      # /openai/models (routers/openai.py:705), skips check_model_access on
      # the completion path (main.py:1032), and forces bypass_filter for the
      # chat and embedding helper paths (routers/openai.py:1120), so picker,
      # chat and document RAG all reflect exactly what edge-api serves.
      #
      # This replaces ENABLE_MODEL_FILTER: "true", which was dead. That name
      # arrived with the rest of this service block in #143 and does not exist
      # anywhere in v0.10.2 (upstream removed it long before that tag), so it
      # never filtered anything; the filtering was Open WebUI's default access
      # control the whole time.
      BYPASS_MODEL_ACCESS_CONTROL: "true"
      # #792: the one thing the gateway list cannot express. All six aliases
      # are legitimately on /v1/models -- that endpoint is an OpenAI-contract
      # surface and direct API clients need the embedding and audio ids -- but
      # three of them serve no chat completion, so listing them in the chat
      # dropdown only produces dead conversations. Dockerfile.open-webui's
      # owui-patches/apply_model_picker_patch.py drops these ids from the
      # /api/models response the picker reads, and from nothing else.
      #
      # Not Open WebUI's per-model access control, which is what #776 tried:
      # the flag above disables it for every role, and it is admin-exempt
      # regardless (BYPASS_ADMIN_ACCESS_CONTROL defaults true) while every
      # tenant owner here is an Open WebUI admin. That fix could never fire.
      #
      # The patch also hides whatever RAG_EMBEDDING_MODEL, AUDIO_TTS_MODEL and
      # AUDIO_STT_MODEL name, so changing the admin-selected embedding alias
      # (D-001) does not need a second edit here. This list is for aliases
      # Open WebUI itself never calls; hive-stt and hive-tts are named because
      # this deployment routes voice through the gateway rather than through
      # Open WebUI's own audio settings.
      HIVE_PICKER_HIDDEN_MODEL_IDS: ${OWUI_PICKER_HIDDEN_ALIASES:-hive-embedding-default,hive-stt,hive-tts}
      ENABLE_EVALUATION_ARENA_MODELS: "false"
      # Web search. Opt-in via .env, default off (same pattern as
      # OWUI_E2E_MODE below) -- this service block is shared with the
      # enterprise profile, which must not silently inherit live outbound
      # search calls.
      #
      # Issue #298: the engine is the self-hosted searxng service above, not
      # the DuckDuckGo scraper (backend/open_webui/retrieval/web/
      # duckduckgo.py) this used to point at. SearXNG aggregates the
      # zero-API-key engines configured in ../searxng/settings.yml (bing,
      # wikipedia, stackoverflow as of issue #1576, down from the original
      # four-engine allow-list -- see that file's own comments for why) and
      # score-ranks the combined results itself, instead of handing back one
      # engine's unranked snippet list.
      #
      # Both bypass flags now default to false (fetch full result pages,
      # then chunk/embed/retrieve them) rather than true (snippet-only, no
      # rank). Measured cost of turning the loader on: 5 concurrent page
      # fetches added roughly 0.5-2s on top of a roughly 0.3-0.6s SearXNG
      # query, from the builder sandbox's own network (issue #298 comment
      # has the full per-query numbers). Embedding stays off the bypass path
      # deliberately: turning the loader on without it would otherwise dump
      # full unchunked page text straight into the prompt, and this reuses
      # the RAG_EMBEDDING_MODEL / RAG_OPENAI_API_BASE_URL pipeline already
      # wired below for file-upload RAG (RAG_TOP_K: "5"), not a new spend
      # category.
      ENABLE_WEB_SEARCH: ${ENABLE_WEB_SEARCH:-false}
      WEB_SEARCH_ENGINE: ${WEB_SEARCH_ENGINE:-}
      SEARXNG_QUERY_URL: ${SEARXNG_QUERY_URL:-http://searxng:8080/search}
      # Deliberate, not the undocumented library default of 3 (issue #298
      # acceptance criterion 5). 5 keeps the concurrent page-fetch cost above
      # bounded by the single slowest page rather than growing linearly, and
      # matches RAG_TOP_K below so retrieval has as many chunked sources to
      # choose from as the search itself returned.
      WEB_SEARCH_RESULT_COUNT: ${WEB_SEARCH_RESULT_COUNT:-5}
      BYPASS_WEB_SEARCH_WEB_LOADER: ${BYPASS_WEB_SEARCH_WEB_LOADER:-false}
      BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL: ${BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL:-false}
      # PR review on #1570 (issue #298), MEDIUM: turning the loader on above
      # without an explicit timeout leaves SafeWebBaseLoader's aiohttp
      # session at its library default (300s total) with 3 retries, so one
      # slow page an authenticated user steers into the top search results
      # ties up this request for minutes. 12s is chosen against the actual
      # page-fetch latencies measured for this change (0.16-1.79s across the
      # sampled queries, docs/proof/searxng-web-search-298-2026-08-30/
      # capture.log): about 7x the slowest real page observed, so it will
      # not clip a legitimately slow-but-real page, while bounding the worst
      # case per URL to roughly 3 x 12s attempts plus the retry backoff
      # (2s + 3s + 4.5s) sleep, about 45s total, down from the previous
      # unbounded/~900s+ ceiling. This is a time bound, not a size bound; see
      # deploy/docker/owui-patches/apply_web_loader_bounds_patch.py for the
      # separate memory-side cap the same review asked for.
      WEB_LOADER_TIMEOUT: ${WEB_LOADER_TIMEOUT:-12}
      # Hive product branding. LICENSE-DECISION.md: Open WebUI image built from
      # Dockerfile.open-webui, which strips the upstream " (Open WebUI)" suffix
      # that env.py forces onto any custom WEBUI_NAME (see that Dockerfile for
      # the license clause + <=50-user carve-out this demo relies on).
      WEBUI_NAME: "Hive"
      WEBUI_URL: ${HIVE_CHAT_URL:-http://localhost:3003}
      # Kills the "A new version (vX.Y.Z) is now available" in-app nag banner.
      ENABLE_VERSION_UPDATE_CHECK: "false"
      DEFAULT_LOCALE: "en"
      OPENAI_API_BASE_URL: "http://edge-api:8080/v1"
      # Issue #1063 credits banner: lets the chat backend read the signed-in
      # user's tenant balance from control-plane behind its internal token.
      # No committed fallback here on purpose: with the token unset (the Hive
      # Enterprise posture, or any billing-less deployment) control-plane does
      # not mount the route and the shim answers 404, so no banner renders.
      # Silent absence is the intended gate, not a bug. Set
      # HIVE_CONSOLE_BILLING_URL to point the empty-balance top-up link at the
      # right deployment's console; unset hides the link but keeps the warning.
      HIVE_CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-http://control-plane:8081}
      CONTROL_PLANE_INTERNAL_TOKEN: ${CONTROL_PLANE_INTERNAL_TOKEN:-}
      HIVE_CONSOLE_BILLING_URL: ${HIVE_CONSOLE_BILLING_URL:-}
      # OWUI_SHIM_KEY MUST be set when the open-webui profile is active. The
      # edge-api OWUI unwrap middleware only fires when this value matches
      # exactly; an empty/unset value disables the middleware and OWUI
      # traffic will 401. It must also be a real registered Hive API key
      # ("hk_" prefix, row in api_keys) on its own dedicated billing account,
      # never an arbitrary `openssl rand` string, because OWUI's own upstream
      # calls that carry no per-user token authenticate as this key and nothing
      # else: the bodyless GET /v1/models behind the model picker, document-RAG
      # embeddings (RAG_OPENAI_API_KEY below), and text-to-speech. An
      # unregistered or revoked value breaks all three, and the only report is
      # an empty picker plus a generic invalid-key error. edge-api logs
      # `owui: ERROR OWUI_SHIM_KEY is unusable: ...` at startup and every five
      # minutes when that happens. Mint one with scripts/seed-owui-e2e-user.py,
      # passing a deployment-specific --account-slug.
      OPENAI_API_KEY: ${OWUI_SHIM_KEY:-}
      ENABLE_OPENAI_API: "true"
      ENABLE_OLLAMA_API: "false"
      # Open WebUI attaches its builtin tool schemas (time, knowledge, chats,
      # tasks, notes, channels) to every UI chat request while native function
      # calling is on, which is its hardcoded default. Nothing this deployment
      # routes to can serve them, and the schemas are not small: 21 specs,
      # 12089 bytes of JSON, 3144 Groq prompt tokens for a one word answer that
      # costs 52 tokens without them. OpenRouter refused them with 404 "No
      # endpoints found that support tool use. Try disabling
      # get_current_timestamp" and the Groq free tier refused them with 429
      # "Requested 6035 > TPM limit 6000", which between them is why no chat
      # completion succeeded on three consecutive nightlies. The demo is not
      # demonstrating tool calling, and buying a tool capable paid route to
      # satisfy schemas nobody asked for is the wrong trade.
      #
      # "legacy" is Open WebUI's own name for its pre native tool path
      # (utils/middleware.py gates every builtin injection on
      # params.function_calling != 'legacy'), so this also restores the classic
      # document RAG injection the RAG_* wiring below expects, instead of
      # routing uploads through builtin knowledge tools. Set
      # OWUI_DEFAULT_FUNCTION_CALLING=native to hand tool calling back once a
      # route that can serve it is enabled. Upstream has no env var for this
      # and it is not persisted config either, so the name is read by the
      # Dockerfile.open-webui patch that makes Open WebUI's own default
      # environment driven.
      HIVE_DEFAULT_FUNCTION_CALLING: ${OWUI_DEFAULT_FUNCTION_CALLING:-legacy}
      # These four are persistent config in Open WebUI: normally the value here
      # is only a first-boot seed and Open WebUI's own database wins forever
      # after. The image patch deploy/docker/owui-patches/hive_rag_env_config.py
      # (issue #722) reconciles exactly these four keys from this environment on
      # every container start, so editing them here does reach a deployment that
      # has already booted. Nothing else in Open WebUI's persisted config is
      # touched, so settings an administrator changes in its own UI still stick.
      # RAG_OPENAI_API_BASE_URL and RAG_OPENAI_API_KEY have to travel together:
      # a destination supplied without a credential would leave Open WebUI
      # sending the key persisted for the previous destination, so open-webui
      # refuses to start and names both variables instead. An empty
      # OWUI_SHIM_KEY therefore stops this container rather than misdirecting
      # its key, which is one more reason that variable is not optional here.
      RAG_EMBEDDING_ENGINE: "openai"
      RAG_OPENAI_API_BASE_URL: "http://edge-api:8080/v1"
      RAG_OPENAI_API_KEY: ${OWUI_SHIM_KEY:-}
      # OWUI's own document RAG embeds through the Hive gateway, so this must
      # name a Hive catalog alias (public.model_aliases), not an OpenAI model
      # id. "text-embedding-3-small" is not in the catalog and every document
      # upload failed alias resolution: the value this line carried between
      # 2026-05-18 and 2026-07-26 was still persisted on the demo box long after
      # this default was corrected, which is issue #722. OWUI's own embedding
      # calls carry no request body metadata, so they cannot be unwrapped to a
      # per-user JWT: OWUI_SHIM_KEY must be a real minted "hk_" Hive API key for
      # this path to authenticate at all (see scripts/seed-owui-e2e-user.py).
      RAG_EMBEDDING_MODEL: ${OWUI_RAG_EMBEDDING_ALIAS:-hive-embedding-default}
      # Chat upload limits (#1405, #1428). Both are persistent config, so both
      # are reconciled by owui-patches/hive_rag_env_config.py for the same
      # first-boot-wins reason as every key around them.
      #
      # This is the SAME expression edge-api and the markitdown sidecar take,
      # verbatim, and that sameness is the fix. Until #1428 the chat surface
      # took its own variable, RAG_FILE_MAX_SIZE, in whole megabytes rather than
      # bytes, settable independently of the ceiling the ingest path enforces.
      # PR #1426 set that variable's compose default to 25, byte for byte the
      # ingest ceiling, and was defeated anyway: the demo box's .env carried
      # RAG_FILE_MAX_SIZE=100, an explicit value beats a compose fallback, and
      # the chat surface went on publishing a 100 MB cap to every browser.
      # Measured live 2026-08-29 with that value in place: a 30 MB attachment
      # produced a composer chip and a POST with no response at all after 44
      # seconds, no progress, no timeout, no error, while the same file sent
      # straight at the container's API was accepted and stored with a 200.
      #
      # Open WebUI wants whole megabytes and this is bytes, which is the only
      # reason the conversion needs code: hive_rag_env_config.derived_upload_cap
      # floors it into rag.file.max_size. Do not re-add a second variable to
      # avoid that division. scripts/test_owui_rag_env_config.py fails if this
      # file ever names RAG_FILE_MAX_SIZE again, or if these three services stop
      # sharing one expression.
      RAG_MAX_UPLOAD_BYTES: ${RAG_MAX_UPLOAD_BYTES:-26214400}
      # The allowlist is derived by a rule rather than by taste: everything this
      # deployment can turn into text, which is Open WebUI's own
      # `known_source_ext` plus the extensions `Loader._get_loader` names in its
      # own branches (pdf, doc, docx, odt, ppt, pptx, xls, xlsx, csv, msg, rst,
      # xml, html, htm, md, epub) plus txt. A narrower list would refuse a file
      # the product could have read, which fails in front of a user and is worse
      # than no cap. scripts/test_owui_rag_env_config.py asserts that derivation
      # against the vendored loader, so an upstream bump that adds a format
      # fails there rather than silently starting to refuse it.
      #
      # An allowlist is the only type control upstream offers, and it is needed
      # because `_get_loader`'s final `else` falls back to TextLoader for any
      # unrecognised extension: without one, an executable is "processed" into
      # mojibake, stored, and served back on request.
      RAG_ALLOWED_FILE_EXTENSIONS: ${RAG_ALLOWED_FILE_EXTENSIONS:-bash,bat,c,cmd,conf,cpp,cs,css,csv,dart,db2,doc,dockerfile,docx,env,epub,erl,ex,exs,go,h,hpp,hs,hsc,htm,html,ini,java,js,json,jsx,lhs,log,lua,m,md,mm,msg,nginxconf,odt,pdf,perl,php,pl,plsql,pm,ppt,pptx,ps1,py,r,rb,rs,rst,scala,sh,sql,svelte,swift,toml,ts,tsx,txt,vue,xls,xlsx,xml,yaml,yml}
      # The prompts Open WebUI sends to a model on its own account: the chat
      # title, the tag list, the follow-up chips, the retrieval and web-search
      # query it writes for itself, the autocomplete and voice prompts, the
      # prompt-based tool-calling preamble, the context-compaction
      # instruction, and the wrapper it puts around retrieved documents.
      #
      # All ten are persistent config, reconciled by
      # owui-patches/hive_rag_env_config.py for the same first-boot-wins reason
      # as everything above, and confirmed already seeded on the demo box on
      # 2026-08-29. They matter more than most, because there is no other way
      # to reach them at all on this deployment: Open WebUI's admin panel is
      # deleted from the fork and 404'd at the proxy, and /api/v1/configs
      # writes are denied there, so before this the only lever was a
      # hand-written SQLite UPDATE inside the owui-data volume on a live box.
      #
      # Every one ships unset, here and on every profile, and unset means "not
      # set" rather than "set to blank", so the reconcile skips it and the
      # deployment keeps Open WebUI's own prompt text byte for byte. That is
      # deliberate and this file is the wrong place to change it: a prompt
      # reaches every user of a surface, this compose file is shared with the
      # enterprise profile and local dev, and picking Hive's own wording is a
      # product decision rather than a side effect of shipping the knob. An
      # operator changes one by setting the variable in the box's own .env, or
      # in the deploy workflow's env for a versioned change.
      #
      # These use compose's NULL form (a bare `VAR:`) rather than the
      # `${VAR:-}` form every other passthrough here uses, and the difference
      # is load bearing rather than stylistic. `${VAR:-}` always DEFINES the
      # variable in the container, as the empty string, even when nobody set
      # it. The null form resolves from the environment and, when the variable
      # is set nowhere, leaves it out of the container entirely. Both still
      # pick up a real value from --env-file and from the shell, which are the
      # two paths an operator uses; all three behaviours were measured against
      # a running container rather than assumed.
      #
      # It matters because of exactly one of these ten. Upstream reads
      # `RAG_TEMPLATE = os.getenv('RAG_TEMPLATE', DEFAULT_RAG_TEMPLATE)`, and
      # os.getenv returns its default only when the key is ABSENT, while
      # present-and-empty yields "". Defining it unconditionally would make
      # DEFAULT_CONFIG['rag.template'] evaluate to "" at import, so a FRESH
      # volume would seed a blank row in place of upstream's real default
      # text, and the reconcile could not repair it because blank means unset
      # there. Nothing would break at the model, since `rag_template()`
      # substitutes the default for a blank value at request time, which is
      # precisely what would have kept it invisible while every new Enterprise
      # install diverged from its own configuration. The other nine default to
      # "" upstream today and are unaffected, and are written this way anyway
      # so a digest bump that gives one of them a real default cannot
      # reintroduce this quietly.
      #
      # The null form fixes the default path, not every path: an operator who
      # writes a bare `RAG_TEMPLATE=` in the box's .env still hands the
      # container a defined-and-empty variable and reopens the same hole on a
      # fresh volume. That is documented next to the variables in .env.example,
      # where an operator would be when they do it. Not defended in code here
      # because the repair would have to live in the reconcile, and a module
      # that silently rewrites a row an operator did not ask it to touch is a
      # worse thing to own than a documented footgun.
      #
      # Names are upstream's own, so Open WebUI's documentation for each of
      # these applies unchanged.
      RAG_TEMPLATE:
      TITLE_GENERATION_PROMPT_TEMPLATE:
      TAGS_GENERATION_PROMPT_TEMPLATE:
      IMAGE_PROMPT_GENERATION_PROMPT_TEMPLATE:
      FOLLOW_UP_GENERATION_PROMPT_TEMPLATE:
      QUERY_GENERATION_PROMPT_TEMPLATE:
      AUTOCOMPLETE_GENERATION_PROMPT_TEMPLATE:
      VOICE_MODE_PROMPT_TEMPLATE:
      TOOLS_FUNCTION_CALLING_PROMPT_TEMPLATE:
      CONTEXT_COMPACTION_PROMPT_TEMPLATE:
      # The eleventh prompt key, and the only one that is Hive's rather than
      # upstream's (issue #1596). Open WebUI has no global system prompt: its
      # only inputs are a models-table row's `params.system` and the per-user
      # Settings > General field, and neither is reachable for a Hive model,
      # whose listing is synthesized by owui-patches/hive_model_picker.py from
      # the control-plane catalog. So the chat surface shipped no identity, no
      # capability statement, no citation rule and no refusal guidance, and the
      # customer was talking to whatever default the routed upstream provider
      # applies.
      #
      # Reconciled into the `hive.chat.system_prompt` row by
      # owui-patches/hive_rag_env_config.py and consumed by
      # owui-patches/apply_chat_system_prompt_patch.py, which prepends it to
      # the request's system message. Null form for the same reason as the ten
      # above, and unset for the same reason: what every user of a surface is
      # told is a product decision, and this file is shared with the enterprise
      # profile and local dev. The demo deployment sets it in
      # .github/workflows/deploy-demo-box.yml, which is the versioned place for
      # one.
      HIVE_CHAT_SYSTEM_PROMPT:
      # Where the retrieval and web-result wrapper (`rag.template`) lands: a
      # system message when true, concatenated into the USER turn when false
      # (issue #1596, narrowing #1571).
      #
      # Upstream defaults this False (backend/open_webui/env.py), and it is a
      # plain os.getenv rather than persisted config, so compose is sufficient
      # and no reconcile entry exists for it. Defaulted true here, for every
      # profile, because that template carries Hive's untrusted-data framing:
      # the rules telling the model never to follow instructions found inside
      # retrieved page text have to outrank that text, and in the user turn
      # they sit at exactly the same authority as the injection they are meant
      # to refuse. The retrieved block is still fenced inside the template
      # either way. An operator who wants upstream's position back sets this
      # false explicitly.
      #
      # This one deliberately uses the `${VAR:-default}` form the eleven prompt
      # keys above must NOT use, and the difference is the point rather than an
      # inconsistency. That form always DEFINES the variable in the container,
      # which for a prompt key would defeat upstream's own os.getenv fallback
      # and seed a blank row on a fresh volume. Here defining it is exactly
      # what is wanted: upstream reads
      # `os.getenv('RAG_SYSTEM_CONTEXT', 'False').lower() == 'true'`, so the
      # null form would leave it absent and the posture would silently revert
      # to upstream's False.
      RAG_SYSTEM_CONTEXT: ${RAG_SYSTEM_CONTEXT:-true}
      # Chat dictation. These four are persistent config as well, reconciled by
      # the same owui-patches/hive_rag_env_config.py for the same
      # first-boot-wins reason as the RAG keys above.
      #
      # Without them Open WebUI keeps its own default, `audio.stt.engine` = ""
      # meaning "transcribe with my bundled Whisper", against the WHISPER_MODEL
      # the upstream image bakes in, which is `base`. Two consequences, and the
      # second is why this is a defect rather than a preference. Chat dictation
      # never reached the gateway at all, so it was unmetered and invisible to
      # the model catalog. And `base` cannot write Bengali: measured live on
      # 2026-08-17 against real Bengali speech, it returned romanized Latin
      # ("bhoi ki shambhat, ek dimu gta shambhat chutra...") at every clip
      # length, and forcing language=bn did not change it, while the same audio
      # through hive-stt returned Bengali script. Bangladesh is the first
      # market, so a microphone that cannot produce Bengali is not a gap.
      #
      # OWUI_SHIM_KEY again, and for the same reason as RAG_OPENAI_API_KEY:
      # a transcription request carries no body metadata to unwrap into a
      # per-user JWT, so it authenticates as the shim key's own billing
      # account. hive-stt is priced per second of audio, and Groq bills a
      # minimum of ten seconds, so one dictation of ten seconds or less costs
      # 43 credits.
      #
      # No language is set here on purpose. Open WebUI's WHISPER_LANGUAGE
      # overrides every user's own Settings > Audio choice rather than filling
      # in for it, and forcing bn turns English dictation into Bengali garbage
      # (measured the same day). whisper-large-v3 auto-detects Bengali
      # correctly from about five seconds of speech; below that a user who
      # wants a guarantee sets the language in their own settings, which the
      # composer already sends and the gateway forwards verbatim.
      #
      # An Enterprise box running the sovereign `voice` profile (Parakeet plus
      # faster-whisper) points OWUI_STT_ALIAS at its own catalog alias, or
      # clears AUDIO_STT_ENGINE to keep whatever its administrator configured;
      # a blank value never clobbers a persisted one.
      AUDIO_STT_ENGINE: "openai"
      AUDIO_STT_OPENAI_API_BASE_URL: "http://edge-api:8080/v1"
      AUDIO_STT_OPENAI_API_KEY: ${OWUI_SHIM_KEY:-}
      AUDIO_STT_MODEL: ${OWUI_STT_ALIAS:-hive-stt}
      # Read-aloud (issue #997). Same first-boot-wins trap as STT directly
      # above: all five audio.tts.* keys are in Open WebUI's DEFAULT_CONFIG,
      # so a volume seeded `engine=""` (bundled browser speech synthesis),
      # api.openai.com, an empty key, model tts-1 and voice alloy on its first
      # boot and compose alone could never move any of them afterwards. The
      # defaults here name what the gateway actually serves: hive-tts resolves
      # to groq/orpheus, which rejects alloy (#996), so the deployment-wide
      # default voice is one Orpheus actually has. The list the Settings >
      # Audio voice dropdowns offer comes from GET /v1/audio/voices on
      # edge-api, which answers without credentials because Open WebUI's own
      # voices fetch sends none.
      #
      # An Enterprise box running the sovereign `voice` profile points
      # OWUI_TTS_ALIAS at its own catalog alias, or clears AUDIO_TTS_ENGINE to
      # keep whatever its administrator configured; a blank value never
      # clobbers a persisted one.
      AUDIO_TTS_ENGINE: "openai"
      AUDIO_TTS_OPENAI_API_BASE_URL: "http://edge-api:8080/v1"
      AUDIO_TTS_OPENAI_API_KEY: ${OWUI_SHIM_KEY:-}
      AUDIO_TTS_MODEL: ${OWUI_TTS_ALIAS:-hive-tts}
      AUDIO_TTS_VOICE: ${OWUI_TTS_VOICE:-autumn}
      VECTOR_DB: "pgvector"
      # TRANSACTION-mode pooler when one is configured. This is the connection
      # that has actually been failing: a recreated open-webui could not get a
      # session-mode client (FATAL: (EMAXCONNSESSION) max clients reached in
      # session mode, pool_size 15) because the Go services and CI had already
      # taken the slots, so the container crash-looped and took chat-hive with
      # it. Both users of this DSN are safe under transaction mode: SQLAlchemy
      # here talks to pgvector through psycopg2, which uses no server-side
      # prepared statements, and the #457 tenant-role patch
      # (owui-patches/tenant_role_from_db.py) opens and closes its own psycopg2
      # connection per login with no session state. Unset falls back to the
      # session DSN, so local and enterprise stacks are unaffected.
      #
      # The _LIBPQ flavour, never SUPABASE_DB_POOL_URL itself. `pool_max_conns`
      # and `default_query_exec_mode` are pgx DSN parameters; libpq has no such
      # connection options and rejects the entire DSN on an unknown one. Handing
      # psycopg2 the pgx flavour produced
      # `invalid dsn: invalid connection option "pool_max_conns"`, which
      # crash-looped this container and returned 502 on chat-hive.scubed.co.
      PGVECTOR_DB_URL: ${SUPABASE_DB_POOL_URL_LIBPQ:-${SUPABASE_DB_URL:-}}
      RAG_TOP_K: "5"
      # Off by default because this deployment configures no reranking model,
      # and Open WebUI's hybrid path is not merely "vector plus BM25" without
      # one. retrieval/utils.py builds a RerankCompressor for every hybrid
      # query, and when reranking_function is None that compressor re-embeds
      # the query and every retrieved document through the same embedder just
      # to compute cosine similarity, which the vector search has already
      # produced. One question therefore costs three gateway embedding round
      # trips instead of one. Measured live on the demo box (issue #832): each
      # embedding call takes 7 to 17 seconds through the gateway, so a single
      # /api/v1/retrieval/query/collection took longer than Caddyfile.owui's
      # 60s response_header_timeout and every knowledge-backed answer died as a
      # 504 before the model was ever called. With this off the same query
      # returns in about 29 seconds and a knowledge-backed chat answer arrives
      # in about 35 seconds with its citation.
      #
      # Set OWUI_RAG_HYBRID_SEARCH=true to turn it back on, which is the right
      # move once a reranking model exists in the catalog: with a real reranker
      # the compressor calls that instead of re-embedding, and hybrid recall is
      # worth the one extra call. Reconciled on every boot by
      # owui-patches/hive_rag_env_config.py for the same first-boot-wins reason
      # as the keys above, so flipping it here reaches a deployment that has
      # already booted.
      ENABLE_RAG_HYBRID_SEARCH: ${OWUI_RAG_HYBRID_SEARCH:-false}
      DATA_DIR: "/data"
      STATIC_DIR: "/data/static"
      OWUI_E2E_MODE: ${OWUI_E2E_MODE:-false}
    volumes:
      - owui-data:/data
      # Hive/S-Cubed favicon + splash overrides. STATIC_DIR above points at
      # /data/static (persisted in owui-data, empty by default -- upstream
      # has no bundled-default seeding when STATIC_DIR is overridden), so
      # this directory mount is the only thing populating them. A single
      # directory bind (not one bind per file) so the mount target exists
      # regardless of whether owui-data is a fresh/empty named volume --
      # Docker can refuse individual file-level binds onto a path that
      # doesn't exist yet inside an empty named volume; one directory bind
      # creates /data/static itself, sidestepping that.
      # The light PNG/ICO assets render the same mark as favicon.svg (charcoal
      # badge, gold hexagon); the dark pair below inverts it. All of them are generated by
      # owui-static/generate-brand-assets.py from the palette and hexagon that
      # https://scubed.co/hive publishes, so a rebrand is one edit and a re-run
      # rather than a dozen hand-made binaries. Each file is now rendered at the
      # size its consumer actually declares; favicon-96x96.png used to be a
      # 128px image, apple-touch-icon.png a 256px one, and logo.png was 256px
      # while manifest.json advertised it as 500x500, which is grounds for a
      # browser to reject the icon and substitute one of its own. favicon-dark
      # and splash-dark are real dark variants (cream tile) rather than copies,
      # because a charcoal tile on a near-black page is close to invisible;
      # favicon-dark.png in particular was absent entirely, and OWUI's /auth
      # page requests it on every dark-theme load. web-app-manifest-192x192.png
      # and web-app-manifest-512x512.png were absent for the same reason; they
      # are the maskable PWA install icons, full-bleed with a wider safe margin
      # because the platform crops a maskable icon to a circle. They are wired
      # into /manifest.json by owui-patches/apply_manifest_patch.py, which is
      # the single source of truth for the manifest: upstream also ships an
      # unreferenced static/site.webmanifest, and shipping our own copy would
      # leave two manifests disagreeing while only the linked one counts.
      # custom.css carries one remaining override: a replacement for the emoji
      # glyph upstream uses to anchor its Workspace empty states, which is
      # upstream markup Hive does not own. Dockerfile.open-webui asserts the
      # markup contract it depends on. Its companion loader.js is gone with the
      # agent-workspace launcher it injected: the frontend is built from source
      # now (vendor/open-webui) and the agent workspace is a row in the sidebar.
      # Known gap: FONTS_DIR under STATIC_DIR is still unseeded; the Hive faces
      # ship inside the built bundle rather than through this mount.
      # This pair was previously described as the only supported hooks because
      # forking Open WebUI was forbidden under D-013. That rule is revoked
      # (owner 2026-08-11, .wolf/decisions.md D-036): Open WebUI is forked and
      # heavily modified, so this was the old ceiling, not a constraint.
      #
      # #712: user.png (the same badge mark as the rest) is included here too.
      # open_webui.routers.users.get_user_profile_image_by_id falls back to
      # FileResponse(f"{STATIC_DIR}/user.png") for any account whose
      # profile_image_url is not an http(s) URL or a data: URI -- which is
      # every OAuth-provisioned user's default ("/user.png", set in
      # utils/oauth.py). Overriding STATIC_DIR without this file present
      # made that fallback 500 (RuntimeError: File at path .../user.png does
      # not exist.) on every single avatar request for those users, since
      # this is a read-only bind of a repo directory, not the owui-data
      # volume -- there is no "first boot" that could ever have seeded it.
      - ./owui-static:/data/static:ro
      # NOTE (#269): ENABLE_PIPELINES/PIPELINES_URLS and a mounted
      # ./pipelines volume used to sit here. Those are not real Open WebUI
      # config keys on this image; they belong to the separate, deprecated
      # "Pipelines" microservice (ghcr.io/open-webui/pipelines), which this
      # compose file never runs. deploy/docker/pipelines/hive_jwt_forward.py
      # was therefore never loaded. It is installed instead as a native Open
      # WebUI Function via the Functions REST API (Admin > Functions),
      # which requires an authenticated admin session and cannot run at
      # container boot with no user yet signed in.
      #
      # #556: that install is no longer a manual post-deploy step. Both
      # callers now run scripts/install-owui-jwt-forward.py, the single
      # implementation, which is idempotent and verifies the end state:
      #   * .github/workflows/deploy-demo-box.yml runs it on every deploy,
      #     with an admin session minted by scripts/owui-mint-admin-token.py
      #     from inside this container (no stored credential, no admin
      #     panel, five-minute token).
      #   * apps/web-console/e2e/phase-19/owui/owui.setup.ts runs it right
      #     after the e2e user's first OIDC login.
      # A deployment brought up by hand, outside that workflow, still needs
      # one run of the same script once an admin account exists.
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # M10: bounded resources so a runaway pipeline / RAG batch cannot
    # starve the rest of the local stack. Numbers picked from observed
    # peak under a 10-user soak; revisit if Phase 24 packaging shifts.
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  caddy-owui:
    image: caddy:2-alpine@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
    profiles:
      - local
      - enterprise
      - chat
    ports:
      - "3003:80"
    depends_on:
      open-webui:
        condition: service_healthy
    environment:
      # Scheme users actually arrive on, forwarded to both upstreams so they
      # build correct absolute URLs. https only when something in front of
      # this listener terminates TLS (Cloudflare Tunnel on the demo box).
      HIVE_CHAT_EXTERNAL_SCHEME: ${HIVE_CHAT_EXTERNAL_SCHEME:-http}
    volumes:
      - ./Caddyfile.owui:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Artifacts hosting (#312) -- separate container, separate origin
  # (ARTIFACTS_DOMAIN) from caddy-owui on purpose: the isolation guarantee
  # that a served artifact's HTML cannot read the main app's cookies or
  # session storage comes from the browser's same-origin policy, which only
  # holds if this never shares a host with HIVE_CHAT_URL/OWUI. Same image
  # and volume pattern as caddy-owui; own named volumes so cert/config state
  # never mixes between the two origins.
  caddy-artifacts:
    image: caddy:2-alpine@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
    profiles:
      - local
      - enterprise
      - chat
    ports:
      - "3004:80"
    environment:
      ARTIFACTS_DOMAIN: ${ARTIFACTS_DOMAIN:-artifacts.localhost}
    depends_on:
      edge-api:
        condition: service_healthy
    volumes:
      - ./Caddyfile.artifacts:/etc/caddy/Caddyfile:ro
      - caddy-artifacts-data:/data
      - caddy-artifacts-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Hive EnterpriseEdge — optional local Ollama inference backend.
  # Active only under the `enterprise` profile. Serves keyless local models
  # (e.g. llama3, mistral) via the Ollama HTTP API on port 11434.
  # OLLAMA_BASE_URL is passed to LiteLLM via the environment so the
  # ollama_chat/ model entries in deploy/litellm/config.yaml resolve
  # correctly. See the commented example block in config.yaml for how to
  # wire a local model into the LiteLLM model_list.
  # GPU passthrough: add a `deploy.resources.reservations.devices` block
  # to this service definition for NVIDIA GPU access (see Docker Compose
  # GPU docs). Not enabled here because the investor-demo box may be
  # CPU-only; add it after hardware is confirmed.
  ollama:
    image: ollama/ollama:latest
    profiles:
      - enterprise
    # No host-port binding. LiteLLM reaches Ollama over the internal Compose
    # network at http://ollama:11434. Exposing 11434 on the host would allow
    # unauthenticated inference calls that bypass Edge and LiteLLM auth.
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0"
    healthcheck:
      # ollama/ollama image ships with the ollama binary but not curl.
      # `ollama list` exits 0 when the daemon is ready and returns the
      # loaded model catalogue; it is the canonical in-image liveness probe.
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Carl.sh Voice STT — Tier 1: Parakeet (English, fast, ONNX/CPU)
  # Active under the `voice` profile, composable with `enterprise`.
  # achetronic/parakeet: Go + ONNX Runtime, speaks OpenAI Whisper API on port
  # 5092, CPU-capable, ffmpeg in image for non-WAV audio.
  # Model files must be provided by the operator at PARAKEET_MODEL_DIR on the
  # host; the directory is mounted read-only at /models inside the container.
  # Port 5092 is NOT exposed on the host; LiteLLM reaches it over the internal
  # Compose network at http://parakeet:5092.
  # Bangla STT is NOT supported by parakeet-tdt-0.6b-v3; Bangla routes to
  # faster-whisper (see below). Do not claim Bangla ASR via this service.
  parakeet:
    image: achetronic/parakeet:latest
    profiles:
      - voice
    environment:
      # Bearer auth for the Parakeet API. Leave blank to run without auth
      # (acceptable on a private internal network; set for extra hardening).
      PARAKEET_API_KEY: ${PARAKEET_API_KEY:-}
    volumes:
      # Owner-provided model directory (parakeet-tdt-0.6b-v3 ONNX files).
      # Set PARAKEET_MODEL_DIR in .env to the host path before starting.
      - ${PARAKEET_MODEL_DIR:-/tmp/parakeet-models}:/models:ro
    # No host-port binding: internal network only.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5092/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Carl.sh Voice STT — Tier 2: faster-whisper (Bangla + multilingual)
  # Active under the `voice` profile, composable with `enterprise`.
  # Uses the faster-whisper server image which speaks the OpenAI Whisper API.
  # All languages except English route here, including Bangla ("bn") and
  # auto-detect (empty language field).
  # Port 8000 is NOT exposed on the host; the stt.TieredClient reaches it
  # over the internal Compose network at http://faster-whisper:8000.
  faster-whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    profiles:
      - voice
    environment:
      # Model to load at startup. large-v3 gives best Bangla accuracy.
      # Override to a smaller model (e.g. base, small) on low-memory boxes.
      WHISPER__MODEL: ${FASTER_WHISPER_MODEL:-large-v3}
    # No host-port binding: internal network only.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    profiles:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ../../deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ../../deploy/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    # Size cap alongside the existing 30d time-based retention. Measured on
    # the demo box 2026-07-29: Prometheus data was only ~73MB, so this is
    # prevention, not an emergency, but this partition is shared with
    # everything else on the box, including the build cache from the
    # self-hosted deploy runner (see deploy-demo-box.yml's builder-prune
    # step, added in this same change). 2GB is ~27x current usage and a
    # small slice of the ~54GB free measured right after that build-cache
    # reclaim, on a 98GB partition.
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=2GB'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
  grafana:
    image: grafana/grafana:latest
    profiles:
      - monitoring
    ports:
      - "3001:3000"
    volumes:
      - ../../deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      # Grafana admin creds are operator-provided. The previous
      # `admin/admin` default left an unauthenticated panel on any
      # environment that forgot to override them. The placeholder defaults
      # below are intentionally non-functional — Grafana refuses to log in
      # with empty values, so an operator that forgets to override these
      # in .env will see an obvious failure rather than a silent default.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    depends_on:
      - prometheus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    profiles:
      - monitoring
    ports:
      # Loopback only. The API is unauthenticated by design, and the box
      # backup (scripts/backup-box.sh, issue #1000) now posts its failure
      # alerts through this port as its failure channel, which makes the
      # exposure load-bearing: anything on the LAN could forge a
      # BackupFailed/Stale alert into the ops inbox or read firing alerts.
      # Prometheus reaches alertmanager over the container network, and
      # host-side callers use localhost, so nothing legitimate needed the
      # LAN-reachable binding.
      - "127.0.0.1:9093:9093"
    configs:
      - source: alertmanager_config
        target: /etc/alertmanager/alertmanager.yml
      - source: alertmanager_smtp_credential
        target: /etc/alertmanager/smtp-credential
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

configs:
  # Alertmanager's configuration is inline here rather than a file under
  # deploy/alertmanager/ for two reasons, both load bearing. It is not a style
  # preference, and moving it back to a bind mount reintroduces both defects.
  #
  # 1. Alertmanager has no environment variable expansion of any kind, so a
  #    bind-mounted file cannot read ENTERPRISE_SMTP_*. Compose interpolates
  #    this block at `up` time, which is the only substitution point in this
  #    stack that does not require rendering a template into the checkout on the
  #    box, which would dirty the working tree and break `git pull --ff-only` on
  #    that shared clone.
  #
  # 2. Config content is part of the SERVICE SPECIFICATION, so
  #    `docker compose up -d` recreates alertmanager whenever this text changes.
  #    A single-file bind mount does not: editing the file's contents changes
  #    nothing about the container spec, the deploy finds no reason to recreate,
  #    and the running process keeps serving whatever it parsed when it started.
  #    That is the same defect the Caddy apply loop in deploy-demo-box.yml
  #    exists to work around, and it is half of why every alert this system
  #    defined went nowhere for four months without one failing check. The other
  #    half was the receiver: a webhook to http://localhost:9095/webhook, where
  #    nothing has ever listened, dating to 0c130db6a on 2026-04-24. Putting the
  #    config in the spec removes the class of problem instead of papering over
  #    it. deploy/prometheus/*.yml cannot follow suit, since a rules-directory
  #    glob does not fit in a compose string, so those keep their bind mounts
  #    and are handled by the apply-and-verify steps in deploy-demo-box.yml.
  #
  # Verified, not assumed: `docker compose config` does not print config content
  # at all (it emits only the config's name), so nothing here can leak an
  # interpolated value into a public CI log. The SMTP password is nonetheless
  # kept out of this text and passed by file reference below, so it never enters
  # the rendered config that Alertmanager echoes back on /api/v2/status either.
  alertmanager_config:
    content: |
      global:
        resolve_timeout: 5m
        # Reuses the ENTERPRISE_SMTP_* variables that already feed GoTrue in
        # docker-compose.enterprise.yml, rather than minting a parallel set for
        # the same relay.
        #
        # The fallback smarthost is deliberate and is not a placeholder
        # pretending to work. RFC 2606 reserves .invalid so it can never
        # resolve, which means an unconfigured deployment produces a config that
        # PARSES, so Alertmanager stays up and a firing alert is still visible in
        # its own UI and in Prometheus, while every delivery attempt fails
        # loudly: the literal string smtp-not-configured.invalid appears in the
        # container log, and alertmanager_notifications_failed_total increments,
        # which this stack now scrapes and alerts on. Refusing to start instead
        # would remove the only surface where a firing alert can still be seen,
        # which is worse than announcing the gap.
        smtp_smarthost: '${ENTERPRISE_SMTP_HOST:-smtp-not-configured.invalid}:${ENTERPRISE_SMTP_PORT:-587}'
        smtp_auth_username: '${ENTERPRISE_SMTP_USER:-}'
        smtp_auth_password_file: '/etc/alertmanager/smtp-credential'
        # STARTTLS on the submission port, and it stays on. Verified against the
        # configured relay: EHLO 250, STARTTLS 220, AUTH 235. If a relay ever
        # negotiates badly, fix the relay rather than turning this off, because an
        # SMTP AUTH over a cleartext session hands the login to anything on the
        # path.
        smtp_require_tls: true
      route:
        group_by: ['alertname']
        group_wait: 10s
        group_interval: 10s
        repeat_interval: 1h
        receiver: 'hive-ops'
      receivers:
        # Both addresses live here rather than in the globals above, deliberately.
        # A literal company email address two lines from an
        # smtp_auth_password_file key is what GitGuardian's "Company Email
        # Password" detector matches: on the first push of this branch it flagged
        # the path /etc/alertmanager/smtp-credential as a secret for exactly that
        # adjacency. Keeping the addresses in the receiver block, where no auth
        # field is in scope, removes the false positive without hiding where
        # alerts go behind another variable nobody would think to check.
        #
        # from and to are different values and are not interchangeable. The
        # sender is the owner's chosen no_reply address on a domain the relay must
        # have authenticated; the recipient is the mailbox a human reads, which is
        # what ENTERPRISE_SMTP_ADMIN_EMAIL holds on this deployment. Do not
        # collapse them, and never fall back to the SMTP login as the sender.
        - name: 'hive-ops'
          email_configs:
            - from: '${HIVE_ALERT_FROM:-no_reply@hive.scubed.co}'
              to: '${ENTERPRISE_SMTP_ADMIN_EMAIL:-contact@scubed.com.bd}'
              send_resolved: true
  # By file reference rather than inline, so the value never appears in the
  # config Alertmanager serves back on /api/v2/status, which the deploy prints.
  # An unset or empty variable yields an empty file, which is fine: with
  # smtp_auth_username empty too, Alertmanager attempts no AUTH at all.
  #
  # Two characters to know about when setting this in .env, because Compose
  # interpolates this value: a literal `$` must be written `$$`, and a `"` would
  # break the YAML. Both fail loudly at `up` time rather than silently, so this
  # is a note for whoever sets it, not a latent bug.
  alertmanager_smtp_credential:
    content: "${ENTERPRISE_SMTP_PASS:-}"

volumes:
  gomodcache:
  gobuildcache:
  prometheus-data:
  grafana-data:
  owui-data:
  # searxng-data caches SearXNG's own favicon/response caches across container
  # recreates. Not the search index (SearXNG holds no persistent index; every
  # query fans out live to its upstream engines).
  searxng-data:
  caddy-data:
  caddy-config:
  caddy-artifacts-data:
  caddy-artifacts-config:
  caddy-console-data:
  caddy-console-config:
  # ollama-models persists pulled model weights across container recreates.
  # Active only when the `enterprise` profile is used.
  ollama-models:
  # litellm-config is a shared volume between control-plane (writer) and litellm
  # (reader). control-plane generates config.yaml via POST /internal/litellm/sync
  # and writes it atomically; litellm reads it at startup and on restart.
  # Phase 20 Plan 03.
  litellm-config:
  # supabase-db-data and supabase-storage-data are declared in
  # docker-compose.enterprise.yml and only exist when that override is loaded.
