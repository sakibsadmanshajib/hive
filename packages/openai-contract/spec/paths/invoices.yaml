# Monthly usage statements.
#
# A usage period is a prepaid draw down against credits the customer already
# bought, so this document raises no charge and carries no money at all. It
# states the credit quantity consumed and nothing that could be used to price
# it: credits are sold at a markup and a subscription grants a quantity whose
# internal value is not published, so a fiat figure derived from a credit count
# would disclose that value (owner ruling, 2026-09-02, issues #1681 and #1682).
# A fiat amount belongs on a purchase invoice, which this surface does not
# model; that document is tracked in issue #1697.
#
# PDF rendered by gofpdf; stored in Supabase Storage hive-files bucket.
openapi: 3.0.0
info:
  title: Hive Invoices
  version: 14.0.0
paths:
  /api/v1/invoices:
    get:
      operationId: listWorkspaceInvoices
      summary: List invoices for a workspace.
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Invoice list.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invoice"
  /api/v1/invoices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getInvoice
      summary: Fetch a single invoice's metadata.
      responses:
        "200":
          description: Invoice.
          content:
            application/json:
              schema:
                type: object
                required: [invoice]
                properties:
                  invoice:
                    $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found.
  /api/v1/invoices/{id}/pdf:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: downloadInvoicePdf
      summary: Redirect to short-lived signed URL for the usage statement PDF.
      responses:
        "302":
          description: Redirect to signed Supabase Storage URL.
          headers:
            Location:
              schema: {type: string, format: uri}
        "404":
          description: Invoice or PDF not found.
components:
  schemas:
    Invoice:
      type: object
      required:
        - id
        - workspace_id
        - period_start
        - period_end
        - total_credits
        - line_items
        - generated_at
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        total_credits:
          type: string
          nullable: true
          description: >-
            Hive credits consumed in the period, as a decimal string so a client
            parses it with BigInt and never rounds at 2^53. Null means the
            quantity was never recorded for that row, which is true of statements
            generated between the issue #1648 fix and the issue #1682 repair. It
            is not a measured zero and must not be rendered as one. There is
            deliberately no fiat field beside it; see the note at the top of this
            file.
        line_items:
          type: array
          items:
            type: object
            required: [model_id, request_count, credits]
            properties:
              model_id:
                type: string
              request_count:
                type: integer
              credits:
                type: string
                nullable: true
                description: Hive credits for this model. Same null rule as total_credits.
        generated_at:
          type: string
          format: date-time
