[project]
name = "hive-sdk-tests-python"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    # Bounded below the openai 3.0.0 major bump: 3.x renamed its transitive
    # HTTP client dependency from `httpx` to `httpx2`, which silently dropped
    # the `httpx` module our tests import directly (ModuleNotFoundError on
    # collection). httpx is pinned as its own direct dependency below so this
    # suite never again depends on openai's internal HTTP client naming.
    "openai>=2.30.0,<3.0.0",
    # httpx is pre-1.0; bounded to the next minor (not major) since httpx has
    # shipped breaking changes across 0.x minor releases before.
    "httpx>=0.28.0,<0.29.0",
    # Anthropic Messages API conformance suite (test_anthropic_messages.py).
    # Verified live against 1.2.0: messages.create() no longer takes
    # temperature/top_p/top_k as typed keywords (see that file's
    # test_temperature_top_p_top_k_via_extra_body), so this suite is pinned
    # to the major version it was actually exercised against rather than an
    # open-ended range that could silently change that surface again.
    "anthropic>=1.2.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
