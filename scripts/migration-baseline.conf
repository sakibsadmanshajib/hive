# Which migrations are already applied to the target database.
#
# public.hive_schema_migrations did not exist before this change, because
# migrations were applied by hand and, in places, by raw SQL that recorded no
# version anywhere. The first run of the applier therefore has to be told what
# history actually happened. It cannot be derived from filenames: the drift is
# INTERLEAVED, not a prefix. 20260516_01 through _07 are applied while _08 and
# _09 are not; 20260518_02 is applied while _01 and _04 are not. Any date based
# or position based heuristic is therefore wrong by construction, which is why
# this file is an explicit per-file list rather than a high water mark.
#
# THE SAFETY RULE, and the property that makes this whole design sound:
#   when a migration cannot be PROVEN applied, it is marked NOT applied.
# Unknown never resolves to applied. The cost of the safe direction is that a
# non-idempotent migration may re-run and abort loudly, which is visible and
# fixable in one job log. The cost of the unsafe direction is a migration
# skipped permanently and silently, with the ledger reporting a fully migrated
# database that is not one. Loud beats silent.
#
# Only files listed below are treated as applied. Everything else in
# supabase/migrations is pending and will be executed by the first run.
# New migrations need no entry here: absence already means pending.
#
# PROVENANCE. Read this before trusting or editing the list, and re-verify
# rather than assuming if the database may have changed since.
#
# Established on 2026-08-01 by scripts/probe-applied-migrations.py, an
# exhaustive object-by-object probe of all 78 files against the live demo
# database, read only, over the pooler's TRANSACTION mode port (6543). The
# probe is checked in, so this list is reproducible rather than asserted: run
# `scripts/probe-applied-migrations.py --emit-baseline` to regenerate it. Transaction mode is used so the probe consumes
# no session-mode slot: those are capped at pool_size 15 and shared with CI,
# agents and the live chat surface. A read only probe needs none of what
# transaction mode drops (prepared statements, LISTEN and NOTIFY, advisory
# locks). The catalog is read in one batch of queries on a single connection
# rather than per file.
#
# An earlier version of this file claimed the whole list was probed when in
# fact one hole had been found and the rest of the prefix was assumed. That
# claim was false and is the reason this block now states its limits. A false
# provenance note is worse than none, because the next reader trusts it and
# skips re-verification.
#
# WHAT THE PROBE COVERS. For every file it parses the SQL, stripping comments
# and dollar quoted bodies so that commented out or dynamically built DDL is
# not mistaken for real DDL, then extracts every strong object the file
# creates: tables, indexes, policies, types, triggers, added columns, added
# constraints, extensions, enum values and views. Each is looked up in the live
# catalog. A file is listed below ONLY if EVERY one of its strong objects is
# present. Every entry below was individually probed this way; none is derived,
# inferred from a neighbour, or assumed from position in the sequence.
#
# CREATE OR REPLACE functions and procedures are deliberately treated as weak
# evidence and never prove a file applied, because a later migration replacing
# the same function would otherwise vouch for an earlier one.
#
# WHAT THE PROBE DOES NOT COVER, and where it can therefore still be wrong:
#   * Object SHAPE. Existence is proven, definition is not. A column, policy,
#     constraint or index that exists but whose type, default, USING clause,
#     predicate or column set differs from the migration is still counted as
#     applied.
#   * GRANT and REVOKE statements, ownership, and role membership.
#   * Column defaults, comments, and storage or partitioning parameters.
#   * ALTER TABLE ENABLE or FORCE ROW LEVEL SECURITY flags.
#   * Data content. Inserts, updates and backfills are not verified, which is
#     why every data-only migration lands in the unprovable group and stays
#     pending rather than being credited.
#   * Anything a migration performs inside a dollar quoted body, since those
#     are stripped before parsing. Such files fall to unprovable and stay
#     pending, which is the safe direction.
#
# SUPERSESSION. A later migration may legitimately drop something an earlier one
# created, in which case the earlier migration did run and its object is simply
# gone. The probe accounts for this by ignoring any object that a later file
# drops. Without it, 20260516_05 reads as partially applied because 20260518_01
# drops its audit_outbox_undelivered index, and the earlier file would be
# re-run, aborting on the objects that do still exist.
#
# SHELF LIFE. This list is a snapshot, and the demo database is being changed
# out of band while this work is in flight: between two runs of the probe on
# 2026-08-01 the applied count moved from 54 to 60, because another operator
# applied migrations by hand mid-session. Re-run the probe and compare before
# merging. A baseline that under-reports what is applied re-runs a
# non-idempotent migration and aborts the deploy loudly, which is recoverable
# but is still a blocked deploy.
#
# Result: 60 provably applied (listed below), 0 provably unapplied, 0 partially
# applied, 18 unprovable. All 18 non-applied files are pending, each with its
# reason recorded below. Every one of those 18 was executed successfully against
# a throwaway clone of the live schema plus provider catalog, so they are known
# re-runnable rather than assumed.


