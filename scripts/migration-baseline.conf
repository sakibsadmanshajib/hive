# One-time baseline for scripts/apply-migrations.sh.
#
# public.hive_schema_migrations did not exist before this change, because
# migrations were applied by hand. The first run of the applier therefore has to
# be told which history already happened. After that first run the ledger is
# self-maintaining and this file is inert: nothing reads it once the ledger has
# rows. Do NOT add entries here for new migrations. A new migration file is
# pending automatically because it sorts after the marker below.
#
# baseline
#   Every migration file at or before this filename is recorded as already
#   applied WITHOUT being executed. Everything after it is pending.
#
# catch_up
#   Exceptions: files at or before the marker that are verified NOT applied, so
#   they stay pending and the first run executes them. This key exists because
#   the drift on this database is not a clean prefix, so a marker alone would
#   permanently skip a hole below it.
#
# All values below were established read-only against the live demo database on
# 2026-07-31 by probing for the objects each migration creates, not by assuming.

# 20260730_01 is applied: the usage_events event_type CHECK now contains
# 'interrupted', 'upstream_error' and 'finalize_failed'.
baseline = 20260730_01_usage_events_event_type_extend.sql

# 20260729_02 is NOT applied, even though both 20260729_01 and 20260730_01 are.
# Neither object it creates exists live: public.purge_metering_shadow_verdicts
# is absent from pg_proc and public.metering_shadow_verdicts_retention_config
# is absent from pg_class. This single file is the reason a plain high-water
# mark would have been wrong.
#
# Known risk on the first automated run, flagged rather than worked around: this
# file creates a pg_cron schedule behind a pg_available_extensions guard, and on
# this database pg_cron is available on the filesystem but is NOT yet an
# installed extension (pg_extension holds only 'vector'). The guard therefore
# takes its true branch and runs CREATE EXTENSION IF NOT EXISTS pg_cron. If that
# raises on this host, the applier stops and fails the deploy, which is the
# intended behaviour and is also how this pre-existing hole finally becomes
# visible. Compare issue #615, the installed-but-not-preloaded variant.
catch_up = 20260729_02_metering_shadow_verdicts_retention.sql

# 20260731_01_tenant_billing_account_backfill_v2.sql is deliberately absent from
# both keys: it sorts after the marker, so it is pending and the first run
# applies it. That is intentional even though it was applied by hand on
# 2026-07-31 to clear the HTTP 403, because the file documents itself as safely
# rerunnable and re-running it is strictly cheaper than risking a permanent hole
# if that hand application did not stick.
