name: deploy-drift-watchdog

# Answers one question deploy-demo-box.yml itself cannot answer about its own
# runs: "did every commit on main that should have deployed actually get a
# deploy run at all?" (issue #1238).
#
# ── Why this cannot be a push-triggered check ────────────────────────────
#
# A workflow that never runs does not fail. It is absent, and absence reads
# as success on a green PR page. That is exactly what happened on 2026-08-26:
# PR #1222 squash-merged as 483ba7983, touched apps/edge-api/** (which
# deploy-demo-box.yml's paths filter matches explicitly) and also touched
# files ci.yml has no paths filter on at all, yet BOTH workflows produced no
# run whatsoever for that push. Not a paths-filter gap (the two prior
# occurrences of this general symptom, PR #786 and PR #971, both were, and
# both are now guarded by .github/ci/lint-deploy-paths-filter.mjs); this one
# was a webhook or dispatch anomaly with no config to blame, resolved only by
# a manual workflow_dispatch once a human happened to notice.
#
# The failure mode that suppressed deploy-demo-box's run would, by the same
# mechanism, suppress a push-triggered guard sitting next to it: whatever
# swallowed the push event swallows it for every workflow listening on that
# push, not just the one whose absence someone happened to check. So this
# watchdog is deliberately NOT `on: push`. It runs on a schedule, asks GitHub
# what state main and deploy-demo-box's run history are ACTUALLY in right
# now, and does not depend on the same push delivery it exists to audit.
#
# ── Cadence ───────────────────────────────────────────────────────────────
#
# Every 30 minutes. This repository is public, so hosted-runner minutes cost
# nothing. deploy-demo-box.yml's own history runs a handful of times on a
# busy day (single digits to low tens), nowhere near external-uptime-probe's
# every-15-minutes outage cadence, so 30 minutes bounds how long a real
# divergence can sit unnoticed without polling far more often than main ever
# actually moves. Combined with the grace window below (15 minutes), worst
# case detection latency is under an hour, well inside a working day.
#
# ── False positives (the two legitimate "no deploy ran" cases) ──────────
#
#   1. The newest commits on main touch nothing deploy-demo-box.yml's paths
#      filter covers (a docs-only or workflow-only change, say). No deploy
#      SHOULD have run. Checked by list-covered-deploy-changes.mjs, which
#      reuses lint-deploy-paths-filter.mjs's own filter-matching so this
#      watchdog and that lint can never disagree about the same commit.
#   2. A deploy for the current tip is already queued or running. Checked
#      directly against the live run list; still in flight is not silently
#      absent.
#
# A grace window (15 minutes since the newest covered commit landed) covers
# the ordinary case neither of the above catches: normal webhook delivery
# and queueing latency between a push landing and its run appearing in the
# run list at all. A watchdog that fires on that lag trains everyone to
# ignore it, which is the same failure this repository already logged for a
# monitor that cries wolf (`external-uptime-probe.yml`'s own reasoning).
#
# ── Alert mechanism ───────────────────────────────────────────────────────
#
# One deduped GitHub issue (title-matched, same shape agent-visual-proof.yml
# already uses: list open issues, comment on a match, else create). Chosen
# over a bare failing scheduled check because nobody watches the Actions tab
# for a workflow they did not personally trigger; chosen over a PR comment
# because there usually is no PR at the time main drifts. The job itself
# still exits non-zero on a real divergence, which is a side effect of
# detecting one, not a second alert mechanism.
#
# ── What this deliberately does NOT do ───────────────────────────────────
#
# It does not have the deploy job record its shipped SHA on the box for this
# watchdog to cross-check. post-deploy-verify.yml's "Assert every container
# runs the image its tag now points to" step (issue #869) already answers
# the harder version of that question -- not "did a workflow run" but "is
# the box actually serving what the last successful run built" -- so adding
# a second, narrower on-box ledger here would duplicate that job rather than
# extend it. Revisit only if #869's freshness check turns out not to cover
# this watchdog's blind spot in practice.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      override_base_sha:
        description: >-
          Test hook: treat this as the last-successful-deploy SHA instead of
          auto-detecting one from run history. Leave blank for a real check.
        type: string
        default: ''
      override_head_sha:
        description: >-
          Test hook: treat this as main's tip SHA instead of asking the API.
          Leave blank for a real check. Set equal to override_base_sha (or
          leave both blank) to exercise the "stays quiet" path on demand.
        type: string
        default: ''
  # Label-gated, the same shape post-deploy-verify.yml and owui-nightly.yml
  # use for the same reason: workflow_dispatch is unusable until this file
  # exists on the default branch, so the pull_request that adds it needs its
  # own way to prove the alert fires red and then stays quiet, before merge.
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  # `gh run list` against this repo's own deploy-demo-box.yml history reads
  # the Actions runs API, which the default GITHUB_TOKEN only gets once
  # `permissions:` is present at all if this scope is listed explicitly.
  actions: read
  issues: write

jobs:
  check:
    name: Check main against the last successful deploy
    if: >-
      ${{
        github.event_name == 'schedule'
        || github.event_name == 'workflow_dispatch'
        || (github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name == github.repository
            && contains(github.event.pull_request.labels.*.name, 'run-deploy-drift-watchdog'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: both the last-successful-deploy SHA and main's tip
          # need to already be present locally for `git diff` below, and
          # neither is necessarily an ancestor of whatever ref this event
          # checked out (a pull_request run checks out the PR's merge ref,
          # not main).
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure main's history is present locally
        # Redundant on a schedule/workflow_dispatch run (already on main),
        # load-bearing on a pull_request run (checked out the PR ref
        # instead). The explicit refspec, not a bare `git fetch origin
        # main`, is what guarantees `origin/main` itself gets created or
        # updated: actions/checkout does not promise a wildcard fetch
        # refspec is configured, so this does not depend on that default.
        run: git fetch origin +refs/heads/main:refs/remotes/origin/main --quiet

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install repo-level dev deps
        # Only need `yaml`, for list-covered-deploy-changes.mjs below.
        run: npm ci --ignore-scripts

      - name: Decide whether this run carries a simulated divergence
        # Only reachable from a pull_request run (workflow_dispatch has its
        # own override_base_sha input already). Forces base_sha back to an
        # old ancestor of main so the covered-changes check below finds real
        # matches without needing to fabricate any commit or touch the repo.
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          simulate=false
          case "$PR_LABELS" in
            *"\"deploy-drift-test:simulate-divergence\""*) simulate=true ;;
          esac
          echo "SIMULATE_DIVERGENCE=$simulate" >> "$GITHUB_ENV"
          echo "simulate divergence: $simulate"

      - name: Resolve base and head commits
        id: resolve
        env:
          OVERRIDE_BASE_SHA: ${{ github.event.inputs.override_base_sha }}
          OVERRIDE_HEAD_SHA: ${{ github.event.inputs.override_head_sha }}
        run: |
          set -euo pipefail

          if [ -n "${OVERRIDE_HEAD_SHA:-}" ]; then
            head_sha="$OVERRIDE_HEAD_SHA"
            echo "head: using override_head_sha"
          else
            head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
            echo "head: main tip is $head_sha"
          fi

          no_baseline=false
          in_flight=false
          if [ -n "${OVERRIDE_BASE_SHA:-}" ]; then
            base_sha="$OVERRIDE_BASE_SHA"
            echo "base: using override_base_sha"
          elif [ "${SIMULATE_DIVERGENCE:-false}" = "true" ]; then
            base_sha=$(git rev-parse origin/main~200)
            echo "base: simulated, 200 commits behind main ($base_sha)"
          else
            # Last 50 runs is comfortably more than deploy-demo-box.yml fires
            # in any single day (issue #1238's own history: single digits to
            # low tens on a busy day), so the newest success in that window
            # is the real last-known-good baseline, not a stale one from a
            # quiet stretch -- and comfortably more than a bad stretch of
            # back-to-back failures during an incident would produce before
            # someone is already looking at it directly.
            runs_json=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow=deploy-demo-box.yml --branch=main -L 50 \
              --json headSha,status,conclusion,createdAt)

            base_sha=$(echo "$runs_json" | jq -r \
              '[.[] | select(.conclusion == "success")] | first | .headSha // empty')
            if [ -z "$base_sha" ]; then
              no_baseline=true
              echo "base: no successful run found in the last 50 -- cannot establish a baseline"
            else
              echo "base: last successful deploy was $base_sha"
            fi

            # Only the NEWEST run, not "any of the last 50": an old run stuck
            # queued (GitHub eventually times these out, but not instantly)
            # must not permanently suppress alerting for a real divergence
            # that shows up after it. `gh run list` is already newest-first.
            newest_status=$(echo "$runs_json" | jq -r '.[0].status // "completed"')
            if [ "$newest_status" != "completed" ]; then
              in_flight=true
              echo "the newest deploy-demo-box run is still queued or in progress"
            fi
          fi

          # Validate both SHAs before they leave this step, once, for every
          # caller downstream (list-covered-deploy-changes.mjs and
          # newest-covered-commit.mjs both only ever see values that already
          # passed this check). head_sha and base_sha can both originate
          # from override_head_sha/override_base_sha, workflow_dispatch
          # inputs that reach here as free text with no format guarantee.
          # Passed unvalidated, either becomes a single argv element to
          # `git log`/`git diff`/`git diff-tree` with no `--` separator: a
          # value starting with `-` is parsed by git as an option rather
          # than a revision, and `git diff --output=<file>` is an arbitrary
          # file write on the runner, not just a parse error. This also
          # closes a second, lower severity issue on the same value: a
          # `$GITHUB_OUTPUT` line written via plain `echo "key=$value"` (no
          # heredoc delimiter) lets an embedded newline in $value inject an
          # extra key=value pair into this step's outputs, and a value that
          # matches this regex cannot contain a newline. base_sha is allowed
          # to be empty here (the no_baseline=true path never sets it); head
          # sha is never legitimately empty.
          sha_re='^[0-9a-f]{7,40}$'
          if ! [[ "$head_sha" =~ $sha_re ]]; then
            echo "::error::head_sha '$head_sha' is not a valid git SHA (7-40 lowercase hex chars); refusing to use it" >&2
            exit 1
          fi
          if [ -n "$base_sha" ] && ! [[ "$base_sha" =~ $sha_re ]]; then
            echo "::error::base_sha '$base_sha' is not a valid git SHA (7-40 lowercase hex chars); refusing to use it" >&2
            exit 1
          fi

          {
            echo "head_sha=$head_sha"
            echo "base_sha=$base_sha"
            echo "no_baseline=$no_baseline"
            echo "in_flight=$in_flight"
          } >> "$GITHUB_OUTPUT"

      - name: List covered changes since the baseline
        id: changes
        if: steps.resolve.outputs.no_baseline != 'true'
        # base_sha/head_sha go through env: rather than direct ${{ }}
        # interpolation into the shell body below: both ultimately trace
        # back to the workflow_dispatch override_base_sha/override_head_sha
        # inputs (free text, unvalidated as SHA-shaped), and the standard
        # GHA injection mitigation is to never splice such a value directly
        # into `run:` text, even when the immediate source is a step output
        # rather than the event payload itself.
        env:
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          node .github/ci/list-covered-deploy-changes.mjs "$BASE_SHA" "$HEAD_SHA" \
            | tee covered-changes.txt
          count=$(wc -l < covered-changes.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count covered path(s) changed between the two SHAs"

      - name: Decide freshness of the newest covered change
        id: age
        if: steps.resolve.outputs.no_baseline != 'true' && steps.changes.outputs.count != '0'
        # Same env: rationale as the "List covered changes" step above.
        env:
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          # The commit that must be fresh is the NEWEST COVERED commit, not
          # main's tip: an unrelated, uncovered commit landing after a
          # genuinely stale covered commit must not reset the apparent
          # freshness (PR #1249 and PR #1246 merged 8 seconds apart is the
          # exact shape that exposed this; see newest-covered-commit.mjs's
          # own header comment). Local git log, not `gh api`: full history is
          # already fetched by the checkout step above, so no extra round
          # trip is needed.
          newest_covered_sha=$(node .github/ci/newest-covered-commit.mjs "$BASE_SHA" "$HEAD_SHA")
          committed=$(git log -1 --format=%cI "$newest_covered_sha")
          committed_epoch=$(date -u -d "$committed" +%s)
          now_epoch=$(date -u +%s)
          age_minutes=$(( (now_epoch - committed_epoch) / 60 ))
          # 15 minutes: this workflow's own header comment justifies it.
          within_grace=false
          [ "$age_minutes" -lt 15 ] && within_grace=true
          echo "within_grace=$within_grace" >> "$GITHUB_OUTPUT"
          echo "newest covered commit ($newest_covered_sha) is ${age_minutes} minute(s) old (grace window: 15)"

      - name: Verdict
        id: verdict
        # always(): without this, a genuine crash in any of the three steps
        # this one reads from (resolve/changes/age) skips this step entirely
        # (GitHub Actions' default behavior for a step with no if: at all),
        # which skips the alert output, which skips "File or update the
        # tracking issue" below (gated on that output). The run shows red on
        # the Actions tab and nothing else happens: the exact silent-failure
        # shape this watchdog exists to catch, reproduced by a bug in the
        # watchdog itself. The new first branch below exists because a bare
        # always() alone is not enough: with a genuine upstream crash, every
        # output this step reads is simply unset (empty string, not "true"
        # or "false"), and the pre-existing elif chain was written assuming
        # those outputs are always trustworthy -- an empty count, compared
        # with `= "0"`, is not equal to "0" and falls through to the same
        # branch a real zero-count quiet result would, which would have
        # silently reported "quiet" for a run that never actually determined
        # that. Checking each step's own outcome first, before trusting its
        # outputs, avoids that.
        if: always()
        run: |
          set -euo pipefail
          reason=""
          if [ "${{ steps.resolve.outcome }}" = "failure" ] || [ "${{ steps.changes.outcome }}" = "failure" ] || [ "${{ steps.age.outcome }}" = "failure" ]; then
            reason="the watchdog's own check failed partway through (resolve=${{ steps.resolve.outcome }}, changes=${{ steps.changes.outcome }}, age=${{ steps.age.outcome }}); treating this as drift since the real state could not be determined"
          elif [ "${{ steps.resolve.outputs.no_baseline }}" = "true" ]; then
            reason="no successful deploy-demo-box run was found in the last 30 runs, so no baseline could be established"
          elif [ "${{ steps.changes.outputs.count }}" = "0" ]; then
            echo "quiet: no covered path changed since the last successful deploy -- absence of a new run is correct"
            echo "alert=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "${{ steps.resolve.outputs.in_flight }}" = "true" ]; then
            echo "quiet: a deploy-demo-box run is currently queued or in progress for main"
            echo "alert=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "${{ steps.age.outputs.within_grace }}" = "true" ]; then
            echo "quiet: within the 15-minute grace window since the newest covered commit landed"
            echo "alert=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            reason="main has ${{ steps.changes.outputs.count }} covered path change(s) since the last successful deploy ($SHORT_BASE), older than the 15-minute grace window, with no deploy currently in flight"
          fi
          echo "REASON=$reason" >> "$GITHUB_ENV"
          echo "alert=true" >> "$GITHUB_OUTPUT"
          echo "::error::deploy drift detected: $reason"
          exit 1
        env:
          SHORT_BASE: ${{ steps.resolve.outputs.base_sha }}

      - name: File or update the tracking issue
        # `always()` because the verdict step above deliberately exits 1 on
        # a real divergence (so the scheduled run itself shows red), and a
        # failed step skips every step after it unless told not to.
        #
        # No test/real split here on purpose: a manual workflow_dispatch or
        # labeled pull_request run that simulates a divergence exercises
        # this exact step, filing or commenting on the real tracking issue,
        # because that is the only way to actually prove the alert fires
        # rather than just the detection logic upstream of it. Verified by
        # hand and cleaned up (issue closed) once confirmed; see this
        # change's own pull request for the run that proved it.
        if: always() && steps.verdict.outputs.alert == 'true'
        env:
          TITLE: main has advanced past the last successful deploy-demo-box run
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # Capped: a simulated test divergence (200 commits back) can list
          # thousands of paths, well past what fits in an issue body. A real
          # divergence between two adjacent deploys is normally a handful.
          total=$(wc -l < covered-changes.txt 2>/dev/null | tr -d ' ')
          listed=$(head -50 covered-changes.txt 2>/dev/null || echo '(none listed -- see the run log)')
          if [ "${total:-0}" -gt 50 ]; then
            listed=$(printf '%s\n... and %s more (see the run log)' "$listed" "$((total - 50))")
          fi
          body=$(printf '%s\n' \
            "$REASON" \
            "" \
            "Run: $RUN_URL" \
            "" \
            "Covered, changed paths since the baseline:" \
            '```' \
            "$listed" \
            '```' \
            "" \
            "This is issue #1238's own failure mode: a merge to main can produce no" \
            "deploy-demo-box run at all, with nothing else noticing. Check whether" \
            "deploy-demo-box.yml ran for the head commit above; if it did not, a manual" \
            "\`gh workflow run deploy-demo-box.yml\` ships it. Close this once a" \
            "successful deploy run's headSha catches up to main.")
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
                  --json number,title -q '.[] | [.number, .title] | @tsv' 2>/dev/null \
                | awk -F'\t' -v t="$TITLE" '$2 == t { print $1; exit }')
          if [ -n "${num:-}" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body" || true
            echo "commented on existing tracking issue #$num"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body" || true
            echo "opened the tracking issue"
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # A second, independent watchdog in the same file, for the same class of
  # defect: something that should have happened did not, and its absence was
  # silent (issue #1491).
  #
  # The demo box's backup has two halves with opposite observability. The
  # on-box half writes a status file and alerts on its own staleness, so it is
  # visible and was genuinely healthy. The off-box half
  # (scripts/pull-box-backups.sh) is a manual command on a dev machine that
  # wrote nothing anywhere, so its silence was indistinguishable from its
  # success. On 2026-08-29 it had not run for six days: sixteen consecutive
  # green backup lines on the box, one day out of seven copied off it, and no
  # signal anywhere. Same shape as the deploy drift the job above watches,
  # which is why it lives here rather than in a workflow of its own.
  #
  # Why this lane. It is the repository's only scheduled workflow whose entire
  # purpose is detecting a thing that silently did not happen, and it already
  # files a deduped GitHub issue rather than relying on a red square in the
  # Actions tab that nobody is watching (its own header argues that point at
  # length). It also runs on a hosted runner, which this check needs, because
  # the marker it reads is a repository variable rather than a file on the box.
  #
  # Why the marker is a repository variable. Nothing that runs on a schedule
  # can read a file on the demo box: hosted runners have no SSH path to it,
  # and the two workflows that do run on its self-hosted runner
  # (post-deploy-verify.yml, rag-demo-readiness.yml) are triggered by deploys
  # and labels, never by a clock. The remaining candidate, a check inside
  # scripts/backup-box.sh run by the box's own hourly cron, would be inert on
  # merge, because the box runs a copy installed by hand under
  # /home/sakib/hive-backups/bin and merging to this repository does not touch
  # it. A repository variable is the one store the writing machine can reach
  # and a scheduled lane can read.
  #
  # No box contact, no credential and no backup artifact is involved here: the
  # job reads one repository variable holding a timestamp and a date.
  #
  # Alerting deliberately differs from the job above. This one creates the
  # tracking issue when none is open and otherwise says nothing. Staleness
  # persists for days by nature, and on a 30 minute cadence the
  # comment-every-time shape would post dozens of notifications a day about one
  # unchanged fact, which is how a monitor gets muted. The job still exits
  # non-zero on every stale run, so the red is continuous even when the
  # notification is not.
  # ──────────────────────────────────────────────────────────────────────────
  offbox-backup-staleness:
    name: Check the off-box backup copy is not stale
    if: >-
      ${{
        github.event_name == 'schedule'
        || github.event_name == 'workflow_dispatch'
        || (github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name == github.repository
            && contains(github.event.pull_request.labels.*.name, 'run-offbox-backup-check'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Narrower than the file-level block this would otherwise inherit: unlike
    # the deploy-drift job above, this one runs no `gh run list`, so it has no
    # use for `actions: read`.
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Written by scripts/pull-box-backups.sh, and by nothing else, after a
      # verified pull. Unset is a legitimate state and the checker treats it as
      # stale, never as "unknown, assume fine". Passed through `env:` rather
      # than interpolated into a `run:` body, so its content reaches the shell
      # as a process environment variable and can never be parsed as shell.
      LAST_OFFBOX_BACKUP_PULL: ${{ vars.LAST_OFFBOX_BACKUP_PULL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check the off-box pull marker
        id: check
        # No pipe around the checker: its exit status is the entire result, and
        # the default shell here is `bash -e` without pipefail, so putting it on
        # the left of a `| tee` would take tee's status instead and print a
        # success line over a real failure.
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -uo pipefail
          # Label-gated proof hook, the same shape and for the same reason as
          # this workflow's own deploy-drift-test:simulate-divergence label:
          # workflow_dispatch is unusable until the file exists on the default
          # branch, so the pull request that adds this job needs a way to prove
          # the alert actually fires before merge, not just that the unit tests
          # say it would. Squeezing the threshold rather than faking the marker
          # keeps the run honest: it reads the real repository variable and
          # measures it, only against an interval nothing can satisfy.
          # Unreachable on a schedule run, where PR_LABELS is null.
          case "${PR_LABELS:-}" in
            *'"offbox-backup-test:simulate-stale"'*)
              export OFFBOX_PULL_STALE_AFTER_HOURS=0.0001
              echo "simulating staleness: threshold squeezed to 0.0001 hours" ;;
          esac
          if node .github/ci/check-offbox-backup-freshness.mjs > offbox-check.txt 2>&1; then
            stale=false
          else
            stale=true
          fi
          cat offbox-check.txt
          echo "stale=$stale" >> "$GITHUB_OUTPUT"

      - name: File the tracking issue and fail
        if: steps.check.outputs.stale == 'true'
        env:
          TITLE: the off-box copy of the demo box backups has gone stale
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          detail=$(cat offbox-check.txt 2>/dev/null || echo '(the check produced no output, see the run log)')
          body=$(printf '%s\n' \
            "$detail" \
            "" \
            "Run: $RUN_URL" \
            "" \
            "The demo box takes encrypted backups twice a day and keeps 14 days of them," \
            "but every one of those days lives on a single disk until someone copies it" \
            "off. This check reads the marker that scripts/pull-box-backups.sh records" \
            "after a verified pull. That marker is now older than the threshold, or" \
            "missing entirely, so the off-box copy is behind the box by at least that" \
            "much." \
            "" \
            "Fix: run \`scripts/pull-box-backups.sh\` on the dev machine holding the" \
            "off-box copy. It pulls only encrypted artifacts, verifies their checksums," \
            "and records the marker. Close this once a later run of this check is green." \
            "" \
            "This is issue #1491's failure mode. Where the durable off-box copy should" \
            "ultimately live is a separate, open owner decision (#1492); this check only" \
            "makes the staleness of whatever copy exists visible.")
          # Deduplicate on title AND author, not title alone. This repository is
          # public with issues enabled, so anyone at all can open an issue with
          # this exact title; matching the title by itself would let a stranger
          # suppress the alert channel indefinitely while detection kept
          # working, which is the quietest possible way to break a monitor. The
          # server-side `--search` also keeps the match independent of how many
          # open issues the repository has, which a bare `--limit 200` against
          # several hundred open issues is not.
          #
          # A failed listing does not abort the step. The default shell here is
          # `bash -e`, so an unguarded command substitution would end the run
          # before the ::error:: and the exit 1 below ever execute, replacing
          # the designed alert with a bare shell failure. It falls through to
          # filing instead, because a duplicate alert is recoverable and a
          # missing one is the thing being fixed.
          num=""
          if listing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
                         --search "in:title \"$TITLE\"" --json number,title,author \
                         -q '.[] | [(.number|tostring), .author.login, .title] | @tsv' 2>&1); then
            # `app/github-actions` is what gh actually reports for an issue
            # filed by GITHUB_TOKEN, confirmed against this repository's own
            # bot-filed issues #1247 and #1248 rather than assumed. The two
            # other spellings are accepted so a gh release that changes the
            # rendering degrades into a duplicate issue rather than into
            # silence. Getting this wrong in the tightening direction is the
            # expensive way round: it would file a fresh issue every 30
            # minutes, which is how a monitor gets muted.
            num=$(printf '%s\n' "$listing" \
              | awk -F'\t' -v t="$TITLE" \
                  '($2 == "app/github-actions" || $2 == "github-actions" || $2 == "github-actions[bot]") && $3 == t { print $1; exit }')
          else
            echo "::warning::could not list open issues to deduplicate ($listing), filing anyway"
          fi
          if [ -n "${num:-}" ]; then
            echo "tracking issue #$num is already open, not commenting again"
          elif gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"; then
            echo "opened the tracking issue"
          else
            # Saying "opened the tracking issue" after a failed create would be a
            # success line printed over a failure, which is the exact shape this
            # whole change exists to remove. The job still exits 1 below, so the
            # run is red either way; this only stops the log from claiming a
            # notification that was never delivered.
            echo "::warning::gh issue create FAILED, so no tracking issue was filed for this stale marker"
          fi
          echo "::error::the off-box backup copy is stale, run scripts/pull-box-backups.sh"
          exit 1
