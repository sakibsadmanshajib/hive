name: CI

# Deliberately NO `paths:` / `paths-ignore:` filter on any trigger. See the
# `changes` job below: path filtering happens inside the workflow so that this
# file is the only producer of every required check name (issue #553).
on:
  pull_request:
    branches: [main]
    # `ready_for_review` is required: none of the default activity types fire
    # when a draft pull request is marked ready with no further pushes, so
    # without it this workflow never runs and every required check stays
    # unpublished. Enforced by .github/ci/lint-workflow-check-names.mjs.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  schedule:
    # Daily run on main. It used to be described as the "paid hive-default
    # fidelity run", which stopped being true when the 2026-08-22 catalog
    # restructure moved hive-default onto Groq, and stopped being desirable
    # when that shared free-tier daily budget ran out and reddened a required
    # check (issue #1088). It now exercises the same alias every other trigger
    # does; see live-integration's HIVE_TEST_MODEL below for which one and why.
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Docker image tags used across live-integration + web-e2e so everyone
  # references the same pre-built image.
  EDGE_IMAGE: hive-edge-api:ci
  CP_IMAGE: hive-control-plane:ci
  WEB_IMAGE: hive-web-console:ci

jobs:
  # ------------------------------------------------------------------
  # Single source of truth for "does this diff need the real suite?".
  #
  # Path filtering used to live in the `on:` trigger. GitHub skips the
  # whole workflow when a trigger path filter does not match, and a
  # skipped workflow never creates its check runs, so every required
  # check stayed Pending and blocked the merge. The previous workaround
  # was a second workflow (ci-noop.yml) that fired on the inverse path
  # set and published job names identical to the ones here as trivial
  # `echo` steps. Because `paths-ignore` matches when ANY changed file
  # falls outside the ignore set, a pull request touching both code and
  # docs fired BOTH workflows, and the echo could report success on
  # every required context in seconds. That made the merge gate
  # ambiguous on this repo's most common pull request shape (the visual
  # proof rule means most substantive changes commit screenshots under
  # docs/ alongside code). Issue #553.
  #
  # Filtering inside the workflow removes the second producer entirely:
  # each required check name is published by exactly one job in exactly
  # one workflow, so no `echo` can ever stand in for a real suite that
  # failed.
  #
  # Two tiers of gating, deliberately different:
  #
  #   * Jobs that publish a REQUIRED check name (go-tests,
  #     repo-policy-lints, web-unit) carry `if: always()` and gate their
  #     individual steps. They therefore always run to completion and
  #     always report their own conclusion. This does not rely on how
  #     branch protection treats a check run whose conclusion is
  #     `skipped`, which is the one thing that cannot be verified on a
  #     pull request into a protected branch until after the change is
  #     already merged. A required job that concludes `success` with no
  #     real steps executed is unambiguous on every GitHub version.
  #
  #   * Jobs that are NOT required (rust-tests, desktop-tests,
  #     agent-console-unit, docker-build, live-integration, web-e2e,
  #     egress-firewall-e2e) use a plain job-level `if:` and are simply
  #     skipped, because a skipped non-required check cannot block
  #     anything.
  #
  # The step-level condition is `!= 'false'` rather than `== 'true'` so
  # that a `changes` job that failed or was cancelled leaves an empty
  # output and the real suite runs anyway.
  #
  # Polarity is deliberate. This is an allow-list of paths that are safe
  # to ignore, and ANYTHING else means run=true, including an
  # unrecognized path, an API error, or an event that carries no diff
  # (schedule, workflow_dispatch). A false "run" costs CI minutes. A
  # false "skip" would defeat the merge gate, so the default must never
  # be "skip".
  # ------------------------------------------------------------------

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only this job needs the pull request file list, so the extra scope
    # is granted here instead of at workflow level.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      # Narrower than `run`: true only when a changed path can actually
      # affect the browser flow web-e2e exercises. See the decide step for
      # the reasoning per path category (issue #659 follow-up).
      web_e2e: ${{ steps.decide.outputs.web_e2e }}
    steps:
      - name: Decide whether the real suite must run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          run_everything() {
            # Also runs web-e2e: every one of these is a case where the
            # diff itself is unknown (API failure, no base commit, a
            # non-diff event, a possibly-truncated list), and the whole
            # point of the narrower web_e2e gate below is to skip only
            # when the actual changed paths are known and provably
            # irrelevant to the browser flow.
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "web_e2e=true" >> "$GITHUB_OUTPUT"
            echo "verdict: RUN the real suite — $1"
            exit 0
          }

          # The API is asked for the same file list GitHub itself would
          # have path-filtered on, so there is no dependency on clone
          # depth or on merge-base resolution.
          # Both endpoints cap the file list they will return: 3000 for
          # a pull request, 300 for a comparison. A truncated list would
          # hide a code path behind a docs-only prefix, so the count is
          # compared against the cap below and a list at the cap runs
          # everything.
          case "$EVENT" in
            pull_request)
              cap=3000
              files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --paginate \
                        --jq '.[].filename') \
                || run_everything "could not list pull request files"
              ;;
            push)
              cap=300
              case "$BEFORE_SHA" in
                '' | 0000000000000000000000000000000000000000)
                  run_everything "push event has no usable base commit"
                  ;;
              esac
              files=$(gh api "repos/$REPO/compare/$BEFORE_SHA...$AFTER_SHA?per_page=100" --paginate \
                        --jq '.files[]?.filename') \
                || run_everything "could not compare $BEFORE_SHA...$AFTER_SHA"
              ;;
            *)
              run_everything "event '$EVENT' carries no diff"
              ;;
          esac

          if [ -z "$files" ]; then
            run_everything "changed-file list came back empty"
          fi

          printf '%s\n' "$files" > /tmp/changed-files.txt
          echo "changed files:"
          sed 's/^/  /' /tmp/changed-files.txt

          count=$(grep -c . /tmp/changed-files.txt || true)
          if [ "${count:-0}" -ge "$cap" ]; then
            run_everything "changed-file list has $count entries and may be truncated at the API cap of $cap"
          fi

          # Deny by executable extension first, and keep that arm FIRST.
          # Every arm below it is a directory grant that ends in
          # `continue`, so an extension listed after them would be
          # silently swallowed instead of denied. A directory cannot stay
          # inert as it grows: .wolf/ and .claude/ already hold hook
          # scripts, and any script or compiled source under an
          # allow-listed prefix is executable code that could change how a
          # build, test or lint behaves. The arm is not enumerated again in
          # this comment, because a second copy of the list is a second
          # thing to forget. Extension-deny needs no maintenance as those
          # directories grow, and still lets the genuinely inert paths
          # through (.wolf/*.md, .wolf/buglog.jsonl, docs/ screenshots).
          #
          # Allow-list: paths that cannot affect any build, test or lint
          # in this workflow. Keep it narrow. Adding an entry here weakens
          # the merge gate for every future pull request.
          #
          # Below, the loop also computes web_e2e, a second and much
          # narrower signal used only to gate the non-required web-e2e
          # job (issue #659 follow-up: four unrelated PRs, a migration
          # baseline script, a payments webhook cap, a decision ledger
          # amendment, and a reservation reaper, all ran the full browser
          # suite the same evening and collided on the shared Supabase
          # pool, issue #631). Unlike `run` above, this is an opt-in
          # allow-list: web_e2e starts false and only a path that can
          # actually reach the booted browser flow turns it true. That
          # is deliberately the opposite default from `run`, because
          # `run` gates required checks (a missed skip there would hide
          # a real regression) while web-e2e is not a required check, so
          # a missed skip here only costs CI minutes and pool
          # contention, not correctness. The categories, and why:
          #   - apps/web-console/*   the app under test, and its own
          #     Playwright specs (apps/web-console/e2e,
          #     apps/web-console/tests/e2e).
          #   - apps/edge-api/*, apps/control-plane/*   the two Go
          #     services this job builds via docker/bake-action and
          #     boots (deploy/docker/Dockerfile.edge-api,
          #     Dockerfile.control-plane) before Playwright runs.
          #   - packages/storage/*, packages/audit-canonical/*,
          #     packages/embedmodel/*, packages/sanitize/*   go.work
          #     members actually imported by edge-api and/or
          #     control-plane's non-test source (confirmed by grep, not
          #     assumed), so a change here changes the built images even
          #     though the path isn't under apps/.
          #     packages/dbtest is deliberately NOT in this list: it is
          #     imported only from _test.go files, and the Dockerfiles
          #     below build ./cmd/server, which never compiles tests, so a
          #     dbtest-only change cannot change what web-e2e boots.
          #   - go.work, go.work.sum   both Dockerfiles COPY these before
          #     resolving any module, so a workspace membership or
          #     replace-directive change can change what gets built even
          #     though the path isn't under apps/ or packages/.
          #   - deploy/docker/*   the compose files and Dockerfiles the
          #     job runs (`docker compose ... up`, docker-bake.hcl).
          #   - scripts/ci-throwaway-db.sh, scripts/ci-supabase-stack.sh
          #     the two the job runs to build its own database and its own
          #     GoTrue plus PostgREST before anything boots.
          #   - supabase/migrations/*   this job now APPLIES the chain
          #     itself, onto a throwaway Postgres, so a migration file is
          #     part of what the browser flow exercises. It used to be
          #     excluded here, correctly at the time, because the job ran
          #     against the shared project's already-live schema that a
          #     merged migration did not change until `supabase db push`.
          #     That is no longer true and the exclusion had to go with it.
          #   - .github/workflows/ci.yml   this file, so a change to the
          #     web-e2e job definition (or to this gate) proves itself
          #     by actually running, instead of the new wiring going
          #     untested the way the routing integration tests did
          #     before issue #655.
          run="false"
          web_e2e="false"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              *.js | *.mjs | *.cjs | *.jsx | *.ts | *.mts | *.cts | *.tsx \
              | *.sh | *.py)
                run="true"
                ;;
              *.md | LICENSE | NOTICE) : ;;
              docs/* | .wolf/* | .claude/* | .vscode/* | .cursor/*) : ;;
              *) run="true" ;;
            esac
            case "$f" in
              apps/web-console/* | apps/edge-api/* | apps/control-plane/* \
              | packages/storage/* | packages/audit-canonical/* \
              | packages/embedmodel/* | packages/sanitize/* | deploy/docker/* \
              | supabase/migrations/* | deploy/supabase/init/* \
              | scripts/ci-throwaway-db.sh | scripts/ci-supabase-stack.sh \
              | scripts/apply-migrations.sh | .github/ci/test-db-bootstrap.sql \
              | .github/workflows/ci.yml | go.work | go.work.sum)
                web_e2e="true"
                ;;
            esac
          done < /tmp/changed-files.txt

          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "web_e2e=$web_e2e" >> "$GITHUB_OUTPUT"
          if [ "$run" = "true" ]; then
            echo "verdict: RUN the real suite, a changed path is outside the docs-only allow-list"
          else
            echo "verdict: SKIP — every changed path is docs-only"
          fi
          if [ "$web_e2e" = "true" ]; then
            echo "web-e2e verdict: RUN, a changed path can affect the booted browser flow"
          else
            echo "web-e2e verdict: SKIP, no changed path can affect the booted browser flow"
          fi

  # ------------------------------------------------------------------
  # Unit-level jobs (run on every PR including forks)
  # ------------------------------------------------------------------

  go-tests:
    name: Go tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # REQUIRED CHECK. Always runs and always reports its own conclusion; the
    # docs-only decision is applied per step. See the note above `changes`.
    needs: changes
    if: always()
    # Ephemeral Postgres for HIVE_TEST_DB_URL-gated RLS suites (issue #311
    # follow-up). Version pin: no supabase/config.toml or other in-repo
    # pin exists, so this tracks Supabase's current default managed
    # Postgres major (17) as the closest available reference — bump this
    # tag if that default changes. pgvector/pgvector (not the plain
    # postgres image) because 20260625_01_enable_pgvector.sql needs the
    # vector extension pre-built; the image is otherwise a drop-in
    # postgres. Runs for every matrix leg (services: is job-level, not
    # matrix-scoped in GitHub Actions) but only control-plane/edge-api
    # actually use it below.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: edge-api
            path: ./apps/edge-api
          - module: control-plane
            path: ./apps/control-plane
          - module: budgetkeys
            path: ./packages/budgetkeys
          - module: storage
            path: ./packages/storage
          - module: sanitize
            path: ./packages/sanitize
          - module: agent-engine
            path: ./apps/agent-engine
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.run != 'false'

      - uses: actions/setup-go@v7
        if: needs.changes.outputs.run != 'false'
        with:
          go-version: '1.26'
          cache-dependency-path: |
            apps/edge-api/go.sum
            apps/control-plane/go.sum
            packages/storage/go.sum
            go.work.sum
            apps/agent-engine/go.sum

      - name: go vet
        if: needs.changes.outputs.run != 'false'
        working-directory: ${{ matrix.path }}
        run: go vet ./...

      - name: go test
        if: needs.changes.outputs.run != 'false'
        working-directory: ${{ matrix.path }}
        run: go test -count=1 -short -race -timeout 5m ./...

      # ------------------------------------------------------------------
      # Bootstrap the ephemeral Postgres above with the real schema
      # (supabase/migrations/, applied in order) plus a CI-only stand-in
      # for the Supabase-managed objects (roles, auth schema) those
      # migrations assume already exist on a real project. Only
      # control-plane and edge-api have HIVE_TEST_DB_URL-gated RLS suites;
      # the other two matrix legs skip this and the step below.
      #
      # Verified locally against a scratch pgvector/pgvector:pg17
      # container before wiring this in: the full migration chain applies
      # and every suite below passes for real, not skipped.
      # ------------------------------------------------------------------

      - name: Bootstrap live Postgres schema (control-plane, edge-api only)
        if: >-
          needs.changes.outputs.run != 'false' &&
          (matrix.module == 'control-plane' || matrix.module == 'edge-api')
        run: |
          set -euo pipefail
          dsn="postgresql://postgres:postgres@127.0.0.1:5432/hive_test?sslmode=disable"
          psql "$dsn" -v ON_ERROR_STOP=1 -f .github/ci/test-db-bootstrap.sql
          for f in supabase/migrations/*.sql; do
            psql "$dsn" -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "HIVE_TEST_DB_URL=$dsn" >> "$GITHUB_ENV"
          # Same ephemeral database, same full migration chain (including
          # 20260801_01_alias_pricing_correction.sql), read via the routing
          # package's own env var name (issue #655). Separate name from
          # HIVE_TEST_DB_URL because the integration test predates this
          # wiring and was never plumbed into any workflow; no reason to
          # rename it now that it is.
          echo "ROUTING_TEST_DB_URL=$dsn" >> "$GITHUB_ENV"
          # Same ephemeral database again, read via litellmconfig's own env
          # var name (issue #701). That suite predates this wiring too and
          # had never run anywhere: it was gated behind LITELLM_TEST_DB_URL,
          # which appeared nowhere under .github/, so a query against a
          # column that does not exist on provider_routes shipped and never
          # failed a single CI run.
          echo "LITELLM_TEST_DB_URL=$dsn" >> "$GITHUB_ENV"
          # Same ephemeral database again, read via catalog's own env var
          # name (issue #708). TestTenantVisibilityIntegration was gated
          # behind CATALOG_TEST_DB_URL, which appeared nowhere under
          # .github/, so it never ran; its fixture also hardcoded two
          # tenant UUIDs it never inserted into public.tenants, so it would
          # have failed its first real run on the FK from
          # tenant_model_visibility.tenant_id. Both are fixed by this PR.
          echo "CATALOG_TEST_DB_URL=$dsn" >> "$GITHUB_ENV"
          # Same ephemeral database again, read via providers' own env var
          # name (issue #708). TestProviderCRUDIntegration was gated behind
          # PROVIDERS_TEST_DB_URL, which appeared nowhere under .github/, so
          # it never ran; its fixture also omitted route_id (a text primary
          # key with no default) on its provider_routes insert, so it would
          # have failed its first real run on the not-null constraint. Both
          # are fixed by this PR.
          echo "PROVIDERS_TEST_DB_URL=$dsn" >> "$GITHUB_ENV"

      - name: go test — RLS suites against live Postgres (control-plane, edge-api only)
        if: >-
          needs.changes.outputs.run != 'false' &&
          (matrix.module == 'control-plane' || matrix.module == 'edge-api')
        working-directory: ${{ matrix.path }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.module }}" = "control-plane" ]; then
            # -tags integration additionally compiles in
            # routing/catalog_pricing_integration_test.go (issue #655),
            # litellmconfig/sync_integration_test.go (issue #701), and
            # catalog/catalog_integration_test.go +
            # providers/integration_test.go (issue #708), which carry a
            # //go:build integration constraint the other packages below do
            # not use; passing the tag is a no-op for them.
            # -p 1 forces packages to run sequentially rather than in
            # parallel across GOMAXPROCS (issue #708 review): several of
            # these suites (routing, catalog, providers) share one live
            # database and can observe each other's transient rows when run
            # concurrently, which is a flaky-collision risk, not a real bug.
            # ./internal/platform/db/... is here for
            # TestSessionPoolReleasesIdleConnections, which asserts on live
            # server backends and so needs HIVE_TEST_DB_URL. Listing it in the
            # -short step above instead would have skipped it silently, which
            # is the same never-runs trap as issues #701 and #708.
            # ./internal/platform (the package itself, not the tree) carries
            # the membership-status guards for IsPlatformAdmin and
            # IsWorkspaceOwner plus the tenant_users RLS suite. Both need a
            # live database, and neither ran anywhere before: the package was
            # absent from this list, so the escalation those guards catch
            # would have shipped again with the suite reporting green.
            # tools/lint-go-db-test-wiring.mjs fails if either is dropped.
            # ./internal/accounting/... carries the credit-reservation
            # settlement suites. Its two HIVE_TEST_DB_URL-gated tests, the
            # release-key dedup proof (issue #652) and the settlement magnitude
            # proof (issue #616), had never run anywhere: the package was absent
            # from this list and the -short step above skips them for want of
            # the env var. The magnitude one is the only check that measures the
            # ledger on real Postgres rather than through a fake, so leaving it
            # unlisted is the same never-runs trap as issues #701 and #708, on
            # the money path.
            # ./internal/ledger/... joins the list with issue #918: its balance
            # query is the only place an over-released reservation can be caught,
            # and the proof that it no longer renders one as a hold has to run
            # against real Postgres.
            # ./internal/budgets/... joins with #1142: its spend aggregation,
            # threshold re-arm, tenant-isolation and cron retry suites are
            # DB-gated and would otherwise never execute in CI.
            # ./internal/byok/... carries the tenant-isolation proof for
            # tenant_provider_keys: the unit suite's fake repository
            # re-implements the WHERE account_id predicate itself, so only real
            # SQL can catch a dropped filter or a swapped scan column. It was
            # invisible to tools/lint-go-db-test-wiring.mjs because the suite
            # read its DSN through a const rather than a bare
            # os.Getenv("HIVE_TEST_DB_URL"); the literal is back, so dropping
            # the package from this list now fails that guard.
            # ./internal/marketplace/..., ./internal/usage/... and
            # ./internal/tenant/... join with issue #708: all three were
            # `#797 backlog, never executed` in tools/lint-go-db-test-wiring.mjs's
            # KNOWN_DARK map (usage carries the request-attempt idempotency
            # proof; marketplace carries its CRUD, RLS and FK-violation
            # suite; tenant/settings' entire package reported 0.0% coverage
            # because every one of its resolver tests goes through the one
            # helper this wiring turns on). Removed from KNOWN_DARK in the
            # same change, since the lint fails if a package both runs and
            # stays listed as debt.
            # 2026-08-26 un-skip pass (owner-directed coverage audit): audit,
            # auditarchive, auditverifier, auditworker, licensing and
            # tests/compliance join this step's package list. Their DSN gates
            # now fail loudly in CI instead of skipping silently, and their
            # suites run against real Postgres for the first time; a suite
            # that has never run is not known to pass, which is exactly what
            # this step proves.
            # ./internal/grants/... joins with issue #1659: a discretionary
            # grant writes a taka amount and a credit amount into two columns
            # in one transaction, and only real SQL can catch the two being
            # swapped back into one unit. The package's other suites go through
            # a fake repository and never reach that write at all, which is how
            # the defect survived them.
            go test -tags integration -count=1 -p 1 -v ./internal/accounts/... ./internal/accounting/... ./internal/grants/... ./internal/audit/... ./internal/auditarchive/... ./internal/auditverifier/... ./internal/auditworker/... ./internal/licensing/... ./tests/compliance/... ./internal/budgets/... ./internal/byok/... ./internal/ledger/... ./internal/agentsched/... ./internal/agenttask/... ./internal/usermemories/... ./internal/egress/... ./internal/payments/... ./internal/profiles/... ./internal/rag/... ./internal/tenants/... ./internal/signup/... ./internal/routing/... ./internal/litellmconfig/... ./internal/catalog/... ./internal/providers/... ./internal/platform ./internal/platform/db/... ./internal/marketplace/... ./internal/usage/... ./internal/tenant/...
          else
            # -tags integration additionally compiles in
            # inference/chat_completions_integration_test.go (issue #708),
            # which needs no DB (it mocks LiteLLM and control-plane with
            # httptest) and never ran purely because this step never passed
            # the tag. ./internal/chat/... and ./internal/auth/... carry
            # HIVE_TEST_DB_URL-gated tests that ran neither here nor in the
            # plain `go test ./...` step above (that step excludes them via
            # -short/skip, this step simply never included the packages);
            # both are now wired for real.
            go test -tags integration -count=1 -p 1 -v ./internal/artifacts/... ./internal/rag/... ./internal/chat/... ./internal/auth/... ./internal/inference/...
          fi

  # ------------------------------------------------------------------
  # Rust tests — desktop sandbox backends (issue #306). Toolchain version
  # comes from apps/desktop-sandbox/rust-toolchain.toml; ubuntu-latest ships
  # rustup preinstalled, which reads that file automatically from the
  # working directory below. Intended to become a required check once this
  # job has a track record on main (see VENDORING.md).
  # ------------------------------------------------------------------

  rust-tests:
    name: Rust tests (desktop-sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.run == 'true'
    defaults:
      run:
        working-directory: apps/desktop-sandbox
    steps:
      - uses: actions/checkout@v7

      - name: Install libcap headers
        # codex-bwrap's build.rs compiles vendored bubblewrap against libcap.
        run: sudo apt-get update && sudo apt-get install -y libcap-dev pkg-config

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop-sandbox/target
          key: rust-desktop-sandbox-${{ hashFiles('apps/desktop-sandbox/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      # windows.rs is #[cfg(windows)]-gated, so the Linux legs above never
      # compile it. Cross-compile the crate to x86_64-pc-windows-gnu so the
      # Win32 FFI is actually type-checked against windows-crate 0.58's real
      # signatures on every PR (a broken call shape now fails CI instead of
      # only surfacing on a Windows host). `cargo check`/`clippy` do not link,
      # so no MinGW linker is needed; adding the target's std is enough. Scoped
      # to -p hive-desktop-sandbox to skip the vendored bwrap C build. MSVC is
      # not cross-checkable here (no linker); see VENDORING.md open risk #2.
      #
      # -p codex-windows-sandbox is included from Step 3 Wave 1 onward: its
      # vendored modules are ALSO #[cfg(windows)]-gated (see its lib.rs) and
      # need the same cross-compile to be exercised at all in CI.
      - name: Add Windows cross target
        run: rustup target add x86_64-pc-windows-gnu

      - name: cargo check (Windows FFI cross-compile)
        run: cargo check --target x86_64-pc-windows-gnu -p hive-desktop-sandbox -p codex-windows-sandbox

      - name: cargo clippy (Windows FFI cross-compile)
        run: cargo clippy --target x86_64-pc-windows-gnu -p hive-desktop-sandbox -p codex-windows-sandbox -- -D warnings

  # ------------------------------------------------------------------
  # Desktop app (Tauri shell, issue #310/#311). Toolchain version comes
  # from apps/desktop/src-tauri/rust-toolchain.toml, same auto-detect as
  # the desktop-sandbox job above. System libs mirror
  # deploy/docker/Dockerfile.desktop-linux (Tauri needs GTK/WebKit
  # headers to build on Linux even for `cargo test`, not just packaging).
  # ------------------------------------------------------------------

  desktop-tests:
    name: Desktop app (Rust + TS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install GTK/WebKit headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: rust-desktop-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: cargo fmt --check
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Type check
        working-directory: apps/desktop
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        working-directory: apps/desktop
        run: npm run test:unit

      - name: Build (vite)
        working-directory: apps/desktop
        run: npm run build

  # ------------------------------------------------------------------
  # Repo-policy lints — tenancy + audit guards that apply across the
  # whole tree. Each script lives under tools/ and is the source of
  # truth for which packages are allowed to write the protected
  # surfaces (audit_log, tenant_settings, raw tenant_id). Previously
  # only fired in the phase-19 workflow; promoted here so every PR
  # benefits regardless of which area it touches.
  # ------------------------------------------------------------------

  repo-policy-lints:
    name: Repo policy lints (tenant + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # REQUIRED CHECK. Always runs and always reports its own conclusion; the
    # docs-only decision is applied per step. See the note above `changes`.
    # One step is deliberately exempt from that decision, `lint:proof-tokens`
    # below, and the three setup steps it needs are exempt with it.
    needs: changes
    if: always()
    steps:
      # Ungated, along with setup-node and the install below, so that
      # `lint:proof-tokens` further down can run on a docs-only pull request.
      # See the comment on that step for why.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install repo-level dev deps
        run: npm ci --ignore-scripts

      # Merge-gate integrity: exactly one job may publish each required
      # check name, and every required context must have a producer.
      # Lives in this job because it is a required check itself, so the
      # guard cannot be bypassed by a change that only touches workflows.
      - if: needs.changes.outputs.run != 'false'
        run: node .github/ci/lint-workflow-check-names.mjs

      # Deploy path-filter coverage: every COPY/ADD source in every
      # deploy/docker/Dockerfile.* must have a matching entry in
      # deploy-demo-box.yml's push.paths, or a merge to main that only
      # touches that source ships silently to nowhere. Lives here for the
      # same reason lint-workflow-check-names.mjs does: this job is a
      # required check, so the guard cannot be bypassed by a change that
      # only touches workflows or Dockerfiles.
      - if: needs.changes.outputs.run != 'false'
        run: node .github/ci/lint-deploy-paths-filter.mjs

      # Deploy tracking-issue reporter symmetry (issue #1416).
      # deploy-demo-box.yml dedupes every red run onto one open issue, so a
      # stale open issue swallows the next unrelated outage as a comment.
      # Nothing closed that issue on recovery until #1416, and #1416 itself sat
      # open through twenty-one green runs still claiming a migration had
      # failed. This asserts the file half and the close half exist, share a
      # label, and watch the same jobs. Lives here for the same reason
      # lint-deploy-paths-filter.mjs above does: a workflow-only change must
      # not be able to remove a deploy guard without a required check noticing.
      - if: needs.changes.outputs.run != 'false'
        run: node .github/ci/lint-deploy-failure-reporter.mjs

      # Regression guard for deploy-drift-watchdog.yml's grace-window
      # freshness check. Before this test existed, that check read main's
      # tip commit date instead of the newest covered commit's date, so an
      # unrelated uncovered commit landing shortly after a genuinely stale
      # covered commit reset the apparent freshness and masked real drift
      # (PR #1249 and PR #1246 merging 8 seconds apart is the shape that
      # exposed it). Wired here, in a required check, for the same reason
      # lint-deploy-paths-filter.mjs above is: a workflow-only change must
      # not be able to reintroduce this without CI noticing.
      - if: needs.changes.outputs.run != 'false'
        run: node .github/ci/newest-covered-commit.test.mjs

      # Regression guard for the set-compose-project-name.sh --check
      # collision detector (issue #1242). No docker daemon needed: it stubs
      # `docker` on PATH with a fake `ps` line.
      - if: needs.changes.outputs.run != 'false'
        run: bash scripts/test-set-compose-project-name.sh

      # Regression guards for the off-box backup staleness check (issue #1491).
      # The first proves the checker's own negative controls (a stale marker, an
      # absent marker and a future-dated one all fail, and the failure names the
      # script to run) and that deploy-drift-watchdog.yml still invokes it, so
      # deleting the check turns this required job red. The second proves the
      # marker is written only after a verified pull, which is the whole
      # property: a marker written ahead of its evidence would be one more
      # surface asserting a state the system does not have. Neither touches the
      # network, the box or GitHub; both stub their dependencies on PATH.
      - if: needs.changes.outputs.run != 'false'
        run: node .github/ci/check-offbox-backup-freshness.test.mjs

      - if: needs.changes.outputs.run != 'false'
        run: bash scripts/test-pull-box-backups.sh

      # Regression guard for deploy-demo-box.yml's pre-build disk gate
      # (issue #1098). Also stubs its dependencies on PATH, so no docker
      # daemon and no real filesystem are involved. Wired here for the same
      # reason as the two guards above: this job is a required check, so a
      # workflow-only change cannot quietly invert a comparison in the one
      # disk guard a job timeout is unable to skip.
      - if: needs.changes.outputs.run != 'false'
        run: bash scripts/test-deploy-disk-gate.sh

      # Regression guard for the profile-eviction step deploy-demo-box.yml runs
      # against the live box (issue #967). Stubs `docker` on PATH, so no daemon
      # is involved. Wired here for the same reason as the guards above: this
      # job is a required check, and the two ways that step can go wrong are
      # both silent, either leaving a profile-gated `next dev` console serving
      # an unauthenticated LAN surface, or removing a live service on a box
      # with no off-box backup.
      - if: needs.changes.outputs.run != 'false'
        run: bash scripts/test-remove-stale-compose-containers.sh

      # Regression guard for install-agent-engine-host.sh's restart decision
      # (issue #921). That script runs on every merge to main, and stopping the
      # launcher unit kills the apptainer child holding every in-flight Cowork
      # session, so restarting it when nothing about the launcher changed
      # terminally failed every running task on an unrelated deploy. The guard
      # models `stop` as destructive, which is what KillMode=control-group
      # actually is, so a script that goes back to restarting unconditionally
      # fails here rather than on the box. Stubs apptainer, docker, systemctl,
      # systemd-run and curl on PATH, same trick as the guards above.
      - if: needs.changes.outputs.run != 'false'
        run: bash scripts/test-agent-engine-restart-gate.sh

      # Regression guard for the agent-engine launcher health probe (issue
      # #1510). Every way that probe can be wrong is the same shape, silence
      # when it should be loud: reporting healthy against a wedged daemon,
      # advancing its own last-success stamp on a failed run so the staleness
      # arm goes permanently blind, or aborting on a corrupt stamp and taking
      # the whole watchdog offline without saying so. None of those would show
      # up on the box until the day they mattered. Stubs systemctl and curl on
      # PATH, same trick as the guard above.
      - if: needs.changes.outputs.run != 'false'
        run: bash scripts/test-agent-engine-health-probe.sh

      # Regression guard for the PreToolUse guards in .claude/hooks/. It
      # feeds each guard both harness payload shapes plus Claude Code's
      # MultiEdit shape, which nests its edit array at `tool_input.edits`
      # rather than at the top level. The secrets scanner read only the
      # top-level array, so it scanned an empty string on every MultiEdit
      # and exited clean on a write it had never seen (issue #1333). The
      # self-check existed before that bug and did not catch it because
      # nothing ran it, so it is wired into a required check here.
      - if: needs.changes.outputs.run != 'false'
        run: node .claude/hooks/hooks.selfcheck.js

      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:tenant-setting
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:tenant-id
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:audit-write
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:desktop-local-http
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:request-url-origin
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:model-visibility
      # NOT gated on the docs-only decision, and the only step in this job
      # that is not. Issue #1409.
      #
      # tools/lint-no-token-in-proof-captures.mjs scans docs/proof/ and
      # nothing else, and docs/ is on the inert-path allow-list that sets
      # `run=false`. So the one guard whose entire purpose is scanning proof
      # captures disabled itself on the only pull-request shape that adds
      # them. PR #1398 committed seventy-one captures and this job reported
      # pass in six seconds, having executed nothing. A gate that switches
      # off for its own subject matter is worse than no gate, because the
      # green it publishes is one a reviewer trusts.
      #
      # This is the whole of the automated defence for that half of a
      # capture. GitHub secret scanning, push protection and GitGuardian do
      # not read a release asset and read no pixels at all, and PR #578
      # leaked four live invitation tokens through exactly this path.
      #
      # Ungating the step rather than carving docs/proof/** out of the
      # docs-only classification, because the carve-out would run the whole
      # heavy suite over a pull request of screenshots, and rather than
      # adding a `changes` output for docs/proof/**, because that copies the
      # scanner's scope into this file where it can drift. The scanner walks
      # the committed tree, not the diff, so running it unconditionally also
      # covers a capture that landed earlier and was never scanned.
      - run: npm run lint:proof-tokens
      # formatUsdBalanceFromCredits is hand-duplicated across the console and
      # the chat front end, which are separate builds whose test suites cannot
      # see each other's copy. It drifted twice that way (#1344, #1345), each
      # time with both suites green. This is the only place both files are
      # readable at once.
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:credits-parity
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:litellm-routing
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:pgx-dsn
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:litellm-config
      # Issue #1059. Six workflows configured themselves from the SUPABASE_*
      # repository secrets, which name the hosted project deleted in the move
      # to the self-hosted data plane. Two of them failed loudly for four days,
      # three were gated off and silently misconfigured, and the sixth was
      # GREEN while shipping the dead origin in a Cloudflare Workers bundle.
      # Nothing structural stopped the next workflow adopting them by copy
      # paste, which is how there came to be six.
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:dead-supabase-secrets
      # Issue #1088. The live-integration job set HIVE_TEST_MODEL, the SDK
      # suites read it, and the compose services forwarded nothing, so the knob
      # meant to keep a merge-gate check off the live demo's provider budget
      # was wired to nothing for a month while every run reported green. This
      # fails when a suite reads a HIVE_* variable that neither its compose
      # service nor its image provides.
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:sdk-test-env
      # A synchronous child process in a Playwright spec freezes the worker's
      # event loop, so no test timeout in that file can fire while it runs.
      # PR #838 found a test recorded as passed at 30194 ms under a 30000 ms
      # timeout. Runs here, in a required check, rather than in web-unit,
      # because it needs nothing but node and must fire on every PR.
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:sync-child-process
      # Issues #1084, #1103. deploy-demo-box.yml is the whole of DEMO.md's
      # promise that a merge to main reaches the box within minutes, and it
      # broke in ways the run itself could not explain: the only diagnostic
      # step sat mid-list so six later steps failed blind, `up -d --build`
      # reported success without anything asserting what the box now serves,
      # and the smoke test threw away the status codes that would have told a
      # 503 apart from a dead host. Guarded here because a required check is
      # the only place a workflow-only change cannot route around.
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:deploy-diagnosability
      # Issue #1610. docker-compose.enterprise.yml made WEBUI_SECRET_KEY a
      # required variable, correctly (issue #1602), and compose interpolates
      # the merged config before it runs any subcommand. post-deploy-verify.yml
      # merges that file and supplied no value, so its image-freshness step got
      # no container ids back and went red on every deploy from the next day,
      # reporting "no running containers matched these compose flags" for what
      # was a missing variable. Guarded here because both halves of the break
      # are workflow-and-compose-only, which no test suite reaches.
      #
      # Self-check first, the same order lint:go-db-test-wiring uses. A
      # CodeRabbit pass on the pull request that added this lint found that its
      # shell-assignment arm counted `# NAME=value` inside a COMMENT, so a
      # workflow could name the variable in prose, supply compose with nothing
      # and still be reported compliant. The fixture pins that case and four
      # others, including that an empty intersection fails rather than passes.
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:compose-required-vars:test
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:compose-required-vars
      # Drive-by, found while checking the wiring above: this lint existed in
      # package.json but no workflow ran it, so it was coverage on paper only.
      # It passes on main today.
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:no-client-cost-fields

      # Issue #813, spec wiring. Moved to web-unit (see that job): asking
      # Playwright which projects a config declares needs the web console's
      # own node_modules, which this dependency-light job deliberately does
      # not install.

      # Issue #659, #797. A Go package carrying a database-gated test skips
      # silently when it is absent from the RLS step's package list, which is
      # how the platform package went from never running to green in one line.
      # Fixture regression test: two matrix legs, one shell `if` with no
      # `else` wrapping a single go test line, so only one leg's package is
      # actually reached. The other leg's DSN-gated package must be reported
      # unpaired, not credited via the directory the wrapped line shares with
      # every leg regardless of the branch that selects it.
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:go-db-test-wiring:test
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:go-db-test-wiring

      # Self-checks for the provisioning scripts (pure python, no network, no
      # framework). Wired into CI here because nothing ran them before: the
      # `make test-scripts` target existed but no workflow invoked it, so every
      # guard in scripts/test_seed_*.py was coverage on paper only. That is what
      # let the OWUI shim seed ship without a tenant_billing_accounts mapping
      # (issue #717). This job is a required check and already runs on every
      # non-docs change, and python3 is preinstalled on ubuntu-latest.
      - if: needs.changes.outputs.run != 'false'
        run: make test-scripts

      # Every Caddyfile has to ADAPT, not merely read correctly.
      #
      # This repo pins several load-bearing properties of these files with
      # structural checks (test_caddy_owui_blocklist.py,
      # test_caddy_supabase_routes.py, test_caddy_console_auth_origin.py), and
      # all of them parse the file as text. None of them can know what Caddy
      # will accept. `handle` takes exactly one matcher token, so
      # `handle /auth/v1 /auth/v1/*` is a parse error, and it passed every one
      # of those checks before crash-looping the container on the box with
      # "wrong argument count or unexpected line ending".
      #
      # The deploy workflow already validates before it reloads, so that
      # failure was loud. It was loud AFTER merge, which is the gap this closes.
      # It lives in this job rather than a new one on purpose: this job is a
      # required check, and a new non-required job's failure is invisible.
      #
      # Same pinned image the four Caddy services run, so what is validated
      # here is what will parse it there. `--config -` on stdin, so the
      # container needs no mount.
      - if: needs.changes.outputs.run != 'false'
        name: Every Caddyfile adapts
        run: |
          set -euo pipefail
          image='caddy:2-alpine@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794'
          for f in deploy/docker/Caddyfile.*; do
            echo "validating $f"
            docker run --rm -i --entrypoint caddy "$image" \
              validate --config - --adapter caddyfile < "$f"
          done

      # The Hive authored half of the vendored chat front end. Same reason as
      # the step above: nothing ran these. `test:frontend` in that package is
      # referenced only by an upstream workflow file this repository never
      # executes, so the sign in redirect decision, the one piece of that front
      # end that can lock every user out, had no pre-merge check on it. The
      # script copies the directory out and runs a pinned vitest, because
      # running it in place would need a full npm install of the chat front end.
      - if: needs.changes.outputs.run != 'false'
        run: make test-owui-frontend

  agent-console-unit:
    name: Agent console (type + unit + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.run == 'true'
    defaults:
      run:
        working-directory: apps/agent-console
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/agent-console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Build (Next.js)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  web-unit:
    name: Web console (type + unit + build)
    runs-on: ubuntu-latest
    # `issues: read` on top of the workflow default, for the exclusion expiry
    # check in tests/interaction/gate-integrity.test.ts. It asks the tracker
    # whether the issue an exclusion cites is still open, and the default token
    # answers 403 without this, which the check reports as a failure rather
    # than swallowing: an unanswered question about an exclusion is not a pass.
    permissions:
      contents: read
      issues: read
    timeout-minutes: 15
    # REQUIRED CHECK. Always runs and always reports its own conclusion; the
    # docs-only decision is applied per step. See the note above `changes`.
    needs: changes
    if: always()
    defaults:
      run:
        working-directory: apps/web-console
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.run != 'false'

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.run != 'false'
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/web-console/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.run != 'false'
        run: npm ci

      - name: Type check
        if: needs.changes.outputs.run != 'false'
        run: npx tsc --noEmit

      # Every Playwright spec must still land in the project the manifest pins
      # it to. Catches a spec that fails to load (the listing exits non-zero), a
      # testDir/testMatch edit that quietly stops matching a file, and a new
      # spec no project collects. Needs no browsers, no stack and no secrets.
      - name: Spec collection guard
        if: needs.changes.outputs.run != 'false'
        run: npm run e2e:verify-collection

      # Issue #813, camouflage shape 14. A Playwright spec that no workflow
      # runs emits no signal at all, and one that only a nightly runs
      # protects nothing on the merge path. Moved here, not left in
      # repo-policy-lints: it asks Playwright directly which projects a
      # config declares (see tools/verify-spec-wiring.mjs's projectsOf),
      # rather than trusting a hand-maintained copy that went stale under
      # PR #799 and produced a false positive. That needs this job's own
      # node_modules (Playwright installed), which repo-policy-lints
      # deliberately does not carry. Fixture regression test for the
      # event-condition classifier runs first, in a check that names the
      # case, rather than as a silently wrong count in the guard below.
      # tools/verify-spec-wiring.mjs parses workflow YAML with the root
      # devDependency 'yaml'. This job's only other install is the
      # apps/web-console one above, set by defaults.run.working-directory, so
      # without this the guard dies on ERR_MODULE_NOT_FOUND. The sibling
      # root-scoped steps below survive because they import nothing.
      - name: Install repo-level dev deps
        if: needs.changes.outputs.run != 'false'
        working-directory: .
        run: npm ci --ignore-scripts

      - name: Spec wiring guard test
        if: needs.changes.outputs.run != 'false'
        working-directory: .
        run: npm run lint:spec-wiring:test
      - name: Spec wiring guard
        if: needs.changes.outputs.run != 'false'
        working-directory: .
        run: npm run lint:spec-wiring

      # Coverage is advisory in this job: the v8 provider has no thresholds
      # configured, so the summary line informs without gating anything. This
      # step replaces the plain unit run instead of adding a second one.
      #
      # GITHUB_TOKEN is read by tests/interaction/gate-integrity.test.ts, which
      # asks the issue tracker whether any exclusion still cites an open issue.
      # An exclusion whose blocker closed is a permanent blind spot, and the
      # only authority on "closed" is the tracker, so without a token that check
      # cannot run. It fails rather than skipping when CI is set.
      - name: Unit tests with coverage summary (advisory)
        if: needs.changes.outputs.run != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run test:coverage

      - name: Build (Next.js)
        if: needs.changes.outputs.run != 'false'
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - name: Lint — no bare role checks outside authz package
        if: needs.changes.outputs.run != 'false'
        working-directory: .
        run: node packages/openai-contract/scripts/lint-no-bare-role-check.mjs apps/control-plane/internal

      - name: Codegen drift — permissions.generated.ts
        if: needs.changes.outputs.run != 'false'
        working-directory: .
        run: |
          make gen-permissions
          git diff --exit-code apps/web-console/lib/control-plane/permissions.generated.ts

  # ------------------------------------------------------------------
  # Docker build validation — fork PRs only.
  # Same-repo PRs get this implicitly via the live-integration job
  # (which builds + runs the stack against staging), so running both
  # would duplicate work and waste CI minutes.
  # ------------------------------------------------------------------

  docker-build:
    name: Docker build smoke (fork PRs only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: >-
      needs.changes.outputs.run == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build all service images (cached)
        uses: docker/bake-action@v7
        with:
          source: .
          files: |
            ./deploy/docker/docker-bake.hcl
          targets: edge-api,control-plane,web-console
          set: |
            *.cache-from=type=gha,scope=docker-build
            *.cache-to=type=gha,scope=docker-build,mode=max

  # ------------------------------------------------------------------
  # markitdown-sidecar (PR #1077): builds the pinned conversion sidecar
  # image and runs its committed container test suite (synthetic PDF +
  # DOCX fixtures over the real HTTP surface) inside that image. Gated on
  # the same run flag as the heavy jobs so it skips docs-only PRs.
  # ------------------------------------------------------------------

  markitdown-sidecar:
    name: Markitdown sidecar (build + convert fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Build sidecar image
        run: docker build -f deploy/docker/markitdown/Dockerfile -t hive-markitdown:ci .
      - name: Run container test suite
        run: docker run --rm hive-markitdown:ci python /app/test_convert.py

  # ------------------------------------------------------------------
  # Live integration — builds images once with GHA cache, loads them
  # locally, starts stack against staging Supabase, runs all three SDK
  # suites in parallel.
  # Gated on same-repo only so fork PRs never receive secrets.
  # ------------------------------------------------------------------

  live-integration:
    name: Live integration (SDK tests + smoke)
    runs-on: ubuntu-latest
    # 35, matching web-e2e, because this job took on the same added work: the
    # same bounded psql fallback, a container start, and the full migration
    # chain. Measured on run 32378996099 the whole job was 3m43s and the
    # database step 17 seconds, so this is tail headroom rather than routine
    # need. Leaving it at 30 while web-e2e went to 35 would mean the one job
    # that pays for real provider completions is also the one that gets
    # cancelled first on a degraded runner, with an empty step log to read.
    timeout-minutes: 35
    # Run on push to main (post-merge gate), on the daily cron, or on PRs that
    # carry the run-live-integration label. The label gate lets contributors
    # explicitly opt in without spending a provider allowance on every PR.
    # Every trigger now calls the same alias; see HIVE_TEST_MODEL below.
    # Fork PRs are excluded: GitHub does not expose secrets to fork
    # runners on pull_request events, so no secret can leak.
    if: >-
      needs.changes.outputs.run == 'true' &&
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'run-live-integration')))
    needs: [changes, go-tests, web-unit]
    permissions:
      contents: read
      issues: write
    # Job-level env: docker compose will interpolate ${VAR} from process env,
    # so we skip the fragile .env heredoc entirely.
    env:
      # Activate the in-stack docker redis (gated to the `local` profile in
      # docker-compose.yml so staging never accidentally starts a docker
      # redis). Setting COMPOSE_PROFILES at the job level so every
      # `docker compose <subcommand>` invocation in this job — up, ps,
      # logs, down — sees the profile.
      COMPOSE_PROFILES: local
      # Deliberately literal placeholders, not the SUPABASE_* repository
      # secrets. Those secrets name the hosted project that was deleted in the
      # move to the self-hosted data plane (issue #1059), so reading them here
      # configured this job against a project that does not exist.
      #
      # Nothing in this job calls the Supabase HTTP surface. It seeds its own
      # API key on its own throwaway Postgres in the step below, and the SDK
      # suites authenticate with that `hk_` key, never with a user session, so
      # GoTrue is never reached. The two services still require the variables
      # to be set at boot, which is all these satisfy. Same values the web
      # unit and build jobs in this file already use for the same reason.
      #
      # If a suite here ever does need a real Supabase, the route is
      # scripts/ci-supabase-stack.sh (as the web-e2e job does), not a shared
      # secret: an unresolvable placeholder fails immediately and names itself,
      # where a stale project answers DNS and fails three steps later.
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      REDIS_URL: redis://redis:6379/0
      CONTROL_PLANE_PORT: '8081'
      CONTROL_PLANE_BASE_URL: http://localhost:8081
      EDGE_CONTROL_PLANE_BASE_URL: http://control-plane:8081
      LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Free pool key slots; hive-free (the default HIVE_TEST_MODEL) fails over
      # across all four deployments, so each slot must reach the litellm
      # container.
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # The internal token control-plane requires on POST /internal/litellm/sync,
      # which the step below calls to derive LiteLLM's serving config from the
      # migration-seeded catalog exactly the way a deploy does. This job sets no
      # other value and compose defaults the variable to this same literal, so
      # pinning it here keeps the sync call and the container in agreement
      # without introducing a new secret.
      CONTROL_PLANE_INTERNAL_TOKEN: hive-local-internal-token
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      # Which alias the token-consuming SDK suites call, and therefore which
      # provider account this job bills. Issue #1088.
      #
      # What was here before was a per-event ternary that read as "free model
      # on pull requests, paid fidelity on push and cron" and was dead three
      # times over. Both branches of the HIVE_TEST_MODEL ternary evaluated to
      # hive-default; the value never reached the suites at all, because the
      # sdk-tests compose services forwarded nothing (fixed in
      # deploy/docker/docker-compose.yml, guarded by
      # tools/lint-sdk-test-env-propagation.mjs); and the variable the ternary
      # actually switched, OPENROUTER_DEFAULT_MODEL, is documented UNUSED in
      # .env.example after its consumer route-openrouter-default was deleted by
      # the 2026-08-22 catalog restructure.
      #
      # That restructure is what made it matter: it moved hive-default from
      # OpenRouter onto Groq, so every run of this job since then has spent the
      # live demo box's Groq free-tier DAILY token budget (limit 200000, shared
      # across the organization, hard cliff). On 2026-08-23 that budget ran out
      # and a required check on main went red for a reason no commit caused,
      # while the demo answered nothing.
      #
      # deepseek-v4-pro is an existing public alias pinned to
      # route-deepseek-v4-pro on OpenRouter, a DIFFERENT provider account
      # whose limit is prepaid credit rather than a daily token cliff.
      # deepseek-v4-flash was tried first and rejected on evidence: its slug
      # (~deepseek/deepseek-v4-flash-latest) is an unpinned OpenRouter router
      # whose upstreams disagree about the OpenAI contract under
      # response_format json_object. Across probes and the CI run of this
      # branch it returned message.content as a parsed JSON object (run
      # 32665985618), as null, and as string on different calls, so no strict
      # assertion can survive it. deepseek-v4-pro-0813 is date-pinned, returns
      # content as a string every time, and answers forced tool_choice with a
      # real tool_calls shape (probed live 2026-08-23 through the demo box's
      # LiteLLM). It costs more per completion than flash but a whole suite
      # run stays in single-digit cents, bounded by the token ceiling below. A
      # second Groq key would not have helped: the limit is per
      # organization, not per key.
      #
      # Fidelity consequence, stated rather than buried: this check no longer
      # exercises the Groq gpt-oss-20b route the demo serves chat from. A
      # Groq-specific regression is caught by the sdk-replay job in
      # deploy-demo-box.yml, which runs these same suites against the live box
      # on hive-default after every deploy and is deliberately left alone. The
      # "Declare which provider account this run bills" step below prints this
      # every run so it is never an unstated assumption.
      #
      # Set the CI_LIVE_INTEGRATION_MODEL repository variable to point this
      # anywhere else (a paid alias for a higher-fidelity run, say) without
      # touching this file.
      #
      # Default is hive-free, the free pool alias (migration
      # 20260824_02_free_pool_router.sql): automated consumption belongs on the
      # load-balanced pool of our own free provider keys, not on a paid tier or
      # on whichever single provider happens to serve the demo today.
      HIVE_TEST_MODEL: ${{ vars.CI_LIVE_INTEGRATION_MODEL || 'hive-free' }}
      # Capability-specific tests (tools, response_format) in the JS
      # chat-completions suite. hive-free serves these as of
      # supabase/migrations/20260830_03_free_pool_capability_truth.sql.
      #
      # It could not before, and the reason was a placeholder rather than a
      # finding: all four pool members were seeded tools_supported=false because
      # cross-member parity had never been probed (#1115), and that column gates
      # response_format as well as tools, so the edge answered its own 400 here
      # (run 32736430913). The members were then measured. The pool is now the
      # two Groq key slots on qwen/qwen3.8-27b, both live-probed for forced tool
      # calls and for strict json_schema, under one LiteLLM group. The members
      # that could not be measured to that bar were removed rather than claimed
      # for, which is what makes the flag true whichever member answers.
      #
      # hive-free is upstream-free, so this also satisfies the owner directive
      # of 2026-08-30 that no CI pipeline may call a paid completion model. It
      # replaces hive-small, which satisfied that directive too but is a paid
      # alias's neighbour rather than the free pool D-047 names for automated
      # consumption.
      #
      # Enforced by TestNoCISurfaceCallsAPaidCompletionModel
      # (apps/control-plane/internal/routing/ci_paid_model_guard_integration_test.go),
      # which resolves every model value in CI through the seeded catalog and
      # fails on any paid completion alias. Same override pattern as
      # HIVE_TEST_MODEL, and an override that names a paid alias is caught by
      # that guard rather than by a list of forbidden names here.
      HIVE_TOOLS_MODEL: ${{ vars.CI_LIVE_INTEGRATION_TOOLS_MODEL || 'hive-free' }}
      # The suites' own default, named here rather than left implicit, because
      # the spend meter below asserts that no alias outside these is ever
      # billed by this job.
      HIVE_EMBEDDING_MODEL: hive-embedding-default
      # The three aliases the image and voice suites resolve into. Named here
      # for the same reason as the line above: the spend assertion below is a
      # closed list, and a suite that bills an alias this workflow never chose
      # is the failure mode that assertion exists to catch. Left at the
      # compose defaults; these are the only aliases in the catalog carrying
      # the image, tts and stt capabilities at all.
      HIVE_IMAGE_MODEL: hive-auto
      HIVE_TTS_MODEL: hive-tts
      HIVE_STT_MODEL: hive-stt
      # Nothing reads this. It is passed only because docker-compose.yml
      # interpolates it into the litellm service's environment, and an unset
      # variable there is a compose warning on every invocation. See
      # .env.example, which documents it as UNUSED.
      OPENROUTER_DEFAULT_MODEL: ${{ vars.OPENROUTER_DEFAULT_MODEL }}
      OPENROUTER_AUTO_MODEL: ${{ vars.OPENROUTER_AUTO_MODEL }}
      OPENROUTER_FAST_FALLBACK_MODEL: ${{ vars.OPENROUTER_FAST_FALLBACK_MODEL }}
      OPENROUTER_EMBEDDING_MODEL: ${{ vars.OPENROUTER_EMBEDDING_MODEL }}
      OPENROUTER_EMBEDDING_FALLBACK_MODEL: ${{ vars.OPENROUTER_EMBEDDING_FALLBACK_MODEL }}
      GROQ_FAST_MODEL: ${{ vars.GROQ_FAST_MODEL }}
      GROQ_REASONING_MODEL: ${{ vars.GROQ_REASONING_MODEL }}
      NVIDIA_NIM_EMBEDDING_MODEL: ${{ vars.NVIDIA_NIM_EMBEDDING_MODEL }}
      # The seven S3_* values are deliberately NOT job-level entries any more,
      # for the same reason and with the same trap as the SUPABASE_* block
      # above: the "Start a throwaway object store" step below writes all of
      # them to $GITHUB_ENV, and a job-level entry takes precedence over what a
      # step writes there, so naming one here would silently point the two Go
      # services back at whatever the repository secret holds.
      #
      # What the secret holds is a deleted project. `S3_ENDPOINT` was last
      # written on 2026-04-21, four months before the self-hosted cutover, and
      # still names the Supabase Cloud project this repository left, which no
      # longer resolves in DNS. So every POST /v1/files in this job died at the
      # socket, the Files and Batches conformance assertions were carried as
      # expected failures rather than as coverage, and the same blind 500 then
      # reached production uncaught (issues #1324 and #1282).
      #
      # There is no correct value to rotate that secret to, which is why this
      # is a fixture and not a new secret. deploy/docker/Caddyfile.supabase
      # serves /storage/v1 on the in-network listener only and says that ports
      # 80 and 443 must never be exposed; the public listener carries /auth/v1
      # and nothing else. The box's Storage is therefore unreachable from a
      # GitHub-hosted runner by design, and pointing CI at it would also mean
      # CI writing into the live demo box's buckets, which is the arrangement
      # the web-e2e job below already records as a defect that was fixed.
      # Same placeholders, same reason as the SUPABASE_* block above. No
      # console container runs under the `local` profile this job activates;
      # these exist only so compose has something to interpolate.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # HIVE_API_KEY is deliberately NOT the repository secret any more. This
      # job seeds its own key, on its own database, in the step below, and a
      # job-level env entry would take precedence over the value that step
      # writes to $GITHUB_ENV and silently point the SDK suites back at the
      # shared account.
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Say which provider allowance this run spends, and what it therefore
      # does NOT cover, before it spends any of it. Issue #1088: for a month
      # this job silently drove the same Groq daily token budget the live demo
      # answers customers from, while its own comments described a cheaper
      # path it was not taking. A reduced-fidelity check has to announce
      # itself, every run, or it reads as coverage it does not have.
      - name: Declare which provider account this run bills
        shell: bash
        run: |
          set -euo pipefail
          echo "SDK suites will call alias: $HIVE_TEST_MODEL"
          echo "embedding suites will call: $HIVE_EMBEDDING_MODEL"
          echo "capability tests will call: $HIVE_TOOLS_MODEL"
          # There used to be a name check for deepseek-v4-pro here, the alias
          # that burned 150 calls and 30.2M credits in one day of CI on
          # 2026-08-25. It is gone, and not because the lesson stopped
          # applying: a list of forbidden names only ever catches the one
          # mistake already made. The replacement is the "Refuse to bill a
          # paid completion alias" step below, which resolves whatever these
          # two variables actually hold through the seeded catalog and rejects
          # anything that is not upstream-free, deepseek-v4-pro included. It
          # runs after the throwaway database exists, which is why it is a
          # separate step rather than another branch here.
          if [ "$HIVE_TEST_MODEL" = "hive-free" ]; then
            echo "::notice::this run bills hive-free, the load-balanced pool of our own free provider keys. No customer-facing provider allowance is consumed. Pool-specific routing regressions (failover between keys) are covered only against the live box; a single-provider regression on any one pool member can still hide behind the other members."
          else
            echo "::notice::this run bills '$HIVE_TEST_MODEL', an override via CI_LIVE_INTEGRATION_MODEL rather than the free-pool default. Whatever that alias serves is what this run consumes."
          fi

      - name: Start a throwaway Postgres and apply the real schema
        shell: bash
        run: |
          set -euo pipefail
          # The hosted runner image already ships psql, so the usual case is a
          # no-op. apt is the fallback, and it is bounded: on 2026-08-19 a
          # bare `sudo apt-get update -qq` here hung for the job's entire
          # 25 minute budget and emitted not one line, so the job was
          # cancelled with no output to read. A hang that produces no
          # evidence is worse than a failure that does.
          if ! command -v psql >/dev/null; then
            for attempt in 1 2 3; do
              if sudo timeout 180 apt-get update -qq \
                 && sudo timeout 180 apt-get install -y -qq postgresql-client; then
                break
              fi
              echo "::warning::apt attempt $attempt failed or timed out, retrying"
              sleep 10
            done
          fi
          if ! command -v psql >/dev/null; then
            echo "::error::psql is unavailable and apt could not install it"
            exit 1
          fi

          # The same image and tag ci.yml's own go-tests job already runs its
          # RLS suites against, so there is one throwaway-Postgres approach in
          # this repository rather than two. docker run rather than a
          # `services:` container so the image is pulled only inside this job,
          # which the `if:` above already gates hard, matching
          # migration-applier-tests.yml.
          #
          # This image has no pg_cron, so 20260729_02 takes its documented
          # absent-extension branch and schedules no nightly purge. The
          # bootstrap below prints which branch was taken every run, so that
          # stays a stated fact rather than a silent difference; a database
          # that exists for the length of one job is never around at 21:00 UTC
          # to run the job anyway.
          docker run -d --name hive-ci-db -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=hive_ci \
            pgvector/pgvector:pg17
          for _ in $(seq 1 90); do
            if docker exec hive-ci-db pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          if ! docker exec hive-ci-db pg_isready -U postgres -h 127.0.0.1; then
            echo "::error::the throwaway Postgres never became ready"
            docker logs hive-ci-db | tail -40
            exit 1
          fi

          export PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres \
                 PGPASSWORD=postgres PGDATABASE=hive_ci
          scripts/ci-throwaway-db.sh

          # The address a compose container reaches this database on.
          # localhost inside those containers is the container itself, and the
          # docker0 gateway is routable from every bridge network the compose
          # project creates.
          gw=$(docker network inspect bridge -f '{{ (index .IPAM.Config 0).Gateway }}')
          dsn="postgres://postgres:postgres@${gw}:5432/hive_ci?sslmode=disable"
          echo "SUPABASE_DB_URL=$dsn" >> "$GITHUB_ENV"
          # edge-api prefers SUPABASE_DB_POOL_URL when set. There is no pooler
          # here and none is wanted: the pooler existed to keep this job off
          # the shared project's 15 session-mode client slots, and the job no
          # longer touches that project at all.
          echo "SUPABASE_DB_POOL_URL=$dsn" >> "$GITHUB_ENV"

      # Owner directive 2026-08-30: no CI pipeline may ever call a paid
      # completion model.
      #
      # TestNoCISurfaceCallsAPaidCompletionModel holds that for every model
      # value written down in this repository, which is most of them. It cannot
      # hold it for these two, because both read a repository VARIABLE first
      # (CI_LIVE_INTEGRATION_MODEL and CI_LIVE_INTEGRATION_TOOLS_MODEL) and a
      # repository variable is not in any diff, so setting one to a paid alias
      # would move this job's spend with nothing in the repository changing and
      # no check going red. That is exactly the silent regression the directive
      # is about, so the resolved value is checked here, at runtime, against
      # the same catalog and the same rule the Go guard uses.
      #
      # Only these two are checked. HIVE_EMBEDDING_MODEL is exempt by the
      # directive (paid embeddings are allowed), HIVE_TTS_MODEL and
      # HIVE_STT_MODEL are not completion aliases, and HIVE_IMAGE_MODEL is a
      # literal in this file that the Go guard already covers and flags.
      #
      # Fails closed in every direction: an alias with no enabled route, an
      # alias absent from the catalog, and a psql error each fail the job
      # rather than reading as "not paid".
      - name: Refuse to bill a paid completion alias
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: hive_ci
        run: |
          set -uo pipefail

          # One query for the whole catalog, then a lookup per variable. The
          # alias never reaches SQL, which is both simpler than psql variable
          # interpolation (which -c does not perform) and leaves nothing for a
          # repository variable's contents to do inside a statement.
          #
          # An alias is upstream-free when every route it can still serve from
          # dispatches an upstream that costs Hive nothing: an OpenRouter
          # ':free' variant, or a member of a free pool group. Identical
          # predicate to ci_paid_model_guard_integration_test.go, prefix match
          # included. The prefix was added for a proposed split into
          # route-free-pool-tools and route-free-pool-open; the owner rejected
          # that (issue #1563, hive-free is ONE endpoint) so the pool stays a
          # single route-free-pool group. The prefix stays anyway: it costs
          # nothing, it is what stops an equality test from calling hive-free
          # paid if a group is ever renamed, and a guard that only works for
          # today's exact string is the failure this one already had once.
          if ! verdicts=$(psql --no-psqlrc -qtAX -v ON_ERROR_STOP=1 -c "
                select r.alias_id || ' ' ||
                       case when bool_and(r.provider_model like '%:free'
                                          or r.litellm_model_name like 'route-free-pool%')
                            then 'free' else 'paid' end
                  from public.provider_routes r
                 where r.health_state not in ('disabled', 'eol')
                 group by r.alias_id"); then
            echo "::error::the catalog query failed, so it is unknown whether this run would bill a paid alias"
            exit 1
          fi
          if [ -z "$verdicts" ]; then
            echo "::error::the seeded catalog has no enabled route for any alias, so this check cannot classify anything and must not pass"
            exit 1
          fi

          fail=0
          for var in HIVE_TEST_MODEL HIVE_TOOLS_MODEL; do
            alias_id="${!var}"
            if [ -z "$alias_id" ]; then
              echo "::error::$var is empty, so this job would call whatever a suite defaults to rather than the alias it selected"
              fail=1
              continue
            fi
            verdict=$(printf '%s\n' "$verdicts" | awk -v a="$alias_id" '$1 == a { print $2 }')
            case "$verdict" in
              free)
                echo "$var = $alias_id is upstream-free"
                ;;
              paid)
                echo "::error::$var resolves to '$alias_id', a PAID completion alias. No CI lane may call one (owner directive 2026-08-30). If this came from the CI_LIVE_INTEGRATION_MODEL or CI_LIVE_INTEGRATION_TOOLS_MODEL repository variable, clear it or point it at an upstream-free alias."
                fail=1
                ;;
              *)
                echo "::error::$var resolves to '$alias_id', which the seeded catalog has no enabled route for, so nothing here can say what it would bill"
                fail=1
                ;;
            esac
          done
          [ "$fail" -eq 0 ]

      # Issues #1324 and #1380. The SDK conformance suites cover POST /v1/files
      # and the whole /v1/batches surface, which uploads its input file first,
      # so both write an object and both need a real S3 endpoint. This job used
      # to take that endpoint from a repository secret naming a project that has
      # not existed since August, so those suites could not pass and could not
      # fail for any reason to do with the gateway. It now stands up its own
      # object store, the same way it already stands up its own database.
      #
      # The real supabase/storage-api at the digest the box runs, not MinIO:
      # the defect that took production down (#1282) was a Storage server-side
      # credential defect that MinIO has no equivalent of and so could not
      # catch. The script's own reasoning block carries the full argument.
      #
      # After the database step because Storage migrates into a `storage`
      # schema that scripts/ci-throwaway-db.sh creates, and before the stack
      # starts because edge-api and control-plane read S3_ENDPOINT at boot and
      # refuse to start without it.
      #
      # The script proves a signed PUT and GET before printing anything, so a
      # fixture that boots and cannot store fails here by name rather than
      # fifteen minutes later inside a suite reporting an HTTP 500.
      - name: Start a throwaway object store
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: hive_ci
        run: |
          set -euo pipefail
          scripts/ci-object-store.sh > /tmp/object-store-env
          # Same shape the web-e2e job uses for its own throwaway stack: assert
          # every expected line is present before consuming any of them, so a
          # script that half succeeded fails here rather than at whichever
          # service boots first without the value it needed.
          for v in S3_ENDPOINT S3_ACCESS_KEY S3_SECRET_KEY S3_REGION \
                   S3_USE_SSL S3_BUCKET_FILES S3_BUCKET_IMAGES; do
            if ! grep -q "^${v}=" /tmp/object-store-env; then
              echo "::error::the throwaway object store printed no $v line"
              exit 1
            fi
          done
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            case "$line" in
              *_KEY=*) echo "::add-mask::${line#*=}" ;;
            esac
            echo "$line" >> "$GITHUB_ENV"
          done < /tmp/object-store-env

      - name: Seed this run's API key on the throwaway database
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: hive_ci
        run: |
          set -euo pipefail
          # Generated per run and masked. There is no shared CI key to leak
          # and no shared account behind it, which is also why
          # .github/workflows/pr-cleanup.yml is gone: it existed to purge the
          # rows this job used to write into the shared project.
          key=$(scripts/ci-seed-api-key.sh | sed -n 's/^HIVE_API_KEY=//p')
          if [ -z "$key" ]; then
            echo "::error::the seeder printed no HIVE_API_KEY line"
            exit 1
          fi
          echo "::add-mask::$key"
          echo "HIVE_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Pre-verify secrets reached runner env
        shell: bash
        run: |
          set -euo pipefail
          # SUPABASE_URL, SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY are
          # deliberately not in this list any more. This step exists to catch a
          # secret that did not reach the runner, and those three are now
          # literals in this job's env block (see the comment there), so an
          # assertion that they are non-empty is one that cannot fail. A check
          # that cannot go red is worse than no check: it reads as coverage.
          # SUPABASE_DB_URL stays, because the throwaway-database step writes it
          # to $GITHUB_ENV and a silent failure there is exactly this step's job.
          # The three S3_* names stay for that same reason and NOT because they
          # are still secrets: they are not, since #1324. The throwaway
          # object-store step writes them, so an empty one here means that step
          # wrote nothing, which is precisely the silent absence this catches.
          for v in SUPABASE_DB_URL \
                   OPENROUTER_API_KEY GROQ_API_KEY_2 GEMINI_API_KEY HIVE_API_KEY \
                   S3_ENDPOINT S3_ACCESS_KEY S3_SECRET_KEY; do
            val="${!v:-}"
            if [ -z "$val" ]; then
              echo "::error::$v is empty in workflow env"
              exit 1
            fi
            echo "  $v: len=${#val}"
          done

      - name: Cache third-party images (redis, litellm)
        id: img-cache
        uses: actions/cache@v6
        with:
          path: /tmp/docker-images
          # Keyed on the pinned tags so tag bumps invalidate the cache.
          key: docker-images-redis-8.4-alpine-litellm-v1.77.7-stable

      - name: Load or pull + save third-party images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/docker-images
          if [ -f /tmp/docker-images/redis.tar ] && [ -f /tmp/docker-images/litellm.tar ]; then
            echo "loading cached images..."
            docker load -i /tmp/docker-images/redis.tar
            docker load -i /tmp/docker-images/litellm.tar
          else
            echo "cache miss — pulling..."
            docker pull redis:8.4-alpine
            docker pull ghcr.io/berriai/litellm:v1.77.7-stable
            docker save redis:8.4-alpine -o /tmp/docker-images/redis.tar
            docker save ghcr.io/berriai/litellm:v1.77.7-stable -o /tmp/docker-images/litellm.tar
          fi

      - name: Build stack images (buildx + GHA cache)
        uses: docker/bake-action@v7
        with:
          source: .
          files: |
            ./deploy/docker/docker-bake.hcl
          targets: edge-api,control-plane,sdk-tests-js,sdk-tests-py,sdk-tests-java
          load: true
          set: |
            *.cache-from=type=gha,scope=stack
            *.cache-to=type=gha,scope=stack,mode=max

      - name: Start core stack (no rebuild — images already loaded)
        working-directory: deploy/docker
        run: |
          # `--profile local` activates the in-stack docker redis. Staging
          # uses Upstash via REDIS_URL and never carries that profile.
          docker compose --profile local up -d --no-build redis litellm control-plane edge-api

      - name: Wait for services to become healthy
        working-directory: deploy/docker
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 300 ))
          for svc in control-plane edge-api; do
            echo "waiting for $svc..."
            while :; do
              state=$(docker inspect --format '{{.State.Health.Status}}' \
                "$(docker compose ps -q $svc)" 2>/dev/null || echo "starting")
              if [ "$state" = "healthy" ]; then
                echo "$svc: healthy"
                break
              fi
              if [ "$(date +%s)" -gt "$deadline" ]; then
                echo "::error::$svc did not become healthy (last state: $state)"
                docker compose logs --tail=200 $svc
                exit 1
              fi
              sleep 5
            done
          done

      - name: Smoke test — /health + /v1/models
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/health | jq -c
          curl -fsS http://localhost:8081/health | jq -c

          code=$(curl -sS -o /tmp/models.json -w "%{http_code}" \
            http://localhost:8080/v1/models \
            -H "Authorization: Bearer $HIVE_API_KEY")
          echo "GET /v1/models -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::/v1/models returned $code"
            cat /tmp/models.json
            exit 1
          fi
          # A 200 alone is not evidence the catalog survived the migration
          # chain: an empty `.data` answers 200 too, and the line below prints
          # nothing and exits 0 on it, so this step passed over a database with
          # no aliases at all. That matters much more now than it did against
          # the shared project's already-populated schema, because this job
          # builds its catalog from the chain on every run.
          #
          # hive-default is seeded by supabase/migrations/20260331_01_model_catalog.sql,
          # so its absence means the chain did not deliver the catalog.
          if ! jq -e '.data | map(.id) | index("hive-default")' /tmp/models.json >/dev/null; then
            echo "::error::/v1/models answered 200 but does not list hive-default, so the throwaway database has no model catalog. Aliases present: $(jq -r '[.data[].id] | join(", ")' /tmp/models.json)"
            exit 1
          fi
          echo "/v1/models lists hive-default"
          jq -r '.data[0:3] | .[] | .id' /tmp/models.json

      - name: Sync LiteLLM model list from the DB catalog
        # The seam this job was missing: a deploy derives LiteLLM's serving
        # config from the database via POST /internal/litellm/sync
        # (deploy-demo-box.yml), but this job never called it, so LiteLLM kept
        # serving the static seed file deploy/litellm/config.yaml. The seed
        # predates the free pool: it has no route-free-pool group, so every
        # alias resolving into the pool (hive-free, this job's default
        # HIVE_TEST_MODEL) failed with Invalid model name while /v1/models,
        # which reads the DB catalog, listed it happily. Calling the same
        # endpoint production calls makes the migration chain the single source
        # of truth for what CI's gateway serves, exactly as on the box. The
        # assertion at the bottom is the regression guard: if anyone breaks
        # this wiring again, the gateway itself reports no pool and the job
        # fails before the suites run.
        shell: bash
        run: |
          set -euo pipefail

          # Same call shape as deploy-demo-box.yml's sync step: internal-token
          # auth, 35s max-time (the endpoint's own work includes a bounded
          # Docker restart), retried past cold-start blips, never swallowed.
          status=""
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          for i in 1 2 3; do
            status=$(curl -sS -o "$response_file" -w '%{http_code}' \
              --connect-timeout 2 --max-time 35 \
              -X POST -H "X-Internal-Token: $CONTROL_PLANE_INTERNAL_TOKEN" \
              http://localhost:8081/internal/litellm/sync) || status="000"
            if [ "$status" = "200" ]; then
              break
            fi
            echo "attempt $i: sync returned $status, retry in 5s"
            sleep 5
          done
          if [ "$status" != "200" ]; then
            echo "::error::litellm config sync failed after 3 attempts, last status $status"
            cat "$response_file" 2>/dev/null || true
            exit 1
          fi
          echo "LiteLLM config synced from provider_routes"

          # Sync restarts the litellm container as its last act, so the gateway
          # is briefly down here. Wait for it to answer again rather than let
          # the suites race the boot.
          master_key="${LITELLM_MASTER_KEY:-litellm-dev-key}"
          deadline=$(( $(date +%s) + 90 ))
          : > /tmp/litellm-models.json
          while :; do
            if body=$(curl -sS --max-time 5 \
                 -H "Authorization: Bearer $master_key" \
                 http://localhost:4000/v1/models 2>/dev/null); then
              printf '%s' "$body" > /tmp/litellm-models.json
              break
            fi
            if [ "$(date +%s)" -gt "$deadline" ]; then
              echo "::error::litellm did not come back up within 90s of the config sync"
              exit 1
            fi
            sleep 3
          done

          # The regression assertion: LiteLLM must now serve the route-free-pool
          # group that migration 20260824_02_free_pool_router.sql seeds, or
          # every plain-chat suite call would 400 with an Invalid model error.
          if ! jq -e '.data | map(.id) | index("route-free-pool") != null' /tmp/litellm-models.json >/dev/null; then
            echo "::error::litellm does not serve route-free-pool after syncing from the DB catalog, so HIVE_TEST_MODEL=hive-free cannot resolve. Gateway models: $(jq -r '[.data[].id] | join(", ")' /tmp/litellm-models.json)"
            exit 1
          fi
          echo "gateway serves route-free-pool; models: $(jq -r '[.data[].id] | join(", ")' /tmp/litellm-models.json)"

      # Name the dead pool member, if there is one, BEFORE the suites run.
      #
      # Serving route-free-pool (asserted above) only proves the group exists,
      # not that its four members answer. Free model ids churn constantly on
      # every provider in the pool, and a retired one answers 404 -- which is
      # exactly the error LiteLLM refuses to fail over (issue #1064). Without
      # this step that shows up as a generic "hive-free is not available." with
      # nothing anywhere naming which of the four models went away.
      #
      # `/health?model=` is LiteLLM's own per-group probe: it runs one tiny
      # request against each deployment in that group and reports them
      # individually, so this costs four small completions on free keys and
      # nothing on any paid alias.
      #
      # Deliberately NOT a hard gate on a single dead member. Surviving one is
      # the pool's entire purpose, so failing the job on it would make the
      # resilience worthless; the suites below are the real gate, and they now
      # pass through a degraded pool. It IS a hard failure when every member is
      # down, because then hive-free genuinely serves nothing.
      - name: Probe each free pool member and name any that is gone
        shell: bash
        run: |
          set -uo pipefail
          code=$(curl -sS -o /tmp/pool-health.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer ${LITELLM_MASTER_KEY}" \
            "http://localhost:4000/health?model=route-free-pool") || code="000"

          if [ "$code" != "200" ]; then
            echo "::warning::could not probe the free pool (HTTP ${code}), so this run cannot say whether all four members are alive"
            exit 0
          fi

          # python3 rather than jq purely so the reporting and the credential
          # redaction are the same language and the same process; the redactor
          # is already a python module this repo ships.
          python3 scripts/report-free-pool-health.py /tmp/pool-health.json

      - name: Run SDK suites in parallel (JS + Python + Java)
        # id, because the spend meter below runs on always() and needs to tell
        # "the suites failed, so the database may not exist" from "the suites
        # passed and the meter is unreadable", which is a defect.
        id: sdk-suites
        working-directory: deploy/docker
        shell: bash
        run: |
          # Intentionally no 'set -e' — we need to capture non-zero suite rc
          # rather than have the background subshell die at the failing command.
          set -uo pipefail
          log=/tmp/sdk
          mkdir -p "$log"

          run_suite() {
            local svc=$1
            local rc=0
            docker compose --profile test run --rm --no-deps "$svc" \
              > "$log/$svc.log" 2>&1 || rc=$?
            echo "$rc" > "$log/$svc.rc"
          }

          run_suite sdk-tests-js   &
          run_suite sdk-tests-py   &
          run_suite sdk-tests-java &
          wait

          fail=0
          for svc in sdk-tests-js sdk-tests-py sdk-tests-java; do
            rc=$(cat "$log/$svc.rc" 2>/dev/null || echo 127)
            echo "=============================================="
            echo "== $svc  (exit $rc)"
            echo "=============================================="
            tail -c 30000 "$log/$svc.log" || true
            if [ "$rc" != "0" ]; then fail=1; fi
          done

          # Issue #1374. Until now this step's only annotation was
          # `Process completed with exit code 1`, and the tracking issue it
          # feeds carried whatever the refusal classifier below had decided.
          # Between 00:59 and 12:09 on 2026-08-29 that pair filed one issue and
          # eleven comments, six of them saying "the provider rate limited us
          # (429)", over five unrelated defects: stale strict-XPASS markers
          # (#1259, #1260, #1261, #1274), a stale vitest it.fails (#1317), the
          # dead S3 endpoint (#1324), and a broken total_tokens invariant. The
          # 429 was real and incidental every time: one free-pool member spends
          # its free-tier daily allowance most days and the pool routes around
          # it, which the probe step above already reports.
          #
          # This names the tests instead. It changes nothing about what passes.
          #
          # Loud on its own failure rather than `|| true`. It must not add a
          # second failure to a step that has already failed, but a silent
          # swallow means a missing python3 or a changed log layout drops
          # SDK_FAILED_TESTS, the refusal classifier takes its no-named-failures
          # branch, and the lane reverts to headlining an incidental 429 with
          # nothing anywhere saying it did.
          if [ "$fail" != "0" ]; then
            python3 ../../scripts/extract-sdk-failures.py "$log" \
              || echo "::warning::extract-sdk-failures.py failed, so no test is named below; whatever cause the refusal classifier reports is its guess, not a named test"
          fi
          exit $fail

      # Issue #1088. A provider allowance this job spends was invisible until
      # it ran out. This reads what the gateway actually metered on its own
      # throwaway database, so the spend of a run is a number in the log every
      # time rather than something reconstructed from a provider console after
      # a red check.
      #
      # It also asserts the alias the suites called, which is the check that
      # would have caught the original defect: HIVE_TEST_MODEL was set here,
      # the suites read it, and nothing forwarded it, so the workflow's stated
      # model and the model actually billed disagreed for a month with every
      # run green.
      - name: Report and bound this run's metered provider spend
        if: always()
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: hive_ci
          SUITES_OUTCOME: ${{ steps.sdk-suites.outcome }}
          # Circuit breaker, not coverage: it is meant to sit dormant and to
          # fire on a runaway loop or a suite that starts generating long
          # completions, before a provider allowance is drained rather than
          # after.
          #
          # Derived from two measured runs of this job rather than picked: 1348
          # tokens across 22 completions on hive-default (run 32660770153) and
          # 1434 across the same 22 on deepseek-v4-flash, which spends more per
          # completion because it is a reasoning model (run 32661219454). About
          # four times the larger of the two leaves room for a few new tests and
          # for reasoning variance while still catching an order-of-magnitude
          # runaway. Raise it only alongside a measurement, and only after
          # finding out what grew.
          #
          # Raised from 6000 to 20000 on 2026-08-28, with the measurement and
          # the cause, per the rule above. Run 33210676196 metered 70048
          # tokens. What grew was one line, not the suite: the oversized-body
          # probe in typed-exceptions.test.ts sent about 300KB of prompt, and
          # nothing on the chat path rejects a body that size, so all of it
          # was forwarded upstream and metered as prompt tokens. That probe is
          # now a tenth of the size. The remaining growth is real and expected:
          # this suite went from 22 completions to roughly 50 as the OpenAI
          # surface coverage landed. 20000 is about twice the measured shape
          # after the fix, which keeps the order-of-magnitude runaway detector
          # that is the whole point of this ceiling.
          RUN_TOKEN_CEILING: '20000'
        run: |
          set -uo pipefail
          q() { psql --no-psqlrc -qtAX -v ON_ERROR_STOP=1 -c "$1"; }

          if ! total=$(q "select coalesce(sum(input_tokens + output_tokens), 0)
                            from public.usage_events where event_type = 'completed'"); then
            # A job that already failed may have failed before this database
            # existed, which is not a second defect. A job that PASSED and
            # cannot be metered is: the ceiling silently did not run, and a
            # check that quietly stops checking is worse than one that fails.
            if [ "$SUITES_OUTCOME" = "success" ]; then
              echo "::error::the SDK suites passed but the usage meter could not be read, so this run's provider spend is unknown and the token ceiling did not run"
              exit 1
            fi
            echo "::warning::usage meter unreadable, and the suites had already failed, so no spend figure for this run"
            exit 0
          fi

          echo "metered provider spend for this run, by alias:"
          psql --no-psqlrc -qX -v ON_ERROR_STOP=1 -c "
            select model_alias,
                   event_type,
                   count(*)            as events,
                   sum(input_tokens)   as input_tokens,
                   sum(output_tokens)  as output_tokens
              from public.usage_events
             group by 1, 2
             order by 1, 2"

          # A non-numeric total means the query answered something this step
          # cannot compare, and every assertion below would then quietly
          # evaluate to "fine". Refuse instead.
          case "$total" in
            ''|*[!0-9]*)
              echo "::error::the usage meter returned '${total}', which is not a token count, so nothing below actually checked anything"
              exit 1
              ;;
          esac

          echo "::notice::live-integration metered ${total} tokens across the configured aliases (ceiling ${RUN_TOKEN_CEILING}); see the per-alias breakdown above"

          if [ "$total" -gt "$RUN_TOKEN_CEILING" ]; then
            echo "::error::this run metered ${total} tokens, over the ${RUN_TOKEN_CEILING} ceiling. Something is generating far more than the suites should. Find it before raising the ceiling: a provider allowance is shared with the live demo."
            exit 1
          fi

          # The alias assertion. Only the aliases this workflow selects can
          # legitimately appear: chat/completions/responses suites use
          # HIVE_TEST_MODEL, capability tests use HIVE_TOOLS_MODEL (a
          # tools-capable alias, since hive-free correctly refuses
          # tools/response_format), the embedding suites use
          # HIVE_EMBEDDING_MODEL, and the image and voice suites use
          # HIVE_IMAGE_MODEL, HIVE_TTS_MODEL and HIVE_STT_MODEL. Anything else
          # means the value this workflow sets is not the value being billed.
          #
          # The last three joined the list when the OpenAI surface coverage
          # landed and this assertion correctly went red on hive-auto and
          # hive-stt. Widening it is only honest because each new alias is
          # pinned above rather than left to whatever a suite defaults to,
          # which is the property the assertion actually protects.
          #
          # The query's own failure is checked, not just its result: a psql
          # error returns an EMPTY string here, which reads exactly like "no
          # unexpected alias" and would turn this into an assertion that cannot
          # fail.
          if ! unexpected=$(q "select string_agg(distinct model_alias, ', ')
                                 from public.usage_events
                                where event_type = 'completed'
                                  and model_alias not in ('${HIVE_TEST_MODEL}', '${HIVE_TOOLS_MODEL}', '${HIVE_EMBEDDING_MODEL}',
                                                          '${HIVE_IMAGE_MODEL}', '${HIVE_TTS_MODEL}', '${HIVE_STT_MODEL}')"); then
            echo "::error::the alias assertion query failed, so this run's billed alias is unverified"
            exit 1
          fi
          if [ -n "$unexpected" ]; then
            echo "::error::this run billed alias(es) '${unexpected}', which is not what HIVE_TEST_MODEL ('${HIVE_TEST_MODEL}'), HIVE_TOOLS_MODEL ('${HIVE_TOOLS_MODEL}') HIVE_EMBEDDING_MODEL ('${HIVE_EMBEDDING_MODEL}'), HIVE_IMAGE_MODEL ('${HIVE_IMAGE_MODEL}'), HIVE_TTS_MODEL ('${HIVE_TTS_MODEL}') or HIVE_STT_MODEL ('${HIVE_STT_MODEL}') selects. The model knob is not reaching the suites (issue #1088), so this job is spending an allowance it did not choose."
            exit 1
          fi

          if [ "$SUITES_OUTCOME" = "success" ]; then
            if ! served=$(q "select count(*) from public.usage_events
                              where event_type = 'completed'
                                and model_alias = '${HIVE_TEST_MODEL}'"); then
              echo "::error::the completion-count query failed, so it is unknown whether this passing run served a single real completion"
              exit 1
            fi
            if [ "$served" = "0" ]; then
              echo "::error::the suites passed without a single metered completion on '${HIVE_TEST_MODEL}'. This job's whole purpose is a real provider round trip, so a pass with no completion is a pass over nothing."
              exit 1
            fi
            echo "${served} completion(s) served by '${HIVE_TEST_MODEL}'"
          fi

      # Issue #1088 again, the half that cost a full diagnosis cycle. On
      # 2026-08-23 this job went red with `Test timed out in 60000ms` as the
      # only visible fact, because LiteLLM retried a rate-limited deployment
      # three times at up to 45 seconds each while the suites time out at 60.
      # The actual 429, naming an exhausted daily token budget, existed only
      # inside a container-log artifact nobody reads first. A red check that
      # misreports its own cause is worse than a slow one.
      - name: Name the real cause when the upstream refused
        if: failure()
        working-directory: deploy/docker
        shell: bash
        run: |
          set -uo pipefail
          # Redacted because this output is public: container logs carry bearer
          # headers and provider keys verbatim. Same redactor the artifact
          # upload below uses.
          docker compose logs --no-color --tail=2000 litellm edge-api 2>&1 \
            | python3 ../../scripts/redact-log-credentials.py > /tmp/upstream.log || true

          # The classification used to be an if/elif chain of greps right here.
          # It moved into a script for one reason: YAML cannot carry a
          # regression test, and this logic had shipped false positives that
          # nothing could have caught.
          #
          # On 2026-08-29 (run 33243396287) it printed "the provider rate
          # limited us (429)" over a job whose real failures were `500 Failed
          # to store file` and one strict XPASS. Three log shapes were being
          # read as upstream refusals when none of them is one: LiteLLM's own
          # `No deployments available ... cooldown_list=[...]`, its
          # `Cooldown Deployments=[...]` table, and a bare `No fallback model
          # group found`, which LiteLLM emits on ANY failed dispatch to a group
          # with no configured fallback, including three refusals this job
          # deliberately tests for. The regexes also matched a 429 on
          # `deepseek-v4-flash` and reported it as a refusal of the free pool.
          #
          # The old reporting `grep ... | head -5` also exited 2 on SIGPIPE
          # under `set -o pipefail`, the exact trap the comment it replaced
          # warned about, visible in that run as `grep: write error: Broken
          # pipe`. Reading the file into memory removes it by construction.
          #
          # Every branch, both false positives and the genuine dead-member case
          # are pinned by `python3 scripts/classify-upstream-refusal.py
          # --selfcheck`, which `make test-scripts` runs as a required check.
          python3 ../../scripts/classify-upstream-refusal.py /tmp/upstream.log


      - name: Dump compose logs on failure
        if: failure()
        working-directory: deploy/docker
        # Piped through the redactor because this artifact is public: container
        # logs carry OAuth callbacks, bearer headers and API keys verbatim.
        run: docker compose logs --no-color --timestamps --tail=500 2>&1 | python3 ../../scripts/redact-log-credentials.py > /tmp/compose.log || true

      # The object store is a plain container, not a compose service, so the
      # dump above does not include it. Without this, a Storage-side 500 leaves
      # the run with edge-api's client-side view and nothing from the server
      # that produced it, which is the same blind failure this job was
      # rebuilt to stop having. Same redactor for the same reason.
      - name: Dump object store logs on failure
        if: failure()
        run: |
          { df -h; echo; docker logs --timestamps hive-ci-storage 2>&1; } \
            | python3 scripts/redact-log-credentials.py > /tmp/object-store.log || true
          # Disk first, deliberately. This job builds five images and loads two
          # cached tarballs after the fixture's own round-trip check has already
          # passed, so a runner that runs out of space produces a Storage 500
          # that looks like a credential or a routing fault and is neither.

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: |
            /tmp/compose.log
            /tmp/object-store.log
          retention-days: 5
          if-no-files-found: ignore

      - name: Tear down stack
        if: always()
        working-directory: deploy/docker
        run: docker compose down -v --remove-orphans || true

      - name: Tear down the throwaway database
        if: always()
        run: docker rm -f hive-ci-db || true

      - name: Tear down the throwaway object store
        if: always()
        run: docker rm -f hive-ci-storage || true

      - name: File or update tracking issue on failure
        # Only for main-branch-relevant triggers (post-merge push, daily
        # cron): a labeled PR run failing is already visible to its author
        # via the PR checks, no need to also file a repo issue. Dedupe on an
        # open issue with the label below instead of filing one per red run.
        if: failure() && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/github-script@v9
        env:
          # Written by the "Name the real cause" step above when it recognises
          # an upstream refusal AND no SDK test was named. Carried into the
          # issue body so the first thing a reader sees is the cause, not a
          # link to a run whose test output says "timed out" (issue #1088).
          UPSTREAM_FAILURE_CLASS: ${{ env.UPSTREAM_FAILURE_CLASS }}
          # The same refusal when named test failures DO exist. It is real but
          # incidental (issue #1374), so it is printed after them and labelled
          # as context rather than as the cause.
          UPSTREAM_FAILURE_CONTEXT: ${{ env.UPSTREAM_FAILURE_CONTEXT }}
          # Written by scripts/extract-sdk-failures.py on the SDK suite step.
          # This is the fact the issue was missing for eleven comments on
          # 2026-08-29: which test failed, and with what message.
          SDK_FAILED_TESTS: ${{ env.SDK_FAILED_TESTS }}
        with:
          script: |
            const label = 'ci-failure:live-integration';
            const title = 'Live integration (SDK tests + smoke) is failing on main';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Failing tests first, always. A tracking issue that leads with an
            // incidental provider 429 sends every reader to the wrong place,
            // which is what happened for a full day on issue #1374.
            const named = (process.env.SDK_FAILED_TESTS || '').trim();
            // Capped at the same 20 the run-page annotations are capped at.
            // A broad outage fails on the order of a hundred cases, and this
            // comment is posted again on every subsequent red run, so the
            // uncapped list is both unreadable and a walk towards GitHub's
            // 65536-character body limit.
            const MAX_LISTED = 20;
            const lines = named ? named.split('\n') : [];
            const overflow = lines.length - MAX_LISTED;
            const tests = lines.length
              ? '**Failing tests:**\n' +
                lines.slice(0, MAX_LISTED).map((line) => `- ${line}`).join('\n') +
                (overflow > 0 ? `\n- and ${overflow} more, see the run page` : '') +
                '\n\n'
              : '';
            const context_ = process.env.UPSTREAM_FAILURE_CONTEXT
              ? `Also in the container logs, as context rather than cause: ${process.env.UPSTREAM_FAILURE_CONTEXT}\n\n`
              : '';
            const cause = tests + (process.env.UPSTREAM_FAILURE_CLASS
              ? `**Cause identified from the container logs:** ${process.env.UPSTREAM_FAILURE_CLASS}\n\n`
              : '') + context_;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Still failing: ${runUrl}\n\n${cause}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: [label],
                body: `Live integration failed on ${context.eventName === 'schedule' ? 'the daily cron' : 'push to main'}.\n\n` +
                  cause +
                  `First detected: ${runUrl}\n\n` +
                  'Filed automatically. Close it once a run goes green; it will be refiled if it fails again.',
              });
            }

  # ------------------------------------------------------------------
  # Playwright E2E against the full booted Go stack + Next.js. Runs
  # every spec (unauth, credentialed, openai-sdk) in a single job so
  # `/console/*` server components can reach a real control-plane and
  # the fixture can seed/reset staging Supabase users before each run.
  # ------------------------------------------------------------------

  web-e2e:
    name: Web E2E (full stack)
    runs-on: ubuntu-latest
    # 25 until this job started standing up its own Postgres, GoTrue and
    # PostgREST before the stack. Measured on run 32378996099: the throwaway
    # Supabase step took 28 seconds and the whole job 5m49s, so the happy path
    # is nowhere near either budget. The headroom is for the tail, not the
    # median: the psql fallback below can spend up to about 18 minutes on a
    # runner image whose apt is degraded, and that has to be able to finish and
    # fail by name rather than be cancelled with an empty step log.
    timeout-minutes: 35
    # HISTORY, and it is history now: this job used to boot against the shared
    # Supabase project's session mode pooler (pool_size 15), and concurrent runs
    # exhausted it. On 2026-08-01 four unrelated PRs (#644, #646, #647, #648)
    # ran this job at overlapping times and all four failed with `page.goto:
    # net::ERR_ABORTED` / a 30s context timeout, which reads as a front end bug
    # rather than the database contention it actually was (issue #631).
    #
    # That coupling is GONE. The job now stands up its own Postgres, GoTrue and
    # PostgREST and opens no connection to Supavisor at all, so contention is no
    # longer a reason for anything here. The path gate below survives on its own
    # merits, stated plainly so the next reader does not go looking for a pooler
    # this job never touches: it exists to keep a full browser suite off pull
    # requests that cannot affect the browser flow, which is runner minutes, and
    # it now also has to fire for migration and stack-script changes because the
    # job applies the migration chain itself.
    #
    # An earlier version of the old fix serialized every web-e2e run with a
    # job-level `concurrency:` group. That was reverted: GitHub Actions
    # only holds one job per concurrency group as pending, so a third
    # queued run cancels the second outright before it ever executes.
    # web-e2e was not a required check then, so a canceled result would
    # surface nowhere and a PR could merge with no browser coverage at all, a
    # silent gap of exactly the kind issue #659 exists to prevent (a
    # skipped test and a passing test are indistinguishable inside a green
    # check). Trading a noisy false-red failure for a silent absence is
    # not a fix.
    #
    # `Web E2E (full stack)` IS a required context on main today, read off the
    # live branch protection on 2026-08-23 (.github/branch-protection-main.json
    # still lists the older six and has not caught up). That strengthens the
    # revert rather than reversing it: a queue-race cancellation would now
    # block the merge outright instead of vanishing, and it is also why the
    # diagnostic steps at the end of this job had to stop being skipped on a
    # cancellation.
    #
    # What replaced it: gate this job on `needs.changes.outputs.web_e2e`
    # (see the `changes` job's decide step for the path reasoning),
    # instead of the blanket `needs.changes.outputs.run` every other job
    # here uses. Two of the four PRs above, the migration baseline script
    # and its probe, touched no path that can reach the booted browser
    # flow and should not have run this job at all; this gate is
    # deterministic and reviewable in a diff, unlike a queue race.
    #
    # It was kept after the throwaway stack landed because the minutes argument
    # stands on its own. The shared-pool argument for it does not, and #631 is
    # what this branch closes: there is no shared pool left to land on.
    if: >-
      needs.changes.outputs.run == 'true' &&
      needs.changes.outputs.web_e2e == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    # Independently boots its own Go stack + Next.js. Decoupled from
    # `live-integration` so a flaky external provider (e.g. OpenRouter
    # 429 on the SDK suites) no longer blocks the UI test coverage.
    needs: [changes, web-unit, go-tests]
    env:
      # Activate the in-stack docker redis profile for every compose call
      # in this job (see live-integration job for the rationale).
      COMPOSE_PROFILES: local
      # SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY and the two
      # NEXT_PUBLIC_ mirrors are deliberately NOT job-level entries any more.
      # This job stands up its own GoTrue and PostgREST (see the throwaway
      # stack step below) and writes all five to $GITHUB_ENV, and a job-level
      # entry takes precedence over what a step writes there, which would
      # silently point the browser and the fixture seeder back at the shared
      # hosted project.
      REDIS_URL: redis://redis:6379/0
      CONTROL_PLANE_PORT: '8081'
      CONTROL_PLANE_BASE_URL: http://localhost:8081
      EDGE_CONTROL_PLANE_BASE_URL: http://control-plane:8081
      # LITELLM_MASTER_KEY is deliberately absent, and its absence is not a
      # gap. docker-compose.yml defaults it to litellm-dev-key for the litellm
      # container and for both Go services, so all three agree on a throwaway
      # value and this job never handles the production one. Naming the secret
      # is also half of what made a Dependabot-triggered run behave differently
      # from every other run: see the S3 block below.
      # Live provider keys are NOT supplied to web-e2e. The Playwright
      # specs run here (unauth, auth-shell, profile-completion) exercise
      # only the UI layer and Supabase auth flows; they make no LLM
      # completion calls. Stub values satisfy LiteLLM startup validation
      # without exposing paid API keys to a job that never needs them.
      OPENROUTER_API_KEY: 'ci-stub-not-used'
      GROQ_API_KEY: 'ci-stub-not-used'
      GROQ_API_KEY_2: 'ci-stub-not-used'
      GEMINI_API_KEY: 'ci-stub-not-used'
      NVIDIA_NIM_API_KEY: 'ci-stub-not-used'
      OPENROUTER_DEFAULT_MODEL: ${{ vars.OPENROUTER_DEFAULT_MODEL }}
      OPENROUTER_AUTO_MODEL: ${{ vars.OPENROUTER_AUTO_MODEL }}
      OPENROUTER_FAST_FALLBACK_MODEL: ${{ vars.OPENROUTER_FAST_FALLBACK_MODEL }}
      OPENROUTER_EMBEDDING_MODEL: ${{ vars.OPENROUTER_EMBEDDING_MODEL }}
      OPENROUTER_EMBEDDING_FALLBACK_MODEL: ${{ vars.OPENROUTER_EMBEDDING_FALLBACK_MODEL }}
      GROQ_FAST_MODEL: ${{ vars.GROQ_FAST_MODEL }}
      GROQ_REASONING_MODEL: ${{ vars.GROQ_REASONING_MODEL }}
      NVIDIA_NIM_EMBEDDING_MODEL: ${{ vars.NVIDIA_NIM_EMBEDDING_MODEL }}
      # The object store is stubbed here, not supplied, for the same reason
      # the provider keys above are: no spec in the chromium project uploads
      # or downloads an object.
      #
      # Issue #1380 read this block as the reason `sdk-tests-js` cannot fail on
      # a file upload. It is not: no SDK suite runs in this job, they all run
      # in `live-integration`, which now stands up a real throwaway object
      # store and exercises the upload for real. The stub stays here because
      # all three of its reasons still hold, and this paragraph exists so the
      # next reader does not have to re-derive that.
      #
      # control-plane and edge-api only require these
      # names to be non-empty at boot (loadStorageConfigFromEnv in
      # apps/control-plane/cmd/server/main.go, NewS3Client in
      # packages/storage/s3.go), and neither dials anything at startup, so a
      # stub boots the stack. Port 9 is discard: a spec that starts touching
      # storage gets connection refused and fails loudly, instead of quietly
      # reading and writing the live Supabase bucket the way this job did
      # while these were secrets.
      #
      # THIS IS WHAT WEDGED THE DEPENDENCY QUEUE. A workflow run triggered by
      # Dependabot is handed the Dependabot secret store, not the Actions one,
      # so every `secrets.S3_*` above resolved to the empty string, and
      # control-plane exited at boot with `storage unavailable: missing
      # S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY, S3_REGION`. The stack never
      # came up, this required check failed on ten open dependency pull
      # requests at once (#1013, #1015, #1016, #1018, #1036, #1037, #1039,
      # #1132, #1134, #1140), and not one of them could have caused it. The
      # fix is not to copy the secrets into the Dependabot store: this job
      # boots its own Postgres, GoTrue, PostgREST, Redis and LiteLLM, and a
      # job that stands up everything it needs should need no credential at
      # all. It now needs none, and the unit test
      # `apps/web-console/tests/unit/ci-web-e2e-secret-free.test.ts` fails the
      # next pull request that puts one back. See issues #820 and #821.
      S3_ENDPOINT: 'http://127.0.0.1:9'
      S3_ACCESS_KEY: 'ci-stub-not-used'
      S3_SECRET_KEY: 'ci-stub-not-used'
      S3_REGION: 'us-east-1'
      S3_USE_SSL: 'false'
      S3_BUCKET_FILES: 'ci-stub-files'
      S3_BUCKET_IMAGES: 'ci-stub-images'
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # HIVE_API_KEY is gone with the shared project. It only ever fed
      # openai-sdk.spec.ts, which skips on `!HIVE_API_KEY || !EDGE_BASE_URL`
      # and was already skipping here because this job has never set
      # EDGE_BASE_URL. Removing it changes no spec's outcome.
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/web-console/package-lock.json

      - name: Start a throwaway Supabase (Postgres, GoTrue, PostgREST)
        shell: bash
        run: |
          set -euo pipefail
          # The hosted runner image already ships psql, so the usual case is a
          # no-op. apt is the fallback, and it is bounded: on 2026-08-19 a
          # bare `sudo apt-get update -qq` here hung for the job's entire
          # 25 minute budget and emitted not one line, so the job was
          # cancelled with no output to read. A hang that produces no
          # evidence is worse than a failure that does.
          if ! command -v psql >/dev/null; then
            for attempt in 1 2 3; do
              if sudo timeout 180 apt-get update -qq \
                 && sudo timeout 180 apt-get install -y -qq postgresql-client; then
                break
              fi
              echo "::warning::apt attempt $attempt failed or timed out, retrying"
              sleep 10
            done
          fi
          if ! command -v psql >/dev/null; then
            echo "::error::psql is unavailable and apt could not install it"
            exit 1
          fi

          # Same image and tag this file's own go-tests job already uses, so
          # there is one throwaway-Postgres approach in this repository.
          docker run -d --name hive-ci-db -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=hive_ci \
            pgvector/pgvector:pg17
          for _ in $(seq 1 90); do
            if docker exec hive-ci-db pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          if ! docker exec hive-ci-db pg_isready -U postgres -h 127.0.0.1; then
            echo "::error::the throwaway Postgres never became ready"
            docker logs hive-ci-db | tail -40
            exit 1
          fi

          export PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres \
                 PGPASSWORD=postgres PGDATABASE=hive_ci

          # A database alone is not enough here, and the coupling is not
          # separable: this job's fixture seeder talks supabase-js
          # (auth.admin.createUser against /auth/v1, .from(table) against
          # /rest/v1) and the browser signs in through @supabase/ssr, while
          # GoTrue's custom access token hook (20260516_07) runs INSIDE the
          # database holding the user rows and raises no_active_membership for
          # a user with no tenant_users row. Cloud auth over a throwaway
          # database therefore fails every login. See scripts/ci-supabase-stack.sh.
          #
          # Its stdout is the five values the rest of the job needs. Each is
          # masked before it is exported: they are worth nothing outside this
          # runner, but a job log is public.
          scripts/ci-supabase-stack.sh --port 9000 > /tmp/supabase-env
          # set -e covers a non-zero exit, and nothing covers a zero exit with
          # truncated stdout: the loop below and the two sed calls all succeed
          # on an empty file, and the job then dies inside Playwright with an
          # unset SUPABASE_URL, three steps from the cause.
          for v in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY \
                   SUPABASE_URL_FROM_CONTAINER; do
            if ! grep -q "^$v=." /tmp/supabase-env; then
              echo "::error::the throwaway Supabase stack printed no $v line"
              exit 1
            fi
          done
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            case "$line" in
              *_KEY=*) echo "::add-mask::${line#*=}" ;;
            esac
            echo "$line" >> "$GITHUB_ENV"
          done < /tmp/supabase-env
          # The two NEXT_PUBLIC_ mirrors the browser and the Next.js build read.
          # The browser reaches the gateway on localhost; a container reaches it
          # on the docker bridge gateway, which is why the stack script emits
          # both forms.
          sed -n 's/^SUPABASE_URL=/NEXT_PUBLIC_SUPABASE_URL=/p'          /tmp/supabase-env >> "$GITHUB_ENV"
          sed -n 's/^SUPABASE_ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/p' /tmp/supabase-env >> "$GITHUB_ENV"

          gw=$(docker network inspect bridge -f '{{ (index .IPAM.Config 0).Gateway }}')
          dsn="postgres://postgres:postgres@${gw}:5432/hive_ci?sslmode=disable"
          echo "SUPABASE_DB_URL=$dsn" >> "$GITHUB_ENV"
          # No pooler here and none wanted: the transaction-mode DSN existed to
          # keep this job off the shared project's 15 session-mode slots, and
          # the job no longer touches that project.
          echo "SUPABASE_DB_POOL_URL=$dsn" >> "$GITHUB_ENV"

      - name: Cache third-party images (redis, litellm)
        id: img-cache
        uses: actions/cache@v6
        with:
          path: /tmp/docker-images
          key: docker-images-redis-8.4-alpine-litellm-v1.77.7-stable

      - name: Load or pull + save third-party images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/docker-images
          if [ -f /tmp/docker-images/redis.tar ] && [ -f /tmp/docker-images/litellm.tar ]; then
            docker load -i /tmp/docker-images/redis.tar
            docker load -i /tmp/docker-images/litellm.tar
          else
            docker pull redis:8.4-alpine
            docker pull ghcr.io/berriai/litellm:v1.77.7-stable
            docker save redis:8.4-alpine -o /tmp/docker-images/redis.tar
            docker save ghcr.io/berriai/litellm:v1.77.7-stable -o /tmp/docker-images/litellm.tar
          fi

      - name: Build stack images (reuse GHA cache from live-integration)
        uses: docker/bake-action@v7
        with:
          source: .
          files: |
            ./deploy/docker/docker-bake.hcl
          targets: edge-api,control-plane
          load: true
          set: |
            *.cache-from=type=gha,scope=stack
            *.cache-to=type=gha,scope=stack,mode=max

      - name: Start core stack (no rebuild — images already loaded)
        working-directory: deploy/docker
        env:
          # control-plane calls GET /auth/v1/user on SUPABASE_URL from inside a
          # container, where localhost is the container itself. The throwaway
          # stack publishes its gateway on the runner, so the service gets the
          # docker bridge form of the same URL the browser uses.
          SUPABASE_URL: ${{ env.SUPABASE_URL_FROM_CONTAINER }}
        run: |
          # `--profile local` activates the in-stack docker redis. Staging
          # uses Upstash via REDIS_URL and never carries that profile.
          docker compose --profile local up -d --no-build redis litellm control-plane edge-api

      - name: Wait for services to become healthy
        working-directory: deploy/docker
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 300 ))
          for svc in control-plane edge-api; do
            while :; do
              state=$(docker inspect --format '{{.State.Health.Status}}' \
                "$(docker compose ps -q $svc)" 2>/dev/null || echo "starting")
              if [ "$state" = "healthy" ]; then
                echo "$svc: healthy"
                break
              fi
              if [ "$(date +%s)" -gt "$deadline" ]; then
                echo "::error::$svc did not become healthy (last state: $state)"
                docker compose logs --tail=200 $svc
                exit 1
              fi
              sleep 5
            done
          done

      - name: Install web-console deps
        working-directory: apps/web-console
        run: npm ci

      - name: Read Playwright version
        id: pw
        working-directory: apps/web-console
        run: |
          v=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: apps/web-console
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: apps/web-console
        run: npx playwright install-deps chromium

      - name: Build + start Next.js (points at booted control-plane)
        working-directory: apps/web-console
        env:
          # NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY and
          # SUPABASE_SERVICE_ROLE_KEY all come from $GITHUB_ENV now, written by
          # the throwaway stack step. Repeating them here as step env would
          # override those values with the shared project's.
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          CONTROL_PLANE_BASE_URL: http://localhost:8081
        run: |
          npm run build
          nohup npm start > /tmp/nextjs.log 2>&1 &
          for i in {1..60}; do
            if (echo > /dev/tcp/127.0.0.1/3000) 2>/dev/null; then echo "Next.js up"; exit 0; fi
            sleep 2
          done
          echo "::error::Next.js did not start"; cat /tmp/nextjs.log; exit 1

      - name: Generate the fixture credentials
        # Random per job, and masked, because the seeder stores the token's
        # sha256 as a live pending invitation. A value anybody can derive from
        # the public run page is a published credential for as long as the run
        # lasts.
        #
        # 24 bytes gives 48 hex characters. The floor it has to clear is
        # minTokenLength in tests/e2e/support/e2e-auth-defaults.json, which
        # requiredSecretEnv enforces at 16, so do not shorten this below that
        # without moving both: the failure would otherwise surface far from
        # here, naming a variable this step does not mention.
        #
        # The two fixture passwords are generated the same way, and used to be
        # repository secrets. Generating them is strictly stronger than reading
        # them: the accounts they belong to are created by this run's own
        # seeder, in a throwaway GoTrue that is destroyed with the job, at
        # addresses already namespaced by run id and attempt, so a value shared
        # across runs bought nothing. It cost something, though. A run
        # triggered by Dependabot never receives an Actions secret, so both
        # passwords arrived empty and requiredSecretEnv threw by name; that was
        # the second wall behind the S3 one documented in this job's env block.
        # This does not weaken the rule these secrets were introduced to
        # enforce, which is that no credential has a committed default: nothing
        # is committed here either, and a caller that neither sets nor
        # generates one still fails by name.
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 24)"
          echo "::add-mask::$token"
          echo "E2E_INVITATION_TOKEN=$token" >> "$GITHUB_ENV"
          for var in E2E_VERIFIED_PASSWORD E2E_UNVERIFIED_PASSWORD; do
            secret="$(openssl rand -hex 24)"
            echo "::add-mask::$secret"
            echo "$var=$secret" >> "$GITHUB_ENV"
          done

      - name: Run UI Playwright suite (unauth + credentialed)
        working-directory: apps/web-console
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          # Fixture seeding runs in this step's own Node child process
          # (tests/e2e/support/e2e-auth-fixtures.mjs), so it needs admin auth.
          # It reads SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY from the
          # environment, and both come from $GITHUB_ENV, written by the
          # throwaway stack step. Naming the repository secret here again
          # would hand the seeder the hosted project's key while it talks to
          # this run's own GoTrue, and GoTrue answers "invalid JWT: token
          # signature is invalid" to every admin call. Measured, in run
          # 32266955684: fourteen specs failed that way with no other cause.
          #
          # This used to POST to a deployed `e2e-fixtures` Supabase Edge
          # Function instead, which kept the key out of this step but put
          # the caller and the seeder on separate release cycles: a change
          # to what the caller asked for shipped with its pull request
          # while the deployed seeder only moved when somebody ran
          # `supabase functions deploy`. Seeding in-process removes that
          # skew, and removes the deploy step from the critical path of
          # any pull request that touches the fixtures.
          # E2E_RUN_KEY, and the three identity values below it, namespace
          # every fixture row this job's specs touch (see
          # apps/web-console/tests/e2e/support/e2e-fixture-seed.mjs,
          # buildIds). Without this, every concurrent Web E2E job (another
          # PR, a push to main) shared one hardcoded set of accounts and
          # users against the same live Supabase project and could delete or
          # reassign rows out from under this job's own reads mid-test.
          # github.run_attempt makes a manual re-run of a flake get a fresh
          # identity too, not the one the previous attempt already consumed.
          # The passwords are generated per run by the step above and have no
          # fallback. They used to fall back to plaintext values committed in
          # e2e-auth-defaults.json, in a public repository, for live accounts
          # holding a tenant OWNER role; the seeder then wrote those values
          # back onto the accounts. That fallback is gone and is not coming
          # back. They were then repository secrets, which failed by name when
          # unset, and which a Dependabot-triggered run never receives at all.
          # Generating them removes the last reason this job needs a secret,
          # and costs nothing: nothing looks a user up by password, the
          # addresses above are already run-scoped, and the GoTrue holding
          # these accounts is torn down with the job.
          E2E_RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          E2E_VERIFIED_EMAIL: e2e-verified+${{ github.run_id }}-${{ github.run_attempt }}@scubed.com.bd
          E2E_VERIFIED_PASSWORD: ${{ env.E2E_VERIFIED_PASSWORD }}
          E2E_UNVERIFIED_EMAIL: e2e-unverified+${{ github.run_id }}-${{ github.run_attempt }}@scubed.com.bd
          E2E_UNVERIFIED_PASSWORD: ${{ env.E2E_UNVERIFIED_PASSWORD }}
          # Generated in the step above, not derived here. It used to be a
          # committed literal concatenated with the run id and attempt, both
          # of which are public on the run page, and e2e-fixture-seed.mjs
          # stores its sha256 as the pending invitation's token_hash. Anyone
          # reading the run URL could compute the live token and accept the
          # invitation into this run's account while it was still open.
          E2E_INVITATION_TOKEN: ${{ env.E2E_INVITATION_TOKEN }}
          # Workspace-owner fixture for console-workspace-admin.spec.ts.
          # Unset leaves that spec skipped, which is why the required
          # coverage for a mispointed control-plane is the unit-level
          # drift guard in tests/unit/control-plane-host.test.ts. This
          # spec is the rendered-symptom check on top of it. The old
          # E2E_PLATFORM_ADMIN_* names are still read as a fallback, so an
          # existing secret keeps working: after issue #758 the account only
          # needs to be OWNER of its workspace, not a platform admin.
          # The run's own seeded verified user, which the seeder makes OWNER of
          # this run's tenant (confirmed on the issued JWT: tenants[0].role is
          # OWNER). It used to be a shared cloud account, which does not exist
          # on a throwaway Supabase, and an unset value makes
          # console-workspace-admin.spec.ts skip itself by name rather than
          # fail: a silent hole inside a green check. Pointing it at the
          # fixture user means the spec now always runs.
          E2E_WORKSPACE_OWNER_EMAIL: e2e-verified+${{ github.run_id }}-${{ github.run_attempt }}@scubed.com.bd
          E2E_WORKSPACE_OWNER_PASSWORD: ${{ env.E2E_VERIFIED_PASSWORD }}
        # Selects by PROJECT, never by file path (issue #813). The
        # `chromium` project's testDir is apps/web-console/tests/e2e, so a
        # spec added to that directory runs here the day it lands with no
        # workflow edit. The hand-maintained path list this replaced is
        # exactly how seven console specs sat in the tree for months
        # without ever executing: a spec that never runs cannot fail, and
        # unlike a skip it emits no signal at all.
        #
        # openai-sdk.spec.ts is in that directory and stays quiet through
        # its own documented `test.skip`, so the reason travels with the
        # spec rather than living here: it needs EDGE_BASE_URL and a real
        # completion round-trip, and this job deliberately boots with stub
        # provider keys.
        #
        # tests/e2e/_probe is excluded by the project's own testIgnore, not
        # by anything here. Those specs target deployed staging hosts and
        # two of their tests carry no credential gate, so against this
        # locally booted stack they fail on DNS rather than on the change
        # under test. They keep their own `probe` project and are carried
        # as justified debt in tests/dark-spec-allowlist.json.
        run: npx playwright test --project=chromium

      # The four diagnostic steps below run on `always()`, not `failure()`.
      # This job carries `timeout-minutes: 35`, and GitHub reports a job killed
      # by its own cap as cancelled rather than failed, so a plain `failure()`
      # step is skipped in exactly the case that most needs explaining. That is
      # observed here, not theoretical: runs that walked into the cap in August
      # 2026 uploaded no compose log and no Next.js log, and the only artifact
      # that survived was the Playwright report, which survived because its
      # upload step already carried `always()`.
      #
      # Measured, not assumed, on a throwaway one minute job that slept past
      # its own cap (run 32628384742, branch deleted after): the job concluded
      # `cancelled`, its `if: failure()` step was skipped, and its `always()`,
      # `cancelled()` and `failure() || cancelled()` steps all ran. So either
      # condition would work. `always()` is the one used here because it is
      # what the three sibling steps at the end of this job already carry and
      # it does not depend on which flavour of cancellation arrives. The cost
      # is a few seconds and one small log artifact on a green run.
      - name: Dump compose logs
        if: always()
        working-directory: deploy/docker
        # Piped through the redactor: see the sdk-tests dump step above.
        run: docker compose logs --no-color --timestamps --tail=500 2>&1 | python3 ../../scripts/redact-log-credentials.py > /tmp/compose-web-e2e-api.log || true

      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs-web-e2e-api
          path: /tmp/compose-web-e2e-api.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Redact the Next.js server log
        if: always()
        # The console renders an error boundary ("Something went wrong on this
        # page", plus a digest) when a server component throws, and the cause is
        # only ever in this log. On 2026-08-16 an invitation-acceptance spec
        # timed out waiting for a workspace switcher that the error boundary had
        # replaced, and nothing in any uploaded artifact said why: this file was
        # written and then discarded with the runner.
        #
        # Redacted on the way out, like the compose dump: artifacts on a public
        # repository are downloadable by anyone with the run URL, and this job
        # drives /invitations/accept?token=<live token>.
        run: |
          set -uo pipefail
          if [ -f /tmp/nextjs.log ]; then
            python3 scripts/redact-log-credentials.py < /tmp/nextjs.log > /tmp/nextjs-redacted.log || true
          fi

      - name: Upload the redacted Next.js server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-log-web-e2e
          path: /tmp/nextjs-redacted.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-api
          # Traces (.zip), videos (.webm) and index.html are excluded. This
          # repository is public, so any artifact here is downloadable by
          # anyone with the run URL, and playwright.config.ts retains a trace
          # on failure: it holds every request header (Authorization: Bearer)
          # and every sb-*-auth-token cookie for the fixture session.
          # index.html goes too, and for the same reason rather than a
          # different one: the HTML reporter base64-inlines the whole report
          # payload into that file, including stdout, stderr and error text,
          # and a waitForURL timeout enumerates the URLs it navigated,
          # fragment included. Both are binary-wrapped, so no text linter can
          # inspect either. Screenshots survive, and the failing test names
          # and error text are already in this job's own log.
          path: |
            apps/web-console/playwright-report/
            !apps/web-console/playwright-report/**/*.zip
            !apps/web-console/playwright-report/**/*.webm
            !apps/web-console/playwright-report/index.html
          if-no-files-found: ignore
          retention-days: 5

      - name: Tear down stack
        if: always()
        working-directory: deploy/docker
        run: docker compose down -v --remove-orphans || true

      - name: Tear down the throwaway Supabase
        if: always()
        # The network too, not just the containers. It is a no-op on a hosted
        # runner, which is discarded whole, but scripts/ci-supabase-stack.sh is
        # also run by hand during development and there the leftovers do
        # accumulate. Removing the containers first is what frees the network to
        # be removed at all.
        run: |
          docker rm -f supabase-gw supabase-rest supabase-auth hive-ci-db || true
          docker network rm hive-ci-supabase || true

  # ------------------------------------------------------------------
  # Interaction coverage gate. Enumerates every interactive control in
  # every console route from the rendered DOM, activates each one, and
  # requires observable evidence that it did something: a request, a
  # navigation, a change to the render, or a value that survives a reload.
  # A control with no proven effect fails the job.
  #
  # This exists because every UI test we had asserted that a control
  # rendered. A button with aria-haspopup="menu" and no click handler
  # passed all of them (issue #785), and so would a toggle that flips in
  # the browser and persists nothing.
  #
  # ADVISORY, not a required check, and deliberately so for now. It is a
  # sweep of a whole application against a live-ish stack, so its failure
  # modes include the stack, the network and the seeded account, not only
  # the console. Making it required before it has a run history on main
  # would block every merge on any of those. It graduates the same way
  # rust-tests and desktop-tests did: a track record first.
  #
  # Advisory does not mean silent. The job reports its own red, and the
  # unit-level half (tests/interaction/gate-integrity.test.ts) runs inside
  # the required web-unit job, so a malformed registry, a stale exclusion
  # or a broken enumerator fails a required check even when this job does
  # not run.
  # ------------------------------------------------------------------

  interaction-coverage:
    name: Interaction coverage (console controls)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      needs.changes.outputs.run == 'true' &&
      needs.changes.outputs.web_e2e == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    needs: [changes, web-unit, go-tests]
    env:
      COMPOSE_PROFILES: local
      # SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY and the two
      # NEXT_PUBLIC_ mirrors are deliberately NOT job-level entries any more,
      # for the reason Web E2E documents at its own env block: this job stands
      # up its own GoTrue and PostgREST and writes all five to $GITHUB_ENV, and
      # a job-level entry would take precedence over what that step writes,
      # silently pointing the mint, the seeder and the browser bundle back at
      # whatever the repository secrets name instead of this run's own auth
      # surface. A session minted on one surface and read by an app built for
      # another is exactly the stall that kept this job red: every cookie name
      # is derived from the project ref in whichever URL each side was given,
      # so both sides must be fed by one source or the state file is complete
      # and useless.
      REDIS_URL: redis://redis:6379/0
      CONTROL_PLANE_PORT: '8081'
      CONTROL_PLANE_BASE_URL: http://localhost:8081
      EDGE_CONTROL_PLANE_BASE_URL: http://control-plane:8081
      # LITELLM_MASTER_KEY is deliberately absent, for the reason Web E2E
      # states at its own env block: compose defaults it to litellm-dev-key for
      # every service that reads it, and naming the secret made a
      # Dependabot-triggered run differ from every other run.
      # The gate drives the UI only. It never asks for a completion, so
      # stub provider keys satisfy LiteLLM startup without exposing paid
      # credentials to a job that has no use for them.
      OPENROUTER_API_KEY: 'ci-stub-not-used'
      GROQ_API_KEY: 'ci-stub-not-used'
      NVIDIA_NIM_API_KEY: 'ci-stub-not-used'
      OPENROUTER_DEFAULT_MODEL: ${{ vars.OPENROUTER_DEFAULT_MODEL }}
      OPENROUTER_AUTO_MODEL: ${{ vars.OPENROUTER_AUTO_MODEL }}
      OPENROUTER_FAST_FALLBACK_MODEL: ${{ vars.OPENROUTER_FAST_FALLBACK_MODEL }}
      OPENROUTER_EMBEDDING_MODEL: ${{ vars.OPENROUTER_EMBEDDING_MODEL }}
      OPENROUTER_EMBEDDING_FALLBACK_MODEL: ${{ vars.OPENROUTER_EMBEDDING_FALLBACK_MODEL }}
      GROQ_FAST_MODEL: ${{ vars.GROQ_FAST_MODEL }}
      GROQ_REASONING_MODEL: ${{ vars.GROQ_REASONING_MODEL }}
      NVIDIA_NIM_EMBEDDING_MODEL: ${{ vars.NVIDIA_NIM_EMBEDDING_MODEL }}
      # Stubbed, not supplied, for the reason Web E2E documents in full at its
      # own env block: the gate touches no object, the two Go services only
      # require these names to be non-empty at boot, and a Dependabot-triggered
      # run receives no Actions secret, so as secrets these resolved empty and
      # control-plane exited at boot with `storage unavailable`. Port 9 is
      # discard, so a spec that starts touching storage fails loudly rather
      # than reaching the live bucket. The job that DOES exercise storage is
      # `live-integration`, which stands up its own object store; issue #1380
      # mistook this block for that coverage.
      S3_ENDPOINT: 'http://127.0.0.1:9'
      S3_ACCESS_KEY: 'ci-stub-not-used'
      S3_SECRET_KEY: 'ci-stub-not-used'
      S3_REGION: 'us-east-1'
      S3_USE_SSL: 'false'
      S3_BUCKET_FILES: 'ci-stub-files'
      S3_BUCKET_IMAGES: 'ci-stub-images'
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Node 24, matching Web E2E. Node 20's npm rejects the current esbuild
      # optional-dependency set with EBADPLATFORM before a single test runs.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/web-console/package-lock.json

      # The hosted project this job used to read its five Supabase values from
      # is gone (the demo box cut over to self-hosted Supabase, PRs #982-#993),
      # and with it went every session this job minted: the state file was
      # complete, the application just did not look for its cookies. Web E2E
      # solved the same problem by standing up its own GoTrue + PostgREST on a
      # throwaway Postgres, and this step is that arrangement, verbatim in
      # shape: scripts/ci-supabase-stack.sh boots the auth surface, applies the
      # real migration chain, asserts the browser's CORS contract, and prints
      # the five values both consumers need. One source for all of them is what
      # makes the mint's cookie and the bundle's expected cookie name agree by
      # construction rather than by two secrets happening to match.
      #
      # psql ships on the runner image; unlike Web E2E no apt fallback is
      # carried here because this step has no other work to overlap it with.
      - name: Start a throwaway Supabase (Postgres, GoTrue, PostgREST)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            echo "::error::psql is unavailable on this runner image"
            exit 1
          fi

          # Same image and tag web-e2e's throwaway step uses.
          docker run -d --name hive-ci-db -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=hive_ci \
            pgvector/pgvector:pg17
          for _ in $(seq 1 90); do
            if docker exec hive-ci-db pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          if ! docker exec hive-ci-db pg_isready -U postgres -h 127.0.0.1; then
            echo "::error::the throwaway Postgres never became ready"
            docker logs hive-ci-db | tail -40
            exit 1
          fi

          export PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres \
                 PGPASSWORD=postgres PGDATABASE=hive_ci

          scripts/ci-supabase-stack.sh --port 9000 > /tmp/supabase-env
          # A zero exit with truncated stdout would surface three steps later as
          # an unset variable inside Playwright, so check the file has each line
          # before exporting any of them.
          for v in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY \
                   SUPABASE_URL_FROM_CONTAINER; do
            if ! grep -q "^$v=." /tmp/supabase-env; then
              echo "::error::the throwaway Supabase stack printed no $v line"
              exit 1
            fi
          done
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            case "$line" in
              *_KEY=*) echo "::add-mask::${line#*=}" ;;
            esac
            echo "$line" >> "$GITHUB_ENV"
          done < /tmp/supabase-env
          # The two NEXT_PUBLIC_ mirrors the browser bundle and the Next.js
          # build read, derived from the same source as SUPABASE_URL itself.
          sed -n 's/^SUPABASE_URL=/NEXT_PUBLIC_SUPABASE_URL=/p'           /tmp/supabase-env >> "$GITHUB_ENV"
          sed -n 's/^SUPABASE_ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/p' /tmp/supabase-env >> "$GITHUB_ENV"

          gw=$(docker network inspect bridge -f '{{ (index .IPAM.Config 0).Gateway }}')
          dsn="postgres://postgres:postgres@${gw}:5432/hive_ci?sslmode=disable"
          echo "SUPABASE_DB_URL=$dsn" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_POOL_URL=$dsn" >> "$GITHUB_ENV"

      - name: Build stack images
        uses: docker/bake-action@v7
        with:
          workdir: .
          files: |
            ./deploy/docker/docker-bake.hcl
          targets: edge-api,control-plane
          load: true
          set: |
            *.cache-from=type=gha,scope=stack
            *.cache-to=type=gha,scope=stack,mode=max

      - name: Start core stack
        working-directory: deploy/docker
        env:
          # control-plane resolves auth users against SUPABASE_URL from inside
          # a container, where localhost is the container itself. The throwaway
          # gateway publishes on the runner, so the service gets the docker
          # bridge form of the same URL the browser uses, exactly as Web E2E
          # hands it over.
          SUPABASE_URL: ${{ env.SUPABASE_URL_FROM_CONTAINER }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
        run: docker compose --profile local up -d redis litellm control-plane edge-api

      - name: Wait for services to become healthy
        working-directory: deploy/docker
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 300 ))
          for svc in control-plane edge-api; do
            while :; do
              state=$(docker inspect --format '{{.State.Health.Status}}' \
                "$(docker compose ps -q $svc)" 2>/dev/null || echo "starting")
              if [ "$state" = "healthy" ]; then
                echo "$svc: healthy"
                break
              fi
              if [ "$(date +%s)" -gt "$deadline" ]; then
                echo "::error::$svc did not become healthy (last state: $state)"
                docker compose logs --tail=200 $svc
                exit 1
              fi
              sleep 5
            done
          done

      - name: Install web-console deps
        working-directory: apps/web-console
        run: npm ci

      - name: Read Playwright version
        id: pw
        working-directory: apps/web-console
        run: |
          v=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: apps/web-console
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: apps/web-console
        run: npx playwright install-deps chromium

      # The compose `web-console` service COPYs source into its image and
      # mounts no volume, so a compose run without `--build` would drive a
      # stale bundle and report a green gate for code that is not in this
      # commit. This job sidesteps that entirely by building the app from
      # the checkout here, the same way the Web E2E job does.
      - name: Build + start Next.js from this checkout
        working-directory: apps/web-console
        env:
          # NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY and
          # SUPABASE_SERVICE_ROLE_KEY come from $GITHUB_ENV now, written by the
          # throwaway stack step. Naming the repository secrets here again is
          # the exact precedence mistake that stalled this gate: the bundle
          # would bake one project's URL while the mint wrote another's cookie.
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          CONTROL_PLANE_BASE_URL: http://localhost:8081
        run: |
          npm run build
          nohup npm start > /tmp/nextjs-interaction.log 2>&1 &
          for i in {1..60}; do
            if (echo > /dev/tcp/127.0.0.1/3000) 2>/dev/null; then echo "Next.js up"; exit 0; fi
            sleep 2
          done
          echo "::error::Next.js did not start"; cat /tmp/nextjs-interaction.log; exit 1

      - name: Resolve this job's fixture identity
        # One place, because these three values must agree exactly and have
        # twice failed by drifting apart.
        #
        # The run key has to be unique per JOB, not per workflow run. Web E2E
        # uses `<run_id>-<attempt>`, and e2e-fixture-seed.mjs derives its
        # account UUIDs and its inviter address from the key, so adopting that
        # same key put both jobs in one identity namespace inside a single
        # workflow run: they seeded the same derived rows and the later one
        # reassigned them, which left this job's own address with no row in
        # auth.users at all and the mint with nothing to sign into.
        #
        # The key also has to appear in the address, because runScopedEmail
        # rewrites any address that does not already contain `+<key>@` and the
        # seeder then provisions an account nobody signs in as. Both
        # constraints at once means the key is in the local part twice over,
        # which is ugly and correct.
        #
        # The invitation token is random and masked for the same reason as in
        # Web E2E: the seeder stores its sha256 as a live pending invitation,
        # and anything derived from the public run page is a published
        # credential for as long as the run lasts.
        run: |
          set -euo pipefail
          key="interaction-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "INTERACTION_RUN_KEY=$key" >> "$GITHUB_ENV"
          echo "INTERACTION_FIXTURE_EMAIL=interaction-gate+$key@scubed.com.bd" >> "$GITHUB_ENV"
          echo "INTERACTION_FIXTURE_EMAIL_UNVERIFIED=interaction-gate-unverified+$key@scubed.com.bd" >> "$GITHUB_ENV"
          token="$(openssl rand -hex 24)"
          echo "::add-mask::$token"
          echo "E2E_INVITATION_TOKEN=$token" >> "$GITHUB_ENV"
          # The two fixture passwords are generated here for the reason Web
          # E2E states at its own generation step: the accounts are created by
          # this run's seeder in a throwaway GoTrue at run-scoped addresses, so
          # a value shared across runs bought nothing, and as a repository
          # secret it arrived empty on every Dependabot-triggered run.
          for var in E2E_VERIFIED_PASSWORD E2E_UNVERIFIED_PASSWORD; do
            secret="$(openssl rand -hex 24)"
            echo "::add-mask::$secret"
            echo "$var=$secret" >> "$GITHUB_ENV"
          done

      - name: Seed the fixture identity the gate signs in as
        working-directory: apps/web-console
        env:
          # SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY come from $GITHUB_ENV
          # (the throwaway stack). Naming the repository secret here would hand
          # the seeder a key from a different surface than the GoTrue it talks
          # to, and every admin call answers "invalid JWT". Web E2E measured
          # exactly that failure in run 32266955684.
          E2E_RUN_KEY: ${{ env.INTERACTION_RUN_KEY }}
          E2E_VERIFIED_EMAIL: ${{ env.INTERACTION_FIXTURE_EMAIL }}
          E2E_VERIFIED_PASSWORD: ${{ env.E2E_VERIFIED_PASSWORD }}
          E2E_UNVERIFIED_EMAIL: ${{ env.INTERACTION_FIXTURE_EMAIL_UNVERIFIED }}
          E2E_UNVERIFIED_PASSWORD: ${{ env.E2E_UNVERIFIED_PASSWORD }}
          E2E_INVITATION_TOKEN: ${{ env.E2E_INVITATION_TOKEN }}
          # Prints the summary of what it actually seeded, which the next line
          # checks. Without it the seeder is silent on success, and a run that
          # provisioned the wrong address exits zero.
          E2E_FIXTURE_VERBOSE: '1'
        run: |
          set -euo pipefail
          node tests/e2e/support/e2e-auth-fixtures.mjs | tee /tmp/interaction-seed.json
          # Loud at the source. The gate mints for INTERACTION_FIXTURE_EMAIL;
          # if the seeder finished without creating exactly that address, fail
          # here naming it, rather than letting the sweep discover it as every
          # authenticated route redirecting to the sign-in page.
          node -e '
            const fs = require("node:fs");
            const want = process.env.INTERACTION_FIXTURE_EMAIL;
            const got = JSON.parse(fs.readFileSync("/tmp/interaction-seed.json", "utf8")).verifiedEmail;
            if (got !== want) {
              console.error(`::error::the fixture step seeded ${got} but the gate signs in as ${want}; the mint would have no account`);
              process.exit(1);
            }
            console.log(`seeded the address the gate signs in as: ${want}`);
          '

      # The setup project shells out to tests/e2e/support/live-auth.mjs, which
      # mints through the admin one-time-token flow against SUPABASE_URL and
      # needs SUPABASE_ANON_KEY plus SUPABASE_SERVICE_ROLE_KEY. All three come
      # from $GITHUB_ENV now; no password variable exists because live-auth
      # never reads, sets or rotates a credential of the account it signs in
      # as.
      - name: Run the interaction coverage gate
        working-directory: apps/web-console
        env:
          INTERACTION_BASE_URL: http://localhost:3000
          INTERACTION_EMAIL: ${{ env.INTERACTION_FIXTURE_EMAIL }}
        run: npm run test:interaction

      # The Playwright HTML report serializes input values into ARIA
      # snapshots, and this gate types into password fields (issue #554), so
      # the report is never uploaded. The JSON coverage document is, and every
      # URL it records has had its fragment dropped and its credential-shaped
      # query parameters replaced before it was written.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interaction-coverage
          path: apps/web-console/interaction-coverage/
          if-no-files-found: warn

      # Redacted, like the other two dump steps in this workflow. Container
      # logs carry OAuth callbacks, bearer headers and API keys verbatim, and
      # an artifact from a public repository is downloadable by anyone holding
      # the run URL.
      - name: Dump compose logs on failure
        if: failure()
        working-directory: deploy/docker
        run: docker compose logs --no-color --timestamps --tail=500 2>&1 | python3 ../../scripts/redact-log-credentials.py > /tmp/compose-interaction.log || true

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs-interaction
          path: /tmp/compose-interaction.log
          if-no-files-found: ignore

      - name: Tear down stack
        if: always()
        working-directory: deploy/docker
        run: docker compose down -v --remove-orphans || true

      - name: Tear down the throwaway Supabase
        if: always()
        # Same reasoning as Web E2E's identical step: containers first, then
        # the network, because the script is also run by hand in development
        # and leftovers accumulate there.
        run: |
          docker rm -f supabase-gw supabase-rest supabase-auth hive-ci-db || true
          docker network rm hive-ci-supabase || true

  # ------------------------------------------------------------------
  # Egress firewall e2e (issue #342 item 6). Live proof that the Linux
  # desktop egress allowlist blocks disallowed outbound traffic inside a
  # real bubblewrap sandbox, and lets allowlisted traffic through. Runs
  # the shipped enforcement components verbatim (codex-bwrap's bwrap, the
  # AllowlistProxy, hive-egress-shim) via scripts/egress-bwrap-e2e.sh.
  #
  # Additive and isolated: a fresh job, not a required check yet (mirrors
  # rust-tests / desktop-tests, which graduate to required once they have
  # a track record on main). Builds the shipped bwrap and points
  # HIVE_BWRAP_PATH at it so the test exercises the binary that ships, not
  # a system bwrap.
  # ------------------------------------------------------------------

  egress-firewall-e2e:
    name: Egress firewall e2e (bwrap)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.run == 'true'
    defaults:
      run:
        working-directory: apps/desktop-sandbox
    steps:
      - uses: actions/checkout@v7

      - name: Install libcap headers + build deps
        # codex-bwrap's build.rs compiles vendored bubblewrap against libcap.
        run: sudo apt-get update && sudo apt-get install -y libcap-dev pkg-config

      - name: Allow unprivileged user namespaces
        # GitHub's ubuntu runners support unprivileged userns, but Ubuntu's
        # AppArmor restriction blocks bubblewrap's --unshare-user by default.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop-sandbox/target
          key: rust-desktop-sandbox-egress-${{ hashFiles('apps/desktop-sandbox/Cargo.lock') }}
          restore-keys: |
            rust-desktop-sandbox-

      - name: Build shipped bwrap + shim + proxy harness
        run: >-
          cargo build -p codex-bwrap --bin bwrap
          -p hive-desktop-sandbox --bin hive-egress-shim
          --example egress-proxy-harness

      - name: Run egress allowlist e2e inside a real bwrap sandbox
        env:
          HIVE_EGRESS_E2E_REQUIRE: "1"
          HIVE_BWRAP_PATH: ${{ github.workspace }}/apps/desktop-sandbox/target/debug/bwrap
        run: ./scripts/egress-bwrap-e2e.sh
