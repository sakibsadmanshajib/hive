name: CI

# Deliberately NO `paths:` / `paths-ignore:` filter on any trigger. See the
# `changes` job below: path filtering happens inside the workflow so that this
# file is the only producer of every required check name (issue #553).
on:
  pull_request:
    branches: [main]
    # `ready_for_review` is required: none of the default activity types fire
    # when a draft pull request is marked ready with no further pushes, so
    # without it this workflow never runs and every required check stays
    # unpublished. Enforced by .github/ci/lint-workflow-check-names.mjs.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  schedule:
    # Daily fidelity run on main: exercises paid hive-default model to catch
    # provider regressions that a free-tier model might silently swallow.
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Docker image tags used across live-integration + web-e2e so everyone
  # references the same pre-built image.
  EDGE_IMAGE: hive-edge-api:ci
  CP_IMAGE: hive-control-plane:ci
  WEB_IMAGE: hive-web-console:ci

jobs:
  # ------------------------------------------------------------------
  # Single source of truth for "does this diff need the real suite?".
  #
  # Path filtering used to live in the `on:` trigger. GitHub skips the
  # whole workflow when a trigger path filter does not match, and a
  # skipped workflow never creates its check runs, so every required
  # check stayed Pending and blocked the merge. The previous workaround
  # was a second workflow (ci-noop.yml) that fired on the inverse path
  # set and published job names identical to the ones here as trivial
  # `echo` steps. Because `paths-ignore` matches when ANY changed file
  # falls outside the ignore set, a pull request touching both code and
  # docs fired BOTH workflows, and the echo could report success on
  # every required context in seconds. That made the merge gate
  # ambiguous on this repo's most common pull request shape (the visual
  # proof rule means most substantive changes commit screenshots under
  # docs/ alongside code). Issue #553.
  #
  # Filtering inside the workflow removes the second producer entirely:
  # each required check name is published by exactly one job in exactly
  # one workflow, so no `echo` can ever stand in for a real suite that
  # failed.
  #
  # Two tiers of gating, deliberately different:
  #
  #   * Jobs that publish a REQUIRED check name (go-tests,
  #     repo-policy-lints, web-unit) carry `if: always()` and gate their
  #     individual steps. They therefore always run to completion and
  #     always report their own conclusion. This does not rely on how
  #     branch protection treats a check run whose conclusion is
  #     `skipped`, which is the one thing that cannot be verified on a
  #     pull request into a protected branch until after the change is
  #     already merged. A required job that concludes `success` with no
  #     real steps executed is unambiguous on every GitHub version.
  #
  #   * Jobs that are NOT required (rust-tests, desktop-tests,
  #     agent-console-unit, docker-build, live-integration, web-e2e,
  #     egress-firewall-e2e) use a plain job-level `if:` and are simply
  #     skipped, because a skipped non-required check cannot block
  #     anything.
  #
  # The step-level condition is `!= 'false'` rather than `== 'true'` so
  # that a `changes` job that failed or was cancelled leaves an empty
  # output and the real suite runs anyway.
  #
  # Polarity is deliberate. This is an allow-list of paths that are safe
  # to ignore, and ANYTHING else means run=true, including an
  # unrecognized path, an API error, or an event that carries no diff
  # (schedule, workflow_dispatch). A false "run" costs CI minutes. A
  # false "skip" would defeat the merge gate, so the default must never
  # be "skip".
  # ------------------------------------------------------------------

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only this job needs the pull request file list, so the extra scope
    # is granted here instead of at workflow level.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      # Narrower than `run`: true only when a changed path can actually
      # affect the browser flow web-e2e exercises. See the decide step for
      # the reasoning per path category (issue #659 follow-up).
      web_e2e: ${{ steps.decide.outputs.web_e2e }}
    steps:
      - name: Decide whether the real suite must run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          run_everything() {
            # Also runs web-e2e: every one of these is a case where the
            # diff itself is unknown (API failure, no base commit, a
            # non-diff event, a possibly-truncated list), and the whole
            # point of the narrower web_e2e gate below is to skip only
            # when the actual changed paths are known and provably
            # irrelevant to the browser flow.
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "web_e2e=true" >> "$GITHUB_OUTPUT"
            echo "verdict: RUN the real suite — $1"
            exit 0
          }

          # The API is asked for the same file list GitHub itself would
          # have path-filtered on, so there is no dependency on clone
          # depth or on merge-base resolution.
          # Both endpoints cap the file list they will return: 3000 for
          # a pull request, 300 for a comparison. A truncated list would
          # hide a code path behind a docs-only prefix, so the count is
          # compared against the cap below and a list at the cap runs
          # everything.
          case "$EVENT" in
            pull_request)
              cap=3000
              files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --paginate \
                        --jq '.[].filename') \
                || run_everything "could not list pull request files"
              ;;
            push)
              cap=300
              case "$BEFORE_SHA" in
                '' | 0000000000000000000000000000000000000000)
                  run_everything "push event has no usable base commit"
                  ;;
              esac
              files=$(gh api "repos/$REPO/compare/$BEFORE_SHA...$AFTER_SHA?per_page=100" --paginate \
                        --jq '.files[]?.filename') \
                || run_everything "could not compare $BEFORE_SHA...$AFTER_SHA"
              ;;
            *)
              run_everything "event '$EVENT' carries no diff"
              ;;
          esac

          if [ -z "$files" ]; then
            run_everything "changed-file list came back empty"
          fi

          printf '%s\n' "$files" > /tmp/changed-files.txt
          echo "changed files:"
          sed 's/^/  /' /tmp/changed-files.txt

          count=$(grep -c . /tmp/changed-files.txt || true)
          if [ "${count:-0}" -ge "$cap" ]; then
            run_everything "changed-file list has $count entries and may be truncated at the API cap of $cap"
          fi

          # Deny by executable extension first, and keep that arm FIRST.
          # Every arm below it is a directory grant that ends in
          # `continue`, so an extension listed after them would be
          # silently swallowed instead of denied. A directory cannot stay
          # inert as it grows: .wolf/ and .claude/ already hold hook
          # scripts, and any script or compiled source under an
          # allow-listed prefix is executable code that could change how a
          # build, test or lint behaves. The arm is not enumerated again in
          # this comment, because a second copy of the list is a second
          # thing to forget. Extension-deny needs no maintenance as those
          # directories grow, and still lets the genuinely inert paths
          # through (.wolf/*.md, .wolf/buglog.jsonl, docs/ screenshots).
          #
          # Allow-list: paths that cannot affect any build, test or lint
          # in this workflow. Keep it narrow. Adding an entry here weakens
          # the merge gate for every future pull request.
          #
          # Below, the loop also computes web_e2e, a second and much
          # narrower signal used only to gate the non-required web-e2e
          # job (issue #659 follow-up: four unrelated PRs, a migration
          # baseline script, a payments webhook cap, a decision ledger
          # amendment, and a reservation reaper, all ran the full browser
          # suite the same evening and collided on the shared Supabase
          # pool, issue #631). Unlike `run` above, this is an opt-in
          # allow-list: web_e2e starts false and only a path that can
          # actually reach the booted browser flow turns it true. That
          # is deliberately the opposite default from `run`, because
          # `run` gates required checks (a missed skip there would hide
          # a real regression) while web-e2e is not a required check, so
          # a missed skip here only costs CI minutes and pool
          # contention, not correctness. The categories, and why:
          #   - apps/web-console/*   the app under test, and its own
          #     Playwright specs (apps/web-console/e2e,
          #     apps/web-console/tests/e2e).
          #   - apps/edge-api/*, apps/control-plane/*   the two Go
          #     services this job builds via docker/bake-action and
          #     boots (deploy/docker/Dockerfile.edge-api,
          #     Dockerfile.control-plane) before Playwright runs.
          #   - packages/storage/*, packages/audit-canonical/*,
          #     packages/embedmodel/*   go.work members actually
          #     imported by edge-api and/or control-plane (confirmed by
          #     grep, not assumed), so a change here changes the built
          #     images even though the path isn't under apps/.
          #   - deploy/docker/*   the compose files and Dockerfiles the
          #     job runs (`docker compose ... up`, docker-bake.hcl).
          #   - scripts/ci-throwaway-db.sh, scripts/ci-supabase-stack.sh
          #     the two the job runs to build its own database and its own
          #     GoTrue plus PostgREST before anything boots.
          #   - supabase/migrations/*   this job now APPLIES the chain
          #     itself, onto a throwaway Postgres, so a migration file is
          #     part of what the browser flow exercises. It used to be
          #     excluded here, correctly at the time, because the job ran
          #     against the shared project's already-live schema that a
          #     merged migration did not change until `supabase db push`.
          #     That is no longer true and the exclusion had to go with it.
          #   - .github/workflows/ci.yml   this file, so a change to the
          #     web-e2e job definition (or to this gate) proves itself
          #     by actually running, instead of the new wiring going
          #     untested the way the routing integration tests did
          #     before issue #655.
          run="false"
          web_e2e="false"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              *.js | *.mjs | *.cjs | *.jsx | *.ts | *.mts | *.cts | *.tsx \
              | *.sh | *.py)
                run="true"
                ;;
              *.md | LICENSE | NOTICE) : ;;
              docs/* | .wolf/* | .claude/* | .vscode/* | .cursor/*) : ;;
              *) run="true" ;;
            esac
            case "$f" in
              apps/web-console/* | apps/edge-api/* | apps/control-plane/* \
              | packages/storage/* | packages/audit-canonical/* \
              | packages/embedmodel/* | deploy/docker/* \
              | supabase/migrations/* | deploy/supabase/init/* \
              | scripts/ci-throwaway-db.sh | scripts/ci-supabase-stack.sh \
              | scripts/apply-migrations.sh | .github/ci/test-db-bootstrap.sql \
              | .github/workflows/ci.yml)
                web_e2e="true"
                ;;
            esac
          done < /tmp/changed-files.txt

          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "web_e2e=$web_e2e" >> "$GITHUB_OUTPUT"
          if [ "$run" = "true" ]; then
            echo "verdict: RUN the real suite, a changed path is outside the docs-only allow-list"
          else
            echo "verdict: SKIP — every changed path is docs-only"
          fi
          if [ "$web_e2e" = "true" ]; then
            echo "web-e2e verdict: RUN, a changed path can affect the booted browser flow"
          else
            echo "web-e2e verdict: SKIP, no changed path can affect the booted browser flow"
          fi

  # ------------------------------------------------------------------
  # Unit-level jobs (run on every PR including forks)
  # ------------------------------------------------------------------

  go-tests:
    name: Go tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # REQUIRED CHECK. Always runs and always reports its own conclusion; the
    # docs-only decision is applied per step. See the note above `changes`.
    needs: changes
    if: always()
    # Ephemeral Postgres for HIVE_TEST_DB_URL-gated RLS suites (issue #311
    # follow-up). Version pin: no supabase/config.toml or other in-repo
    # pin exists, so this tracks Supabase's current default managed
    # Postgres major (17) as the closest available reference — bump this
    # tag if that default changes. pgvector/pgvector (not the plain
    # postgres image) because 20260625_01_enable_pgvector.sql needs the
    # vector extension pre-built; the image is otherwise a drop-in
    # postgres. Runs for every matrix leg (services: is job-level, not
    # matrix-scoped in GitHub Actions) but only control-plane/edge-api
    # actually use it below.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: edge-api
            path: ./apps/edge-api
          - module: control-plane
            path: ./apps/control-plane
          - module: storage
            path: ./packages/storage
          - module: agent-engine
            path: ./apps/agent-engine
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.run != 'false'

      - uses: actions/setup-go@v5
        if: needs.changes.outputs.run != 'false'
        with:
          go-version: '1.24'
          cache-dependency-path: |
            apps/edge-api/go.sum
            apps/control-plane/go.sum
            packages/storage/go.sum
            apps/agent-engine/go.sum

      - name: go vet
        if: needs.changes.outputs.run != 'false'
        working-directory: ${{ matrix.path }}
        run: go vet ./...

      - name: go test
        if: needs.changes.outputs.run != 'false'
        working-directory: ${{ matrix.path }}
        run: go test -count=1 -short -race -timeout 5m ./...

      # ------------------------------------------------------------------
      # Bootstrap the ephemeral Postgres above with the real schema
      # (supabase/migrations/, applied in order) plus a CI-only stand-in
      # for the Supabase-managed objects (roles, auth schema) those
      # migrations assume already exist on a real project. Only
      # control-plane and edge-api have HIVE_TEST_DB_URL-gated RLS suites;
      # the other two matrix legs skip this and the step below.
      #
      # Verified locally against a scratch pgvector/pgvector:pg17
      # container before wiring this in: the full migration chain applies
      # and every suite below passes for real, not skipped.
      # ------------------------------------------------------------------

      - name: Bootstrap live Postgres schema (control-plane, edge-api only)
        if: >-
          needs.changes.outputs.run != 'false' &&
          (matrix.module == 'control-plane' || matrix.module == 'edge-api')
        run: |
          set -euo pipefail
          dsn="postgresql://postgres:postgres@127.0.0.1:5432/hive_test?sslmode=disable"
          psql "$dsn" -v ON_ERROR_STOP=1 -f .github/ci/test-db-bootstrap.sql
          for f in supabase/migrations/*.sql; do
            psql "$dsn" -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "HIVE_TEST_DB_URL=$dsn" >> "$GITHUB_ENV"
          # Same ephemeral database, same full migration chain (including
          # 20260801_01_alias_pricing_correction.sql), read via the routing
          # package's own env var name (issue #655). Separate name from
          # HIVE_TEST_DB_URL because the integration test predates this
          # wiring and was never plumbed into any workflow; no reason to
          # rename it now that it is.
          echo "ROUTING_TEST_DB_URL=$dsn" >> "$GITHUB_ENV"
          # Same ephemeral database again, read via litellmconfig's own env
          # var name (issue #701). That suite predates this wiring too and
          # had never run anywhere: it was gated behind LITELLM_TEST_DB_URL,
          # which appeared nowhere under .github/, so a query against a
          # column that does not exist on provider_routes shipped and never
          # failed a single CI run.
          echo "LITELLM_TEST_DB_URL=$dsn" >> "$GITHUB_ENV"
          # Same ephemeral database again, read via catalog's own env var
          # name (issue #708). TestTenantVisibilityIntegration was gated
          # behind CATALOG_TEST_DB_URL, which appeared nowhere under
          # .github/, so it never ran; its fixture also hardcoded two
          # tenant UUIDs it never inserted into public.tenants, so it would
          # have failed its first real run on the FK from
          # tenant_model_visibility.tenant_id. Both are fixed by this PR.
          echo "CATALOG_TEST_DB_URL=$dsn" >> "$GITHUB_ENV"
          # Same ephemeral database again, read via providers' own env var
          # name (issue #708). TestProviderCRUDIntegration was gated behind
          # PROVIDERS_TEST_DB_URL, which appeared nowhere under .github/, so
          # it never ran; its fixture also omitted route_id (a text primary
          # key with no default) on its provider_routes insert, so it would
          # have failed its first real run on the not-null constraint. Both
          # are fixed by this PR.
          echo "PROVIDERS_TEST_DB_URL=$dsn" >> "$GITHUB_ENV"

      - name: go test — RLS suites against live Postgres (control-plane, edge-api only)
        if: >-
          needs.changes.outputs.run != 'false' &&
          (matrix.module == 'control-plane' || matrix.module == 'edge-api')
        working-directory: ${{ matrix.path }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.module }}" = "control-plane" ]; then
            # -tags integration additionally compiles in
            # routing/catalog_pricing_integration_test.go (issue #655),
            # litellmconfig/sync_integration_test.go (issue #701), and
            # catalog/catalog_integration_test.go +
            # providers/integration_test.go (issue #708), which carry a
            # //go:build integration constraint the other packages below do
            # not use; passing the tag is a no-op for them.
            # -p 1 forces packages to run sequentially rather than in
            # parallel across GOMAXPROCS (issue #708 review): several of
            # these suites (routing, catalog, providers) share one live
            # database and can observe each other's transient rows when run
            # concurrently, which is a flaky-collision risk, not a real bug.
            # ./internal/platform/db/... is here for
            # TestSessionPoolReleasesIdleConnections, which asserts on live
            # server backends and so needs HIVE_TEST_DB_URL. Listing it in the
            # -short step above instead would have skipped it silently, which
            # is the same never-runs trap as issues #701 and #708.
            # ./internal/platform (the package itself, not the tree) carries
            # the membership-status guards for IsPlatformAdmin and
            # IsWorkspaceOwner plus the tenant_users RLS suite. Both need a
            # live database, and neither ran anywhere before: the package was
            # absent from this list, so the escalation those guards catch
            # would have shipped again with the suite reporting green.
            # tools/lint-go-db-test-wiring.mjs fails if either is dropped.
            # ./internal/accounting/... carries the credit-reservation
            # settlement suites. Its two HIVE_TEST_DB_URL-gated tests, the
            # release-key dedup proof (issue #652) and the settlement magnitude
            # proof (issue #616), had never run anywhere: the package was absent
            # from this list and the -short step above skips them for want of
            # the env var. The magnitude one is the only check that measures the
            # ledger on real Postgres rather than through a fake, so leaving it
            # unlisted is the same never-runs trap as issues #701 and #708, on
            # the money path.
            # ./internal/ledger/... joins the list with issue #918: its balance
            # query is the only place an over-released reservation can be caught,
            # and the proof that it no longer renders one as a hold has to run
            # against real Postgres.
            go test -tags integration -count=1 -p 1 -v ./internal/accounts/... ./internal/accounting/... ./internal/ledger/... ./internal/agenttask/... ./internal/usermemories/... ./internal/egress/... ./internal/payments/... ./internal/profiles/... ./internal/rag/... ./internal/tenants/... ./internal/signup/... ./internal/routing/... ./internal/litellmconfig/... ./internal/catalog/... ./internal/providers/... ./internal/platform ./internal/platform/db/...
          else
            # -tags integration additionally compiles in
            # inference/chat_completions_integration_test.go (issue #708),
            # which needs no DB (it mocks LiteLLM and control-plane with
            # httptest) and never ran purely because this step never passed
            # the tag. ./internal/chat/... and ./internal/auth/... carry
            # HIVE_TEST_DB_URL-gated tests that ran neither here nor in the
            # plain `go test ./...` step above (that step excludes them via
            # -short/skip, this step simply never included the packages);
            # both are now wired for real.
            go test -tags integration -count=1 -p 1 -v ./internal/artifacts/... ./internal/rag/... ./internal/chat/... ./internal/auth/... ./internal/inference/...
          fi

  # ------------------------------------------------------------------
  # Rust tests — desktop sandbox backends (issue #306). Toolchain version
  # comes from apps/desktop-sandbox/rust-toolchain.toml; ubuntu-latest ships
  # rustup preinstalled, which reads that file automatically from the
  # working directory below. Intended to become a required check once this
  # job has a track record on main (see VENDORING.md).
  # ------------------------------------------------------------------

  rust-tests:
    name: Rust tests (desktop-sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.run == 'true'
    defaults:
      run:
        working-directory: apps/desktop-sandbox
    steps:
      - uses: actions/checkout@v4

      - name: Install libcap headers
        # codex-bwrap's build.rs compiles vendored bubblewrap against libcap.
        run: sudo apt-get update && sudo apt-get install -y libcap-dev pkg-config

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop-sandbox/target
          key: rust-desktop-sandbox-${{ hashFiles('apps/desktop-sandbox/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      # windows.rs is #[cfg(windows)]-gated, so the Linux legs above never
      # compile it. Cross-compile the crate to x86_64-pc-windows-gnu so the
      # Win32 FFI is actually type-checked against windows-crate 0.58's real
      # signatures on every PR (a broken call shape now fails CI instead of
      # only surfacing on a Windows host). `cargo check`/`clippy` do not link,
      # so no MinGW linker is needed; adding the target's std is enough. Scoped
      # to -p hive-desktop-sandbox to skip the vendored bwrap C build. MSVC is
      # not cross-checkable here (no linker); see VENDORING.md open risk #2.
      #
      # -p codex-windows-sandbox is included from Step 3 Wave 1 onward: its
      # vendored modules are ALSO #[cfg(windows)]-gated (see its lib.rs) and
      # need the same cross-compile to be exercised at all in CI.
      - name: Add Windows cross target
        run: rustup target add x86_64-pc-windows-gnu

      - name: cargo check (Windows FFI cross-compile)
        run: cargo check --target x86_64-pc-windows-gnu -p hive-desktop-sandbox -p codex-windows-sandbox

      - name: cargo clippy (Windows FFI cross-compile)
        run: cargo clippy --target x86_64-pc-windows-gnu -p hive-desktop-sandbox -p codex-windows-sandbox -- -D warnings

  # ------------------------------------------------------------------
  # Desktop app (Tauri shell, issue #310/#311). Toolchain version comes
  # from apps/desktop/src-tauri/rust-toolchain.toml, same auto-detect as
  # the desktop-sandbox job above. System libs mirror
  # deploy/docker/Dockerfile.desktop-linux (Tauri needs GTK/WebKit
  # headers to build on Linux even for `cargo test`, not just packaging).
  # ------------------------------------------------------------------

  desktop-tests:
    name: Desktop app (Rust + TS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK/WebKit headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: rust-desktop-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: cargo fmt --check
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Type check
        working-directory: apps/desktop
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        working-directory: apps/desktop
        run: npm run test:unit

      - name: Build (vite)
        working-directory: apps/desktop
        run: npm run build

  # ------------------------------------------------------------------
  # Repo-policy lints — tenancy + audit guards that apply across the
  # whole tree. Each script lives under tools/ and is the source of
  # truth for which packages are allowed to write the protected
  # surfaces (audit_log, tenant_settings, raw tenant_id). Previously
  # only fired in the phase-19 workflow; promoted here so every PR
  # benefits regardless of which area it touches.
  # ------------------------------------------------------------------

  repo-policy-lints:
    name: Repo policy lints (tenant + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # REQUIRED CHECK. Always runs and always reports its own conclusion; the
    # docs-only decision is applied per step. See the note above `changes`.
    needs: changes
    if: always()
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.run != 'false'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.run != 'false'
        with:
          node-version: '20'

      - name: Install repo-level dev deps
        if: needs.changes.outputs.run != 'false'
        run: npm ci --ignore-scripts

      # Merge-gate integrity: exactly one job may publish each required
      # check name, and every required context must have a producer.
      # Lives in this job because it is a required check itself, so the
      # guard cannot be bypassed by a change that only touches workflows.
      - if: needs.changes.outputs.run != 'false'
        run: node .github/ci/lint-workflow-check-names.mjs

      # Deploy path-filter coverage: every COPY/ADD source in every
      # deploy/docker/Dockerfile.* must have a matching entry in
      # deploy-demo-box.yml's push.paths, or a merge to main that only
      # touches that source ships silently to nowhere. Lives here for the
      # same reason lint-workflow-check-names.mjs does: this job is a
      # required check, so the guard cannot be bypassed by a change that
      # only touches workflows or Dockerfiles.
      - if: needs.changes.outputs.run != 'false'
        run: node .github/ci/lint-deploy-paths-filter.mjs

      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:tenant-setting
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:tenant-id
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:audit-write
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:desktop-local-http
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:request-url-origin
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:model-visibility
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:proof-tokens
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:litellm-routing
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:pgx-dsn
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:litellm-config
      # A synchronous child process in a Playwright spec freezes the worker's
      # event loop, so no test timeout in that file can fire while it runs.
      # PR #838 found a test recorded as passed at 30194 ms under a 30000 ms
      # timeout. Runs here, in a required check, rather than in web-unit,
      # because it needs nothing but node and must fire on every PR.
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:sync-child-process
      # Drive-by, found while checking the wiring above: this lint existed in
      # package.json but no workflow ran it, so it was coverage on paper only.
      # It passes on main today.
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:no-client-cost-fields

      # Issue #813, spec wiring. Moved to web-unit (see that job): asking
      # Playwright which projects a config declares needs the web console's
      # own node_modules, which this dependency-light job deliberately does
      # not install.

      # Issue #659, #797. A Go package carrying a database-gated test skips
      # silently when it is absent from the RLS step's package list, which is
      # how the platform package went from never running to green in one line.
      # Fixture regression test: two matrix legs, one shell `if` with no
      # `else` wrapping a single go test line, so only one leg's package is
      # actually reached. The other leg's DSN-gated package must be reported
      # unpaired, not credited via the directory the wrapped line shares with
      # every leg regardless of the branch that selects it.
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:go-db-test-wiring:test
      - if: needs.changes.outputs.run != 'false'
        run: npm run lint:go-db-test-wiring

      # Self-checks for the provisioning scripts (pure python, no network, no
      # framework). Wired into CI here because nothing ran them before: the
      # `make test-scripts` target existed but no workflow invoked it, so every
      # guard in scripts/test_seed_*.py was coverage on paper only. That is what
      # let the OWUI shim seed ship without a tenant_billing_accounts mapping
      # (issue #717). This job is a required check and already runs on every
      # non-docs change, and python3 is preinstalled on ubuntu-latest.
      - if: needs.changes.outputs.run != 'false'
        run: make test-scripts

      # Every Caddyfile has to ADAPT, not merely read correctly.
      #
      # This repo pins several load-bearing properties of these files with
      # structural checks (test_caddy_owui_blocklist.py,
      # test_caddy_supabase_routes.py, test_caddy_console_auth_origin.py), and
      # all of them parse the file as text. None of them can know what Caddy
      # will accept. `handle` takes exactly one matcher token, so
      # `handle /auth/v1 /auth/v1/*` is a parse error, and it passed every one
      # of those checks before crash-looping the container on the box with
      # "wrong argument count or unexpected line ending".
      #
      # The deploy workflow already validates before it reloads, so that
      # failure was loud. It was loud AFTER merge, which is the gap this closes.
      # It lives in this job rather than a new one on purpose: this job is a
      # required check, and a new non-required job's failure is invisible.
      #
      # Same pinned image the four Caddy services run, so what is validated
      # here is what will parse it there. `--config -` on stdin, so the
      # container needs no mount.
      - if: needs.changes.outputs.run != 'false'
        name: Every Caddyfile adapts
        run: |
          set -euo pipefail
          image='caddy:2-alpine@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794'
          for f in deploy/docker/Caddyfile.*; do
            echo "validating $f"
            docker run --rm -i --entrypoint caddy "$image" \
              validate --config - --adapter caddyfile < "$f"
          done

      # The Hive authored half of the vendored chat front end. Same reason as
      # the step above: nothing ran these. `test:frontend` in that package is
      # referenced only by an upstream workflow file this repository never
      # executes, so the sign in redirect decision, the one piece of that front
      # end that can lock every user out, had no pre-merge check on it. The
      # script copies the directory out and runs a pinned vitest, because
      # running it in place would need a full npm install of the chat front end.
      - if: needs.changes.outputs.run != 'false'
        run: make test-owui-frontend

  agent-console-unit:
    name: Agent console (type + unit + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.run == 'true'
    defaults:
      run:
        working-directory: apps/agent-console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/agent-console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Build (Next.js)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  web-unit:
    name: Web console (type + unit + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # REQUIRED CHECK. Always runs and always reports its own conclusion; the
    # docs-only decision is applied per step. See the note above `changes`.
    needs: changes
    if: always()
    defaults:
      run:
        working-directory: apps/web-console
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.run != 'false'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.run != 'false'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web-console/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.run != 'false'
        run: npm ci

      - name: Type check
        if: needs.changes.outputs.run != 'false'
        run: npx tsc --noEmit

      # Every Playwright spec must still land in the project the manifest pins
      # it to. Catches a spec that fails to load (the listing exits non-zero), a
      # testDir/testMatch edit that quietly stops matching a file, and a new
      # spec no project collects. Needs no browsers, no stack and no secrets.
      - name: Spec collection guard
        if: needs.changes.outputs.run != 'false'
        run: npm run e2e:verify-collection

      # Issue #813, camouflage shape 14. A Playwright spec that no workflow
      # runs emits no signal at all, and one that only a nightly runs
      # protects nothing on the merge path. Moved here, not left in
      # repo-policy-lints: it asks Playwright directly which projects a
      # config declares (see tools/verify-spec-wiring.mjs's projectsOf),
      # rather than trusting a hand-maintained copy that went stale under
      # PR #799 and produced a false positive. That needs this job's own
      # node_modules (Playwright installed), which repo-policy-lints
      # deliberately does not carry. Fixture regression test for the
      # event-condition classifier runs first, in a check that names the
      # case, rather than as a silently wrong count in the guard below.
      # tools/verify-spec-wiring.mjs parses workflow YAML with the root
      # devDependency 'yaml'. This job's only other install is the
      # apps/web-console one above, set by defaults.run.working-directory, so
      # without this the guard dies on ERR_MODULE_NOT_FOUND. The sibling
      # root-scoped steps below survive because they import nothing.
      - name: Install repo-level dev deps
        if: needs.changes.outputs.run != 'false'
        working-directory: .
        run: npm ci --ignore-scripts

      - name: Spec wiring guard test
        if: needs.changes.outputs.run != 'false'
        working-directory: .
        run: npm run lint:spec-wiring:test
      - name: Spec wiring guard
        if: needs.changes.outputs.run != 'false'
        working-directory: .
        run: npm run lint:spec-wiring

      - name: Unit tests (vitest)
        if: needs.changes.outputs.run != 'false'
        run: npm run test:unit

      - name: Build (Next.js)
        if: needs.changes.outputs.run != 'false'
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - name: Lint — no bare role checks outside authz package
        if: needs.changes.outputs.run != 'false'
        working-directory: .
        run: node packages/openai-contract/scripts/lint-no-bare-role-check.mjs apps/control-plane/internal

      - name: Codegen drift — permissions.generated.ts
        if: needs.changes.outputs.run != 'false'
        working-directory: .
        run: |
          make gen-permissions
          git diff --exit-code apps/web-console/lib/control-plane/permissions.generated.ts

  # ------------------------------------------------------------------
  # Docker build validation — fork PRs only.
  # Same-repo PRs get this implicitly via the live-integration job
  # (which builds + runs the stack against staging), so running both
  # would duplicate work and waste CI minutes.
  # ------------------------------------------------------------------

  docker-build:
    name: Docker build smoke (fork PRs only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: >-
      needs.changes.outputs.run == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build all service images (cached)
        uses: docker/bake-action@v6
        with:
          workdir: .
          files: |
            ./deploy/docker/docker-bake.hcl
          targets: edge-api,control-plane,web-console
          set: |
            *.cache-from=type=gha,scope=docker-build
            *.cache-to=type=gha,scope=docker-build,mode=max

  # ------------------------------------------------------------------
  # Live integration — builds images once with GHA cache, loads them
  # locally, starts stack against staging Supabase, runs all three SDK
  # suites in parallel.
  # Gated on same-repo only so fork PRs never receive secrets.
  # ------------------------------------------------------------------

  live-integration:
    name: Live integration (SDK tests + smoke)
    runs-on: ubuntu-latest
    # 35, matching web-e2e, because this job took on the same added work: the
    # same bounded psql fallback, a container start, and the full migration
    # chain. Measured on run 32378996099 the whole job was 3m43s and the
    # database step 17 seconds, so this is tail headroom rather than routine
    # need. Leaving it at 30 while web-e2e went to 35 would mean the one job
    # that pays for real provider completions is also the one that gets
    # cancelled first on a degraded runner, with an empty step log to read.
    timeout-minutes: 35
    # Run on push to main (post-merge gate) or on PRs that carry the
    # run-live-integration label. The label gate lets contributors
    # explicitly opt in without running paid completions on every PR.
    # The daily cron variant (schedule) also runs here to exercise the
    # paid hive-default model for fidelity checks.
    # Fork PRs are excluded: GitHub does not expose secrets to fork
    # runners on pull_request events, so no secret can leak.
    if: >-
      needs.changes.outputs.run == 'true' &&
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'run-live-integration')))
    needs: [changes, go-tests, web-unit]
    permissions:
      contents: read
      issues: write
    # Job-level env: docker compose will interpolate ${VAR} from process env,
    # so we skip the fragile .env heredoc entirely.
    env:
      # Activate the in-stack docker redis (gated to the `local` profile in
      # docker-compose.yml so staging never accidentally starts a docker
      # redis). Setting COMPOSE_PROFILES at the job level so every
      # `docker compose <subcommand>` invocation in this job — up, ps,
      # logs, down — sees the profile.
      COMPOSE_PROFILES: local
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REDIS_URL: redis://redis:6379/0
      CONTROL_PLANE_PORT: '8081'
      CONTROL_PLANE_BASE_URL: http://localhost:8081
      EDGE_CONTROL_PLANE_BASE_URL: http://control-plane:8081
      LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      # Routine PR runs use a free OpenRouter model to avoid per-token
      # charges on every merge-gate check. The daily cron run (schedule)
      # and post-merge push runs use the paid hive-default model for
      # full fidelity. HIVE_TEST_MODEL propagates into sdk-tests
      # containers via docker compose env interpolation.
      OPENROUTER_DEFAULT_MODEL: >-
        ${{ (github.event_name == 'schedule' || github.event_name == 'push')
            && vars.OPENROUTER_DEFAULT_MODEL
            || 'openrouter/mistralai/mistral-7b-instruct:free' }}
      HIVE_TEST_MODEL: >-
        ${{ (github.event_name == 'schedule' || github.event_name == 'push')
            && 'hive-default'
            || 'hive-default' }}
      OPENROUTER_AUTO_MODEL: ${{ vars.OPENROUTER_AUTO_MODEL }}
      OPENROUTER_FAST_FALLBACK_MODEL: ${{ vars.OPENROUTER_FAST_FALLBACK_MODEL }}
      OPENROUTER_EMBEDDING_MODEL: ${{ vars.OPENROUTER_EMBEDDING_MODEL }}
      OPENROUTER_EMBEDDING_FALLBACK_MODEL: ${{ vars.OPENROUTER_EMBEDDING_FALLBACK_MODEL }}
      GROQ_FAST_MODEL: ${{ vars.GROQ_FAST_MODEL }}
      GROQ_REASONING_MODEL: ${{ vars.GROQ_REASONING_MODEL }}
      NVIDIA_NIM_EMBEDDING_MODEL: ${{ vars.NVIDIA_NIM_EMBEDDING_MODEL }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_USE_SSL: 'true'
      S3_BUCKET_FILES: ${{ secrets.S3_BUCKET_FILES }}
      S3_BUCKET_IMAGES: ${{ secrets.S3_BUCKET_IMAGES }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # HIVE_API_KEY is deliberately NOT the repository secret any more. This
      # job seeds its own key, on its own database, in the step below, and a
      # job-level env entry would take precedence over the value that step
      # writes to $GITHUB_ENV and silently point the SDK suites back at the
      # shared account.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Start a throwaway Postgres and apply the real schema
        shell: bash
        run: |
          set -euo pipefail
          # The hosted runner image already ships psql, so the usual case is a
          # no-op. apt is the fallback, and it is bounded: on 2026-08-19 a
          # bare `sudo apt-get update -qq` here hung for the job's entire
          # 25 minute budget and emitted not one line, so the job was
          # cancelled with no output to read. A hang that produces no
          # evidence is worse than a failure that does.
          if ! command -v psql >/dev/null; then
            for attempt in 1 2 3; do
              if sudo timeout 180 apt-get update -qq \
                 && sudo timeout 180 apt-get install -y -qq postgresql-client; then
                break
              fi
              echo "::warning::apt attempt $attempt failed or timed out, retrying"
              sleep 10
            done
          fi
          if ! command -v psql >/dev/null; then
            echo "::error::psql is unavailable and apt could not install it"
            exit 1
          fi

          # The same image and tag ci.yml's own go-tests job already runs its
          # RLS suites against, so there is one throwaway-Postgres approach in
          # this repository rather than two. docker run rather than a
          # `services:` container so the image is pulled only inside this job,
          # which the `if:` above already gates hard, matching
          # migration-applier-tests.yml.
          #
          # This image has no pg_cron, so 20260729_02 takes its documented
          # absent-extension branch and schedules no nightly purge. The
          # bootstrap below prints which branch was taken every run, so that
          # stays a stated fact rather than a silent difference; a database
          # that exists for the length of one job is never around at 21:00 UTC
          # to run the job anyway.
          docker run -d --name hive-ci-db -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=hive_ci \
            pgvector/pgvector:pg17
          for _ in $(seq 1 90); do
            if docker exec hive-ci-db pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          if ! docker exec hive-ci-db pg_isready -U postgres -h 127.0.0.1; then
            echo "::error::the throwaway Postgres never became ready"
            docker logs hive-ci-db | tail -40
            exit 1
          fi

          export PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres \
                 PGPASSWORD=postgres PGDATABASE=hive_ci
          scripts/ci-throwaway-db.sh

          # The address a compose container reaches this database on.
          # localhost inside those containers is the container itself, and the
          # docker0 gateway is routable from every bridge network the compose
          # project creates.
          gw=$(docker network inspect bridge -f '{{ (index .IPAM.Config 0).Gateway }}')
          dsn="postgres://postgres:postgres@${gw}:5432/hive_ci?sslmode=disable"
          echo "SUPABASE_DB_URL=$dsn" >> "$GITHUB_ENV"
          # edge-api prefers SUPABASE_DB_POOL_URL when set. There is no pooler
          # here and none is wanted: the pooler existed to keep this job off
          # the shared project's 15 session-mode client slots, and the job no
          # longer touches that project at all.
          echo "SUPABASE_DB_POOL_URL=$dsn" >> "$GITHUB_ENV"

      - name: Seed this run's API key on the throwaway database
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: hive_ci
        run: |
          set -euo pipefail
          # Generated per run and masked. There is no shared CI key to leak
          # and no shared account behind it, which is also why
          # .github/workflows/pr-cleanup.yml is gone: it existed to purge the
          # rows this job used to write into the shared project.
          key=$(scripts/ci-seed-api-key.sh | sed -n 's/^HIVE_API_KEY=//p')
          if [ -z "$key" ]; then
            echo "::error::the seeder printed no HIVE_API_KEY line"
            exit 1
          fi
          echo "::add-mask::$key"
          echo "HIVE_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Pre-verify secrets reached runner env
        shell: bash
        run: |
          set -euo pipefail
          for v in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_URL \
                   OPENROUTER_API_KEY HIVE_API_KEY S3_ENDPOINT S3_ACCESS_KEY S3_SECRET_KEY; do
            val="${!v:-}"
            if [ -z "$val" ]; then
              echo "::error::$v is empty in workflow env"
              exit 1
            fi
            echo "  $v: len=${#val}"
          done

      - name: Cache third-party images (redis, litellm)
        id: img-cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images
          # Keyed on the pinned tags so tag bumps invalidate the cache.
          key: docker-images-redis-8.4-alpine-litellm-v1.77.7-stable

      - name: Load or pull + save third-party images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/docker-images
          if [ -f /tmp/docker-images/redis.tar ] && [ -f /tmp/docker-images/litellm.tar ]; then
            echo "loading cached images..."
            docker load -i /tmp/docker-images/redis.tar
            docker load -i /tmp/docker-images/litellm.tar
          else
            echo "cache miss — pulling..."
            docker pull redis:8.4-alpine
            docker pull ghcr.io/berriai/litellm:v1.77.7-stable
            docker save redis:8.4-alpine -o /tmp/docker-images/redis.tar
            docker save ghcr.io/berriai/litellm:v1.77.7-stable -o /tmp/docker-images/litellm.tar
          fi

      - name: Build stack images (buildx + GHA cache)
        uses: docker/bake-action@v6
        with:
          workdir: .
          files: |
            ./deploy/docker/docker-bake.hcl
          targets: edge-api,control-plane,sdk-tests-js,sdk-tests-py,sdk-tests-java
          load: true
          set: |
            *.cache-from=type=gha,scope=stack
            *.cache-to=type=gha,scope=stack,mode=max

      - name: Start core stack (no rebuild — images already loaded)
        working-directory: deploy/docker
        run: |
          # `--profile local` activates the in-stack docker redis. Staging
          # uses Upstash via REDIS_URL and never carries that profile.
          docker compose --profile local up -d --no-build redis litellm control-plane edge-api

      - name: Wait for services to become healthy
        working-directory: deploy/docker
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 300 ))
          for svc in control-plane edge-api; do
            echo "waiting for $svc..."
            while :; do
              state=$(docker inspect --format '{{.State.Health.Status}}' \
                "$(docker compose ps -q $svc)" 2>/dev/null || echo "starting")
              if [ "$state" = "healthy" ]; then
                echo "$svc: healthy"
                break
              fi
              if [ "$(date +%s)" -gt "$deadline" ]; then
                echo "::error::$svc did not become healthy (last state: $state)"
                docker compose logs --tail=200 $svc
                exit 1
              fi
              sleep 5
            done
          done

      - name: Smoke test — /health + /v1/models
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/health | jq -c
          curl -fsS http://localhost:8081/health | jq -c

          code=$(curl -sS -o /tmp/models.json -w "%{http_code}" \
            http://localhost:8080/v1/models \
            -H "Authorization: Bearer $HIVE_API_KEY")
          echo "GET /v1/models -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::/v1/models returned $code"
            cat /tmp/models.json
            exit 1
          fi
          # A 200 alone is not evidence the catalog survived the migration
          # chain: an empty `.data` answers 200 too, and the line below prints
          # nothing and exits 0 on it, so this step passed over a database with
          # no aliases at all. That matters much more now than it did against
          # the shared project's already-populated schema, because this job
          # builds its catalog from the chain on every run.
          #
          # hive-default is seeded by supabase/migrations/20260331_01_model_catalog.sql,
          # so its absence means the chain did not deliver the catalog.
          if ! jq -e '.data | map(.id) | index("hive-default")' /tmp/models.json >/dev/null; then
            echo "::error::/v1/models answered 200 but does not list hive-default, so the throwaway database has no model catalog. Aliases present: $(jq -r '[.data[].id] | join(", ")' /tmp/models.json)"
            exit 1
          fi
          echo "/v1/models lists hive-default"
          jq -r '.data[0:3] | .[] | .id' /tmp/models.json

      - name: Run SDK suites in parallel (JS + Python + Java)
        working-directory: deploy/docker
        shell: bash
        run: |
          # Intentionally no 'set -e' — we need to capture non-zero suite rc
          # rather than have the background subshell die at the failing command.
          set -uo pipefail
          log=/tmp/sdk
          mkdir -p "$log"

          run_suite() {
            local svc=$1
            local rc=0
            docker compose --profile test run --rm --no-deps "$svc" \
              > "$log/$svc.log" 2>&1 || rc=$?
            echo "$rc" > "$log/$svc.rc"
          }

          run_suite sdk-tests-js   &
          run_suite sdk-tests-py   &
          run_suite sdk-tests-java &
          wait

          fail=0
          for svc in sdk-tests-js sdk-tests-py sdk-tests-java; do
            rc=$(cat "$log/$svc.rc" 2>/dev/null || echo 127)
            echo "=============================================="
            echo "== $svc  (exit $rc)"
            echo "=============================================="
            tail -c 30000 "$log/$svc.log" || true
            if [ "$rc" != "0" ]; then fail=1; fi
          done
          exit $fail

      - name: Dump compose logs on failure
        if: failure()
        working-directory: deploy/docker
        # Piped through the redactor because this artifact is public: container
        # logs carry OAuth callbacks, bearer headers and API keys verbatim.
        run: docker compose logs --no-color --timestamps --tail=500 2>&1 | python3 ../../scripts/redact-log-credentials.py > /tmp/compose.log || true

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: /tmp/compose.log
          retention-days: 5
          if-no-files-found: ignore

      - name: Tear down stack
        if: always()
        working-directory: deploy/docker
        run: docker compose down -v --remove-orphans || true

      - name: Tear down the throwaway database
        if: always()
        run: docker rm -f hive-ci-db || true

      - name: File or update tracking issue on failure
        # Only for main-branch-relevant triggers (post-merge push, daily
        # cron): a labeled PR run failing is already visible to its author
        # via the PR checks, no need to also file a repo issue. Dedupe on an
        # open issue with the label below instead of filing one per red run.
        if: failure() && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'ci-failure:live-integration';
            const title = 'Live integration (SDK tests + smoke) is failing on main';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Still failing: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: [label],
                body: `Live integration failed on ${context.eventName === 'schedule' ? 'the daily cron' : 'push to main'}.\n\n` +
                  `First detected: ${runUrl}\n\n` +
                  'Filed automatically. Close it once a run goes green; it will be refiled if it fails again.',
              });
            }

  # ------------------------------------------------------------------
  # Playwright E2E against the full booted Go stack + Next.js. Runs
  # every spec (unauth, credentialed, openai-sdk) in a single job so
  # `/console/*` server components can reach a real control-plane and
  # the fixture can seed/reset staging Supabase users before each run.
  # ------------------------------------------------------------------

  web-e2e:
    name: Web E2E (full stack)
    runs-on: ubuntu-latest
    # 25 until this job started standing up its own Postgres, GoTrue and
    # PostgREST before the stack. Measured on run 32378996099: the throwaway
    # Supabase step took 28 seconds and the whole job 5m49s, so the happy path
    # is nowhere near either budget. The headroom is for the tail, not the
    # median: the psql fallback below can spend up to about 18 minutes on a
    # runner image whose apt is degraded, and that has to be able to finish and
    # fail by name rather than be cancelled with an empty step log.
    timeout-minutes: 35
    # HISTORY, and it is history now: this job used to boot against the shared
    # Supabase project's session mode pooler (pool_size 15), and concurrent runs
    # exhausted it. On 2026-08-01 four unrelated PRs (#644, #646, #647, #648)
    # ran this job at overlapping times and all four failed with `page.goto:
    # net::ERR_ABORTED` / a 30s context timeout, which reads as a front end bug
    # rather than the database contention it actually was (issue #631).
    #
    # That coupling is GONE. The job now stands up its own Postgres, GoTrue and
    # PostgREST and opens no connection to Supavisor at all, so contention is no
    # longer a reason for anything here. The path gate below survives on its own
    # merits, stated plainly so the next reader does not go looking for a pooler
    # this job never touches: it exists to keep a full browser suite off pull
    # requests that cannot affect the browser flow, which is runner minutes, and
    # it now also has to fire for migration and stack-script changes because the
    # job applies the migration chain itself.
    #
    # An earlier version of the old fix serialized every web-e2e run with a
    # job-level `concurrency:` group. That was reverted: GitHub Actions
    # only holds one job per concurrency group as pending, so a third
    # queued run cancels the second outright before it ever executes.
    # web-e2e was not a required check then, so a canceled result would
    # surface nowhere and a PR could merge with no browser coverage at all, a
    # silent gap of exactly the kind issue #659 exists to prevent (a
    # skipped test and a passing test are indistinguishable inside a green
    # check). Trading a noisy false-red failure for a silent absence is
    # not a fix.
    #
    # `Web E2E (full stack)` IS a required context on main today, read off the
    # live branch protection on 2026-08-23 (.github/branch-protection-main.json
    # still lists the older six and has not caught up). That strengthens the
    # revert rather than reversing it: a queue-race cancellation would now
    # block the merge outright instead of vanishing, and it is also why the
    # diagnostic steps at the end of this job had to stop being skipped on a
    # cancellation.
    #
    # What replaced it: gate this job on `needs.changes.outputs.web_e2e`
    # (see the `changes` job's decide step for the path reasoning),
    # instead of the blanket `needs.changes.outputs.run` every other job
    # here uses. Two of the four PRs above, the migration baseline script
    # and its probe, touched no path that can reach the booted browser
    # flow and should not have run this job at all; this gate is
    # deterministic and reviewable in a diff, unlike a queue race.
    #
    # It was kept after the throwaway stack landed because the minutes argument
    # stands on its own. The shared-pool argument for it does not, and #631 is
    # what this branch closes: there is no shared pool left to land on.
    if: >-
      needs.changes.outputs.run == 'true' &&
      needs.changes.outputs.web_e2e == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    # Independently boots its own Go stack + Next.js. Decoupled from
    # `live-integration` so a flaky external provider (e.g. OpenRouter
    # 429 on the SDK suites) no longer blocks the UI test coverage.
    needs: [changes, web-unit, go-tests]
    env:
      # Activate the in-stack docker redis profile for every compose call
      # in this job (see live-integration job for the rationale).
      COMPOSE_PROFILES: local
      # SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY and the two
      # NEXT_PUBLIC_ mirrors are deliberately NOT job-level entries any more.
      # This job stands up its own GoTrue and PostgREST (see the throwaway
      # stack step below) and writes all five to $GITHUB_ENV, and a job-level
      # entry takes precedence over what a step writes there, which would
      # silently point the browser and the fixture seeder back at the shared
      # hosted project.
      REDIS_URL: redis://redis:6379/0
      CONTROL_PLANE_PORT: '8081'
      CONTROL_PLANE_BASE_URL: http://localhost:8081
      EDGE_CONTROL_PLANE_BASE_URL: http://control-plane:8081
      LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
      # Live provider keys are NOT supplied to web-e2e. The Playwright
      # specs run here (unauth, auth-shell, profile-completion) exercise
      # only the UI layer and Supabase auth flows; they make no LLM
      # completion calls. Stub values satisfy LiteLLM startup validation
      # without exposing paid API keys to a job that never needs them.
      OPENROUTER_API_KEY: 'ci-stub-not-used'
      GROQ_API_KEY: 'ci-stub-not-used'
      NVIDIA_NIM_API_KEY: 'ci-stub-not-used'
      OPENROUTER_DEFAULT_MODEL: ${{ vars.OPENROUTER_DEFAULT_MODEL }}
      OPENROUTER_AUTO_MODEL: ${{ vars.OPENROUTER_AUTO_MODEL }}
      OPENROUTER_FAST_FALLBACK_MODEL: ${{ vars.OPENROUTER_FAST_FALLBACK_MODEL }}
      OPENROUTER_EMBEDDING_MODEL: ${{ vars.OPENROUTER_EMBEDDING_MODEL }}
      OPENROUTER_EMBEDDING_FALLBACK_MODEL: ${{ vars.OPENROUTER_EMBEDDING_FALLBACK_MODEL }}
      GROQ_FAST_MODEL: ${{ vars.GROQ_FAST_MODEL }}
      GROQ_REASONING_MODEL: ${{ vars.GROQ_REASONING_MODEL }}
      NVIDIA_NIM_EMBEDDING_MODEL: ${{ vars.NVIDIA_NIM_EMBEDDING_MODEL }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_USE_SSL: 'true'
      S3_BUCKET_FILES: ${{ secrets.S3_BUCKET_FILES }}
      S3_BUCKET_IMAGES: ${{ secrets.S3_BUCKET_IMAGES }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # HIVE_API_KEY is gone with the shared project. It only ever fed
      # openai-sdk.spec.ts, which skips on `!HIVE_API_KEY || !EDGE_BASE_URL`
      # and was already skipping here because this job has never set
      # EDGE_BASE_URL. Removing it changes no spec's outcome.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web-console/package-lock.json

      - name: Start a throwaway Supabase (Postgres, GoTrue, PostgREST)
        shell: bash
        run: |
          set -euo pipefail
          # The hosted runner image already ships psql, so the usual case is a
          # no-op. apt is the fallback, and it is bounded: on 2026-08-19 a
          # bare `sudo apt-get update -qq` here hung for the job's entire
          # 25 minute budget and emitted not one line, so the job was
          # cancelled with no output to read. A hang that produces no
          # evidence is worse than a failure that does.
          if ! command -v psql >/dev/null; then
            for attempt in 1 2 3; do
              if sudo timeout 180 apt-get update -qq \
                 && sudo timeout 180 apt-get install -y -qq postgresql-client; then
                break
              fi
              echo "::warning::apt attempt $attempt failed or timed out, retrying"
              sleep 10
            done
          fi
          if ! command -v psql >/dev/null; then
            echo "::error::psql is unavailable and apt could not install it"
            exit 1
          fi

          # Same image and tag this file's own go-tests job already uses, so
          # there is one throwaway-Postgres approach in this repository.
          docker run -d --name hive-ci-db -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=hive_ci \
            pgvector/pgvector:pg17
          for _ in $(seq 1 90); do
            if docker exec hive-ci-db pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          if ! docker exec hive-ci-db pg_isready -U postgres -h 127.0.0.1; then
            echo "::error::the throwaway Postgres never became ready"
            docker logs hive-ci-db | tail -40
            exit 1
          fi

          export PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres \
                 PGPASSWORD=postgres PGDATABASE=hive_ci

          # A database alone is not enough here, and the coupling is not
          # separable: this job's fixture seeder talks supabase-js
          # (auth.admin.createUser against /auth/v1, .from(table) against
          # /rest/v1) and the browser signs in through @supabase/ssr, while
          # GoTrue's custom access token hook (20260516_07) runs INSIDE the
          # database holding the user rows and raises no_active_membership for
          # a user with no tenant_users row. Cloud auth over a throwaway
          # database therefore fails every login. See scripts/ci-supabase-stack.sh.
          #
          # Its stdout is the five values the rest of the job needs. Each is
          # masked before it is exported: they are worth nothing outside this
          # runner, but a job log is public.
          scripts/ci-supabase-stack.sh --port 9000 > /tmp/supabase-env
          # set -e covers a non-zero exit, and nothing covers a zero exit with
          # truncated stdout: the loop below and the two sed calls all succeed
          # on an empty file, and the job then dies inside Playwright with an
          # unset SUPABASE_URL, three steps from the cause.
          for v in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY \
                   SUPABASE_URL_FROM_CONTAINER; do
            if ! grep -q "^$v=." /tmp/supabase-env; then
              echo "::error::the throwaway Supabase stack printed no $v line"
              exit 1
            fi
          done
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            case "$line" in
              *_KEY=*) echo "::add-mask::${line#*=}" ;;
            esac
            echo "$line" >> "$GITHUB_ENV"
          done < /tmp/supabase-env
          # The two NEXT_PUBLIC_ mirrors the browser and the Next.js build read.
          # The browser reaches the gateway on localhost; a container reaches it
          # on the docker bridge gateway, which is why the stack script emits
          # both forms.
          sed -n 's/^SUPABASE_URL=/NEXT_PUBLIC_SUPABASE_URL=/p'          /tmp/supabase-env >> "$GITHUB_ENV"
          sed -n 's/^SUPABASE_ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/p' /tmp/supabase-env >> "$GITHUB_ENV"

          gw=$(docker network inspect bridge -f '{{ (index .IPAM.Config 0).Gateway }}')
          dsn="postgres://postgres:postgres@${gw}:5432/hive_ci?sslmode=disable"
          echo "SUPABASE_DB_URL=$dsn" >> "$GITHUB_ENV"
          # No pooler here and none wanted: the transaction-mode DSN existed to
          # keep this job off the shared project's 15 session-mode slots, and
          # the job no longer touches that project.
          echo "SUPABASE_DB_POOL_URL=$dsn" >> "$GITHUB_ENV"

      - name: Cache third-party images (redis, litellm)
        id: img-cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images
          key: docker-images-redis-8.4-alpine-litellm-v1.77.7-stable

      - name: Load or pull + save third-party images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/docker-images
          if [ -f /tmp/docker-images/redis.tar ] && [ -f /tmp/docker-images/litellm.tar ]; then
            docker load -i /tmp/docker-images/redis.tar
            docker load -i /tmp/docker-images/litellm.tar
          else
            docker pull redis:8.4-alpine
            docker pull ghcr.io/berriai/litellm:v1.77.7-stable
            docker save redis:8.4-alpine -o /tmp/docker-images/redis.tar
            docker save ghcr.io/berriai/litellm:v1.77.7-stable -o /tmp/docker-images/litellm.tar
          fi

      - name: Build stack images (reuse GHA cache from live-integration)
        uses: docker/bake-action@v6
        with:
          workdir: .
          files: |
            ./deploy/docker/docker-bake.hcl
          targets: edge-api,control-plane
          load: true
          set: |
            *.cache-from=type=gha,scope=stack
            *.cache-to=type=gha,scope=stack,mode=max

      - name: Start core stack (no rebuild — images already loaded)
        working-directory: deploy/docker
        env:
          # control-plane calls GET /auth/v1/user on SUPABASE_URL from inside a
          # container, where localhost is the container itself. The throwaway
          # stack publishes its gateway on the runner, so the service gets the
          # docker bridge form of the same URL the browser uses.
          SUPABASE_URL: ${{ env.SUPABASE_URL_FROM_CONTAINER }}
        run: |
          # `--profile local` activates the in-stack docker redis. Staging
          # uses Upstash via REDIS_URL and never carries that profile.
          docker compose --profile local up -d --no-build redis litellm control-plane edge-api

      - name: Wait for services to become healthy
        working-directory: deploy/docker
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 300 ))
          for svc in control-plane edge-api; do
            while :; do
              state=$(docker inspect --format '{{.State.Health.Status}}' \
                "$(docker compose ps -q $svc)" 2>/dev/null || echo "starting")
              if [ "$state" = "healthy" ]; then
                echo "$svc: healthy"
                break
              fi
              if [ "$(date +%s)" -gt "$deadline" ]; then
                echo "::error::$svc did not become healthy (last state: $state)"
                docker compose logs --tail=200 $svc
                exit 1
              fi
              sleep 5
            done
          done

      - name: Install web-console deps
        working-directory: apps/web-console
        run: npm ci

      - name: Read Playwright version
        id: pw
        working-directory: apps/web-console
        run: |
          v=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: apps/web-console
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: apps/web-console
        run: npx playwright install-deps chromium

      - name: Build + start Next.js (points at booted control-plane)
        working-directory: apps/web-console
        env:
          # NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY and
          # SUPABASE_SERVICE_ROLE_KEY all come from $GITHUB_ENV now, written by
          # the throwaway stack step. Repeating them here as step env would
          # override those values with the shared project's.
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          CONTROL_PLANE_BASE_URL: http://localhost:8081
        run: |
          npm run build
          nohup npm start > /tmp/nextjs.log 2>&1 &
          for i in {1..60}; do
            if (echo > /dev/tcp/127.0.0.1/3000) 2>/dev/null; then echo "Next.js up"; exit 0; fi
            sleep 2
          done
          echo "::error::Next.js did not start"; cat /tmp/nextjs.log; exit 1

      - name: Generate the fixture invitation token
        # Random per job, and masked, because the seeder stores its sha256 as a
        # live pending invitation. A value anybody can derive from the public
        # run page is a published credential for as long as the run lasts.
        #
        # 24 bytes gives 48 hex characters. The floor it has to clear is
        # minTokenLength in tests/e2e/support/e2e-auth-defaults.json, which
        # requiredSecretEnv enforces at 16, so do not shorten this below that
        # without moving both: the failure would otherwise surface far from
        # here, naming a variable this step does not mention.
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 24)"
          echo "::add-mask::$token"
          echo "E2E_INVITATION_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Run UI Playwright suite (unauth + credentialed)
        working-directory: apps/web-console
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          # Fixture seeding runs in this step's own Node child process
          # (tests/e2e/support/e2e-auth-fixtures.mjs), so it needs admin auth.
          # It reads SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY from the
          # environment, and both come from $GITHUB_ENV, written by the
          # throwaway stack step. Naming the repository secret here again
          # would hand the seeder the hosted project's key while it talks to
          # this run's own GoTrue, and GoTrue answers "invalid JWT: token
          # signature is invalid" to every admin call. Measured, in run
          # 32266955684: fourteen specs failed that way with no other cause.
          #
          # This used to POST to a deployed `e2e-fixtures` Supabase Edge
          # Function instead, which kept the key out of this step but put
          # the caller and the seeder on separate release cycles: a change
          # to what the caller asked for shipped with its pull request
          # while the deployed seeder only moved when somebody ran
          # `supabase functions deploy`. Seeding in-process removes that
          # skew, and removes the deploy step from the critical path of
          # any pull request that touches the fixtures.
          # E2E_RUN_KEY, and the three identity values below it, namespace
          # every fixture row this job's specs touch (see
          # apps/web-console/tests/e2e/support/e2e-fixture-seed.mjs,
          # buildIds). Without this, every concurrent Web E2E job (another
          # PR, a push to main) shared one hardcoded set of accounts and
          # users against the same live Supabase project and could delete or
          # reassign rows out from under this job's own reads mid-test.
          # github.run_attempt makes a manual re-run of a flake get a fresh
          # identity too, not the one the previous attempt already consumed.
          # The passwords come from secrets and have no fallback. They used to
          # fall back to plaintext values committed in
          # e2e-auth-defaults.json, in a public repository, for live accounts
          # holding a tenant OWNER role; the seeder then wrote those values
          # back onto the accounts. The fallback is gone and an unset secret
          # now fails this job by name. They need not be unique per run:
          # nothing looks a user up by password, and the addresses above are
          # already run-scoped.
          E2E_RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          E2E_VERIFIED_EMAIL: e2e-verified+${{ github.run_id }}-${{ github.run_attempt }}@scubed.com.bd
          E2E_VERIFIED_PASSWORD: ${{ secrets.E2E_VERIFIED_PASSWORD }}
          E2E_UNVERIFIED_EMAIL: e2e-unverified+${{ github.run_id }}-${{ github.run_attempt }}@scubed.com.bd
          E2E_UNVERIFIED_PASSWORD: ${{ secrets.E2E_UNVERIFIED_PASSWORD }}
          # Generated in the step above, not derived here. It used to be a
          # committed literal concatenated with the run id and attempt, both
          # of which are public on the run page, and e2e-fixture-seed.mjs
          # stores its sha256 as the pending invitation's token_hash. Anyone
          # reading the run URL could compute the live token and accept the
          # invitation into this run's account while it was still open.
          E2E_INVITATION_TOKEN: ${{ env.E2E_INVITATION_TOKEN }}
          # Workspace-owner fixture for console-workspace-admin.spec.ts.
          # Unset leaves that spec skipped, which is why the required
          # coverage for a mispointed control-plane is the unit-level
          # drift guard in tests/unit/control-plane-host.test.ts. This
          # spec is the rendered-symptom check on top of it. The old
          # E2E_PLATFORM_ADMIN_* names are still read as a fallback, so an
          # existing secret keeps working: after issue #758 the account only
          # needs to be OWNER of its workspace, not a platform admin.
          # The run's own seeded verified user, which the seeder makes OWNER of
          # this run's tenant (confirmed on the issued JWT: tenants[0].role is
          # OWNER). It used to be a shared cloud account, which does not exist
          # on a throwaway Supabase, and an unset value makes
          # console-workspace-admin.spec.ts skip itself by name rather than
          # fail: a silent hole inside a green check. Pointing it at the
          # fixture user means the spec now always runs.
          E2E_WORKSPACE_OWNER_EMAIL: e2e-verified+${{ github.run_id }}-${{ github.run_attempt }}@scubed.com.bd
          E2E_WORKSPACE_OWNER_PASSWORD: ${{ secrets.E2E_VERIFIED_PASSWORD }}
        # Selects by PROJECT, never by file path (issue #813). The
        # `chromium` project's testDir is apps/web-console/tests/e2e, so a
        # spec added to that directory runs here the day it lands with no
        # workflow edit. The hand-maintained path list this replaced is
        # exactly how seven console specs sat in the tree for months
        # without ever executing: a spec that never runs cannot fail, and
        # unlike a skip it emits no signal at all.
        #
        # openai-sdk.spec.ts is in that directory and stays quiet through
        # its own documented `test.skip`, so the reason travels with the
        # spec rather than living here: it needs EDGE_BASE_URL and a real
        # completion round-trip, and this job deliberately boots with stub
        # provider keys.
        #
        # tests/e2e/_probe is excluded by the project's own testIgnore, not
        # by anything here. Those specs target deployed staging hosts and
        # two of their tests carry no credential gate, so against this
        # locally booted stack they fail on DNS rather than on the change
        # under test. They keep their own `probe` project and are carried
        # as justified debt in tests/dark-spec-allowlist.json.
        run: npx playwright test --project=chromium

      # The four diagnostic steps below run on `always()`, not `failure()`.
      # This job carries `timeout-minutes: 35`, and GitHub reports a job killed
      # by its own cap as cancelled rather than failed, so a plain `failure()`
      # step is skipped in exactly the case that most needs explaining. That is
      # observed here, not theoretical: runs that walked into the cap in August
      # 2026 uploaded no compose log and no Next.js log, and the only artifact
      # that survived was the Playwright report, which survived because its
      # upload step already carried `always()`.
      #
      # Measured, not assumed, on a throwaway one minute job that slept past
      # its own cap (run 32628384742, branch deleted after): the job concluded
      # `cancelled`, its `if: failure()` step was skipped, and its `always()`,
      # `cancelled()` and `failure() || cancelled()` steps all ran. So either
      # condition would work. `always()` is the one used here because it is
      # what the three sibling steps at the end of this job already carry and
      # it does not depend on which flavour of cancellation arrives. The cost
      # is a few seconds and one small log artifact on a green run.
      - name: Dump compose logs
        if: always()
        working-directory: deploy/docker
        # Piped through the redactor: see the sdk-tests dump step above.
        run: docker compose logs --no-color --timestamps --tail=500 2>&1 | python3 ../../scripts/redact-log-credentials.py > /tmp/compose-web-e2e-api.log || true

      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-web-e2e-api
          path: /tmp/compose-web-e2e-api.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Redact the Next.js server log
        if: always()
        # The console renders an error boundary ("Something went wrong on this
        # page", plus a digest) when a server component throws, and the cause is
        # only ever in this log. On 2026-08-16 an invitation-acceptance spec
        # timed out waiting for a workspace switcher that the error boundary had
        # replaced, and nothing in any uploaded artifact said why: this file was
        # written and then discarded with the runner.
        #
        # Redacted on the way out, like the compose dump: artifacts on a public
        # repository are downloadable by anyone with the run URL, and this job
        # drives /invitations/accept?token=<live token>.
        run: |
          set -uo pipefail
          if [ -f /tmp/nextjs.log ]; then
            python3 scripts/redact-log-credentials.py < /tmp/nextjs.log > /tmp/nextjs-redacted.log || true
          fi

      - name: Upload the redacted Next.js server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-log-web-e2e
          path: /tmp/nextjs-redacted.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          # Traces (.zip), videos (.webm) and index.html are excluded. This
          # repository is public, so any artifact here is downloadable by
          # anyone with the run URL, and playwright.config.ts retains a trace
          # on failure: it holds every request header (Authorization: Bearer)
          # and every sb-*-auth-token cookie for the fixture session.
          # index.html goes too, and for the same reason rather than a
          # different one: the HTML reporter base64-inlines the whole report
          # payload into that file, including stdout, stderr and error text,
          # and a waitForURL timeout enumerates the URLs it navigated,
          # fragment included. Both are binary-wrapped, so no text linter can
          # inspect either. Screenshots survive, and the failing test names
          # and error text are already in this job's own log.
          path: |
            apps/web-console/playwright-report/
            !apps/web-console/playwright-report/**/*.zip
            !apps/web-console/playwright-report/**/*.webm
            !apps/web-console/playwright-report/index.html
          if-no-files-found: ignore
          retention-days: 5

      - name: Tear down stack
        if: always()
        working-directory: deploy/docker
        run: docker compose down -v --remove-orphans || true

      - name: Tear down the throwaway Supabase
        if: always()
        # The network too, not just the containers. It is a no-op on a hosted
        # runner, which is discarded whole, but scripts/ci-supabase-stack.sh is
        # also run by hand during development and there the leftovers do
        # accumulate. Removing the containers first is what frees the network to
        # be removed at all.
        run: |
          docker rm -f supabase-gw supabase-rest supabase-auth hive-ci-db || true
          docker network rm hive-ci-supabase || true

  # ------------------------------------------------------------------
  # Egress firewall e2e (issue #342 item 6). Live proof that the Linux
  # desktop egress allowlist blocks disallowed outbound traffic inside a
  # real bubblewrap sandbox, and lets allowlisted traffic through. Runs
  # the shipped enforcement components verbatim (codex-bwrap's bwrap, the
  # AllowlistProxy, hive-egress-shim) via scripts/egress-bwrap-e2e.sh.
  #
  # Additive and isolated: a fresh job, not a required check yet (mirrors
  # rust-tests / desktop-tests, which graduate to required once they have
  # a track record on main). Builds the shipped bwrap and points
  # HIVE_BWRAP_PATH at it so the test exercises the binary that ships, not
  # a system bwrap.
  # ------------------------------------------------------------------

  egress-firewall-e2e:
    name: Egress firewall e2e (bwrap)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.run == 'true'
    defaults:
      run:
        working-directory: apps/desktop-sandbox
    steps:
      - uses: actions/checkout@v4

      - name: Install libcap headers + build deps
        # codex-bwrap's build.rs compiles vendored bubblewrap against libcap.
        run: sudo apt-get update && sudo apt-get install -y libcap-dev pkg-config

      - name: Allow unprivileged user namespaces
        # GitHub's ubuntu runners support unprivileged userns, but Ubuntu's
        # AppArmor restriction blocks bubblewrap's --unshare-user by default.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop-sandbox/target
          key: rust-desktop-sandbox-egress-${{ hashFiles('apps/desktop-sandbox/Cargo.lock') }}
          restore-keys: |
            rust-desktop-sandbox-

      - name: Build shipped bwrap + shim + proxy harness
        run: >-
          cargo build -p codex-bwrap --bin bwrap
          -p hive-desktop-sandbox --bin hive-egress-shim
          --example egress-proxy-harness

      - name: Run egress allowlist e2e inside a real bwrap sandbox
        env:
          HIVE_EGRESS_E2E_REQUIRE: "1"
          HIVE_BWRAP_PATH: ${{ github.workspace }}/apps/desktop-sandbox/target/debug/bwrap
        run: ./scripts/egress-bwrap-e2e.sh
