name: demo-box-probe

# Temporary pre-merge bring-up of this branch on the demo box, run through the
# self-hosted runner because there is no SSH path to that host from anywhere
# else. It never prints a secret value. Deleted before this branch merges.

on:
  push:
    branches:
      - feat/agent-engine-demo-box

concurrency:
  group: demo-box-probe
  cancel-in-progress: true

jobs:
  bring-up:
    runs-on: [self-hosted, hive-demo]
    permissions:
      actions: read
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install and restart the agent-engine launch daemon from this branch
        env:
          GH_TOKEN: ${{ github.token }}
          HIVE_AGENT_ENGINE_LLM_MODEL: openai/hive-default
          HIVE_AGENT_ENGINE_LLM_BASE_URL: https://api-hive.scubed.co/v1
          HIVE_AGENT_ENGINE_LLM_API_KEY: ${{ secrets.HIVE_API_KEY }}
        run: |
          set -euo pipefail
          CONTROL_PLANE_INTERNAL_TOKEN=$(grep -E '^CONTROL_PLANE_INTERNAL_TOKEN=' /home/sakib/hive/.env | head -1 | cut -d= -f2-)
          export CONTROL_PLANE_INTERNAL_TOKEN
          REPO_DIR="$GITHUB_WORKSPACE" bash scripts/install-agent-engine-host.sh

      - name: Recreate control-plane from this branch, pointed at the socket
        working-directory: deploy/docker
        env:
          HIVE_AGENT_ENGINE_SOCKET_DIR: /home/sakib/agent-runtime/run
          HIVE_AGENT_ENGINE_SOCKET: /run/hive-agent/engine.sock
        run: |
          set -euo pipefail
          existing=$(grep -E '^SUPABASE_DB_URL=' /home/sakib/hive/.env | head -1 | cut -d= -f2-)
          existing="${existing%\"}"; existing="${existing#\"}"
          eval "$(python3 /home/sakib/hive/scripts/derive-pooler-dsn.py --dsn "$existing" | sed 's/^/export /')"
          docker compose -p hive --env-file /home/sakib/hive/.env \
            --profile local --profile chat up -d --build control-plane

      - name: Prove control-plane reached the daemon
        run: |
          set -uo pipefail
          for _ in $(seq 1 30); do
            docker logs hive-control-plane-1 2>&1 | grep -E "agent-engine daemon" && break
            sleep 5
          done
          echo "== control-plane health =="
          curl -sS --max-time 10 http://127.0.0.1:8081/health || true
          echo
          echo "== daemon health from the host =="
          curl -sS --max-time 10 --unix-socket /home/sakib/agent-runtime/run/engine.sock http://localhost/health
          echo
