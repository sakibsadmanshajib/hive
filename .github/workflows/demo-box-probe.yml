name: demo-box-probe

# Temporary read-only probe of the demo box, run through the self-hosted
# runner because there is no SSH path to that host from anywhere else. It
# prints host capability facts only: never a value out of the box's .env,
# only key names. Deleted before this branch merges.

on:
  push:
    branches:
      - feat/agent-engine-demo-box

concurrency:
  group: demo-box-probe
  cancel-in-progress: true

env:
  RUNTIME_DIR: /home/sakib/agent-runtime
  SIF_ARTIFACT_ID: '9093355682'

jobs:
  probe:
    runs-on: [self-hosted, hive-demo]
    permissions:
      actions: read
    timeout-minutes: 30
    steps:
      - name: Fetch the CI-built SIF onto the box
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNTIME_DIR"
          sif="$RUNTIME_DIR/agent-engine.sif"
          if [ -s "$sif" ]; then
            echo "SIF already present: $(stat -c%s "$sif") bytes"
          else
            curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -o "$RUNTIME_DIR/sif.zip" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SIF_ARTIFACT_ID}/zip"
            python3 -c "import zipfile;z=zipfile.ZipFile('$RUNTIME_DIR/sif.zip');print(z.namelist());z.extractall('$RUNTIME_DIR')"
            rm -f "$RUNTIME_DIR/sif.zip"
            ls -l "$RUNTIME_DIR"
            [ -s "$sif" ] || mv "$RUNTIME_DIR"/*.sif "$sif"
          fi
          ls -l "$sif"

      - name: Does the box run this SIF unprivileged at all
        run: |
          set -euo pipefail
          apptainer exec --containall "$RUNTIME_DIR/agent-engine.sif" \
            python3 -c "import openhands.agent_server as m; print('SIF_EXEC_OK', m.__file__)"

      - name: Full sandbox launch, exactly as sandbox.BuildArgv builds it
        run: |
          set -uo pipefail
          cd /home/sakib/hive
          sess=$(mktemp -d "$RUNTIME_DIR/probe-XXXX")
          ctl="$sess/c"; work="$sess/w"
          mkdir -p "$ctl" "$work"
          egress="$sess/e.sock"

          # Stand-in for internal/egressproxy: the bind mount needs a real
          # socket at this path before apptainer starts. It answers nothing;
          # this step only proves the sandbox comes up and its control
          # channel answers.
          python3 -c "import socket,sys;s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM);s.bind(sys.argv[1]);s.listen(8);[s.accept()[0].close() for _ in iter(int,1)]" "$egress" &
          egress_pid=$!
          for _ in $(seq 1 50); do [ -S "$egress" ] && break; sleep 0.1; done

          apptainer run \
            --pid --containall --net --network none \
            --no-mount hostfs --no-mount bind-paths \
            --memory 4G --cpus 2 --pids-limit 512 \
            --env HTTP_PROXY=http://127.0.0.1:3128 \
            --env HTTPS_PROXY=http://127.0.0.1:3128 \
            --env NO_PROXY=127.0.0.1,localhost \
            --env HIVE_CONTROL_TARGET_PORT=38080 \
            --bind "$egress":/opt/hive/egress.sock \
            --bind "$ctl":/opt/hive/control \
            --bind /home/sakib/hive/apps/agent-engine/packs/coding-pack:/opt/hive/pack:ro \
            --bind "$work":/workspace \
            "$RUNTIME_DIR/agent-engine.sif" --host 0.0.0.0 --port 38080 \
            > "$sess/sandbox.log" 2>&1 &
          sandbox_pid=$!

          echo "== waiting for control socket =="
          ok=no
          for _ in $(seq 1 120); do
            if [ -S "$ctl/agent.sock" ]; then ok=yes; break; fi
            kill -0 "$sandbox_pid" 2>/dev/null || { echo "sandbox process died"; break; }
            sleep 1
          done
          echo "CONTROL_SOCKET_PRESENT=$ok"

          if [ "$ok" = yes ]; then
            echo "== GET /health =="
            for _ in $(seq 1 60); do
              body=$(curl -s --max-time 5 --unix-socket "$ctl/agent.sock" http://localhost/health || true)
              [ -n "$body" ] && break
              sleep 2
            done
            echo "HEALTH=$body"
            echo "== GET /api/agent-profiles =="
            curl -s --max-time 10 --unix-socket "$ctl/agent.sock" http://localhost/api/agent-profiles || true
            echo
            echo "== POST /api/conversations with no profile =="
            curl -s --max-time 30 --unix-socket "$ctl/agent.sock" \
              -H 'Content-Type: application/json' \
              -d '{"workspace":{"kind":"local","working_dir":"/workspace"}}' \
              http://localhost/api/conversations | head -c 2000 || true
            echo
          fi

          echo "== sandbox log (tail) =="
          tail -40 "$sess/sandbox.log" || true

          kill "$sandbox_pid" 2>/dev/null || true
          kill "$egress_pid" 2>/dev/null || true
          sleep 2
          rm -rf "$sess"
