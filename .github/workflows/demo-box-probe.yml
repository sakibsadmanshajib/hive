name: demo-box-probe

# Temporary read-only probe of the demo box, run through the self-hosted
# runner because there is no SSH path to that host from anywhere else. It
# prints host capability facts only: never a value out of the box's .env,
# only key names. Deleted before this branch merges.

on:
  push:
    branches:
      - feat/agent-engine-demo-box

concurrency:
  group: demo-box-probe
  cancel-in-progress: true

env:
  RUNTIME_DIR: /home/sakib/agent-runtime

jobs:
  probe:
    runs-on: [self-hosted, hive-demo]
    permissions:
      actions: read
    timeout-minutes: 30
    steps:
      - name: Session bus facts
        run: |
          set -uo pipefail
          echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-unset}"
          echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS:-unset}"
          ls -l /run/user/1000/bus 2>&1 || echo "no /run/user/1000/bus"
          ls -ld /run/user/1000 2>&1 || echo "no /run/user/1000"
          loginctl show-user sakib 2>&1 | head -8 || true
          cat /sys/fs/cgroup/user.slice/user-1000.slice/cgroup.controllers 2>&1 || echo "no user slice controllers"

      - name: Launch with a user session bus in the environment
        env:
          XDG_RUNTIME_DIR: /run/user/1000
          DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
        run: |
          set -uo pipefail
          sess=$(mktemp -d "$RUNTIME_DIR/probe-XXXX")
          ctl="$sess/c"; work="$sess/w"
          mkdir -p "$ctl" "$work"
          egress="$sess/e.sock"
          python3 -c "import socket,sys;s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM);s.bind(sys.argv[1]);s.listen(8);[s.accept()[0].close() for _ in iter(int,1)]" "$egress" &
          egress_pid=$!
          for _ in $(seq 1 50); do [ -S "$egress" ] && break; sleep 0.1; done

          apptainer run \
            --pid --containall --net --network none \
            --no-mount hostfs --no-mount bind-paths \
            --memory 4G --cpus 2 --pids-limit 512 \
            --env HTTP_PROXY=http://127.0.0.1:3128 \
            --env HTTPS_PROXY=http://127.0.0.1:3128 \
            --env NO_PROXY=127.0.0.1,localhost \
            --env HIVE_CONTROL_TARGET_PORT=38080 \
            --bind "$egress":/opt/hive/egress.sock \
            --bind "$ctl":/opt/hive/control \
            --bind /home/sakib/hive/apps/agent-engine/packs/coding-pack:/opt/hive/pack:ro \
            --bind "$work":/workspace \
            "$RUNTIME_DIR/agent-engine.sif" --host 0.0.0.0 --port 38080 \
            > "$sess/sandbox.log" 2>&1 &
          sandbox_pid=$!

          ok=no
          for _ in $(seq 1 180); do
            if [ -S "$ctl/agent.sock" ]; then ok=yes; break; fi
            kill -0 "$sandbox_pid" 2>/dev/null || { echo "sandbox process died"; break; }
            sleep 1
          done
          echo "CONTROL_SOCKET_PRESENT=$ok"

          if [ "$ok" = yes ]; then
            for _ in $(seq 1 60); do
              body=$(curl -s --max-time 5 --unix-socket "$ctl/agent.sock" http://localhost/health || true)
              [ -n "$body" ] && break
              sleep 2
            done
            echo "HEALTH=$body"
            echo "== POST /api/conversations with inline agent_settings =="
            curl -s --max-time 60 --unix-socket "$ctl/agent.sock" \
              -H 'Content-Type: application/json' \
              -d '{"workspace":{"kind":"local","working_dir":"/workspace"},"agent_settings":{"agent_kind":"openhands","llm":{"model":"openai/hive-probe-model","base_url":"https://api-hive.scubed.co/v1","api_key":"probe-not-a-real-key","usage_id":"hive-agent"}}}' \
              http://localhost/api/conversations | head -c 1500 || true
            echo
          fi

          echo "== sandbox log (tail) =="
          tail -30 "$sess/sandbox.log" || true

          kill "$sandbox_pid" 2>/dev/null || true
          kill "$egress_pid" 2>/dev/null || true
          sleep 2
          rm -rf "$sess"
