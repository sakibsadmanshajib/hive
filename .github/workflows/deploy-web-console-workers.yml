name: deploy-web-console-workers

# Deploys apps/web-console to Cloudflare Workers (OpenNext). This is the only
# surviving leg of the old deploy-staging.yml pipeline: the OCI VM this
# workflow used to deploy edge-api/control-plane to (via SSH, `deploy-vm`
# job) has been retired in favour of deploy-demo-box.yml, which deploys those
# services directly on the owner's physical demo box over a self-hosted
# Actions runner.
#
# This job is expected to retire too, once apps/web-console is migrated off
# Cloudflare Workers onto the same physical demo box (in flight separately as
# of this writing: local branch feat/web-console-selfhosted-docker, not yet
# pushed or merged). Do not fold web-console into deploy-demo-box.yml until
# that migration lands; this file stays the deploy path for web-console
# until then.
#
# If the retired OCI VM tier needs to come back for any reason, its old
# `detect-changes` / `build-images` / `deploy-vm` job definitions (plus the
# STAGING_HOST / STAGING_SSH_KEY / STAGING_ENV / STAGING_REDIS_URL /
# STAGING_INTERNAL_TOKEN secrets they used) are recoverable from git history
# on this file's prior path, .github/workflows/deploy-staging.yml.

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web-console/**'
      - '.github/workflows/deploy-web-console-workers.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-console-workers
  cancel-in-progress: false

jobs:
  deploy-workers:
    name: Deploy web-console to Cloudflare Workers (OpenNext)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web-console
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
        # No npm cache here: apps/web-console/package-lock.json is also
        # cached by pull_request workflows that run on fork PRs (e.g.
        # license-gate), so restoring that cache in this trusted deploy job
        # would accept a cache a fork PR could have poisoned. `npm ci` still
        # dominates install time either way.

      - name: Install deps
        run: npm ci

      - name: Build (OpenNext for Cloudflare Workers)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build:cf

      - name: Populate OpenNext incremental cache (no-op without R2)
        # Run in a real shell so the `|| true` bash short-circuit applies.
        # The cloudflare/wrangler-action `preCommands` field is exec'd
        # token-by-token, which made `|| true` get parsed as positional
        # args and emit "ERROR Too many non-option arguments: got 2".
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare populateCache --target remote || true

      - name: Deploy to CF Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web-console
          command: deploy
          # Pinned to match apps/web-console's own `wrangler: "^4.0.0"` dep
          # and v4-style wrangler.jsonc config, so the action-installed CLI
          # can't silently drift onto a newer major than the repo targets.
          wranglerVersion: "4"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
