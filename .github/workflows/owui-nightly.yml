name: OWUI nightly e2e

on:
  schedule:
    - cron: '0 6 * * *'
  pull_request:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: owui-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owui-e2e:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-owui-e2e')) }}
    runs-on: ubuntu-22.04
    # 30 until the chat frontend was forked. This job boots the stack with
    # `--build`, and that build now compiles vendor/open-webui from source:
    # measured cold on a development machine, `npm ci` about 90 seconds and
    # `npm run build` about 420 seconds, against a runner with no layer cache
    # to hit. 45 covers it with the same margin the previous number had.
    timeout-minutes: 45
    env:
      OWUI_URL: http://localhost:3003
      OWUI_E2E_MAX_USD_PER_RUN: '1'
      OWUI_E2E_MODE: 'true'
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reconstruct SUPABASE_DB_URL
        # HIVE_TEST_DB_URL secret does not exist (phantom -- 2026-07-04 run
        # 28643196239 failed on it). Reconstruct from the same DB part
        # secrets ci.yml already uses successfully (see ci.yml
        # "Reconstruct SUPABASE_DB_URL" step).
        shell: bash
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          for v in SUPABASE_DB_HOST SUPABASE_DB_PORT SUPABASE_DB_USER SUPABASE_DB_NAME SUPABASE_DB_PASSWORD; do
            val="${!v:-}"
            if [ -z "$val" ]; then
              echo "::error::$v is empty; cannot reconstruct SUPABASE_DB_URL"
              exit 1
            fi
          done
          # The script URL-encodes the password, which is stored in its raw
          # decoded form, and emits both DSNs: a capped session-mode
          # SUPABASE_DB_URL for control-plane, which needs session state, and a
          # transaction-mode SUPABASE_DB_POOL_URL for edge-api and open-webui,
          # which do not. This job booting its whole stack on session mode is
          # what exhausted the 15-client pool and failed 12 consecutive nightly
          # runs from 2026-07-26.
          python3 scripts/derive-pooler-dsn.py --self-test
          python3 scripts/derive-pooler-dsn.py \
            --host "$SUPABASE_DB_HOST" --port "$SUPABASE_DB_PORT" \
            --user "$SUPABASE_DB_USER" --dbname "$SUPABASE_DB_NAME" \
            --password "$SUPABASE_DB_PASSWORD" >> "$GITHUB_ENV"
      - name: Seed OWUI e2e test user
        # Self-provisions the owui-e2e tenant, GoTrue user, membership, and a
        # real "hk_" Hive API key used as OWUI_SHIM_KEY. Idempotent. Passwords
        # are NOT rotated: the run key below gives this run its own users
        # instead, because rotating a shared account revokes the sessions of
        # every concurrent run (docs/live-test-auth.md). Runs BEFORE "Materialize .env.ci" now
        # (moved from after it) because that step consumes the minted
        # OWUI_SHIM_KEY. Removes the need for hand-managed OWUI_E2E_EMAIL /
        # OWUI_E2E_PASSWORD repo secrets.
        #
        # Also captures OWUI_BOOTSTRAP_EMAIL/PASSWORD: a second throwaway
        # user owui.setup.ts signs in and out of before the real fixture
        # login, so the real fixture user (role OWNER, the exact role PR
        # #451 fixed) is provably not Open WebUI's unconditional first-user
        # admin, and actually exercises the OAUTH_ALLOWED_ROLES gate. See
        # scripts/seed-owui-e2e-user.py's module docstring.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # One fixture identity per job attempt. The seeder no longer
          # overwrites an existing account's password, because doing so revoked
          # the sessions of every run holding one (docs/live-test-auth.md), and
          # this workflow triggers on a schedule, on dispatch, and on a
          # labelled pull request, whose concurrency group is keyed on the ref
          # and so does not join the scheduled run's. A run-scoped identity has
          # no prior password to preserve, so this run still gets a usable one
          # and no other run is disturbed. Same shape as E2E_RUN_KEY in ci.yml.
          OWUI_E2E_RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Both guards below exist to produce a readable failure, so neither
          # may be pre-empted by set -e. A non-zero exit from the seeder used
          # to abort the step before its own ::error:: line, and each grep
          # returns 1 when the line it wants is absent, which under pipefail
          # killed the step at the assignment rather than at the check. The
          # missing-line case is the normal way this seeder now declines to
          # rotate an existing account's password, so it has to say so.
          if ! out=$(python3 scripts/seed-owui-e2e-user.py); then
            echo "::error::seed-owui-e2e-user.py failed; its stderr is above"
            exit 1
          fi
          field() { printf '%s\n' "$out" | grep "^$1=" | cut -d= -f2- || true; }
          email=$(field EMAIL)
          password=$(field PASSWORD)
          shim_key=$(field SHIM_KEY)
          bootstrap_email=$(field BOOTSTRAP_EMAIL)
          bootstrap_password=$(field BOOTSTRAP_PASSWORD)
          if [ -z "$email" ] || [ -z "$password" ] || [ -z "$shim_key" ] || [ -z "$bootstrap_email" ] || [ -z "$bootstrap_password" ]; then
            echo "::error::seed-owui-e2e-user.py did not print EMAIL/PASSWORD/SHIM_KEY/BOOTSTRAP_EMAIL/BOOTSTRAP_PASSWORD. A missing PASSWORD line means the account already existed and the seeder refused to rotate it: see its stderr above, and docs/live-test-auth.md."
            exit 1
          fi
          echo "::add-mask::$password"
          echo "::add-mask::$shim_key"
          echo "::add-mask::$bootstrap_password"
          echo "OWUI_E2E_EMAIL=$email" >> "$GITHUB_ENV"
          echo "OWUI_E2E_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "OWUI_SHIM_KEY=$shim_key" >> "$GITHUB_ENV"
          echo "OWUI_BOOTSTRAP_EMAIL=$bootstrap_email" >> "$GITHUB_ENV"
          echo "OWUI_BOOTSTRAP_PASSWORD=$bootstrap_password" >> "$GITHUB_ENV"
      - name: Materialize .env.ci
        # local/test profiles boot control-plane + edge-api + open-webui +
        # web-console, all of which fail fast without real Supabase/S3/LLM
        # provider credentials (see CLAUDE.md fail-fast rule). Mirrors the
        # secret set already proven working in ci.yml's live-integration job.
        #
        # The model literals below (OPENROUTER_DEFAULT_MODEL, etc.) are model
        # slugs, not secrets, and are hardcoded intentionally: without them
        # LiteLLM boots with an empty model_list ("LLM Provider NOT provided.
        # You passed model=") and OWUI's /api/models returns zero models, so
        # no chat request can be sent (run 28684729556). Values mirror the
        # defaults in .env.example and deploy/litellm/config.yaml.
        #
        # The two OpenRouter chat vars used to be pinned here at
        # "openrouter/free" after .env.example had already moved off it (#689,
        # #711). That kept this job pointed at OpenRouter's arbitrary free pool,
        # which cannot serve these specs: asked directly, it answers 404 "No
        # endpoints found that support tool use" for any request carrying tools,
        # and 502 "Invalid URL" from a stealth provider even for a plain two
        # message chat. Both were reproduced against the live API while
        # diagnosing three consecutive nightlies in which zero chat completions
        # succeeded. They now carry the same priced slugs the catalog derives
        # hive-default and hive-auto's price from, which is also what
        # deploy-demo-box.yml asserts on the box.
        #
        # SUPABASE_JWT_ISSUER/AUDIENCE/JWKS_URL were previously omitted here,
        # which silently disabled edge-api's whole phase-19 JWT + OWUI-unwrap
        # wiring ("WARNING: phase-19 JWT auth wiring skipped", run
        # 28685935882) -- every /v1/* call fell back to the raw API-key path
        # instead of per-user JWT auth. Derived from SUPABASE_URL per the
        # documented convention in .env.example; no new secret needed.
        # OWUI_SHIM_KEY now comes from the "Seed OWUI e2e test user" step
        # (a real hk_ Hive API key) instead of a random, unregistered value --
        # see that step and scripts/seed-owui-e2e-user.py for why a random
        # shim value can never authenticate OWUI's bodyless GET /v1/models
        # connection probe.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET_FILES: ${{ secrets.S3_BUCKET_FILES }}
          S3_BUCKET_IMAGES: ${{ secrets.S3_BUCKET_IMAGES }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_OAUTH_CLIENT_ID: ${{ secrets.SUPABASE_OAUTH_CLIENT_ID }}
          SUPABASE_OAUTH_CLIENT_SECRET: ${{ secrets.SUPABASE_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for v in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_URL \
                   SUPABASE_DB_POOL_URL SUPABASE_DB_POOL_URL_LIBPQ \
                   S3_ENDPOINT S3_ACCESS_KEY S3_SECRET_KEY S3_REGION \
                   OPENROUTER_API_KEY GROQ_API_KEY OWUI_SHIM_KEY; do
            val="${!v:-}"
            if [ -z "$val" ]; then
              echo "::error::$v is empty; cannot materialize .env.ci"
              exit 1
            fi
          done
          cat > .env.ci <<EOF
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
          SUPABASE_DB_URL=${SUPABASE_DB_URL}
          SUPABASE_DB_POOL_URL=${SUPABASE_DB_POOL_URL}
          SUPABASE_DB_POOL_URL_LIBPQ=${SUPABASE_DB_POOL_URL_LIBPQ}
          SUPABASE_JWT_ISSUER=${SUPABASE_URL}/auth/v1
          SUPABASE_JWT_AUDIENCE=authenticated
          SUPABASE_JWKS_URL=${SUPABASE_URL}/auth/v1/.well-known/jwks.json
          REDIS_URL=redis://redis:6379/0
          S3_ENDPOINT=${S3_ENDPOINT}
          S3_ACCESS_KEY=${S3_ACCESS_KEY}
          S3_SECRET_KEY=${S3_SECRET_KEY}
          S3_REGION=${S3_REGION}
          S3_BUCKET_FILES=${S3_BUCKET_FILES:-hive-files}
          S3_BUCKET_IMAGES=${S3_BUCKET_IMAGES:-hive-images}
          LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-litellm-dev-key}
          OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
          GROQ_API_KEY=${GROQ_API_KEY}
          OPENROUTER_DEFAULT_MODEL=openrouter/openai/gpt-4o-mini
          OPENROUTER_AUTO_MODEL=openrouter/openai/gpt-4.1-mini
          OPENROUTER_EMBEDDING_MODEL=openrouter/nvidia/llama-nemotron-embed-vl-1b-v2:free
          OPENROUTER_EMBEDDING_FALLBACK_MODEL=openrouter/qwen/qwen3-embedding-8b
          GROQ_FAST_MODEL=groq/llama-3.1-8b-instant
          GROQ_REASONING_MODEL=groq/openai/gpt-oss-120b
          NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-$SUPABASE_URL}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-$SUPABASE_ANON_KEY}
          SUPABASE_OAUTH_CLIENT_ID=${SUPABASE_OAUTH_CLIENT_ID:-}
          SUPABASE_OAUTH_CLIENT_SECRET=${SUPABASE_OAUTH_CLIENT_SECRET:-}
          OWUI_SHIM_KEY=${OWUI_SHIM_KEY}
          EOF
          chmod 600 .env.ci
      - name: Boot stack with local profile
        run: |
          cd deploy/docker
          docker compose --env-file ../../.env.ci \
            --profile local \
            up -d --build
          healthy=0
          for i in $(seq 1 60); do
            if curl -fsSL http://localhost:3003/health; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            echo "OWUI failed to become healthy within 120s"
            docker compose ps
            exit 1
          fi
      - name: Diagnose model catalog layers
        # Attributes an empty OWUI model list to one of three layers in a single
        # glance --
        # 1) LiteLLM has no model_list (env/config problem upstream of Hive)
        # 2) edge-api /v1/models rejects the OWUI shim credential (auth problem)
        # 3) both return models but OWUI still shows none (OWUI-side problem)
        # Prints only counts/status codes, never secrets or response bodies.
        #
        # Both curls stay non-fatal (set +e) so the full three-layer picture is
        # always printed, but layer 2 is then ASSERTED: a shim key edge-api
        # refuses means no model is selectable, and every model-dependent spec
        # below can only fail. Issue #717 spent four Playwright timeouts (2.7
        # minutes each) reporting that indirectly while this step printed
        # status=403 and exited 0. Failing here names the cause instead.
        env:
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
        run: |
          set +e
          litellm_status=$(curl -s -o /tmp/litellm-models.json -w '%{http_code}' \
            -H "Authorization: Bearer ${LITELLM_MASTER_KEY:-litellm-dev-key}" \
            http://localhost:4000/v1/models)
          litellm_count=$(jq -r 'if (.data | type) == "array" then (.data | length) else "parse-error" end' /tmp/litellm-models.json 2>/dev/null)
          edge_status=$(curl -s -o /tmp/edge-models.json -w '%{http_code}' \
            -H "Authorization: Bearer ${OWUI_SHIM_KEY}" \
            http://localhost:8080/v1/models)
          edge_count=$(jq -r 'if (.data | type) == "array" then (.data | length) else "parse-error" end' /tmp/edge-models.json 2>/dev/null)
          echo "layer 1 (litellm /v1/models):  status=${litellm_status} count=${litellm_count:-parse-error}"
          echo "layer 2 (edge-api /v1/models): status=${edge_status} count=${edge_count:-parse-error}"
          if [ "$edge_status" != "200" ]; then
            code=$(jq -r '.error.code // "unknown"' /tmp/edge-models.json 2>/dev/null)
            echo "::error::edge-api /v1/models answered ${edge_status} (error code: ${code}) to the seeded OWUI_SHIM_KEY, so Open WebUI has no models to select and every model-dependent spec below would fail on a timeout. account_not_provisioned means the shim key's account has no public.tenant_billing_accounts row: see scripts/seed-owui-e2e-user.py's provision_billing_mapping and issue #717."
            exit 1
          fi
          exit 0
      - name: Probe Supabase token endpoint from OWUI container
        # Diagnostic only, non-fatal (|| true). Leading hypothesis for the
        # run 28676421973 callback hang: runner egress stall (IPv6/DNS
        # connect) reaching Supabase from inside the container -- local
        # repro with the identical image and endpoints completes in under
        # 3s (~1.3s per call). Credentials are read from env and never
        # printed; only status code and elapsed time are logged.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_OAUTH_CLIENT_ID: ${{ secrets.SUPABASE_OAUTH_CLIENT_ID }}
          SUPABASE_OAUTH_CLIENT_SECRET: ${{ secrets.SUPABASE_OAUTH_CLIENT_SECRET }}
        run: |
          cd deploy/docker
          docker compose --env-file ../../.env.ci exec -T \
            -e SUPABASE_URL -e SUPABASE_OAUTH_CLIENT_ID -e SUPABASE_OAUTH_CLIENT_SECRET \
            open-webui python3 -c "
          import os, time, httpx
          t = time.time()
          r = httpx.post(
              os.environ['SUPABASE_URL'] + '/auth/v1/oauth/token',
              data={
                  'grant_type': 'authorization_code',
                  'code': 'bogus',
                  'redirect_uri': 'http://localhost:3003/oauth/oidc/callback',
                  'code_verifier': 'bogus',
              },
              auth=(os.environ['SUPABASE_OAUTH_CLIENT_ID'], os.environ['SUPABASE_OAUTH_CLIENT_SECRET']),
              timeout=20,
          )
          print('token-endpoint', r.status_code, round(time.time() - t, 2), 's')
          " || true
      # #712: this job was the only one in the repo installing JS deps with
      # pnpm (npm i -g pnpm@9 && pnpm install) instead of npm ci against the
      # committed package-lock.json. pnpm can't read that lockfile, so it
      # re-resolved the whole tree from live npm on every run -- exposed to
      # any upstream publish break (run 30944097241 died here on
      # @aws-sdk/credential-provider-login@^3.972.74, a version that was
      # never published) and never actually testing the dependency tree the
      # app ships. Every other job already does this the same way: see
      # ci.yml's "Install web-console deps" / "Read Playwright version" /
      # "Cache Playwright browsers" steps, mirrored below.
      - name: Install web-console deps
        working-directory: apps/web-console
        run: npm ci

      - name: Read Playwright version
        id: pw
        working-directory: apps/web-console
        run: |
          v=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: apps/web-console
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: apps/web-console
        run: npx playwright install-deps chromium

      - name: Run OWUI Playwright suite
        # OWUI_E2E_EMAIL/PASSWORD/OWUI_BOOTSTRAP_EMAIL/PASSWORD are always
        # provisioned by the "Seed OWUI e2e test user" step above (schedule,
        # workflow_dispatch, and labeled pull_request runs all reach this
        # step). SUPABASE_OAUTH_CLIENT_ID/SECRET are a separate, ops-
        # provisioned pair (Supabase OAuth App registration) that HAVE been
        # provisioned as repo secrets since 2026-07-03 -- this step actually
        # runs the real OAuth journey, it does not skip. owui.setup.ts and
        # playwright.owui.config.ts's hasCreds gate remain in place as a
        # defensive skip only (mirrors #266's OWUI_E2E_* skip mechanism), for
        # a fork or any environment missing one of these values.
        working-directory: apps/web-console
        env:
          SUPABASE_OAUTH_CLIENT_ID: ${{ secrets.SUPABASE_OAUTH_CLIENT_ID }}
          SUPABASE_OAUTH_CLIENT_SECRET: ${{ secrets.SUPABASE_OAUTH_CLIENT_SECRET }}
          # CI runs against shared serverless routes (Groq's free tier, plus
          # the priced OpenRouter slugs set above), where first-token latency
          # is dominated by provider-side queueing, not our stack.
          # performance/ttfb.spec.ts's strict 8s default (meant for a warm,
          # dedicated model) is meaningless here; give it real headroom so the
          # run stays green while still logging the actual number
          # (run 28695213565).
          OWUI_TTFB_BUDGET_MS: '30000'
        run: |
          if [ -z "${SUPABASE_OAUTH_CLIENT_ID:-}" ] || [ -z "${SUPABASE_OAUTH_CLIENT_SECRET:-}" ]; then
            echo "::warning::OWUI OAuth e2e skipped, SUPABASE_OAUTH_CLIENT_ID/SUPABASE_OAUTH_CLIENT_SECRET secrets not provisioned"
          fi
          npm run e2e:owui
          npm run e2e:owui:perf

      - name: Run phase-19 tenant isolation suite
        # Issue #813. The `phase-19` project had an npm script, a dedicated
        # Playwright project and a collection guard, and no workflow that ever
        # executed it: `e2e:phase-19:verify-collection` asks the runner what it
        # would collect and then stops, which is not the same thing as running
        # it. Seven spec files sat collected-but-never-executed as a result.
        #
        # This job is where they belong. It is the only one that boots Open
        # WebUI, and `auth.setup.ts` signs in through the real OAuth journey
        # against it. E2E_USER_A_* reuses the user the "Seed OWUI e2e test
        # user" step already provisioned, so this needs no new secret.
        #
        # What actually executes here, stated plainly so a skip is not mistaken
        # for coverage: 01 and 02 run against HIVE_TEST_DB_URL. 03, 04, 05, 06
        # and 07 skip themselves by name on E2E_TENANT_B_ID,
        # E2E_USER_A_SECOND_TENANT_ID, E2E_EXPIRED_JWT and E2E_ORPHAN_JWT,
        # none of which any environment provides yet. Provisioning a second
        # tenant and the two crafted JWTs is the remaining half of #708 and is
        # tracked there, not worked around here.
        #
        # `pg` is a runtime import in those specs (they skip when it is
        # missing, which would be a silent pass), so it is installed before the
        # run rather than by the SOC2 step further down.
        if: always()
        working-directory: apps/web-console
        env:
          # OWUI_URL is already job-level. Repeating it here would be a second
          # place for it to drift from the port the stack actually publishes.
          CONTROL_PLANE_URL: http://localhost:8081
          EDGE_API_URL: http://localhost:8080
          E2E_USER_A_EMAIL: ${{ env.OWUI_E2E_EMAIL }}
          E2E_USER_A_PASSWORD: ${{ env.OWUI_E2E_PASSWORD }}
          # Transaction-mode pooler DSN in libpq form, which is what node-pg
          # accepts. The session-mode DSN is capped at the project's pool_size
          # of 15 and is shared with the live stack, so a test client must not
          # take one of those slots.
          HIVE_TEST_DB_URL: ${{ env.SUPABASE_DB_POOL_URL_LIBPQ }}
        run: |
          npm i --no-save pg
          npm run e2e:phase-19

      - name: Dump container logs on failure
        # The OWUI OAuth callback can hang with no visible error on the
        # Playwright side (e.g. run 28676421973's 30s hang after the token
        # exchange). The Playwright report has no insight into what the
        # backend containers were doing, so pull their logs directly.
        if: failure()
        run: |
          cd deploy/docker
          # #269: a full owui project run generates enough per-request HTTP
          # access-log noise (open-webui) to push earlier diagnostic lines
          # (e.g. the hive_jwt_forward JWT-claims probe) out of a 300-line
          # tail before this step runs (run 28688900087). 2000 covers a full
          # 6-spec run with room to spare.
          # --timestamps: only open-webui and (partly) edge-api stamp their own
          # lines, so litellm's access log had no clock at all. Attributing a
          # slow or missing request across layers means lining these logs up
          # against Playwright's wall-clock trace, which is impossible for a
          # service whose lines carry no time (run 31042840516).
          # Piped through the redactor before it becomes a public artifact.
          # open-webui's uvicorn access lines print the OAuth callback verbatim,
          # so an unfiltered dump publishes GET /oauth/oidc/callback?code=... for
          # a real account, and edge-api logs carry the shim key.
          docker compose --env-file ../../.env.ci logs --no-color --timestamps --tail 2000 \
            open-webui litellm edge-api control-plane 2>&1 \
            | python3 $GITHUB_WORKSPACE/scripts/redact-log-credentials.py \
            > $GITHUB_WORKSPACE/compose-logs.txt || true
      - name: SOC2 coverage report
        if: always()
        run: |
          npm i --no-save yaml pg
          node tools/soc2-coverage-report.mjs || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owui-playwright-report
          # Traces (.zip), videos (.webm) and index.html are excluded, and the
          # repository is public, so anyone with a run URL can download what is
          # left. These specs walk the full OAuth journey for a seeded account:
          # a trace holds every request header (Authorization: Bearer), every
          # sb-*-auth-token cookie, and the callback URLs whose query string
          # and fragment carry code= and access_token=. index.html carries the
          # same material by another route: the HTML reporter base64-inlines
          # the whole report payload into it, stdout, stderr and error text
          # included, and a waitForURL timeout enumerates every URL it
          # navigated, fragment and all. Neither is inspectable by a text
          # linter. Screenshots remain, and the failing test names and error
          # text are already in this job's own log.
          path: |
            apps/web-console/playwright-report-owui
            !apps/web-console/playwright-report-owui/**/*.zip
            !apps/web-console/playwright-report-owui/**/*.webm
            !apps/web-console/playwright-report-owui/index.html
          retention-days: 5
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: owui-compose-logs
          path: compose-logs.txt
          retention-days: 5
      - name: Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -fsSL -X POST -H 'Content-Type: application/json' \
            -d '{"text":"OWUI nightly e2e red, see GHA run"}' \
            "$SLACK_WEBHOOK_URL"
