name: deploy-demo-box

# Deploys edge-api, control-plane, agent-console, and the chat surface
# straight to the owner's physical demo/staging box. The box runs a real git
# checkout of this repo on `main` at /home/sakib/hive, reachable only via a
# Cloudflare Tunnel (zero inbound ports) and a self-hosted Actions runner
# (`hive-demo-box`, labels: self-hosted, Linux, X64, hive-demo) with an
# outbound-only connection to GitHub. No SSH/scp from GitHub's cloud runners
# is possible or desired; the `deploy` job below runs directly on the box.
#
# Known durability gap: the runner process is `nohup ./run.sh` from
# ~/actions-runner on the box, not a systemd service (no passwordless sudo
# was available to install it as one at the time this workflow was written).
# It will not survive a box reboot until someone with sudo access on the box
# runs, from ~/actions-runner:
#   sudo ./svc.sh install && sudo ./svc.sh start

on:
  push:
    branches:
      - main
    paths:
      - 'apps/edge-api/**'
      - 'apps/control-plane/**'
      - 'apps/agent-console/**'
      - 'apps/agent-engine/**'
      # console-hive.scubed.co is web-console-prod (docker-compose.yml, chat
      # profile), built straight from this directory by
      # Dockerfile.web-console.prod's `COPY apps/web-console/ ./`. This entry
      # was missing entirely until 2026-08-08: PR #786 changed only files
      # under here, merged to main, and triggered no deploy at all. It sat on
      # main, undeployed and silently absent from the box, until a manual
      # workflow_dispatch shipped it. Same failure class as the
      # supabase/migrations and hive_jwt_forward gaps below: a paths filter
      # with a missing entry does not fail loud, it just never runs.
      - 'apps/web-console/**'
      # deploy/docker/Dockerfile.open-webui's frontend build stage COPYs this
      # tree directly (`COPY vendor/open-webui ./`) to compile the forked chat
      # frontend from source (see that Dockerfile's own header comment and the
      # `deploy` job's timeout-minutes comment below, both of which already
      # documented this as a real build input). It had no entry here, so PR
      # #971 (nav fixes touching only this tree) merged and triggered no
      # deploy at all, until an audit against every deploy/docker/Dockerfile.*
      # COPY source (2026-08-18) found the gap. Same failure class as
      # apps/web-console above: `.github/ci/lint-deploy-paths-filter.mjs`
      # (wired into ci.yml's repo-policy-lints job) now checks every
      # Dockerfile in deploy/docker/ against this list so the next missing
      # entry fails a PR check instead of silently never deploying.
      - 'vendor/open-webui/**'
      - 'packages/**'
      - 'deploy/docker/**'
      - 'deploy/litellm/**'
      # Copied first, by name, in every Go service Dockerfile this workflow
      # builds (edge-api, control-plane, agent-engine): `COPY go.work
      # go.work.sum* ./`. A change here (e.g. adding or repointing a `use`
      # directive) is a real build input with no entry of its own, so it
      # would silently ride along on the next unrelated deploy instead of
      # shipping when it lands, the same blind spot as apps/web-console above.
      - 'go.work'
      - 'go.work.sum'
      # Every Dockerfile in deploy/docker/ builds with repo root as its
      # context (`../../`), so this file directly controls what BuildKit
      # sees. It is not itself under deploy/docker/, so it had no entry. Its
      # own header documents why it exists: the confirmed root cause of 16+
      # red deploy runs (2026-07-26 on) before it was added. A future edit
      # here is exactly the kind of change that must not wait for an
      # unrelated commit to ship it.
      - '.dockerignore'
      # A schema-only merge used to match nothing here, so it deployed nothing
      # and applied nothing. That is literally how PR #624's
      # 20260731_01_tenant_billing_account_backfill_v2.sql and PR #602's
      # 20260730_01_usage_events_event_type_extend.sql reached main and never
      # ran: the paths filter below had no entry for supabase/migrations, so
      # this workflow was never even triggered by them.
      - 'supabase/migrations/**'
      - 'scripts/apply-migrations.sh'
      - 'scripts/migration-baseline.conf'
      - 'scripts/probe-applied-migrations.py'
      # Directly invoked by the migrate job's retention-schedule report step
      # and the deploy job's pooler-DSN derivation step respectively (both
      # below in this same file). Neither had an entry, so a fix to either
      # script would merge and never redeploy to pick the fix up.
      - 'scripts/check-retention-schedule.sh'
      - 'scripts/derive-pooler-dsn.py'
      # The single answer to "how does a command on the box reach the stack's
      # database". Both the migrate job and the deploy job's price assertion go
      # through it, so a fix to it that never deployed would leave both of them
      # running the broken version, which is the same blind spot every other
      # script listed here exists for.
      - 'scripts/stack-psql.sh'
      # Installs and restarts the host-side agent-engine launch daemon in the
      # deploy job below. Same blind spot as every other script listed here:
      # without an entry, a fix to it would merge and never deploy.
      - 'scripts/install-agent-engine-host.sh'
      # Both halves of the hive_jwt_forward install (#556). Without these
      # entries a fix to the installer itself would merge and never deploy,
      # the same blind spot the supabase/migrations entry above exists for.
      - 'scripts/install-owui-jwt-forward.py'
      - 'scripts/owui-mint-admin-token.py'
      - '.github/workflows/deploy-demo-box.yml'
  workflow_dispatch:

concurrency:
  group: deploy-demo-box
  cancel-in-progress: false

# The compose invocation, defined ONCE for every step in this workflow.
#
# Four steps below run `docker compose` against the box, and before this block
# existed each of them rebuilt the same flag list by hand. That is not a style
# problem, it is the shape of a silent outage: a step that resolves a different
# set of compose files resolves a different PROJECT, so it reads a stack that is
# missing services and reports green over it. The one step that also passes
# `--remove-orphans` makes it worse than a bad read, because a service the
# invocation does not know about is deleted.
#
# Both `-f` files AND `--profile selfhost` are load bearing, together:
#
#   * Without `-f docker-compose.enterprise.yml`, the self-hosted Supabase data
#     plane is not in the project at all. `--remove-orphans` then deletes
#     supabase-db, supabase-auth, supabase-rest, supabase-storage and the
#     gateway, and edge-api is recreated without the certificate authority mount
#     and exits at boot on its first JWKS refresh.
#   * Without `--profile selfhost`, passing that file is WORSE than omitting it:
#     `edge-api` carries no profile of its own and depends on `supabase-init`
#     and `supabase-ca-export`, so compose refuses every command outright with
#     `service "edge-api" depends on undefined service "supabase-init": invalid
#     compose project`. Confirmed on the box.
#
# `COMPOSE_FILE` and `COMPOSE_PROFILES` in the box's own .env are NOT an
# alternative to spelling the profiles here. Measured on the box against a copy
# of that file: with profile flags on the command line the resolved service list
# contains supabase-db zero times, and with no flag at all it contains it once.
# A command-line profile flag replaces the environment value rather than adding
# to it.
#
# docker-compose.override.yml is listed explicitly because passing any `-f`
# stops compose auto-loading it, and it is what the box has been resolving all
# along. Its contents (`develop: watch` blocks) are inert for `up -d`, so this
# is about keeping the project identity unchanged rather than about behaviour.
#
# scripts/test_selfhost_supabase_seam.py fails if this definition loses the
# enterprise file or the profile, and fails if any step in this workflow goes
# back to spelling its own flags.
env:
  HIVE_COMPOSE_FLAGS: >-
    --env-file ../../.env
    -f docker-compose.yml
    -f docker-compose.override.yml
    -f docker-compose.enterprise.yml
    --profile local
    --profile chat
    --profile monitoring
    --profile selfhost

jobs:
  # ------------------------------------------------------------------
  # Schema before code. Migrations run here, and the deploy job below
  # `needs:` this one, so a migration failure stops the deploy instead of
  # shipping code against a stale schema.
  #
  # Why this order and not the reverse:
  #
  #   * Code-then-schema is exactly today's outage. PR #620 landed a
  #     fail-closed tenant check, deploy-demo-box shipped it, the backfill it
  #     depends on had never run, and every API-key call on the demo box
  #     answered HTTP 403.
  #   * Schema-then-code leaves a window where the still-running old code sees
  #     the new schema. Every pending migration in this repo is additive or
  #     widening (new tables, new columns, a CHECK constraint extended to a
  #     strictly broader value list, backfill INSERTs), and old code tolerates
  #     all of those: it simply does not read the new objects, and its existing
  #     writes still satisfy a widened constraint. Checked across the tree: the
  #     only destructive statement in supabase/migrations is a
  #     DROP TABLE IF EXISTS at the top of 20260625_06, which is long applied
  #     and self-contained. Nothing pending narrows a constraint or drops a
  #     column, so this window is safe.
  #
  # Runs ON THE BOX, and the reason is the whole point of this job's shape.
  #
  # It used to run on ubuntu-latest and connect over the SUPABASE_DB_* secrets.
  # That worked for exactly as long as the database was a hosted Supavisor
  # pooler on a public hostname. After the self-hosted cutover (PR #986) the
  # database the stack uses has no published port at all and exists only inside
  # the compose network, which no GitHub-hosted runner can reach. This job did
  # not go red for that. Those secrets still named a reachable Supabase Cloud
  # project, so it applied every pending migration there, reported that nightly
  # retention was scheduled, and finished green, while the database the
  # application actually reads received no schema change whatsoever. There was
  # no signal of any kind: success is what the job printed in both worlds.
  #
  # So the target is no longer a separate secret set. It is derived from
  # SUPABASE_DB_URL in the box's own .env, which is the value control-plane
  # itself connects with, and it is then asserted to BE that database by
  # comparing pg_control_system().system_identifier against what the running
  # supabase-db container reports over its own local socket. The two sides
  # reach the server by unrelated routes and are named by unrelated inputs, so
  # the comparison can genuinely fail, and when it fails it fails this job and
  # stops the deploy.
  #
  # psql on the box: still not installed, and there is still no passwordless
  # sudo to install it. That is not worked around by wishing, it is worked
  # around by running psql in a throwaway container on the stack's own network
  # (scripts/stack-psql.sh), which the deploy job's price assertion uses too.
  # bash, python3 and sha256sum, the other things scripts/apply-migrations.sh
  # needs, are all present on the host already.
  # ------------------------------------------------------------------
  migrate:
    name: Apply pending database migrations
    runs-on: [self-hosted, hive-demo]
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      # Every psql call in this job goes through the wrapper, so no step gets
      # to invent its own docker invocation. A bare `psql` here would at least
      # be loud (there is none on the host); a `docker run` that forgot
      # --network would connect to nothing and read like a broken database,
      # which is exactly how this broke the first time.
      PSQL_BIN: ${{ github.workspace }}/scripts/stack-psql.sh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate the migration baseline file
        # Cheap, no database: catches a typo'd or stale baseline entry before
        # anything connects.
        run: scripts/apply-migrations.sh --check

      - name: Make sure the stack's database is up
        # Schema before code needs a database to talk to, and this job is now
        # the first thing in the run. Without this a box whose stack is down
        # cannot deploy the fix for its stack being down: migrate would fail on
        # an unreachable database and the `needs:` edge would stop the deploy.
        #
        # Deliberately NOT --remove-orphans, and deliberately only this one
        # service. Recreating the whole stack is the deploy job's work, and a
        # compose invocation carrying --remove-orphans is the one that deletes
        # the data plane when it resolves a different project (see the
        # HIVE_COMPOSE_FLAGS block at the top of this file).
        working-directory: /home/sakib/hive/deploy/docker
        run: docker compose $HIVE_COMPOSE_FLAGS up -d supabase-db

      - name: Derive the migration connection from the box's own .env
        # One source of truth for what to migrate: the same SUPABASE_DB_URL the
        # stack's own services connect with. A separate secret set is what made
        # the silent-success failure above possible, so there is no longer one.
        #
        # scripts/derive-pooler-dsn.py --emit-libpq-env hands back libpq
        # variables rather than a DSN, because apply-migrations.sh and
        # check-retention-schedule.sh take libpq variables and deliberately
        # never parse a DSN (parameters are per-driver, and a pgx-only one in a
        # libpq value is rejected outright, which has already crash-looped a
        # container). It also lands a pooler host on the transaction-mode port,
        # which is why the old port-picking step is gone rather than kept: a
        # migration needs no session state and must not hold one of the
        # project's 15 session slots.
        run: |
          set -euo pipefail
          env_file=/home/sakib/hive/.env
          raw=$(grep -E '^SUPABASE_DB_URL=' "$env_file" | head -1 | cut -d= -f2-)
          # A hand-edited .env may quote the value; the DSN parser must not see
          # the quotes.
          raw="${raw%\"}"; raw="${raw#\"}"
          raw="${raw%\'}"; raw="${raw#\'}"
          if [ -z "$raw" ]; then
            echo "::error::SUPABASE_DB_URL is missing or empty in $env_file, so there is no migration target"
            exit 1
          fi
          # The DSN and the password it carries are not repository secrets, so
          # nothing masks them automatically. Register both before anything
          # else in this job can echo one.
          echo "::add-mask::$raw"
          python3 scripts/derive-pooler-dsn.py --self-test
          creds=$(python3 scripts/derive-pooler-dsn.py --dsn "$raw" --emit-libpq-env)
          while IFS= read -r line; do
            case "$line" in
              PGPASSWORD=*) echo "::add-mask::${line#PGPASSWORD=}" ;;
            esac
            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done <<< "$creds"

      - name: Assert the migration target is the database this stack uses
        # The identity assertion. Not a comment, not a hostname pattern match:
        # pg_control_system().system_identifier is generated by initdb and is
        # unique per cluster, so two connections agreeing on it agree on the
        # server.
        #
        # The two sides are independent on purpose, which is what lets this
        # fail. The target side is a libpq connection over the compose network,
        # named entirely by SUPABASE_DB_URL from the box's .env. The stack side
        # is a local socket inside the running supabase-db container, named
        # entirely by compose project resolution, with the role and database
        # read out of the container's own environment rather than out of that
        # DSN. Point the DSN at any other database, hosted or otherwise, and
        # the identifiers differ and this step fails.
        #
        # Both sides being empty is treated as failure too. A check whose only
        # failure mode is "the strings differ" passes when neither side
        # produced a string at all, which is the shape that has bitten this
        # repository repeatedly.
        working-directory: /home/sakib/hive/deploy/docker
        run: |
          set -euo pipefail
          identity_sql='SELECT system_identifier FROM pg_control_system()'

          target=$("$PSQL_BIN" -tAXq -v ON_ERROR_STOP=1 -c "$identity_sql" | tr -d '[:space:]')
          if [ -z "$target" ]; then
            echo "::error::the migration connection returned no system_identifier, so the target database could not be identified at all"
            exit 1
          fi

          db_user=$(docker compose $HIVE_COMPOSE_FLAGS exec -T supabase-db printenv POSTGRES_USER | tr -d '[:space:]')
          db_name=$(docker compose $HIVE_COMPOSE_FLAGS exec -T supabase-db printenv POSTGRES_DB | tr -d '[:space:]')
          if [ -z "$db_user" ] || [ -z "$db_name" ]; then
            echo "::error::could not read POSTGRES_USER/POSTGRES_DB out of the running supabase-db container, so the stack's own database could not be identified"
            exit 1
          fi

          stack=$(docker compose $HIVE_COMPOSE_FLAGS exec -T supabase-db \
            psql -U "$db_user" -d "$db_name" --no-psqlrc -tAXq -v ON_ERROR_STOP=1 \
              -c "$identity_sql" | tr -d '[:space:]')
          if [ -z "$stack" ]; then
            echo "::error::the running supabase-db container returned no system_identifier, so the stack's own database could not be identified"
            exit 1
          fi

          if [ "$target" != "$stack" ]; then
            echo "::error::migration target mismatch: the connection derived from SUPABASE_DB_URL is cluster $target, but the database this stack runs is cluster $stack. Refusing to migrate a database the application does not use. Fix SUPABASE_DB_URL in the box's .env, or the stack, so the two agree."
            exit 1
          fi
          echo "migration target confirmed: cluster $target is the database this stack runs"

      - name: Apply pending migrations
        # No `|| true`, no continue-on-error, no swallowed exit code: the script
        # runs psql with ON_ERROR_STOP=1 under `set -euo pipefail`, so the first
        # failing statement fails this step, fails this job, and the `needs:`
        # edge below stops the deploy. Silent failure is the entire defect class
        # this job exists to remove.
        #
        # Only libpq variables are used, and they come from the derive step
        # above rather than from this step. This path never builds a DSN
        # string, because DSN parameters are per-driver and a pgx-only parameter
        # in a libpq value is rejected outright (that mistake has already
        # crash-looped a container and cost ~50 minutes of chat downtime).
        #
        # On a database whose ledger is empty, the script probes the schema
        # before deciding whether scripts/migration-baseline.conf describes that
        # database (issue #676). A brand new database runs the whole chain; a
        # database that predates the ledger seeds the baseline as before; a
        # state that is neither aborts this step and prints what it needs. That
        # abort is the intended outcome, not a flake: the alternative is a green
        # deploy over schema that was never created.
        run: scripts/apply-migrations.sh

      - name: Report whether nightly metering retention is scheduled
        # Issue #645. 20260729_02 sets the purge job up behind two guards that
        # each degrade to a RAISE NOTICE, correctly, since nothing else in that
        # migration needs pg_cron. The cost is that a host where the extension
        # cannot be created silently gets no retention at all, evidenced only by
        # a notice in a log nobody rereads after the run goes green.
        #
        # This step reports that state instead of leaving it buried. It is NOT a
        # gate and never fails the job: on a host without pg_cron the extension
        # genuinely cannot be created, and blocking every deploy for that is the
        # mistake the guards already avoid. Absence surfaces as a ::warning::
        # annotation on the run summary. The migration step above is unchanged
        # and still fails the deploy on a real migration error.
        run: scripts/check-retention-schedule.sh

  deploy:
    name: Pull + recreate stack on the demo box
    needs: migrate
    runs-on: [self-hosted, hive-demo]
    # This job never checks out the repo (the box already has its own clone).
    # Failure reporting lives in the report-failure job at the end of this
    # file, so that a failed migrate is reported too rather than vanishing
    # when this job is skipped. actions:read exists for one reason: the
    # agent-engine step below downloads the CI-built Apptainer image when the
    # box has none, since that image is linux/amd64 only and cannot be built
    # on the dev machine. contents:read is for the Pull latest main step
    # below: it authenticates the box's own HTTPS remote with this job's own
    # ephemeral github.token instead of a credential stored on the box.
    permissions:
      actions: read
      contents: read
    # 15 until the chat frontend was forked. The Open WebUI image now compiles
    # vendor/open-webui from source before it starts, and the first deploy that
    # touches that tree has no layer cache on the box to hit: measured on a
    # development machine, `npm ci` about 90 seconds and `npm run build` about
    # 420 seconds, on top of everything this job already does. A deploy that
    # trips its own timeout mid recreate is the worst outcome available, so the
    # ceiling moves rather than the build. Subsequent deploys that leave the
    # vendored tree alone hit the cache and cost nothing extra.
    timeout-minutes: 30
    steps:
      - name: Pull latest main
        # Root cause of the 2026-08-13 outage (every deploy since failing
        # `fatal: could not read Username for 'https://github.com': No such
        # device or address`, exit 128): the box's persistent clone at
        # /home/sakib/hive authenticates its HTTPS remote from some
        # credential external to this workflow (a stored PAT or a git
        # credential helper on the box; this runner has no shell access to
        # inspect which). That credential worked through the 2026-08-12
        # 20:04 UTC run (confirmed from that run's own log: `git fetch`
        # printed a real ref listing, not an error) and was gone by the next
        # deploy 17 hours later, with the workflow file byte-identical
        # across that gap (`git log -- .github/workflows/deploy-demo-box.yml`
        # between those two commits is empty). That is an expired or rotated
        # credential, not a missing config line: nothing in this repo
        # changed to cause it.
        #
        # Fix: stop depending on any credential that lives on the box at
        # all. `github.token` is this job's own ephemeral, auto-rotated
        # GITHUB_TOKEN (scoped read-only by `contents: read` above, minted
        # fresh per run), the same mechanism actions/checkout uses
        # internally. It is supplied as per-invocation `GIT_CONFIG_*`
        # environment variables rather than `.git/config`, so there is
        # nothing here to expire or rotate again. Two things a first pass
        # of this comment got wrong, corrected after security review on
        # this PR: the interpolated value IS written to disk, in the
        # runner's own materialized step script under $RUNNER_TEMP (this
        # runner is not ephemeral, see the box-reboot note below, so that
        # file is not on a fresh tmpfs); and GitHub only auto-masks the
        # literal token, not the base64 Basic-auth blob derived from it, so
        # that blob is masked explicitly below instead. The token itself
        # now reaches the script only via the `GH_TOKEN` env var, never
        # interpolated into the script text, matching the pattern the
        # agent-engine step below already uses.
        #
        # actions/checkout itself was considered instead of fixing the pull
        # in place, letting the runner's own already-authenticated checkout
        # do the fetch. Rejected: every step below assumes /home/sakib/hive is
        # a long-lived directory carrying the box's own untracked .env
        # (every secret this stack runs on) and Docker build cache.
        # actions/checkout's default `clean: true` runs `git clean -ffdx`,
        # which would delete that untracked .env on first use, a bigger
        # and riskier change than fixing the credential the persistent
        # clone already uses.
        #
        # GIT_TERMINAL_PROMPT=0 makes a still-bad credential fail in one
        # git-native line instead of the opaque "could not read Username /
        # No such device or address" this outage actually produced (that
        # message is itself just what a denied non-interactive prompt looks
        # like on a runner with no tty).
        env:
          GIT_TERMINAL_PROMPT: "0"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /home/sakib/hive

          # A leftover .git/index.lock from a prior run killed mid checkout
          # (the timeout-minutes below, a manual cancel, or a box reboot
          # this file's own header says the runner does not survive) would
          # fail this line with a lock message instead of the real problem.
          # Age-gated, not unconditional: this clone is the box's shared
          # checkout, other writers (git gc --auto, a human on the box) can
          # legitimately hold this lock, and the workflow-level concurrency
          # group only serializes this workflow's own runs against each
          # other. 30 minutes matches this job's own timeout-minutes above,
          # so a lock younger than that is still someone's live operation.
          # Both moved together when the chat frontend build landed; they are
          # one invariant and must not drift apart.
          find .git -maxdepth 1 -name index.lock -mmin +30 -delete
          git checkout main

          # The token below authenticates ANY public github.com repo, not
          # just this one, so it would fetch happily from a repointed
          # origin. Check first, or a repointed remote pulls the wrong
          # content while reporting the same green this whole fix exists to
          # make honest.
          # Redacted unconditionally, not just when a mismatch is found:
          # origin can embed a credential (https://user:token@github.com/...)
          # and this value reaches both the error branch below and the
          # diagnostic dump after it, so redacting once here keeps every
          # later use safe by construction instead of relying on each print
          # site to remember.
          expected_url="https://github.com/${{ github.repository }}"
          actual_url=$(git remote get-url origin)
          # Greedy up to the LAST @, not the first: a credential whose
          # secret half itself contains an unencoded @ would otherwise
          # leave part of it printed after a first-@ match.
          redacted_url=$(printf '%s' "$actual_url" | sed -E 's#//.*@#//REDACTED@#')
          case "$actual_url" in
            "$expected_url"|"$expected_url.git") ;;
            *)
              echo "::error::box remote 'origin' is $redacted_url, expected $expected_url(.git). Refusing to pull: this job's GITHUB_TOKEN would authenticate a fetch from any public github.com repo, so a repointed remote would silently deploy the wrong source. Fix with: git -C /home/sakib/hive remote set-url origin $expected_url.git" >&2
              exit 1
              ;;
          esac

          # Secret-free, and answers exactly what this PR could not verify
          # without box access: whether a credential path older than this
          # fix could still shadow or rescue it. --name-only reports THAT a
          # helper is configured, never its value: a helper can be an
          # inline shell snippet with a PAT embedded in it, and that value
          # is exactly the on-box credential this whole PR suspects.
          git config --show-origin --name-only --get-regexp '^credential\.helper$' \
            && echo "credential.helper is configured (value withheld)" \
            || echo "no credential helper configured"
          echo "origin: $redacted_url"
          [ -f "$HOME/.git-credentials" ] && echo "a stored credential file exists on the box" || true
          [ -f "$HOME/.netrc" ] && echo "a .netrc file exists on the box" || true

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_TOKEN is empty. This job's permissions block (needs contents: read) or the runner's token minting is the problem, not the box." >&2
            exit 1
          fi

          # GIT_CONFIG_* env vars, not `git -c` on argv: argv is world
          # readable via /proc/<pid>/cmdline on a stock box with no
          # hidepid, env is readable only by the same uid or root. Slot 1
          # empties credential.helper for this invocation so a stored PAT
          # or netrc on the box cannot shadow or rescue the header in slot
          # 0: a failure below is unambiguously this token's failure.
          b64=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$b64"
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $b64"
          export GIT_CONFIG_KEY_1="credential.helper"
          export GIT_CONFIG_VALUE_1=""

          if ! git fetch origin main; then
            echo "::error::git fetch origin main failed. See the git error above for the actual cause. If it names the username/credential, check the deploy job's permissions block (needs contents: read)." >&2
            exit 1
          fi
          if ! git pull --ff-only origin main; then
            echo "::error::git pull --ff-only origin main failed after a successful fetch, so this is a fast-forward divergence (a stray local commit on the box, or main force-pushed), not a credential problem. See the git error above; git -C /home/sakib/hive log --oneline -5 origin/main on the box will show what diverged." >&2
            exit 1
          fi

          # pull --ff-only moves the ref and writes the worktree as two
          # separate steps, not one atomic operation. A run killed in
          # between (this job's own timeout, a cancel, or a box reboot)
          # leaves HEAD advanced over a half-written tree; the next run's
          # fetch/pull then reports "Already up to date" over that same
          # half-written tree and goes green. This catches either case:
          # this run's own interruption never reaches this line anyway, so
          # only a genuinely dirty tree (this run's or a leftover one) fails
          # it.
          if [ -n "$(git status --porcelain -uno)" ]; then
            echo "::error::working tree at /home/sakib/hive has tracked-file changes against HEAD after the pull, consistent with a previous deploy interrupted mid checkout. Recover with: git -C /home/sakib/hive reset --hard origin/main (safe: reset --hard does not remove untracked files, so the box's .env is not touched)." >&2
            exit 1
          fi

          # --ff-only means this line only runs after a real advance or a
          # no-op "Already up to date.", never after a silent partial pull,
          # but nothing upstream of this could tell the two apart without
          # reading raw git output. Record the outcome explicitly instead.
          echo "deployed commit: $(git rev-parse HEAD)"

      - name: Install and restart the agent-engine launch daemon
        # Issue #780. Cowork tasks need an Apptainer sandbox per task, and
        # control-plane's own container cannot exec Apptainer. The launcher
        # therefore runs on the box as this unprivileged user and
        # control-plane talks to it over a Unix socket; see the script header
        # for why the container is deliberately NOT given that privilege.
        # GH_TOKEN below is job-scoped, so the contents:read this job's
        # permissions block grants for the Pull latest main step above also
        # reaches this GH_TOKEN, which previously only carried the default
        # actions:read scope. Correct and unavoidable at job-level
        # permissions granularity; noted since it was not called out when
        # contents:read was added. See issue #902 for the separate,
        # pre-existing question of who can trigger this job at all.
        working-directory: /home/sakib/hive
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_PLANE_INTERNAL_TOKEN: ${{ secrets.CONTROL_PLANE_INTERNAL_TOKEN }}
          HIVE_AGENT_ENGINE_LLM_MODEL: ${{ vars.HIVE_AGENT_ENGINE_LLM_MODEL || 'openai/hive-default' }}
          HIVE_AGENT_ENGINE_LLM_BASE_URL: ${{ vars.HIVE_AGENT_ENGINE_LLM_BASE_URL || 'https://api-hive.scubed.co/v1' }}
          HIVE_AGENT_ENGINE_LLM_API_KEY: ${{ secrets.HIVE_API_KEY }}
          HIVE_AGENT_ENGINE_SESSION_API_KEY: ${{ secrets.HIVE_AGENT_ENGINE_SESSION_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CONTROL_PLANE_INTERNAL_TOKEN:-}" ]; then
            # The box's .env is the source of truth for this token; the
            # secret is optional so a box that only has it there still works.
            CONTROL_PLANE_INTERNAL_TOKEN=$(grep -E '^CONTROL_PLANE_INTERNAL_TOKEN=' .env | head -1 | cut -d= -f2-)
            export CONTROL_PLANE_INTERNAL_TOKEN
          fi
          bash scripts/install-agent-engine-host.sh

      - name: Point control-plane at the launch daemon's socket
        # Shell environment beats --env-file in compose interpolation, so
        # exporting here is what actually reaches the container (the same
        # mechanism the pooler DSN step below relies on). The values are also
        # appended to the box's .env when absent, so that a compose run by
        # hand on the box behaves like the deploy rather than silently coming
        # up with the agent engine unconfigured.
        working-directory: /home/sakib/hive
        run: |
          set -euo pipefail
          socket_dir=/home/sakib/agent-runtime/run
          socket_in_container=/run/hive-agent/engine.sock
          {
            echo "HIVE_AGENT_ENGINE_SOCKET_DIR=$socket_dir"
            echo "HIVE_AGENT_ENGINE_SOCKET=$socket_in_container"
          } >> "$GITHUB_ENV"
          grep -qE '^HIVE_AGENT_ENGINE_SOCKET_DIR=' .env || echo "HIVE_AGENT_ENGINE_SOCKET_DIR=$socket_dir" >> .env
          grep -qE '^HIVE_AGENT_ENGINE_SOCKET=' .env || echo "HIVE_AGENT_ENGINE_SOCKET=$socket_in_container" >> .env

      - name: Derive the pooler DSN split from the box's own .env
        # The box's .env holds one SUPABASE_DB_URL, pointing at Supavisor's
        # SESSION-mode port. Session-mode clients are 1:1 with server
        # connections and capped at the project's pool_size of 15, shared by
        # this stack, every CI job that boots a stack, the purge job and any
        # one-off psql. That is why recreating open-webui here has been failing
        # with EMAXCONNSESSION while the build itself succeeded.
        #
        # Derive both DSNs from that single value rather than adding a secret or
        # editing the box's .env: a capped session DSN for control-plane, which
        # needs session state, and a transaction-mode DSN for everyone who does
        # not. Shell environment beats --env-file in compose interpolation, so
        # exporting them here is enough for the compose file to pick them up.
        working-directory: /home/sakib/hive
        run: |
          set -euo pipefail
          existing=$(grep -E '^SUPABASE_DB_URL=' .env | head -1 | cut -d= -f2-)
          # A hand-edited .env may quote the value; the DSN parser must not see
          # the quotes.
          existing="${existing%\"}"; existing="${existing#\"}"
          existing="${existing%\'}"; existing="${existing#\'}"
          if [ -z "$existing" ]; then
            echo "::error::SUPABASE_DB_URL is missing or empty in the box's .env"
            exit 1
          fi
          python3 scripts/derive-pooler-dsn.py --self-test
          # stdout is the KEY=value pairs; the script logs a password-free
          # host/port/params summary on stderr.
          #
          # --session-max-conns 6 keeps this box's budget exactly where it has
          # been. Six is no longer the script's default: an ephemeral consumer
          # now gets four, because three CI stacks boot per push and six each
          # asked for 18 of the project's 15 session slots before this box's own
          # share was counted. This is the one long-lived deployment, it serves
          # real chat traffic, and it is the consumer that budget was written
          # for, so it asks for it by name.
          python3 scripts/derive-pooler-dsn.py --dsn "$existing" --session-max-conns 6 >> "$GITHUB_ENV"

      - name: Rebuild + recreate changed services
        # `--build` only rebuilds layers whose inputs changed (Docker build
        # cache), so this is cheap even though no service list is scoped out.
        # This is the exact profile combo documented in the repo's own
        # CLAUDE.md "Getting Started" section for the chat-enabled local/demo
        # surface: core services (edge-api, control-plane, litellm) plus the
        # chat front-end (open-webui, agent-console) plus in-stack redis --
        # plus `monitoring` (prometheus, grafana, alertmanager).
        #
        # `monitoring` was missing here until 2026-08-03. That gap is why a
        # box reboot left those three containers dead for 22 hours with no
        # alert (Alertmanager itself was one of the dead containers): PR #596
        # added `restart: unless-stopped` to their compose definitions, but
        # this job never recreates them, so the live containers kept the
        # stale `no` restart policy they were created with on 2026-07-26,
        # from before that fix. Any future change to the monitoring service
        # definitions had the same blind spot. Including the profile here
        # keeps the running containers in sync with docker-compose.yml on
        # every deploy, the same way it already works for the other
        # services, so this class of drift cannot recur.
        #
        # The chronic failure here (16+ red runs since 2026-07-26, "cannot
        # replace to directory .../node_modules/@opennextjs/cloudflare with
        # file") is fixed by the root .dockerignore added in this PR, not by
        # anything in this step -- see that file's comment for the actual
        # mechanism, reproduced and confirmed directly on the demo box.
        working-directory: /home/sakib/hive/deploy/docker
        run: |
          set -euo pipefail
          docker compose $HIVE_COMPOSE_FLAGS up -d --build --remove-orphans

      - name: Apply the bind-mounted Caddy configs
        # Every Caddyfile in this stack is bind-mounted into its container, so
        # editing the file's CONTENTS changes nothing about the container
        # specification and the `up -d` above finds no reason to recreate the
        # service. Caddy carries on serving whatever it parsed when it last
        # started, and the deploy reports success either way. That is exactly
        # how issue #619's fix (PR #664) merged, deployed green, and changed
        # nothing: on the box afterwards `hive-caddy-owui-1` was 32 hours old
        # while edge-api and open-webui were 15 minutes old, and
        # chat-hive.scubed.co kept answering /v1/featuregate out of Open WebUI.
        # No Caddyfile edit has ever reached the running proxy through a normal
        # deploy.
        #
        # There is a second layer to it, measured on the box rather than
        # assumed, and it is the one that makes a naive fix look like it worked.
        # A single-FILE bind mount resolves to an inode at container start. `git
        # pull` does not edit the file in place, it writes a replacement and
        # renames over it, which allocates a new inode. The running container
        # therefore keeps showing the OLD file forever:
        #
        #   host  /home/sakib/hive/deploy/docker/Caddyfile.owui  inode 133458, 5216 bytes
        #   guest /etc/caddy/Caddyfile                           inode 174599, 4665 bytes (Jul 27)
        #
        # So `caddy reload --config /etc/caddy/Caddyfile` inside that container
        # re-reads the stale copy, succeeds, exits 0 and changes nothing. That
        # is the same silent success in a new costume, which is why the config
        # this step applies is always piped in from the host checkout and why
        # the following step asserts the outcome instead of trusting an exit
        # code.
        #
        # Verified on the box before this was written, none of it guessed: Caddy
        # is v2.11.3, `caddy` is on PATH in the pinned caddy:2-alpine image, the
        # container runs `caddy run --config /etc/caddy/Caddyfile --adapter
        # caddyfile`, the admin API answers 200 on 127.0.0.1:2019 inside the
        # container (no Caddyfile here sets `admin off`), and `caddy validate`
        # and `caddy reload` both accept `--config -` on stdin.
        #
        # Validation always runs first, against the host file, so a malformed
        # Caddyfile is rejected before any running proxy is asked to load it.
        # `caddy reload` would also refuse it, but a separate validate reports
        # the parse error with its line number and keeps a broken config away
        # from a listener that is currently serving the demo.
        #
        # Reload versus recreate is decided by whether the container's mounted
        # copy still matches the host file, not by preference:
        #
        #   * copies match -> `caddy reload` in place. Zero downtime, no dropped
        #     connections. This is the normal path, since most deploys change no
        #     Caddyfile at all.
        #   * copies differ -> the mount is inode-stale and no in-container
        #     reload can ever see the new file, so the service is recreated.
        #     Recreation re-binds the mount to the current inode, which also
        #     means the container cannot silently revert to the old config the
        #     next time it restarts. `--no-deps` keeps open-webui and the other
        #     upstreams untouched, so the interruption is this proxy's own
        #     sub-second restart.
        #
        # Nothing here is allowed to fail quietly: `set -euo pipefail`, no
        # `|| true`, no continue-on-error. A green deploy over an unapplied
        # config is the defect being removed.
        #
        # All three Caddy services are handled because all three share the
        # defect. Each is in the local/chat profile set this job brings up, so a
        # container missing here means the deploy is already broken and failing
        # is correct.
        working-directory: /home/sakib/hive/deploy/docker
        run: |
          set -euo pipefail
          COMPOSE=(docker compose $HIVE_COMPOSE_FLAGS)
          for pair in caddy-owui:Caddyfile.owui \
                      caddy-artifacts:Caddyfile.artifacts \
                      caddy-console:Caddyfile.console \
                      caddy-supabase:Caddyfile.supabase; do
            svc=${pair%%:*}
            file=./${pair#*:}
            echo "::group::$svc ($file)"
            # Validate what is about to go live: the host file, piped in, never
            # the container's possibly-stale copy of it.
            "${COMPOSE[@]}" exec -T "$svc" \
              caddy validate --config - --adapter caddyfile < "$file"
            # `< /dev/null` on purpose: `exec -T` attaches the caller's stdin to
            # the container, and this command has no use for it.
            #
            # `set -e` is suspended for a command tested in an `if` condition,
            # so a transient failure of the `docker compose exec ... | cmp`
            # pipeline lands in the `else` branch rather than aborting the
            # script. That is the deliberate fail-safe: it forces the recreate
            # path, which still applies the config, rather than risking a
            # false "reloaded" claim.
            if "${COMPOSE[@]}" exec -T "$svc" cat /etc/caddy/Caddyfile </dev/null \
                 | cmp -s - "$file"; then
              "${COMPOSE[@]}" exec -T "$svc" \
                caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
              echo "$svc: reloaded in place, no downtime"
            else
              echo "$svc: mounted copy differs from $file, so the bind mount is" \
                   "pinned to a replaced inode; recreating to re-bind it"
              "${COMPOSE[@]}" up -d --force-recreate --no-deps "$svc"
            fi
            echo "::endgroup::"
          done

      - name: Verify the chat-origin Caddy config is actually live
        # A zero exit from validate and reload is not proof that the intended
        # routing is live: a reload of a stale mounted copy exits 0 having
        # changed nothing, which is how this defect hid in the first place. So
        # assert the outcome on a route only the current Caddyfile serves.
        # /v1/featuregate is proxied to edge-api by Caddyfile.owui; under a stale
        # config the request falls through to Open WebUI's catch-all and comes
        # back as text/html, which is precisely the live symptom in #619.
        #
        # The assertion is on content type and body shape, never on the status
        # code: this caller carries no credential and edge-api answers an
        # unauthenticated /v1/featuregate with 401 or 403 by design. Open WebUI
        # cannot satisfy it, because its catch-all serves the SPA document.
        #
        # localhost:3003 is caddy-owui's published port, so this tests the
        # config Caddy has loaded rather than the Cloudflare Tunnel, DNS, or
        # anything else in front of it. The retry loop covers edge-api still
        # coming up after the recreate above; a 502 from Caddy means the route
        # matched but the upstream is not ready yet, so it is retried and then
        # fails the deploy if it never resolves.
        working-directory: /home/sakib/hive/deploy/docker
        run: |
          set -uo pipefail
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          code=000
          ctype=none
          for i in $(seq 1 12); do
            # A transport failure still lets curl print its own `-w` output
            # (typically "000 " with an empty content-type) before the command
            # substitution reports the nonzero exit. Chaining `|| echo "000
            # none"` onto that same substitution appends rather than replaces,
            # so a failed probe used to leave `ctype` as the literal string
            # "000 none". Assigning inside the `if` and only overwriting probe
            # in the `else` branch keeps the fields separable either way.
            if probe=$(curl -s -o "$body" -w '%{http_code} %{content_type}' \
              http://localhost:3003/v1/featuregate); then
              :
            else
              probe="000 none"
            fi
            code=${probe%% *}
            ctype=${probe#* }
            case "$ctype" in
              application/json*)
                if jq -e 'has("gates") or (.error | has("code"))' "$body" >/dev/null 2>&1; then
                  echo "/v1/featuregate is served by edge-api (status $code, $ctype)"
                  exit 0
                fi
                echo "attempt $i: JSON but not a gateway body, retry in 5s"
                ;;
              *)
                echo "attempt $i: status=$code content-type=${ctype:-none}, want application/json, retry in 5s"
                ;;
            esac
            sleep 5
          done
          echo "::error::/v1/featuregate on caddy-owui is not answering as edge-api JSON. The running Caddy config does not match deploy/docker/Caddyfile.owui (issue #619). Last status $code, content-type ${ctype:-none}."
          head -c 400 "$body" || true
          exit 1

      - name: Install the hive_jwt_forward Open WebUI Function
        # Issue #556. Per-user chat attribution depends on an Open WebUI
        # Function that no deployment has ever had. Open WebUI offers no mount
        # or env var that installs a Function; only its Functions REST API
        # does, and until now the only caller was CI's own Playwright setup.
        # So every chat completion from this box was refused by edge-api with
        # "This chat session is not carrying a signed-in user token", because
        # the request body carried no __metadata.upstream_auth for the OWUI
        # unwrap middleware to read. The failure was silent by construction:
        # nothing checked, nothing warned, and the deploy went green.
        #
        # Placed here, immediately after the Caddy config is verified live and
        # before the public smoke test, because this is the earliest point at
        # which both preconditions are proven rather than assumed: open-webui
        # is up (the recreate and the featuregate probe both depend on it) and
        # localhost:3003 is serving the current Caddyfile. Unlike the pricing
        # assertion at the end of this job, this step CHANGES deployment state
        # rather than auditing it, so it belongs before the step that declares
        # the public surface healthy -- chat should be attributable from the
        # moment it is reachable, not one step later. Sitting above the
        # failure dump also means a failure here prints the open-webui logs.
        #
        # The admin session is minted, not stored. See
        # scripts/owui-mint-admin-token.py for why every other route is
        # closed on this box: the admin panel is disabled, Caddyfile.owui
        # 404s /api/v1/auths/signin, OAuth-provisioned accounts have a random
        # password Open WebUI never discloses, and the OAuth journey CI uses
        # needs a browser. The minted token lives five minutes, creates no
        # account, and needs no secret in .env, so a fresh Enterprise box
        # works the same way with nothing provisioned by hand.
        #
        # localhost:3003 is caddy-owui's published port. Its @adminMutation
        # matcher does not block this: a Caddy `path` wildcard does not cross
        # a slash, so /api/v*/functions* matches /api/v1/functions but not
        # /api/v1/functions/create (measured against caddy:2-alpine, not
        # assumed). That is also why CI's installer reaches the same API
        # through the same port.
        #
        # No `|| true`, no continue-on-error. The script exits nonzero unless
        # it has re-read the function from the API and confirmed it is present,
        # active AND global -- a 2xx from the install call proves none of that,
        # and replacing a silent absence with a warning nobody reads would
        # leave #556 exactly where it was.
        working-directory: /home/sakib/hive/deploy/docker
        run: |
          set -euo pipefail
          COMPOSE=(docker compose $HIVE_COMPOSE_FLAGS)
          # `python3 -` reads the program from stdin; `exec -T` forwards it
          # (the Caddy step above pipes a config in the same way).
          token=$("${COMPOSE[@]}" exec -T open-webui python3 - \
            < ../../scripts/owui-mint-admin-token.py)
          if [ -z "$token" ]; then
            echo "::error::could not mint an Open WebUI admin session token"
            exit 1
          fi
          # Shape checks run BEFORE the mask, not after: ::add-mask:: masks
          # only the FIRST line of its value, so if anything ever printed a
          # second line to the container's stdout, the `echo` below would
          # itself emit that tail as an ordinary, unmasked log line. Checking
          # afterwards would be too late to prevent the one leak this step
          # must not have. Neither branch prints the value.
          case "$token" in
            *[![:print:]]*)
              echo "::error::the minted token is not a single printable line, so ::add-mask:: cannot fully mask it"
              exit 1
              ;;
          esac
          case "$token" in
            *.*.*) ;;
            *)
              echo "::error::the minted value is not a three-part JWT"
              exit 1
              ;;
          esac
          echo "::add-mask::$token"
          OWUI_ADMIN_TOKEN="$token" python3 \
            ../../scripts/install-owui-jwt-forward.py \
            --base-url http://localhost:3003

      - name: Dump container status + logs on failure
        if: failure()
        working-directory: /home/sakib/hive/deploy/docker
        run: |
          COMPOSE=(docker compose $HIVE_COMPOSE_FLAGS)
          echo "::group::docker compose ps"
          "${COMPOSE[@]}" ps || true
          echo "::endgroup::"
          for svc in edge-api control-plane agent-console open-webui litellm redis prometheus grafana alertmanager; do
            echo "::group::logs ($svc)"
            "${COMPOSE[@]}" logs --tail=200 --no-color "$svc" 2>&1 || true
            echo "::endgroup::"
          done

      - name: Prune dangling images
        if: always()
        run: docker image prune -f

      - name: Smoke test public hostnames
        # Containers take a moment to become healthy after a recreate, so
        # retry with backoff instead of failing on the first miss.
        #
        # control-hive.scubed.co is the demo box's control-plane hostname
        # (Cloudflare Tunnel maps it to localhost:8081 on this box) and is the
        # only one. An older second hostname, cp-hive.scubed.co, was a proxied
        # A record to a retired VM (40.233.86.19) with no tunnel ingress rule
        # behind it, so it timed out with 522 on every path rather than
        # answering 200. That DNS record was deleted on 2026-07-27 and the name
        # no longer resolves at all, which is why nothing below asserts it.
        # deploy/cloudflare/tunnel-ingress.json is now the source of truth for
        # which hostnames are public, and `npm run cloudflare:check` fails on
        # any -hive.scubed.co record with no ingress rule behind it.
        run: |
          for i in $(seq 1 12); do
            api_ok=0; cp_ok=0; chat_ok=0
            curl -fsS https://api-hive.scubed.co/health >/dev/null && api_ok=1 || true
            curl -fsS https://control-hive.scubed.co/health >/dev/null && cp_ok=1 || true
            curl -fsS https://chat-hive.scubed.co/ >/dev/null && chat_ok=1 || true
            if [ "$api_ok" = 1 ] && [ "$cp_ok" = 1 ] && [ "$chat_ok" = 1 ]; then
              echo "SMOKE OK"
              exit 0
            fi
            echo "attempt $i failed (api=$api_ok, control-plane=$cp_ok, chat=$chat_ok), retry in 10s"
            sleep 10
          done
          echo "SMOKE FAIL"
          exit 1

      - name: Sync LiteLLM model list from the DB catalog (issue #713)
        # control-plane's litellmconfig service (Phase 20 Plan 03) already
        # generates deploy/litellm/config.yaml's model_list directly from
        # provider_routes.provider_model and can trigger a LiteLLM restart via
        # the Docker socket it already has mounted, but nothing in this
        # pipeline ever called it, so every deploy kept running whatever
        # env-var template (os.environ/GROQ_FAST_MODEL and siblings) was last
        # baked into the box's own .env. That is exactly the two-mechanisms-
        # one-checked shape that let hive-fast silently point at a Groq model
        # the catalog had already been corrected away from (issue #965): a
        # migration can update the DB and still never reach the running
        # gateway. Calling this endpoint on every deploy makes the DB the
        # only source of truth for every DB-managed route's upstream model,
        # which is the fix issue #713 asked for rather than another env var.
        #
        # POST /internal/litellm/sync is guarded by RequireInternalToken
        # (X-Internal-Token), the same internal auth edge-api already uses
        # for service-to-service calls to control-plane, so no new secret is
        # introduced here. CONTROL_PLANE_INTERNAL_TOKEN is read directly from
        # the box's own .env: compose always sources control-plane's real
        # token from there regardless of whether a GitHub secret is also set
        # for other steps, so there is no fallback to try. Retried since this
        # runs immediately after the smoke test above already confirmed
        # control-plane healthy over HTTPS, so a failure here past the first
        # attempt or two is a real one, not a cold-start race, and is
        # intentionally not swallowed: a sync failure (a genuine non-200, not
        # a transient connection reset while the container finishes booting)
        # fails this job rather than silently leaving LiteLLM on a stale
        # model list. --max-time is 35s, not the more typical 10s used
        # elsewhere in this file: the endpoint's own work is a DB query, an
        # atomic config write, and a Docker container restart bounded by its
        # own 30s internal timeout (litellmconfig/restart.go), so a shorter
        # client timeout would fire while the server side is still legitimately
        # working and misreport a slow-but-successful sync as a failure.
        #
        # A 200 here is not trusted blindly. Traced through WriteAndRestart
        # (litellmconfig/generator.go): it writes the new config, and only
        # calls Restart() if that write succeeded; Restart()'s own error
        # propagates straight back up, so any half-applied outcome (write
        # failed, or write succeeded but the container restart call failed)
        # is a non-200 here, caught by the retry loop below. The one gap that
        # design can't close on its own is the restart API call succeeding
        # while the LiteLLM process itself fails to come up with the new
        # config (a bad merge, a crash loop). That is exactly what the next
        # step re-derives independently from LiteLLM's own live /model/info
        # rather than from this step's exit code, so a sync that reports
        # success but reconciled nothing still fails the job, one step later.
        working-directory: /home/sakib/hive
        run: |
          set -euo pipefail

          token=$(grep -E '^CONTROL_PLANE_INTERNAL_TOKEN=' .env | head -1 | cut -d= -f2- || true)
          if [ -z "$token" ]; then
            echo "::error::CONTROL_PLANE_INTERNAL_TOKEN is missing or empty in the box's .env"
            exit 1
          fi

          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT

          status=""
          for i in 1 2 3; do
            status=$(curl -sS -o "$response_file" -w '%{http_code}' \
              --connect-timeout 2 --max-time 35 \
              -X POST -H "X-Internal-Token: $token" \
              http://localhost:8081/internal/litellm/sync) || status="000"
            if [ "$status" = "200" ]; then
              echo "LiteLLM config synced from provider_routes"
              exit 0
            fi
            echo "attempt $i: sync returned $status, retry in 5s"
            sleep 5
          done
          echo "::error::litellm sync failed after 3 attempts, last status $status"
          cat "$response_file" 2>/dev/null || true
          exit 1

      - name: Assert model catalog prices agree with the model LiteLLM will call
        # Issue #689. provider_routes.provider_model is metadata nobody reads at
        # dispatch time: the model LiteLLM actually sends upstream resolves at
        # container start from an env var (deploy/litellm/config.yaml, e.g.
        # `model: os.environ/OPENROUTER_DEFAULT_MODEL`). A price row and a
        # deployment env var can drift apart with nothing to notice, and #689
        # is exactly that: hive-default/hive-auto priced against gpt-4o-mini/
        # gpt-4.1-mini while OPENROUTER_DEFAULT_MODEL/OPENROUTER_AUTO_MODEL
        # defaulted to `openrouter/free`, OpenRouter's arbitrary free-model
        # router, priced at zero and undisclosed which model actually answers.
        #
        # Deliberately placed LAST, after the Caddy config and the public
        # smoke test, not right after the recreate. By the time this step can
        # run at all, the containers are already recreated and LiteLLM is
        # already serving whatever it resolved -- failing early buys nothing,
        # since aborting here cannot prevent a single mispriced request that
        # already went out. Every step between the recreate and here lacks
        # `if: always()`, so putting this assertion before them would have let
        # one red run here skip the Caddy config apply and the public smoke
        # test too, leaving the box half-deployed over a pricing question that
        # was never about whether the deploy could proceed.
        #
        # Source of truth for "what LiteLLM will really call" is LiteLLM's own
        # `GET /model/info` (verified against litellm/router.py's
        # `Router.set_model_list`: every `os.environ/VAR` litellm_param is
        # resolved there when the router's model list is built, so
        # `data[].litellm_params.model` in the response is already the
        # substituted value, not the raw `os.environ/...` template). Reading
        # the container's own environment would only prove the .env file was
        # applied, not that LiteLLM parsed it the way this assertion assumes;
        # /model/info proves the latter directly. Requires the same
        # LITELLM_MASTER_KEY the box's .env already sets, via `Authorization:
        # Bearer`.
        #
        # Restricted to routes whose alias actually prices tokens
        # (model_aliases.price_unit = 'tokens', a nonzero input or output
        # price): a mismatch anywhere else is not a mispricing, since D-033
        # keeps non-token modalities off an invented per-token price and
        # apps/edge-api/internal/audio charges hive-stt/hive-tts from flat
        # literals, never this catalog (issue #627). Routes that are
        # `disabled`/`eol` are excluded because they are never dispatched
        # (20260801_01_alias_pricing_correction.sql retired
        # route-openrouter-fast-fallback exactly this way).
        #
        # Looked up by litellm_model_name, not route_id: today every seeded
        # row sets them equal, but litellm_model_name is the column that
        # actually names the LiteLLM gateway alias (`model_name:` in
        # config.yaml), and route_id is only this table's own primary key.
        # The moment a route needs the two to diverge (the way route-doc-vlm
        # already does outside this table, sharing OPENROUTER_AUTO_MODEL under
        # its own route_id), matching on route_id would return nothing from
        # /model/info and falsely report a correctly wired route as missing.
        #
        # The comparison canonicalizes rather than discards the leading
        # provider/adapter segment. hive-embedding-default's two routes use
        # LiteLLM's generic `openai/` adapter with an explicit `api_base`
        # pointed at OpenRouter, because LiteLLM's native `openrouter/`
        # provider does not map `/embeddings` (see deploy/litellm/config.yaml
        # section 5); that api_base is what makes `openai/` here mean
        # "openrouter", not the model string alone. So when live_model starts
        # with `openai/` AND live_base names openrouter.ai, it is rewritten to
        # `openrouter/<rest>` before comparing; every other route is compared
        # as a full, unmodified string. Discarding the provider segment
        # instead (an earlier version of this step did) would keep passing
        # even if api_base were repointed at a different endpoint serving the
        # same model name under a different real cost -- the same
        # two-mechanisms-one-checked shape as #689 itself, just moved one
        # field over.
        #
        # Known circularity (issue #713, wired in by the preceding step): the
        # previous step now calls apps/control-plane/internal/litellmconfig's
        # config sync (issue #701, fixed by #705; #707 tracks the remaining
        # gaps in what it preserves) on every deploy, which writes a
        # DB-managed route's `litellm_params.model` straight from
        # provider_routes.provider_model, the same column this step's DB side
        # reads. That means this comparison can no longer fail for a
        # DB-managed route even if the sync's own query or the generator's
        # adapter logic is wrong, because both sides trace back to the
        # identical database read. What this step still catches: the sync
        # step above failing outright (it fails the job itself before this
        # one runs), a route this catalog thinks is DB-managed but the sync
        # query's join excludes (a real drift the two steps would otherwise
        # disagree on), or an api_base mismatch on a route the sync does not
        # cover. It no longer catches a bad `provider_model` value reaching a
        # stale env-var template, because that mechanism is no longer in the
        # loop for any route the sync's query returns. This is an accepted,
        # narrower scope for this step now that issue #713 is fixed, not a
        # regression: the two-mechanisms-one-checked shape #689 and #965 both
        # hit is what #713 removed, and a check that could still fail on it
        # would mean the sync had not actually taken effect.
        working-directory: /home/sakib/hive/deploy/docker
        run: |
          set -euo pipefail

          master_key=$(grep -E '^LITELLM_MASTER_KEY=' ../../.env | head -1 | cut -d= -f2-)
          master_key="${master_key%\"}"; master_key="${master_key#\"}"
          master_key="${master_key%\'}"; master_key="${master_key#\'}"
          if [ -z "$master_key" ]; then
            echo "::error::LITELLM_MASTER_KEY is missing or empty in the box's .env"
            exit 1
          fi

          # LiteLLM has been up since the recreate several steps back, but
          # retry with backoff anyway rather than assume. --connect-timeout
          # and --max-time bound each attempt: without them a curl that
          # connects but never answers hangs forever, and the loop below
          # never advances, so the failure is an opaque 15-minute job
          # timeout instead of a loud one. Worst case with the caps: 12
          # attempts x (10s max-time + 5s sleep) = 180s (3 minutes).
          resolved=""
          for i in $(seq 1 12); do
            if resolved=$(curl -fsS --connect-timeout 2 --max-time 10 \
              -H "Authorization: Bearer $master_key" \
              http://localhost:4000/model/info); then
              break
            fi
            echo "attempt $i: /model/info not answering yet, retry in 5s"
            resolved=""
            sleep 5
          done
          if [ -z "$resolved" ]; then
            echo "::error::LiteLLM's /model/info never answered"
            exit 1
          fi

          # ../../scripts/stack-psql.sh, not a bare `docker run`. This step
          # already ran psql in a container, but on the default bridge
          # network, where the self-hosted database's compose-network hostname
          # does not resolve: the first deploy after PR #986 failed here with
          # `could not translate host name "supabase-db" to address`. The
          # wrapper attaches the container to the stack's network, and is the
          # single place that answers this for the whole repository.
          rows=$(../../scripts/stack-psql.sh \
            "$SUPABASE_DB_POOL_URL_LIBPQ" -At -F'|' -v ON_ERROR_STOP=1 -c "
              SELECT pr.route_id, pr.litellm_model_name, pr.provider_model
                FROM public.provider_routes pr
                JOIN public.model_aliases ma ON ma.alias_id = pr.alias_id
               WHERE pr.health_state NOT IN ('disabled', 'eol')
                 AND ma.price_unit = 'tokens'
                 AND (ma.input_price_credits > 0 OR ma.output_price_credits > 0)
               ORDER BY pr.route_id;")

          if [ -z "$rows" ]; then
            echo "::error::no priced token routes came back from provider_routes -- the query itself is broken, not just empty"
            exit 1
          fi

          fail=0
          while IFS='|' read -r route_id litellm_name db_model; do
            [ -z "$route_id" ] && continue
            live_model=$(echo "$resolved" | jq -r --arg id "$litellm_name" \
              '.data[] | select(.model_name == $id) | .litellm_params.model' | head -1)
            live_base=$(echo "$resolved" | jq -r --arg id "$litellm_name" \
              '.data[] | select(.model_name == $id) | (.litellm_params.api_base // "")' | head -1)
            if [ -z "$live_model" ] || [ "$live_model" = "null" ]; then
              echo "::error::$route_id ($litellm_name): priced route is not in LiteLLM's live /model/info at all"
              fail=1
              continue
            fi
            # LiteLLM's generic openai/ adapter pointed at OpenRouter IS the
            # openrouter provider, and only then. Canonicalize rather than
            # discard, so the provider segment stays part of the comparison.
            case "$live_model|$live_base" in
              openai/*"openrouter.ai"*) live_model="openrouter/${live_model#openai/}" ;;
            esac
            if [ "$db_model" != "$live_model" ]; then
              echo "::error::$route_id: catalog prices $db_model but LiteLLM will call $live_model"
              fail=1
            else
              echo "$route_id: OK ($db_model <-> $live_model)"
            fi
          done <<< "$rows"

          if [ "$fail" -ne 0 ]; then
            echo "::error::model catalog / live LiteLLM model mismatch -- refusing the deploy (issue #689)"
            exit 1
          fi
          echo "model catalog matches every priced route LiteLLM will actually call"

      - name: Prune build cache older than 24h
        # Measured on the demo box 2026-07-29: `docker system df` showed
        # Build Cache at 40.87GB (30.04GB reclaimable across 339 layers),
        # built up from every image rebuild this runner has ever done and
        # never pruned. Reclaiming it took the box from 27G to 54G free on a
        # 98G partition shared with everything else (Prometheus, container
        # logs, the repo's own git checkout). `until=24h` still lets a
        # concurrent job's fresh layers survive. Lives here rather than a
        # host systemd timer because the box has no passwordless sudo, and
        # this way the fix is repo-tracked. `if: always()` matters: a failed
        # build is exactly when unused cache layers pile up the fastest.
        if: always()
        run: docker builder prune -f --filter until=24h

  sdk-replay:
    name: SDK replay against the demo box
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    env:
      HIVE_BASE_URL: https://api-hive.scubed.co/v1
      HIVE_API_KEY: ${{ secrets.HIVE_API_KEY }}
      HIVE_TEST_MODEL: hive-default
      HIVE_EMBEDDING_MODEL: hive-embedding-default
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assert model catalog
        run: |
          set -euo pipefail
          # --retry 5 --retry-all-errors --retry-delay 5: this runs right after
          # deploy recreates control-plane, and a cold container's first
          # /internal/apikeys/resolve can take several seconds (2026-08-14
          # incident: 5.65s observed), which used to 401 this replay's very
          # first request. Bounded retry rides out that cold-start window
          # without masking a genuinely broken deploy -- five attempts five
          # seconds apart still fails loudly if the box stays down.
          # --max-time 15 bounds each individual attempt (edge-api's own
          # resolve-client timeout is 10s; 15s covers that plus network
          # round-trip) so a wedged attempt cannot silently eat the whole
          # retry budget instead of failing over to the next attempt.
          body="$(curl -fsS --retry 5 --retry-all-errors --retry-delay 5 --max-time 15 \
            -H "Authorization: Bearer $HIVE_API_KEY" "$HIVE_BASE_URL/models")"
          echo "$body" | jq -e '.data | length >= 4' >/dev/null
          for alias in hive-auto hive-default hive-embedding-default hive-fast; do
            echo "$body" | jq -e --arg id "$alias" '.data | map(.id) | index($id) != null' >/dev/null \
              || { echo "missing alias: $alias"; exit 1; }
          done
          echo "catalog OK"

      - name: Install JS sdk-tests deps
        working-directory: packages/sdk-tests/js
        run: npm install --no-audit --no-fund

      - name: Run JS chat-completions replay
        working-directory: packages/sdk-tests/js
        run: npx vitest run tests/chat-completions

      - name: Install Python sdk-tests deps
        working-directory: packages/sdk-tests/python
        run: pip install -e '.[dev]'

      - name: Run Python health/models/embeddings replay
        working-directory: packages/sdk-tests/python
        run: pytest tests/test_health.py tests/test_models.py tests/test_embeddings.py -q

  # ------------------------------------------------------------------
  # Interaction coverage for the agent workspace (Cowork), against the
  # deployment this workflow just shipped.
  #
  # It lives here rather than in ci.yml because the surface it exercises is a
  # deployed one: the Cowork console, the edge-api agent-task routes and the
  # host launcher only exist together on the box. A pull request job could
  # only ever probe main's deployment, which says nothing about the pull
  # request, and ci.yml's stack boots neither agent-console nor the launcher.
  #
  # Selected by project name, never by file path (issue #813). The project's
  # testMatch in apps/web-console/playwright.config.ts is the single place
  # that names the file, and scripts/verify-spec-collection.mjs fails the
  # required web-console job if that wiring ever silently stops matching.
  # ------------------------------------------------------------------
  agent-workspace-coverage:
    name: Agent workspace interaction coverage
    needs: deploy
    # MANUAL ONLY until issues #881 and #886 are fixed, then delete this line.
    #
    # The suite creates one real agent task and cancels it. Per #886 a cancel
    # never reaches the engine, so the sandbox keeps running and keeps its
    # concurrency slot; two runs exhaust HIVE_QUOTA_USER_CONCURRENCY for the
    # demo account and every later create is refused. On every push to main
    # touching apps/web-console that would take the demo surface down for the
    # day, which is a real cost to pay for a measurement.
    #
    # Not in report-failure's `needs` either, for the same window: that job
    # dedupes on a single open label, so a job that is red for a known product
    # reason would hold that issue open and downgrade a genuine `migrate`
    # failure to a comment on a stale issue, which is #553's blind spot
    # reopened.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # One create in this suite launches a real sandbox, and control-plane's
    # CreateTask is synchronous over that launch with a five-minute bound.
    timeout-minutes: 25
    env:
      HIVE_CHAT_BASE_URL: https://chat-hive.scubed.co
      # Minting a session needs all three. live-auth.mjs uses the admin
      # one-time-token flow, which touches no password, and there is no
      # credential-rotating fallback in it (docs/live-test-auth.md).
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Optional. The spec defaults to the demo account, which is named in
      # docs/proof/live-auth-helper-2026-08-08/README.md and is not a
      # credential. Set this secret to point the run at a different identity.
      HIVE_QA_AGENT_EMAIL: ${{ secrets.HIVE_QA_AGENT_EMAIL }}
      # Optional, and the only reason C8 is unproven when it is absent: that
      # control is the password submit path itself. Never rotate a shared
      # account's password to manufacture one.
      HIVE_QA_AGENT_PASSWORD: ${{ secrets.HIVE_QA_AGENT_PASSWORD }}
      # Both generated files land in test-results/, which the repo .gitignore
      # already excludes. Nothing this job produces is ever committed: a
      # checked-in coverage snapshot reports the same ratio forever, including
      # after the coverage it describes has moved.
      PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/agent-workspace-run.json
    defaults:
      run:
        working-directory: apps/web-console
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web-console/package-lock.json

      - name: Install web-console deps
        run: npm ci

      - name: Read Playwright version
        id: pw
        run: |
          v=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run the agent workspace probe
        run: npm run e2e:agent-workspace

      - name: Build the coverage ledger
        # Always, so a red run still publishes which controls it proved and
        # which it did not. The ledger is generated here and gitignored: a
        # committed snapshot reports the same ratio forever, including after
        # coverage has moved. This step also fails when a control has no test
        # at all, which is the one hole a ratio alone cannot show.
        if: always()
        run: |
          set -euo pipefail
          # The status is captured rather than allowed to abort the step, and
          # stderr is merged into the pipe, because neither was true before and
          # both broke the case this step exists for. The build script exits
          # non-zero on a missing test, an undeclared tag, a duplicate tag or a
          # run under the floor, and pipefail propagated that through `tee`, so
          # the shell aborted and the summary block below never ran. The FAIL
          # lines go to stderr as well, so `tee` captured none of them and both
          # the summary and the artifact omitted the reason. A failing ledger
          # has to publish WHY it failed; that is the whole point of it.
          status=0
          node scripts/build-agent-workspace-coverage.mjs \
            test-results/agent-workspace-run.json \
            test-results/agent-workspace-coverage.json \
            2>&1 | tee test-results/coverage-summary.txt || status=$?
          {
            echo '## Agent workspace interaction coverage'
            echo ''
            echo '```'
            cat test-results/coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload the coverage ledger
        # The ledger and the run summary, by extension, and nothing else.
        #
        # NOT the Playwright report, NOT test-results/ wholesale, and the two
        # files are NAMED rather than globbed. This project drives a browser
        # with a real session on a deployed host, so a trace or a video would
        # carry the Authorization bearer and the sb-*-auth-token cookie (which
        # holds a refresh token) verbatim, into a public repository's artifacts
        # for 90 days. The project turns both off in playwright.config.ts; this
        # list is the second layer, so a future edit that re-enables either one
        # still cannot publish it.
        #
        # A `*.json` glob was the first attempt and it was too wide: it also
        # published test-results/agent-workspace-run.json, the raw Playwright
        # report, which carries every title, error message and captured
        # stdout/stderr from a run against a live deployment. Nothing prints a
        # token today, so that was a posture gap rather than a live leak, but
        # naming the files means a future log line cannot widen the artifact.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-workspace-coverage
          path: |
            apps/web-console/test-results/agent-workspace-coverage.json
            apps/web-console/test-results/coverage-summary.txt
          if-no-files-found: warn

  report-failure:
    # This workflow only triggers on push-to-main or manual dispatch, so every
    # failure in it means main is unmigrated, undeployed or unverified on the
    # demo box, and nothing else was surfacing that (issue #553's blind spot,
    # same pattern). Dedupe on an open issue with the label below instead of
    # filing one per red run.
    #
    # This lives in its own job rather than as a final step of `deploy` so that
    # a failed `migrate` is reported as well. As a step inside `deploy` it could
    # never fire for a migration failure, because `needs: migrate` skips the
    # whole deploy job and every step in it -- which would have made the exact
    # class of silent schema failure this change exists to eliminate invisible
    # all over again.
    name: Report failure
    needs: [migrate, deploy, sdk-replay]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        env:
          MIGRATE_RESULT: ${{ needs.migrate.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          # Bracket notation, not needs.sdk-replay.result: a hyphen in a
          # context property is parsed as subtraction in a GitHub expression.
          REPLAY_RESULT: ${{ needs['sdk-replay'].result }}
        with:
          script: |
            const label = 'ci-failure:deploy-demo-box';
            const title = 'deploy-demo-box is failing on main';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const results = `migrate=${process.env.MIGRATE_RESULT}, `
              + `deploy=${process.env.DEPLOY_RESULT}, `
              + `sdk-replay=${process.env.REPLAY_RESULT}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Still failing: ${runUrl}\n\n${results}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: [label],
                body: `deploy-demo-box failed on main.\n\nFirst detected: ${runUrl}\n\n${results}\n\n` +
                  'A migrate failure means main is running against a stale schema and the deploy was ' +
                  'deliberately stopped. Fix the migration, then re-run this workflow.\n\n' +
                  'Filed automatically. Close it once a run goes green; it will be refiled if it fails again.',
              });
            }
